[package]
name = "iris-desktop"
version = "0.1.0"
description = "IRIS desktop companion"
authors = ["Project Alpha"]
edition = "2021"

[lib]
name = "iris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "iris-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
