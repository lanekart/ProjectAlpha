name: DSI-010 Calendar Population Validation

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-calendar-population-validation.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-calendar-population-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Format and validate focused files
        run: |
          poetry run ruff check --fix \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          poetry run ruff format \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          poetry run ruff check \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py
          poetry run pytest -q \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
      - name: Upload validated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-calendar-population-validated-files
          path: |
            alpha/decision_superiority/pre2016_emergency_calendar.py
            alpha/decision_superiority/pre2016_population.py
            scripts/build_dsi010_2005_emergency_holiday_source.py
            tests/decision_superiority/test_pre2016_emergency_calendar.py
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          if-no-files-found: error
          retention-days: 7
