name: DSI-010 one-time format

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.15.20
      - name: Format DSI-010 files
        run: |
          ruff format \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_calendar_recovery.py \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            tests/decision_superiority/test_pre2016_calendar.py \
            tests/decision_superiority/test_pre2016_calendar_recovery.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_calendar_recovery.py \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            tests/decision_superiority/test_pre2016_calendar.py \
            tests/decision_superiority/test_pre2016_calendar_recovery.py
          git commit -m "style(dsi-010): apply locked Ruff formatter"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
