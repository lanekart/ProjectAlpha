name: DSI-010 Cancel Obsolete Runs

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-cancel-obsolete-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete source and resume runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for run_id in 30302226936 30302638488; do
            status=$(curl --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "run_id=${run_id} status=${status}"
            if [ "$status" != "completed" ]; then
              curl --fail --request POST --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/cancel"
              echo "cancelled=${run_id}"
            fi
          done
