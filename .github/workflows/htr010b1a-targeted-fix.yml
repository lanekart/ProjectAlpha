name: HTR010B1A Targeted Fix

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - '.github/HTR010B1A_TARGETED_FIX_TRIGGER'

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply targeted line fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path('alpha/historical_truth/adjustment_replay_admission_cli.py')
          text = cli.read_text(encoding='utf-8')
          text = text.replace(
              '            "HTR-010B1A consumes pinned HTR-010A3/HTR-010B artifacts and cannot refresh sources",',
              '            "HTR-010B1A consumes pinned HTR-010A3/HTR-010B artifacts "\n            "and cannot refresh sources",',
          )
          cli.write_text(text, encoding='utf-8')

          exports = Path('alpha/historical_truth/adjustment_replay_admission_exports.py')
          text = exports.read_text(encoding='utf-8')
          old = 'def _readiness_markdown(title: str, payload: dict[str, Any]) -> str:\n    blockers = payload.get("blockers") or []\n    return "\\n".join('
          new = '''def _readiness_markdown(title: str, payload: dict[str, Any]) -> str:\n    blockers = payload.get("blockers") or []\n    admission_quarantined = payload.get(\n        "admission_quarantined_identity_count",\n        payload.get("quarantined_identity_count", 0),\n    )\n    unresolved = payload.get(\n        "unresolved_case_identity_count",\n        payload.get("unresolved_factor_case_count", 0),\n    )\n    silent_mixed = payload.get("silent_mixed_basis_count", 0)\n    return "\\n".join('''
          text = text.replace(old, new)
          text = text.replace(
              '            f"{payload.get(\'admission_quarantined_identity_count\', payload.get(\'quarantined_identity_count\', 0))}",',
              '            f"{admission_quarantined}",',
          )
          text = text.replace(
              '            f"{payload.get(\'unresolved_case_identity_count\', payload.get(\'unresolved_factor_case_count\', 0))}",',
              '            f"{unresolved}",',
          )
          text = text.replace(
              '            f"Silent mixed-basis intervals: {payload.get(\'silent_mixed_basis_count\', 0)}",',
              '            f"Silent mixed-basis intervals: {silent_mixed}",',
          )
          exports.write_text(text, encoding='utf-8')

          tests = Path('tests/historical_truth/test_adjustment_replay_admission_repair.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '            "admission_state": AdmissionState.RAW_REPLAY_CERTIFIED_POST_EVENT_SEGMENT.value,',
              '            "admission_state": (\n                AdmissionState.RAW_REPLAY_CERTIFIED_POST_EVENT_SEGMENT.value\n            ),',
          )
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Format and commit
        run: |
          python -m pip install ruff==0.15.20
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            tests/historical_truth/test_adjustment_replay_admission_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            tests/historical_truth/test_adjustment_replay_admission_repair.py
          git commit -m 'Fix remaining HTR-010B1A lint lines'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
