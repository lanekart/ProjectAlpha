name: Pre-2016 Composite Factor Validation Tail

on:
  pull_request:
    paths: [.github/workflows/pre2016-composite-factor-validation-tail.yml]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90235741539"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep -nE 'error:|ERROR|FAILED|Failure|Traceback|AssertionError|TypeError|AttributeError|E[0-9]{3}|F[0-9]{3}|mypy|pytest|short test summary' /tmp/log | tail -260 || true
          tail -240 /tmp/log
