name: HTR-010B10E1 Adjust Positive Controls

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - name: Adjust frozen-policy fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/htr010b10e1-apply.yml')
          text = path.read_text(encoding='utf-8')
          old = "'risk_reward_ratio=Decimal(\"3\"),'"
          new = "'risk_reward_ratio=Decimal(\"4\"),'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one 3R workflow replacement, found {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = "              ('historical_bar_count=250,',\n               'historical_bar_count=1260,'),\n"
          insertion = (
              anchor
              + "              ('sample_count=\"1\"',\n"
              + "               'sample_count=\"10\"'),\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one history fixture anchor, found {text.count(anchor)}')
          text = text.replace(anchor, insertion, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/htr010b10e1-adjust-probes.yml').unlink()
          PY
      - name: Commit workflow adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(htr-010b10e1): complete positive-control fixtures'
          git fetch origin feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          git rebase origin/feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
