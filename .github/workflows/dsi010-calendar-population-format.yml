name: DSI-010 Calendar Population Formatting

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-calendar-population-format.yml

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Format and validate focused changes
        run: |
          poetry run ruff check --fix \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          poetry run ruff format \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          poetry run ruff check \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py
          poetry run pytest -q \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
      - name: Commit canonical focused files
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/decision_superiority/pre2016_emergency_calendar.py \
            alpha/decision_superiority/pre2016_population.py \
            scripts/build_dsi010_2005_emergency_holiday_source.py \
            tests/decision_superiority/test_pre2016_emergency_calendar.py \
            tests/decision_superiority/test_pre2016_population_special_sessions.py
          if git diff --cached --quiet; then
            echo "Focused files already canonical"
            exit 0
          fi
          git commit -m "style(dsi-010): format calendar population repairs"
          git pull --rebase origin feature/dsi-010-pre2016-external-era-validation
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
