name: DSI-010 Clear Stale Actions

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-clear-stale-actions.yml

permissions:
  actions: write
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale feature-branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          branch = "feature/dsi-010-pre2016-external-era-validation"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          query = urllib.parse.urlencode({"branch": branch, "per_page": 100})
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs?{query}",
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response).get("workflow_runs", [])

          cancelled = []
          for run in runs:
              run_id = int(run["id"])
              if run_id == current_run_id:
                  continue
              if run.get("status") not in {"queued", "in_progress", "waiting", "pending"}:
                  continue
              cancel = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel",
                  data=b"",
                  method="POST",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(cancel) as response:
                      response.read()
                  cancelled.append(
                      {
                          "id": run_id,
                          "name": run.get("name"),
                          "head_sha": run.get("head_sha"),
                          "status": run.get("status"),
                      }
                  )
              except urllib.error.HTTPError as exc:
                  if exc.code not in {409, 422}:
                      raise

          print(json.dumps({"cancelled_count": len(cancelled), "runs": cancelled}, indent=2))
          PY
