name: CI

on:
  push:
  pull_request:

jobs:
  htr010b2-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Capture focused validation
        run: |
          set +e
          poetry run ruff check \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/benchmark_replay/__init__.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            alpha/application/benchmark_cli.py \
            tests/benchmark_replay/test_governed_adjusted.py \
            2>&1 | tee htr010b2-ruff.txt
          echo ${PIPESTATUS[0]} > htr010b2-ruff-status.txt
          poetry run mypy \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            alpha/application/benchmark_cli.py \
            2>&1 | tee htr010b2-mypy.txt
          echo ${PIPESTATUS[0]} > htr010b2-mypy-status.txt
          poetry run pytest -q tests/benchmark_replay/test_governed_adjusted.py \
            2>&1 | tee htr010b2-pytest.txt
          echo ${PIPESTATUS[0]} > htr010b2-pytest-status.txt
      - name: Upload exact B2 workspace and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: htr010b2-focused-diagnostics
          path: |
            alpha/benchmark_replay/governed_adjusted.py
            alpha/benchmark_replay/__init__.py
            alpha/application/governed_adjusted_benchmark_cli.py
            alpha/application/benchmark_cli.py
            tests/benchmark_replay/test_governed_adjusted.py
            htr010b2-ruff.txt
            htr010b2-ruff-status.txt
            htr010b2-mypy.txt
            htr010b2-mypy-status.txt
            htr010b2-pytest.txt
            htr010b2-pytest-status.txt
          if-no-files-found: error
