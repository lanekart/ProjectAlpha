name: CI

on:
  push:
  pull_request:

jobs:
  historical-replay-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Capture historical replay failure
        run: |
          set +e
          poetry run pytest -q tests/historical_replay tests/recovery 2>&1 | tee historical-replay.txt
          status=${PIPESTATUS[0]}
          tail -n 220 historical-replay.txt > historical-replay-tail.txt
          echo "$status" > historical-replay-status.txt
          exit 0
      - name: Upload historical replay diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: historical-replay-diagnostics
          path: |
            historical-replay-tail.txt
            historical-replay-status.txt
          if-no-files-found: error
