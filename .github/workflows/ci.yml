name: CI

on:
  push:
  pull_request:

jobs:
  b2_comparison_repair:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b2-governed-adjusted-benchmark-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Apply repair
        run: poetry run python scripts/temp_repair_b2_comparisons.py
      - name: Ruff autofix and formatting
        run: |
          poetry run ruff check --fix \
            alpha/canonical_universe_audit/store.py \
            alpha/benchmark_replay/engine.py \
            alpha/benchmark_replay/governed_adjusted.py \
            tests/benchmark_replay/test_governed_adjusted.py
          poetry run ruff format \
            alpha/canonical_universe_audit/store.py \
            alpha/benchmark_replay/engine.py \
            alpha/benchmark_replay/governed_adjusted.py \
            tests/benchmark_replay/test_governed_adjusted.py
      - uses: actions/upload-artifact@v4
        with:
          name: b2-comparison-repair
          path: |
            alpha/canonical_universe_audit/store.py
            alpha/benchmark_replay/engine.py
            alpha/benchmark_replay/governed_adjusted.py
            tests/benchmark_replay/test_governed_adjusted.py
          if-no-files-found: error
      - name: Ruff verification
        run: |
          poetry run ruff check \
            alpha/canonical_universe_audit/store.py \
            alpha/benchmark_replay/engine.py \
            alpha/benchmark_replay/governed_adjusted.py \
            tests/benchmark_replay/test_governed_adjusted.py
          poetry run ruff format --check \
            alpha/canonical_universe_audit/store.py \
            alpha/benchmark_replay/engine.py \
            alpha/benchmark_replay/governed_adjusted.py \
            tests/benchmark_replay/test_governed_adjusted.py
      - name: Strict MyPy
        run: poetry run mypy alpha
      - name: Full benchmark regression
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run pytest -x -vv \
            tests/benchmark_replay \
            tests/historical_truth/test_b1_final_closure.py \
            2>&1 | tee b2-pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-comparison-pytest-log
          path: b2-pytest.log
          if-no-files-found: error
      - name: Require passing regression
        if: steps.regression.outcome != 'success'
        run: exit 1
      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/canonical_universe_audit/store.py \
            alpha/benchmark_replay/engine.py \
            alpha/benchmark_replay/governed_adjusted.py \
            tests/benchmark_replay/test_governed_adjusted.py
          git commit -m "Use store capabilities for benchmark comparisons"
          git push origin HEAD:feature/htr-010b2-governed-adjusted-benchmark-integration
