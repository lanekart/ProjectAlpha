name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Ruff check
        run: poetry run ruff check .
      - name: Ruff format check
        run: poetry run ruff format --check .
      - name: MyPy
        run: poetry run mypy alpha

  stable_id_format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Apply locked Ruff formatting
        run: |
          poetry run ruff check --fix \
            alpha/recovery/security_timeline.py \
            alpha/recovery/replay_frame.py \
            alpha/historical_truth/replay.py \
            alpha/historical_truth/b1_shadow_universe.py \
            alpha/historical_replay/governed_price_repository.py \
            tests/recovery/test_security_timeline.py \
            tests/recovery/test_replay_frame.py \
            tests/historical_truth/test_replay.py \
            tests/historical_truth/test_b1_shadow_universe.py \
            tests/historical_replay/test_governed_price_repository.py
          poetry run ruff format \
            alpha/recovery/security_timeline.py \
            alpha/recovery/replay_frame.py \
            alpha/historical_truth/replay.py \
            alpha/historical_truth/b1_shadow_universe.py \
            alpha/historical_replay/governed_price_repository.py \
            tests/recovery/test_security_timeline.py \
            tests/recovery/test_replay_frame.py \
            tests/historical_truth/test_replay.py \
            tests/historical_truth/test_b1_shadow_universe.py \
            tests/historical_replay/test_governed_price_repository.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-stable-id
          path: |
            alpha/recovery/security_timeline.py
            alpha/recovery/replay_frame.py
            alpha/historical_truth/replay.py
            alpha/historical_truth/b1_shadow_universe.py
            alpha/historical_replay/governed_price_repository.py
            tests/recovery/test_security_timeline.py
            tests/recovery/test_replay_frame.py
            tests/historical_truth/test_replay.py
            tests/historical_truth/test_b1_shadow_universe.py
            tests/historical_replay/test_governed_price_repository.py
          if-no-files-found: error

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - historical_truth
          - historical_replay
          - decision_and_market
          - portfolio_and_backtest
          - research_and_signals
          - remaining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Run shard
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            historical_truth)
              poetry run pytest -q tests/historical_truth
              ;;
            historical_replay)
              poetry run pytest -q tests/historical_replay tests/recovery
              ;;
            decision_and_market)
              poetry run pytest -q tests/decision_intelligence tests/decision_lifecycle tests/decision_orchestrator tests/market tests/market_intelligence tests/market_truth
              ;;
            portfolio_and_backtest)
              poetry run pytest -q tests/portfolio tests/portfolio_intelligence tests/backtest tests/execution tests/costs
              ;;
            research_and_signals)
              poetry run pytest -q tests/research tests/trading_signals tests/strategy_lab tests/strategy_discovery tests/setup_discovery tests/candidate_learning
              ;;
            remaining)
              poetry run python scripts/run_remaining_tests.py
              ;;
          esac
