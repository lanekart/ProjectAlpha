name: HTR010B1B Format Branch

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write
  pull-requests: read

jobs:
  format-branch:
    if: github.event.pull_request.number == 32 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply HTR-010B1B type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'alpha/historical_truth/'
              'adjustment_replay_admission_continuity.py'
          )
          text = path.read_text(encoding='utf-8')
          old_inverse = (
              '    inverse = 1.0 / factor '
              'if factor not in {None, 0.0} else None\n'
          )
          new_inverse = (
              '    inverse: float | None = None\n'
              '    if factor is not None and factor != 0.0:\n'
              '        inverse = 1.0 / factor\n'
          )
          assert old_inverse in text
          text = text.replace(old_inverse, new_inverse, 1)
          old_number = '''def _number(value: object) -> float | None:
    try:
        return float(value) if value is not None else None
    except (TypeError, ValueError):
        return None
'''
          new_number = '''def _number(value: object) -> float | None:
    if value is None:
        return None
    if not isinstance(value, (str, int, float)):
        return None
    try:
        return float(value)
    except ValueError:
        return None
'''
          assert old_number in text
          path.write_text(text.replace(old_number, new_number, 1), encoding='utf-8')
          PY
      - name: Format HTR-010B1B files
        run: |
          python -m pip install ruff==0.15.20
          ruff check \
            alpha/historical_truth/adjustment_replay_admission_continuity.py \
            alpha/historical_truth/adjustment_replay_admission_continuity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            tests/historical_truth/test_adjustment_replay_admission_continuity.py \
            --fix || true
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_continuity.py \
            alpha/historical_truth/adjustment_replay_admission_continuity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            tests/historical_truth/test_adjustment_replay_admission_continuity.py
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/historical_truth/adjustment_replay_admission_continuity.py \
            alpha/historical_truth/adjustment_replay_admission_continuity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            tests/historical_truth/test_adjustment_replay_admission_continuity.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix HTR-010B1B MyPy narrowing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
