name: HTR010B1B Format Branch

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write
  pull-requests: read

jobs:
  format-branch:
    if: github.event.pull_request.number == 32 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format HTR-010B1B files
        run: |
          python -m pip install ruff==0.15.20
          ruff check \
            alpha/historical_truth/adjustment_replay_admission_continuity.py \
            alpha/historical_truth/adjustment_replay_admission_continuity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            tests/historical_truth/test_adjustment_replay_admission_continuity.py \
            --fix || true
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_continuity.py \
            alpha/historical_truth/adjustment_replay_admission_continuity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            tests/historical_truth/test_adjustment_replay_admission_continuity.py
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/historical_truth/adjustment_replay_admission_continuity.py \
            alpha/historical_truth/adjustment_replay_admission_continuity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            tests/historical_truth/test_adjustment_replay_admission_continuity.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format HTR-010B1B continuity implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
