name: HTR-007 Session Calendar Build

on:
  push:
    branches:
      - feature/htr-007-supporting-official-data
  pull_request:
    branches:
      - feature/recovery-foundation-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-007-supporting-official-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.create true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Repair session calendar source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/historical_truth/session_calendar.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from dataclasses import asdict, dataclass',
              'from collections.abc import Iterable\nfrom dataclasses import asdict, dataclass, replace',
          )
          text = text.replace(
              'from typing import Any, Iterable',
              'from typing import Any',
          )
          text = text.replace(
              '        conflicts = sum(bool(record.issue_codes) for record in records) - unconfirmed - missing_special\n',
              '        conflicts = sum(\n'
              '            "HOLIDAY_HAS_OBSERVED_CANDLES" in record.issue_codes\n'
              '            for record in records\n'
              '        )\n',
          )
          text = text.replace(
              '        return SessionCalendarReport(\n'
              '            **{**asdict(provisional), "report_sha256": digest}\n'
              '        )\n',
              '        return replace(provisional, report_sha256=digest)\n',
          )
          text = text.replace(
              '            raise ValueError(f"official calendar source has no covered years: {source_path}")\n',
              '            raise ValueError(\n'
              '                "official calendar source has no covered years: "\n'
              '                f"{source_path}"\n'
              '            )\n',
          )
          text = text.replace(
              '            f"Missing official special sessions: {report.missing_special_session_count}",\n',
              '            (\n'
              '                "Missing official special sessions: "\n'
              '                f"{report.missing_special_session_count}"\n'
              '            ),\n',
          )
          text = text.replace(
              '            "A missing bhavcopy is never classified as a holiday without official evidence."\n',
              '            "A missing bhavcopy is never classified as a holiday "\n'
              '            "without official evidence."\n',
          )
          text = text.replace(
              '        descriptions = tuple(\n'
              '            dict.fromkeys(\n'
              '                item.description for item in (*holidays, *specials) if item.description\n'
              '            )\n'
              '        )\n'
              '        source_ids = tuple(\n'
              '            sorted({item.source_id for item in (*holidays, *specials)})\n'
              '        )\n',
              '        descriptions = tuple(\n'
              '            dict.fromkeys(\n'
              '                [item.description for item in holidays if item.description]\n'
              '                + [item.description for item in specials if item.description]\n'
              '            )\n'
              '        )\n'
              '        source_ids = tuple(\n'
              '            sorted(\n'
              '                {item.source_id for item in holidays}\n'
              '                | {item.source_id for item in specials}\n'
              '            )\n'
              '        )\n',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate session calendar slice
        id: validate
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: '1'
        run: |
          set +e
          poetry run ruff check --fix \
            alpha/historical_truth/session_calendar.py \
            alpha/historical_truth/session_calendar_cli.py \
            tests/historical_truth/test_session_calendar.py \
            2>&1 | tee ruff-fix.txt
          s1=${PIPESTATUS[0]}

          poetry run ruff format \
            alpha/historical_truth/session_calendar.py \
            alpha/historical_truth/session_calendar_cli.py \
            tests/historical_truth/test_session_calendar.py \
            2>&1 | tee ruff-format.txt
          s2=${PIPESTATUS[0]}

          poetry run ruff check \
            alpha/historical_truth/session_calendar.py \
            alpha/historical_truth/session_calendar_cli.py \
            tests/historical_truth/test_session_calendar.py \
            2>&1 | tee ruff-check.txt
          s3=${PIPESTATUS[0]}

          poetry run mypy \
            alpha/historical_truth/session_calendar.py \
            alpha/historical_truth/session_calendar_cli.py \
            2>&1 | tee mypy.txt
          s4=${PIPESTATUS[0]}

          poetry run pytest tests/historical_truth/test_session_calendar.py -q \
            2>&1 | tee pytest.txt
          s5=${PIPESTATUS[0]}

          printf 'ruff_fix=%s\nruff_format=%s\nruff_check=%s\nmypy=%s\npytest=%s\n' \
            "$s1" "$s2" "$s3" "$s4" "$s5" | tee validation-status.txt
          if (( s1 || s2 || s3 || s4 || s5 )); then
            exit 1
          fi

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr007-session-calendar-diagnostics
          path: |
            ruff-fix.txt
            ruff-format.txt
            ruff-check.txt
            mypy.txt
            pytest.txt
            validation-status.txt
          if-no-files-found: error

      - name: Commit validated source and remove temporary workflow
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          rm .github/workflows/htr007-session-calendar-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/historical_truth/session_calendar.py \
            alpha/historical_truth/session_calendar_cli.py \
            tests/historical_truth/test_session_calendar.py \
            .github/workflows/htr007-session-calendar-build.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "HTR-007: validate official session calendar slice"
            git push origin HEAD:feature/htr-007-supporting-official-data
          fi
