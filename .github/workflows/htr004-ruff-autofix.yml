name: HTR-004 Ruff Autofix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-004-canonical-replay

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Apply deterministic source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("alpha/recovery/corporate_actions.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "from datetime import date, datetime": "from datetime import date",
              '                raise ValueError(f"duplicate corporate action event_id {event.event_id!r}")': (
                  "                raise ValueError(\n"
                  '                    f"duplicate corporate action event_id {event.event_id!r}"\n'
                  "                )"
              ),
              "        events = tuple(_event_from_mapping(row.values) for row in result.canonical_preview)": (
                  "        events = tuple(\n"
                  "            _event_from_mapping(row.values)\n"
                  "            for row in result.canonical_preview\n"
                  "        )"
              ),
              "        event_ids = {event_id for item in changed for event_id in item.applied_event_ids}": (
                  "        event_ids = {\n"
                  "            event_id\n"
                  "            for item in changed\n"
                  "            for event_id in item.applied_event_ids\n"
                  "        }"
              ),
              '            "source_name": str(context.parameters.get("source_name", "corporate_actions")),': (
                  '            "source_name": str(\n'
                  '                context.parameters.get("source_name", "corporate_actions")\n'
                  "            ),"
              ),
              '                            summary=f"Corporate action is missing required field {field}.",': (
                  "                            summary=(\n"
                  '                                "Corporate action is missing required field "\n'
                  '                                f"{field}."\n'
                  "                            ),"
              ),
              '        [row for row in rows if row.get("status") == CorporateActionStatus.UNRESOLVED.value],': (
                  "        [\n"
                  "            row\n"
                  "            for row in rows\n"
                  '            if row.get("status")\n'
                  "            == CorporateActionStatus.UNRESOLVED.value\n"
                  "        ],"
              ),
              '                "validation_issues": [asdict(item) for item in result.validation_issues],': (
                  '                "validation_issues": [\n'
                  "                    asdict(item) for item in result.validation_issues\n"
                  "                ],"
              ),
              '                "verification_issues": [asdict(item) for item in result.verification_issues],': (
                  '                "verification_issues": [\n'
                  "                    asdict(item) for item in result.verification_issues\n"
                  "                ],"
              ),
              "        if not numerator or not denominator or numerator <= _ZERO or denominator <= _ZERO:": (
                  "        if (\n"
                  "            not numerator\n"
                  "            or not denominator\n"
                  "            or numerator <= _ZERO\n"
                  "            or denominator <= _ZERO\n"
                  "        ):"
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source fragment not found: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify Ruff gates
        run: |
          ruff format alpha/recovery/corporate_actions.py
          ruff check alpha/recovery/corporate_actions.py
          ruff format --check alpha/recovery/corporate_actions.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha/recovery/corporate_actions.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix HTR-004 corporate action quality gates"
          git push origin HEAD:feature/htr-004-canonical-replay
