name: HTR-004 Ruff Autofix

on:
  push:
    branches:
      - feature/htr-004-canonical-replay

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-004-canonical-replay

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Apply Ruff fixes and formatting
        run: |
          ruff check alpha/recovery/corporate_actions.py --fix
          ruff format alpha/recovery/corporate_actions.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha/recovery/corporate_actions.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix HTR-004 corporate action quality gates"
          git push origin HEAD:feature/htr-004-canonical-replay
