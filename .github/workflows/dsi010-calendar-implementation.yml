name: DSI-010 Calendar Implementation

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-calendar-implementation.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-calendar-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Patch governed HTML recovery support
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path("alpha/decision_superiority/pre2016_calendar_recovery.py")
          text = module.read_text(encoding="utf-8")

          text = text.replace(
              "import hashlib\nimport json\nimport re\n",
              "import hashlib\nimport json\nimport re\nfrom html.parser import HTMLParser\n",
          )
          text = text.replace(
              "    pdf_signature_valid: bool = False\n    text_extraction_status: str = \"NOT_ATTEMPTED\"\n",
              "    pdf_signature_valid: bool = False\n    document_format: str = \"\"\n    text_extraction_status: str = \"NOT_ATTEMPTED\"\n",
          )
          text = text.replace(
              "    pdf_signature = raw.startswith(b\"%PDF-\")\n    document_path = _persist_document(\n        candidate,\n        documents=documents,\n        raw=raw,\n        digest=digest,\n        pdf_signature=pdf_signature,\n    )\n",
              "    pdf_signature = raw.startswith(b\"%PDF-\")\n    document_format = _detect_document_format(\n        candidate.source_url,\n        raw,\n        content_type,\n    )\n    document_path = _persist_document(\n        candidate,\n        documents=documents,\n        raw=raw,\n        digest=digest,\n        document_format=document_format,\n    )\n",
          )
          text = text.replace(
              "        pdf_signature_valid=pdf_signature,\n        document_path=str(document_path) if document_path else None,\n",
              "        pdf_signature_valid=pdf_signature,\n        document_format=document_format,\n        document_path=str(document_path) if document_path else None,\n",
          )
          old_reject = '''    if not pdf_signature:
        error = (
            "HTML_RESPONSE_REJECTED"
            if "html" in content_type.casefold() or raw.lstrip().startswith(b"<")
            else "PDF_SIGNATURE_MISSING"
        )
        return replace(
            base,
            recovery_state="OFFICIAL_SOURCE_CONTENT_INVALID",
            error=error,
        )
'''
          new_reject = '''    if document_format == "UNKNOWN":
        error = (
            "HTML_RESPONSE_REJECTED"
            if _looks_like_html(raw, content_type)
            else "DOCUMENT_FORMAT_UNSUPPORTED"
        )
        return replace(
            base,
            recovery_state="OFFICIAL_SOURCE_CONTENT_INVALID",
            error=error,
        )
'''
          if old_reject not in text:
              raise SystemExit("PDF rejection block not found")
          text = text.replace(old_reject, new_reject)

          old_extract = '''    try:
        text = _extract_pdf_text(raw)
    except (OSError, ValueError) as exc:
        return replace(
            base,
            text_extraction_status="FAILED",
            recovery_state="OFFICIAL_SOURCE_CONTENT_INVALID",
            error=f"PDF_TEXT_EXTRACTION_FAILED:{type(exc).__name__}",
        )
'''
          new_extract = '''    try:
        text = _extract_document_text(raw, document_format)
    except (OSError, UnicodeError, ValueError) as exc:
        return replace(
            base,
            text_extraction_status="FAILED",
            recovery_state="OFFICIAL_SOURCE_CONTENT_INVALID",
            error=f"DOCUMENT_TEXT_EXTRACTION_FAILED:{type(exc).__name__}",
        )
'''
          if old_extract not in text:
              raise SystemExit("PDF extraction block not found")
          text = text.replace(old_extract, new_extract)

          old_persist = '''def _persist_document(
    candidate: Pre2011CalendarSourceCandidate,
    *,
    documents: Path,
    raw: bytes,
    digest: str | None,
    pdf_signature: bool,
) -> Path | None:
    if not raw or digest is None:
        return None
    suffix = ".pdf" if pdf_signature else ".bin"
'''
          new_persist = '''def _persist_document(
    candidate: Pre2011CalendarSourceCandidate,
    *,
    documents: Path,
    raw: bytes,
    digest: str | None,
    document_format: str,
) -> Path | None:
    if not raw or digest is None:
        return None
    suffix = {"PDF": ".pdf", "HTML": ".htm"}.get(document_format, ".bin")
'''
          if old_persist not in text:
              raise SystemExit("persist signature not found")
          text = text.replace(old_persist, new_persist)

          marker = "def _persist_document(\n"
          helpers = '''class _VisibleHtmlTextParser(HTMLParser):
    """Extract visible text from an immutable official archive HTML document."""

    def __init__(self) -> None:
        super().__init__(convert_charrefs=True)
        self.parts: list[str] = []
        self._suppressed_depth = 0

    def handle_starttag(
        self,
        tag: str,
        attrs: list[tuple[str, str | None]],
    ) -> None:
        del attrs
        if tag.casefold() in {"script", "style"}:
            self._suppressed_depth += 1

    def handle_endtag(self, tag: str) -> None:
        if tag.casefold() in {"script", "style"} and self._suppressed_depth:
            self._suppressed_depth -= 1

    def handle_data(self, data: str) -> None:
        if self._suppressed_depth:
            return
        normalized = re.sub(r"\\s+", " ", data).strip()
        if normalized:
            self.parts.append(normalized)


def _looks_like_html(raw: bytes, content_type: str) -> bool:
    prefix = raw[:2048].lstrip().lower()
    return (
        "html" in content_type.casefold()
        or prefix.startswith(b"<!doctype html")
        or prefix.startswith(b"<html")
        or b"<body" in prefix
    )


def _detect_document_format(
    source_url: str,
    raw: bytes,
    content_type: str,
) -> str:
    if raw.startswith(b"%PDF-"):
        return "PDF"
    suffix = Path(urlparse(source_url).path).suffix.casefold()
    if suffix in {".htm", ".html"} and _looks_like_html(raw, content_type):
        return "HTML"
    return "UNKNOWN"


def _extract_document_text(raw: bytes, document_format: str) -> str:
    if document_format == "PDF":
        return _extract_pdf_text(raw)
    if document_format == "HTML":
        parser = _VisibleHtmlTextParser()
        parser.feed(raw.decode("utf-8", errors="replace"))
        rendered = "\\n".join(parser.parts)
        if not rendered:
            raise ValueError("HTML_TEXT_EMPTY")
        return rendered
    raise ValueError("DOCUMENT_FORMAT_UNSUPPORTED")


'''
          if marker not in text:
              raise SystemExit("persist marker not found")
          text = text.replace(marker, helpers + marker, 1)

          text = text.replace(
              '''            r"\\b\\d{1,2}[-/]\\w{3,9}[-/]\\d{2,4}\\b",
            r"\\b\\d{4}-\\d{2}-\\d{2}\\b",
''',
              '''            r"\\b\\d{1,2}[-/]\\w{3,9}[-/]\\d{2,4}\\b",
            r"\\b\\d{4}-\\d{2}-\\d{2}\\b",
            r"\\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2},\\s+\\d{4}\\b",
            r"\\b\\d{1,2}(?:st|nd|rd|th)?\\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{4}\\b",
''',
          )
          module.write_text(text, encoding="utf-8")

          tests = Path("tests/decision_superiority/test_pre2016_calendar_recovery.py")
          test_text = tests.read_text(encoding="utf-8")
          insertion_marker = "\n\ndef test_html_200_response_is_rejected_without_pdf_extraction"
          new_test = '''

def test_valid_official_archive_html_is_recovered(tmp_path: Path) -> None:
    url = "https://nsearchives.nseindia.com/content/circulars/cmtr5633.htm"
    raw = b"""<!doctype html><html><body>
    National Stock Exchange of India Limited
    Capital Market Segment
    Sub: Trading holidays for the calendar year 2005
    Download No. NSE/CMTR/5633
    Date: December 07, 2004
    Wednesday, January 26, 2005 Republic Day
    Muhurat Trading will be conducted
    </body></html>"""
    registry = _write_registry(
        tmp_path,
        candidates=(
            _candidate(
                year=2005,
                source_id="NSE_CM_2005_CALENDAR_HTML",
                source_url=url,
                segment_scope="CAPITAL_MARKET",
                expected_sha256=hashlib.sha256(raw).hexdigest(),
                requires_muhurat_statement=True,
            ),
        ),
    )

    result = recover_pre2011_official_calendar_sources(
        candidate_registry=registry,
        output=tmp_path / "output",
        session=FakeSession(
            {
                url: FakeResponse(
                    status_code=200,
                    content=raw,
                    content_type="text/html; charset=utf-8",
                    url=url,
                )
            }
        ),
    )

    attempt = result.attempts[0]
    assert result.fully_recovered_years == (2005,)
    assert attempt.document_format == "HTML"
    assert attempt.pdf_signature_valid is False
    assert attempt.text_extraction_status == "EXTRACTED"
    assert attempt.content_validation_passed is True
    assert attempt.recovery_state == "VERIFIED_OFFICIAL_EVIDENCE"
    assert attempt.document_path is not None
    assert attempt.document_path.endswith(".htm")
'''
          if insertion_marker not in test_text:
              raise SystemExit("test insertion marker not found")
          test_text = test_text.replace(insertion_marker, new_test + insertion_marker, 1)
          tests.write_text(test_text, encoding="utf-8")

          docs = Path("docs/DSI-010_PRE2011_OFFICIAL_CALENDAR_RECOVERY.md")
          docs_text = docs.read_text(encoding="utf-8")
          docs_text = docs_text.replace(
              "Official NSE circular PDF.\n- Official NSE archive PDF.",
              "Official NSE circular PDF or immutable archive HTML.\n- Official NSE archive PDF or HTML document.",
          )
          docs_text = docs_text.replace(
              "An HTTP 200 response is not accepted unless it contains a valid PDF and the\nmandatory circular-content checks pass.",
              "An HTTP 200 response is accepted only when it contains either a valid PDF or an\nofficial archive HTML document whose URL also ends in `.htm`/`.html`, and all mandatory\ncircular-content checks pass. HTML returned for a PDF URL remains rejected.",
          )
          docs.write_text(docs_text, encoding="utf-8")
          PY
      - name: Format and validate focused implementation
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          poetry run ruff check --fix \
            alpha/decision_superiority/pre2016_calendar_recovery.py \
            tests/decision_superiority/test_pre2016_calendar_recovery.py
          poetry run ruff format \
            alpha/decision_superiority/pre2016_calendar_recovery.py \
            tests/decision_superiority/test_pre2016_calendar_recovery.py
          poetry run ruff check \
            alpha/decision_superiority/pre2016_calendar_recovery.py \
            tests/decision_superiority/test_pre2016_calendar_recovery.py
          poetry run mypy alpha/decision_superiority/pre2016_calendar_recovery.py
          poetry run pytest -q tests/decision_superiority/test_pre2016_calendar_recovery.py
      - name: Commit validated implementation
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/decision_superiority/pre2016_calendar_recovery.py \
            tests/decision_superiority/test_pre2016_calendar_recovery.py \
            docs/DSI-010_PRE2011_OFFICIAL_CALENDAR_RECOVERY.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "fix(dsi-010): recover official NSE archive HTML calendars"
            git pull --rebase origin feature/dsi-010-pre2016-external-era-validation
            git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
          fi
