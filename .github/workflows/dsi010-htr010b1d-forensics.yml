name: DSI-010 HTR-010B1D Factor Forensics

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010b1d-forensics.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Download preserved HTR-010B1C state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30341297898
          name: dsi010-htr010b1-admission-audit
          path: inputs/htr010b1c

      - name: Restore governed HTR-010B1D prerequisites
        run: |
          set -euo pipefail
          ARCHIVE=$(find inputs/htr010b1c -type f -name alpha_data_after_htr010b1.tar.gz | head -1)
          CALENDAR=$(find inputs/htr010b1c -type f -name htr007_session_calendar.json | head -1)
          test -n "$ARCHIVE" && test -f "$ARCHIVE"
          test -n "$CALENDAR" && test -f "$CALENDAR"
          mkdir -p work artifacts/dsi010_htr010b1d_forensics
          tar -xzf "$ARCHIVE" -C work
          mkdir -p work/certified_calendar
          cp "$CALENDAR" work/certified_calendar/htr007_session_calendar.json
          for name in \
            htr009b_corporate_action_price_continuity \
            htr010a_complete_security_dataset \
            htr010a1_population_interval_repair \
            htr010a2_lifecycle_session_semantics \
            htr010a3_tier_a_foundation_readiness \
            htr010b_complete_corporate_action_dataset \
            htr010b1_adjustment_replay_admission; do
            source=$(find inputs/htr010b1c -type d -path "*/artifacts/${name}" | head -1)
            test -n "$source" && test -d "$source"
            rm -rf "artifacts/${name}"
            cp -a "$source" "artifacts/${name}"
          done
          rm -rf artifacts/htr010b1d_factor_transformation_forensics
          test -f work/alpha_data/warehouse/historical_truth.duckdb
          test -f artifacts/htr010b1_adjustment_replay_admission/htr010b1_factor_validation_results.json

      - name: Run HTR-010B1D residual factor-transformation forensics
        id: b1d
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run python -m alpha historical-truth factor-transformation-forensics \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1c-output artifacts/htr010b1_adjustment_replay_admission \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d_factor_transformation_forensics \
            2>&1 | tee artifacts/dsi010_htr010b1d_forensics/htr010b1d.log

      - name: Export governed HTR-010B1D result
        if: always()
        env:
          B1D_OUTCOME: ${{ steps.b1d.outcome }}
        run: |
          poetry run python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/htr010b1d_factor_transformation_forensics")
          report_path = output / "htr010b1d_factor_transformation_forensics.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.is_file() else {}
          summary = {
              "htr010b1d_outcome": os.environ.get("B1D_OUTCOME", "unknown"),
              "case_count": report.get("case_count"),
              "classification_counts": report.get("classification_counts", {}),
              "recommended_repair_action_counts": report.get("recommended_repair_action_counts", {}),
              "orientation_candidate_count": report.get("orientation_candidate_count"),
              "term_arithmetic_mismatch_count": report.get("term_arithmetic_mismatch_count"),
              "series_selection_mismatch_count": report.get("series_selection_mismatch_count"),
              "series_selection_ambiguity_count": report.get("series_selection_ambiguity_count"),
              "close_basis_count": report.get("close_basis_count"),
              "date_basis_mismatch_count": report.get("date_basis_mismatch_count"),
              "multiple_action_composition_count": report.get("multiple_action_composition_count"),
              "market_gap_not_factor_error_count": report.get("market_gap_not_factor_error_count"),
              "unresolved_count": report.get("unresolved_count"),
              "report_sha256": report.get("report_sha256"),
              "market_derived_factor_autocorrection": report.get("market_derived_factor_autocorrection"),
              "official_factor_mutated": report.get("official_factor_mutated"),
              "admission_policy_changed": report.get("admission_policy_changed"),
              "production_influence": False,
          }
          target = Path("artifacts/dsi010_htr010b1d_forensics")
          target.mkdir(parents=True, exist_ok=True)
          (target / "htr010b1d_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          tar -czf artifacts/dsi010_htr010b1d_forensics/alpha_data_after_htr010b1d.tar.gz \
            -C work alpha_data

      - name: Upload governed HTR-010B1D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-htr010b1d-factor-forensics
          path: |
            artifacts/dsi010_htr010b1d_forensics
            artifacts/htr010b1d_factor_transformation_forensics
            artifacts/htr010b1_adjustment_replay_admission
            artifacts/htr010b_complete_corporate_action_dataset
            artifacts/htr010a3_tier_a_foundation_readiness
            artifacts/htr010a2_lifecycle_session_semantics
            artifacts/htr010a1_population_interval_repair
            artifacts/htr010a_complete_security_dataset
            artifacts/htr009b_corporate_action_price_continuity
            work/certified_calendar/htr007_session_calendar.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce forensic execution
        if: always()
        env:
          B1D_OUTCOME: ${{ steps.b1d.outcome }}
        run: |
          echo "HTR010B1D_OUTCOME=${B1D_OUTCOME}"
          test "${B1D_OUTCOME}" = success
          test -f artifacts/htr010b1d_factor_transformation_forensics/htr010b1d_factor_transformation_forensics.json
          echo "PRODUCTION_INFLUENCE=false"
