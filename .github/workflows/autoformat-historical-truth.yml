name: Autoformat Historical Truth

on:
  push:
    branches:
      - feature/historical-truth-warehouse-v1
    paths:
      - "alpha/historical_truth/service.py"
      - ".github/workflows/autoformat-historical-truth.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/historical-truth-warehouse-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Format file
        run: ruff format alpha/historical_truth/service.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha/historical_truth/service.py
          git commit -m "Format historical truth service"
          git push origin HEAD:feature/historical-truth-warehouse-v1
