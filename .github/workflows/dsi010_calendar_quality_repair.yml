name: DSI010 Calendar Quality Repair

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/dsi-010-pre2016-external-era-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked Ruff
        run: python -m pip install 'ruff==0.15.20'
      - name: Apply exact repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('alpha/decision_superiority/pre2016_external_validation.py')
          engine_text = engine.read_text(encoding='utf-8')
          old_engine = '                "sha256": _file_sha256(sources.calendar_report),'
          new_engine = '''                "sha256": hashlib.sha256(
                      sources.calendar_report.read_bytes()
                  ).hexdigest(),'''
          if old_engine not in engine_text:
              raise SystemExit('engine calendar sha anchor missing')
          engine.write_text(
              engine_text.replace(old_engine, new_engine, 1),
              encoding='utf-8',
          )

          tests = Path('tests/decision_superiority/test_pre2016_calendar.py')
          test_text = tests.read_text(encoding='utf-8')
          old_test = (
              '    payload = _calendar_payload(source, '
              'certification_state="incomplete_official_evidence")'
          )
          new_test = '''    payload = _calendar_payload(
              source,
              certification_state="incomplete_official_evidence",
          )'''
          if old_test not in test_text:
              raise SystemExit('test calendar payload anchor missing')
          tests.write_text(
              test_text.replace(old_test, new_test, 1),
              encoding='utf-8',
          )
          PY
          ruff check \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            tests/decision_superiority/test_pre2016_calendar.py
          ruff format \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            tests/decision_superiority/test_pre2016_calendar.py
          ruff check \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            tests/decision_superiority/test_pre2016_calendar.py
          python -m compileall -q \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            tests/decision_superiority/test_pre2016_calendar.py
      - name: Commit repair and remove workflow
        run: |
          rm .github/workflows/dsi010_calendar_quality_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            tests/decision_superiority/test_pre2016_calendar.py \
            .github/workflows/dsi010_calendar_quality_repair.yml
          git commit -m 'fix(dsi-010): close calendar source quality defects'
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
