name: DSI-010 Population Merge Validation

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-population-merge-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Apply exact merger corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("alpha/decision_superiority/pre2016_population_merge.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '        raise Pre2016PopulationMergeError("PRE2016_MERGE_EXPECTED_YEAR_OUTSIDE_PROTOCOL")\n': (
                  '        raise Pre2016PopulationMergeError(\n'
                  '            "PRE2016_MERGE_EXPECTED_YEAR_OUTSIDE_PROTOCOL"\n'
                  '        )\n'
              ),
              '            if table in {"daily_candle", "validation_quarantine"} and added != source_count:\n': (
                  '            if (\n'
                  '                table in {"daily_candle", "validation_quarantine"}\n'
                  '                and added != source_count\n'
                  '            ):\n'
              ),
              '    return tuple(str(row[1]) for row in connection.execute(f"PRAGMA table_info(\'{table}\')"))\n': (
                  '    rows = connection.execute(\n'
                  '        f"PRAGMA table_info(\'{table}\')"\n'
                  '    ).fetchall()\n'
                  '    return tuple(str(row[1]) for row in rows)\n'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"merge patch target missing: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate merger
        run: |
          poetry run ruff check --fix \
            alpha/decision_superiority/pre2016_population_merge.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run ruff format \
            alpha/decision_superiority/pre2016_population_merge.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run ruff check \
            alpha/decision_superiority/pre2016_population_merge.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run mypy alpha/decision_superiority/pre2016_population_merge.py
          poetry run pytest -q tests/decision_superiority/test_pre2016_population_merge.py
      - name: Commit validated merger
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/decision_superiority/pre2016_population_merge.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          if git diff --cached --quiet; then
            echo "Merger already canonical"
            exit 0
          fi
          git commit -m "fix(dsi-010): validate population shard merger"
          git pull --rebase origin feature/dsi-010-pre2016-external-era-validation
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
