name: HTR-010B10 Finalize Engine Typing

on:
  push:
    branches:
      - feature/htr-010b10-governed-adaptive-institutional-trade-shadow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - name: Apply exact engine typing fix and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py')
          text = path.read_text(encoding='utf-8')
          old = "f\"`{', '.join(str(item) for item in blockers) or 'NONE'}`\""
          new = "f\"`{', '.join(str(item) for item in cast(Sequence[object], blockers)) or 'NONE'}`\""
          if old not in text and new not in text:
              raise SystemExit('expected blockers renderer not found')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/htr010b10-final-mypy-diagnostics.yml').unlink(missing_ok=True)
          Path('.github/workflows/htr010b10-finalize-engine-typing.yml').unlink(missing_ok=True)
          PY
          pip install ruff==0.15.20
          ruff check --fix alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py
          ruff format alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py
      - name: Commit final strict typing correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py .github/workflows
          git commit -m 'fix(htr-010b10): narrow report blockers for strict typing'
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
