name: DSI-013 Full Source Format

on:
  push:
    branches:
      - feature/dsi-013-governed-intraday-execution-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-013-governed-intraday-execution-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Format and lint complete DSI-013 surface
        run: |
          python -m pip install ruff==0.15.20
          ruff format \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_*.py \
            tests/decision_superiority/test_intraday_*.py
          ruff check \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_*.py \
            tests/decision_superiority/test_intraday_*.py
          ruff format --check \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_*.py \
            tests/decision_superiority/test_intraday_*.py
      - name: Commit formatted source and remove helper
        run: |
          rm .github/workflows/dsi013-full-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_*.py \
            tests/decision_superiority/test_intraday_*.py \
            .github/workflows/dsi013-full-format.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-013): apply locked formatting"
          git push origin HEAD:feature/dsi-013-governed-intraday-execution-audit
