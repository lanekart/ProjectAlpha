name: Temporary B2 Digest Formatter

on:
  push:
    branches:
      - feature/htr-010b2-governed-adjusted-benchmark-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b2-governed-adjusted-benchmark-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Repair import and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/benchmark_replay/test_governed_adjusted.py")
          text = path.read_text()
          if "    validate_governed_adjusted_handoff,\n" not in text:
              text = text.replace(
                  "    build_governed_benchmark_stores,\n)",
                  "    build_governed_benchmark_stores,\n"
                  "    validate_governed_adjusted_handoff,\n"
                  ")",
                  1,
              )
          path.write_text(text)
          PY
          poetry run ruff check --fix \
            alpha/historical_truth/b1_final_closure.py \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            tests/benchmark_replay/test_governed_adjusted.py
          poetry run ruff format \
            alpha/historical_truth/b1_final_closure.py \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            tests/benchmark_replay/test_governed_adjusted.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha tests
          if ! git diff --cached --quiet; then
            git commit -m "Format B2 closure digest repair"
            git push origin HEAD:feature/htr-010b2-governed-adjusted-benchmark-integration
          fi
