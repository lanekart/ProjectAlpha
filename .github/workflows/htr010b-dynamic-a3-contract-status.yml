name: HTR-010B Dynamic A3 Contract Repair Status

on:
  pull_request:
    paths:
      - .github/workflows/htr010b-dynamic-a3-contract-status.yml

permissions:
  actions: read
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate HTR-010B repair run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = "feature/dsi-010-pre2016-external-era-validation"
          workflow = "htr010b-dynamic-a3-contract-repair.yml"
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{workflow}/runs?branch={urllib.parse.quote(branch, safe='')}&per_page=10"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = payload.get("workflow_runs", [])
          if not runs:
              raise SystemExit("HTR010B_DYNAMIC_A3_REPAIR_RUN_NOT_FOUND")
          latest = runs[0]
          print("===== HTR-010B DYNAMIC A3 REPAIR RUN =====")
          for key in (
              "id", "status", "conclusion", "head_sha", "run_number",
              "event", "created_at", "updated_at", "jobs_url",
          ):
              print(f"{key}: {latest.get(key)}")
          PY
