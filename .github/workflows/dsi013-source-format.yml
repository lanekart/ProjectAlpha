name: DSI-013 Source Format Repair

on:
  push:
    branches:
      - feature/dsi-013-governed-intraday-execution-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-013-governed-intraday-execution-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply locked Ruff fixes and formatting
        run: |
          python -m pip install ruff==0.15.20
          ruff check \
            alpha/decision_superiority/intraday_execution_models.py \
            alpha/decision_superiority/intraday_execution_source.py \
            tests/decision_superiority/test_intraday_execution_source.py \
            --fix
          ruff format \
            alpha/decision_superiority/intraday_execution_models.py \
            alpha/decision_superiority/intraday_execution_source.py \
            tests/decision_superiority/test_intraday_execution_source.py
          ruff check \
            alpha/decision_superiority/intraday_execution_models.py \
            alpha/decision_superiority/intraday_execution_source.py \
            tests/decision_superiority/test_intraday_execution_source.py
          ruff format --check \
            alpha/decision_superiority/intraday_execution_models.py \
            alpha/decision_superiority/intraday_execution_source.py \
            tests/decision_superiority/test_intraday_execution_source.py
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/dsi013-source-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/intraday_execution_models.py \
            alpha/decision_superiority/intraday_execution_source.py \
            tests/decision_superiority/test_intraday_execution_source.py \
            .github/workflows/dsi013-source-format.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-013): satisfy locked formatting"
          git push origin HEAD:feature/dsi-013-governed-intraday-execution-audit
