name: HTR-007 Pilot Compatibility Patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-007-checkpointed-backfill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry install --no-interaction

      - name: Preserve pilot checksum-drift evidence
        run: |
          poetry run python - <<'PY'
          from pathlib import Path

          path = Path("alpha/historical_truth/pilot.py")
          content = path.read_text(encoding="utf-8")

          fetched_anchor = "        fetched = self.archive.fetch(request)\n"
          early_drift = (
              "        fetched = self.archive.fetch(request)\n"
              "        checksum_drift_before_status = bool(\n"
              "            previous is not None\n"
              "            and previous.sha256 is not None\n"
              "            and fetched.sha256 is not None\n"
              "            and previous.sha256 != fetched.sha256\n"
              "        ) or fetched.error in {\n"
              "            \"immutable archive checksum drift detected\",\n"
              "            \"refetched archive checksum differs from trusted manifest\",\n"
              "        }\n"
          )
          if content.count(fetched_anchor) != 1:
              raise SystemExit("pilot fetched anchor did not match exactly")
          content = content.replace(fetched_anchor, early_drift, 1)

          unavailable_old = (
              "                BackfillPilotStatus.UNAVAILABLE,\n"
              "                fetched.error,\n"
              "            )\n"
          )
          unavailable_new = (
              "                BackfillPilotStatus.UNAVAILABLE,\n"
              "                fetched.error,\n"
              "                checksum_drift=checksum_drift_before_status,\n"
              "            )\n"
          )
          if content.count(unavailable_old) != 1:
              raise SystemExit("pilot unavailable record anchor did not match exactly")
          content = content.replace(unavailable_old, unavailable_new, 1)

          failed_old = (
              "                BackfillPilotStatus.FAILED,\n"
              "                fetched.error,\n"
              "            )\n"
          )
          failed_new = (
              "                BackfillPilotStatus.FAILED,\n"
              "                fetched.error,\n"
              "                checksum_drift=checksum_drift_before_status,\n"
              "            )\n"
          )
          if content.count(failed_old) != 1:
              raise SystemExit("pilot failed record anchor did not match exactly")
          content = content.replace(failed_old, failed_new, 1)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Validate compatibility patch
        run: |
          poetry run ruff format alpha/historical_truth/pilot.py
          poetry run ruff check alpha/historical_truth/pilot.py
          poetry run mypy alpha
          poetry run pytest \
            tests/historical_truth/test_backfill_pilot.py \
            tests/historical_truth/test_backfill.py \
            tests/historical_truth/test_backfill_cli.py -q

      - name: Commit compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/htr007-pilot-compat-patch.yml
          git add alpha/historical_truth/pilot.py
          git commit -m "Preserve pilot checksum drift evidence"
          git push origin HEAD:feature/htr-007-checkpointed-backfill
