name: HTR-010A3 Unmapped Discrepancy Repair

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/htr010a3-unmapped-discrepancy-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: poetry run python scripts/patch_htr010a3_unmapped_discrepancy.py
      - run: |
          poetry run ruff format \
            alpha/historical_truth/foundation_readiness_engine.py \
            tests/historical_truth/test_foundation_readiness_pre2016_regressions.py
          poetry run ruff check \
            alpha/historical_truth/foundation_readiness_engine.py \
            tests/historical_truth/test_foundation_readiness_pre2016_regressions.py
          poetry run ruff format --check \
            alpha/historical_truth/foundation_readiness_engine.py \
            tests/historical_truth/test_foundation_readiness_pre2016_regressions.py
          poetry run mypy alpha/historical_truth/foundation_readiness_engine.py
          poetry run pytest -q \
            tests/historical_truth/test_foundation_readiness_pre2016_regressions.py \
            tests/historical_truth/test_foundation_readiness.py
      - run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/historical_truth/foundation_readiness_engine.py \
            tests/historical_truth/test_foundation_readiness_pre2016_regressions.py
          git commit -m "fix(htr-010a3): retain unmapped discrepancies"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
