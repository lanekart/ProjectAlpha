name: HTR010B1 Targeted Fix

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - '.github/HTR010B1_FIX_TRIGGER'

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Split transformation contract strings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/historical_truth/adjustment_replay_admission_engine.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"research_continuity_view": "May use all effective actions known by the research cutoff; never exposes event knowledge as a predictive feature before historical availability.",',
              '"research_continuity_view": (\n            "May use all effective actions known by the research cutoff; "\n            "never exposes event knowledge as a predictive feature before "\n            "historical availability."\n        ),',
          )
          text = text.replace(
              '"rolling_as_of_replay_view": "At replay date t, use only factors whose actions are effective on or before t and whose immutable evidence version is pinned to the replay contract.",',
              '"rolling_as_of_replay_view": (\n            "At replay date t, use only factors whose actions are effective "\n            "on or before t and whose immutable evidence version is pinned "\n            "to the replay contract."\n        ),',
          )
          text = text.replace(
              '"event_knowledge_boundary": "Announcement and filing content may influence features only after its historical availability timestamp.",',
              '"event_knowledge_boundary": (\n            "Announcement and filing content may influence features only "\n            "after its historical availability timestamp."\n        ),',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and commit
        run: |
          python -m pip install ruff==0.15.20
          ruff format alpha/historical_truth/adjustment_replay_admission_engine.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/historical_truth/adjustment_replay_admission_engine.py
          git commit -m 'Fix HTR-010B1 transformation contract formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
