name: DSI-012 Market Slice Rebind

on:
  push:
    branches:
      - feature/dsi-012-governed-structural-stop-risk-scaling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-012-governed-structural-stop-risk-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply governed slice-hash repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"replacement target missing in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          main = Path("alpha/decision_superiority/structural_stop_risk_scaling.py")
          replace_once(
              main,
              "    _source_contract_rows,\n    _validate_source_chain,\n",
              "    _source_contract_rows,\n    _validate_market_slice,\n    _validate_source_chain,\n",
          )
          replace_once(
              main,
              "        validate_regime_strategy_tournament_certificate(\n"
              "            sources.dsi007_certificate,\n"
              "            require_ready=False,\n"
              "            database=sources.database,\n"
              "        )\n",
              "        dsi007 = validate_regime_strategy_tournament_certificate(\n"
              "            sources.dsi007_certificate,\n"
              "            require_ready=False,\n"
              "        )\n",
          )
          replace_once(
              main,
              "        selected, simulation, base_metrics = _rehydrate_structural_stop(\n"
              "            sources=sources,\n"
              "            dsi008=dsi008,\n"
              "        )\n",
              "        selected, simulation, base_metrics, market_hash = (\n"
              "            _rehydrate_structural_stop(\n"
              "                sources=sources,\n"
              "                dsi008=dsi008,\n"
              "            )\n"
              "        )\n"
              "        _validate_market_slice(\n"
              "            actual_market_hash=market_hash,\n"
              "            dsi009=dsi009,\n"
              "        )\n",
          )
          replace_once(
              main,
              "        source_rows = _source_contract_rows(sources=sources, dsi009=dsi009)\n",
              "        source_rows = _source_contract_rows(\n"
              "            sources=sources,\n"
              "            dsi009=dsi009,\n"
              "            dsi007=dsi007,\n"
              "            market_hash=market_hash,\n"
              "        )\n",
          )

          rehydration = Path(
              "alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py"
          )
          replace_once(
              rehydration,
              "    _load_dsi008_ledgers,\n    _outer_signals,\n",
              "    _load_dsi008_ledgers,\n    _market_sha256,\n    _outer_signals,\n",
          )
          replace_once(
              rehydration,
              ") -> tuple[pd.DataFrame, dict[str, Any], dict[str, Any]]:\n",
              ") -> tuple[pd.DataFrame, dict[str, Any], dict[str, Any], str]:\n",
          )
          replace_once(
              rehydration,
              "    candidates = _candidate_frame(signals, market)\n",
              "    market_hash = _market_sha256(market)\n"
              "    candidates = _candidate_frame(signals, market)\n",
          )
          replace_once(
              rehydration,
              "    return selected, simulation, metrics\n",
              "    return selected, simulation, metrics, market_hash\n",
          )
          marker = "\n\ndef _parity_rows(\n"
          addition = '''\n\ndef _validate_market_slice(\n    *,\n    actual_market_hash: str,\n    dsi009: Mapping[str, Any],\n) -> None:\n    expected = str(\n        cast(Mapping[str, Any], dsi009["source_chain_hashes"])[\n            "GOVERNED_MARKET_SLICE"\n        ]\n    )\n    if actual_market_hash != expected:\n        raise StructuralStopRiskScalingError(\n            "DSI012_GOVERNED_MARKET_SLICE_DRIFT"\n        )\n'''
          replace_once(rehydration, marker, addition + marker)
          replace_once(
              rehydration,
              "def _source_contract_rows(\n"
              "    *,\n"
              "    sources: StructuralStopRiskScalingSourcePaths,\n"
              "    dsi009: Mapping[str, Any],\n"
              ") -> list[dict[str, Any]]:\n"
              "    return [\n",
              "def _source_contract_rows(\n"
              "    *,\n"
              "    sources: StructuralStopRiskScalingSourcePaths,\n"
              "    dsi009: Mapping[str, Any],\n"
              "    dsi007: Mapping[str, Any],\n"
              "    market_hash: str,\n"
              ") -> list[dict[str, Any]]:\n"
              "    dsi007_hashes = cast(Mapping[str, Any], dsi007[\"source_chain_hashes\"])\n"
              "    return [\n",
          )
          replace_once(
              rehydration,
              "        {\n"
              "            \"source_role\": \"GOVERNED_MARKET_SLICE\",\n"
              "            \"path\": \"REHYDRATED_FROM_GOVERNED_DATABASE\",\n"
              "            \"sha256\": str(\n"
              "                cast(Mapping[str, Any], dsi009[\"source_chain_hashes\"])[\n"
              "                    \"GOVERNED_MARKET_SLICE\"\n"
              "                ]\n"
              "            ),\n"
              "        },\n",
              "        {\n"
              "            \"source_role\": \"GOVERNED_MARKET_SLICE\",\n"
              "            \"path\": \"REHYDRATED_FROM_CURRENT_GOVERNED_DATABASE\",\n"
              "            \"sha256\": market_hash,\n"
              "        },\n"
              "        {\n"
              "            \"source_role\": \"CURRENT_DATABASE_CONTAINER\",\n"
              "            \"path\": _portable_path(sources.database),\n"
              "            \"sha256\": _sha256(sources.database),\n"
              "        },\n"
              "        {\n"
              "            \"source_role\": \"DSI007_CERTIFIED_DATABASE_LINEAGE\",\n"
              "            \"path\": \"SIGNED_DSI007_CERTIFICATE_FIELD\",\n"
              "            \"sha256\": str(dsi007_hashes[\"HISTORICAL_TRUTH_DATABASE\"]),\n"
              "        },\n",
          )
          replace_once(
              rehydration,
              "    \"_source_contract_rows\",\n    \"_validate_source_chain\",\n",
              "    \"_source_contract_rows\",\n    \"_validate_market_slice\",\n    \"_validate_source_chain\",\n",
          )

          tests = Path("tests/decision_superiority/test_structural_stop_risk_scaling.py")
          replace_once(
              tests,
              "    _scaled_trade_ledger,\n    governance_flags,\n",
              "    _scaled_trade_ledger,\n    _validate_market_slice,\n    governance_flags,\n",
          )
          insert_before = "\n\ndef test_overlay_scales_path_and_charges_only_borrowed_exposure() -> None:\n"
          new_test = '''\n\ndef test_market_slice_validation_ignores_container_drift_but_not_population_drift() -> None:\n    dsi009 = {\n        "source_chain_hashes": {"GOVERNED_MARKET_SLICE": "slice-hash"}\n    }\n    _validate_market_slice(\n        actual_market_hash="slice-hash",\n        dsi009=dsi009,\n    )\n    with pytest.raises(\n        StructuralStopRiskScalingError,\n        match="DSI012_GOVERNED_MARKET_SLICE_DRIFT",\n    ):\n        _validate_market_slice(\n            actual_market_hash="different-slice",\n            dsi009=dsi009,\n        )\n'''
          replace_once(tests, insert_before, new_test + insert_before)

          docs = Path("docs/DSI-012_GOVERNED_STRUCTURAL_STOP_RISK_SCALING.md")
          text = docs.read_text(encoding="utf-8")
          anchor = "- DSI-009 source-chain and metric parity must reconcile before scaling.\n"
          if anchor not in text:
              raise SystemExit("documentation anchor missing")
          text = text.replace(
              anchor,
              anchor
              + "- The current DuckDB container may differ from the historical DSI-007 file, but the rehydrated DSI-009 governed OHLC slice must match its signed SHA-256 exactly.\n"
              + "- Both the current database-container hash and the historical DSI-007 database-lineage hash are retained as separate evidence.\n",
              1,
          )
          docs.write_text(text, encoding="utf-8")
          PY
      - name: Install locked Ruff
        run: pip install ruff==0.15.20
      - name: Format repaired files
        run: |
          ruff format \
            alpha/decision_superiority/structural_stop_risk_scaling.py \
            alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py \
            tests/decision_superiority/test_structural_stop_risk_scaling.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/structural_stop_risk_scaling.py \
            alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py \
            tests/decision_superiority/test_structural_stop_risk_scaling.py \
            docs/DSI-012_GOVERNED_STRUCTURAL_STOP_RISK_SCALING.md
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-012): bind rehydration to governed market slice"
          git push origin HEAD:feature/dsi-012-governed-structural-stop-risk-scaling
