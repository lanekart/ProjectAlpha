name: Temporary Fix B2 Repair Workflow

on:
  push:
    branches:
      - feature/htr-010b2-governed-adjusted-benchmark-integration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b2-governed-adjusted-benchmark-integration
          fetch-depth: 0
      - name: Fix comparison-call indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/temp-b2-comparison-capability-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          comparison_call = dedent(
              \'\'\'
                  comparison_frame = _build_comparison_frame(
                      identity_frame,
                      identities=inputs.identities,
                      actions=inputs.actions,
                      as_of=admission.replay_end,
                      dates=comparison_dates,
                      progress=progress,
                      progress_offset=len(dependency_dates),
                      progress_total=progress_total,
                  )
              \'\'\'
          )
'''
          new = '''          comparison_call = indent(
              dedent(
                  \'\'\'
                  comparison_frame = _build_comparison_frame(
                      identity_frame,
                      identities=inputs.identities,
                      actions=inputs.actions,
                      as_of=admission.replay_end,
                      dates=comparison_dates,
                      progress=progress,
                      progress_offset=len(dependency_dates),
                      progress_total=progress_total,
                  )
                  \'\'\'
              ).lstrip(),
              "    ",
          )
'''
          if new in text:
              print('workflow indentation already fixed')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('workflow indentation fixed')
          else:
              raise SystemExit(f'expected one comparison-call block, found {text.count(old)}')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-b2-comparison-capability-repair.yml
          git commit -m "Fix B2 comparison repair workflow indentation"
          git push origin HEAD:feature/htr-010b2-governed-adjusted-benchmark-integration
