name: DSI-010 B1E Restore Result

on:
  pull_request:
    paths: [.github/workflows/dsi010-b1e-restore-result.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90222623940"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep -nE 'Restore evidence|find inputs|test -d|test -f|No such file|cannot stat|Error|ERROR|failed|Failure|source=' /tmp/log | tail -220 || true
          tail -180 /tmp/log
