name: DSI-010 HTR-010A Outcome Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010a-outcome-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print HTR-010A execution block
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90192084558"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== HTR-010A MARKERS ====="
          grep -nE 'HTR-010A|COMPLETE SECURITY|Certification State|Primary State|Secondary blocker|BLOCKED_|Traceback|Exception|Error|ERROR' /tmp/job.log | tail -220 || true
          echo "===== HTR-010A RANGE ====="
          sed -n '520,610p' /tmp/job.log
