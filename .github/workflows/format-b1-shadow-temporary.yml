name: Temporary B1 Shadow Formatter

on:
  push:
    branches:
      - feature/htr-010b2-governed-adjusted-benchmark-integration

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Format focused files
        run: |
          poetry run ruff format \
            alpha/historical_truth/b1_shadow_replay.py \
            alpha/historical_truth/b1_shadow_replay_cli.py \
            alpha/historical_truth/b1_final_closure_cli.py \
            tests/historical_truth/test_b1_shadow_replay.py \
            tests/historical_truth/test_b1_final_closure.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-b1-shadow
          path: |
            alpha/historical_truth/b1_shadow_replay.py
            alpha/historical_truth/b1_shadow_replay_cli.py
            alpha/historical_truth/b1_final_closure_cli.py
            tests/historical_truth/test_b1_shadow_replay.py
            tests/historical_truth/test_b1_final_closure.py
          if-no-files-found: error
