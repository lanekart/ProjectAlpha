name: DSI-010 Legacy ISIN Bridge Result

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-legacy-isin-bridge-result.yml

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30355398752
          name: dsi010-rights-reference-certified-rebuild
          path: final
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30356547188
          name: dsi010-insufficient-factor-evidence-audit
          path: audit
      - name: Print compact A3 bridge contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              payload=json.loads(Path(path).read_text(encoding='utf-8'))
              return payload.get('records',payload) if isinstance(payload,dict) else payload

          cases=load(next(Path('audit').rglob('insufficient_factor_evidence_cases.json')))
          case=next(row for row in cases if row.get('insufficient_reason')=='LEGACY_CANDLES_MISSING_ISIN')
          a3=next(Path('final').rglob('htr010a3_tier_a_foundation_readiness'))
          joins=load(a3/'htr010a3_corporate_action_join_readiness.json')
          join=next(row for row in joins if str(row.get('identity_key'))==str(case.get('identity_key')))
          print('JOIN_KEYS='+json.dumps(sorted(join)))
          print('CASE='+json.dumps(case,sort_keys=True))
          print('JOIN='+json.dumps(join,sort_keys=True))
          print('A3_FILES='+json.dumps(sorted(path.name for path in a3.glob('*'))))
          PY
