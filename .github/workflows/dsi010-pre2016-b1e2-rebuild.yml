name: DSI-010 Pre-2016 B1E2 Rebuild

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-pre2016-b1e2-rebuild.yml

permissions:
  actions: read
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry && poetry install --no-interaction
      - name: Download preserved governed A3/B state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30335669653
          name: dsi010-a3-b-repaired-rerun
          path: inputs
      - name: Restore immutable A3 boundary
        run: |
          set -euo pipefail
          archive=$(find inputs -type f -name alpha_data_after_htr010b.tar.gz | head -1)
          calendar=$(find inputs -type f -name htr007_session_calendar.json | head -1)
          test -f "$archive"
          test -f "$calendar"
          mkdir -p work artifacts work/calendar
          tar -xzf "$archive" -C work
          test -f work/alpha_data/warehouse/historical_truth.duckdb
          cp -a inputs/artifacts/. artifacts/
          cp "$calendar" work/calendar/htr007_session_calendar.json
          test -f artifacts/htr010a3_tier_a_foundation_readiness/htr010a3_corporate_action_join_readiness.json
          rm -rf \
            artifacts/htr009b_corporate_action_price_continuity \
            artifacts/htr010b_complete_corporate_action_dataset \
            artifacts/htr010b1_adjustment_replay_admission \
            artifacts/htr010b1d_factor_transformation_forensics \
            artifacts/htr010b1d1_cross_series_identity_bridge \
            artifacts/htr010b1d2_bridge_aware_validation_repair \
            artifacts/htr010b1e2_final_admission_state_propagation \
            artifacts/dsi010_pre2016_b1e2_rebuild
          mkdir -p artifacts/dsi010_pre2016_b1e2_rebuild
      - name: Run governed repaired chain
        run: |
          set -euo pipefail
          poetry run python -m alpha historical-truth corporate-action-price-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/calendar/htr007_session_calendar.json \
            --root work/alpha_data \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr009b_corporate_action_price_continuity \
            --verify-only \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr009b.log

          poetry run python -m alpha historical-truth complete-corporate-action-dataset \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --root work/alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b_complete_corporate_action_dataset \
            --verify-only \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr010b.log

          poetry run python -m alpha historical-truth adjustment-replay-admission-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --root work/alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --session-calendar-report work/calendar/htr007_session_calendar.json \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1_adjustment_replay_admission \
            --verify-only \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr010b1c.log

          poetry run python -m alpha historical-truth factor-transformation-forensics \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1c-output artifacts/htr010b1_adjustment_replay_admission \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d_factor_transformation_forensics \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr010b1d.log

          poetry run python -m alpha historical-truth factor-transformation-bridge-forensics \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1d-output artifacts/htr010b1d_factor_transformation_forensics \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d1_cross_series_identity_bridge \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr010b1d1.log

          poetry run python -m alpha historical-truth bridge-aware-factor-validation-repair \
            --htr010b1d1-output artifacts/htr010b1d1_cross_series_identity_bridge \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d2_bridge_aware_validation_repair \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr010b1d2.log

          poetry run python -m alpha historical-truth bridge-aware-admission-reconcile \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1d2-output artifacts/htr010b1d2_bridge_aware_validation_repair \
            --session-calendar-report work/calendar/htr007_session_calendar.json \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1e2_final_admission_state_propagation \
            2>&1 | tee artifacts/dsi010_pre2016_b1e2_rebuild/htr010b1e2.log
      - name: Export signed rebuild summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path: Path):
              payload=json.loads(path.read_text(encoding='utf-8'))
              return payload.get('records', payload) if isinstance(payload, dict) else payload

          final_dir=Path('artifacts/htr010b1e2_final_admission_state_propagation')
          validations=load(final_dir/'htr010b1_factor_validation_results.json')
          readiness=json.loads((final_dir/'htr010b1_replay_readiness.json').read_text(encoding='utf-8'))
          d1=json.loads((Path('artifacts/htr010b1d_factor_transformation_forensics')/'htr010b1d_factor_transformation_forensics.json').read_text(encoding='utf-8'))
          d2=json.loads((Path('artifacts/htr010b1d2_bridge_aware_validation_repair')/'htr010b1d2_validation_repair.json').read_text(encoding='utf-8'))
          outcomes=Counter(str(row.get('validation_outcome')) for row in validations)
          target_symbols={str(row.get('symbol')): str(row.get('validation_outcome')) for row in validations if str(row.get('symbol')) in {'OMAXE','MINDACORP','JBMA'}}
          summary={
              'contract_version': readiness.get('consistency_contract_version'),
              'validation_outcomes': dict(sorted(outcomes.items())),
              'implementation_defect_count': outcomes.get('IMPLEMENTATION_DEFECT',0),
              'final_unresolved_interval_count': readiness.get('final_unresolved_interval_count'),
              'readiness_state': readiness.get('state'),
              'readiness_blockers': readiness.get('blockers',[]),
              'b1d_case_count': d1.get('case_count'),
              'b1d_classifications': d1.get('classification_counts',{}),
              'b1d2_case_count': d2.get('case_count'),
              'b1d2_proposed_outcomes': d2.get('proposed_validation_outcome_counts',{}),
              'target_symbol_outcomes': target_symbols,
              'production_influence': readiness.get('production_influence'),
              'full_benchmark_replays': 0,
          }
          out=Path('artifacts/dsi010_pre2016_b1e2_rebuild/rebuild_summary.json')
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          tar -czf artifacts/dsi010_pre2016_b1e2_rebuild/alpha_data_after_pre2016_b1e2.tar.gz -C work alpha_data
      - name: Enforce governed closure boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/dsi010_pre2016_b1e2_rebuild/rebuild_summary.json').read_text())
          assert p['implementation_defect_count'] == 0, p
          assert p['final_unresolved_interval_count'] == 0, p
          assert 'FACTOR_TRANSFORMATION_IMPLEMENTATION_DEFECTS' not in p['readiness_blockers'], p
          assert p['production_influence'] is False, p
          assert p['full_benchmark_replays'] == 0, p
          print('PRE2016_B1E2_REBUILD=success')
          print('ADJUSTED_REPLAY_READY=false')
          print('PRODUCTION_INFLUENCE=false')
          PY
      - name: Upload governed rebuilt evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-pre2016-b1e2-rebuild
          retention-days: 14
          compression-level: 6
          path: |
            artifacts/dsi010_pre2016_b1e2_rebuild
            artifacts/htr009b_corporate_action_price_continuity
            artifacts/htr010a3_tier_a_foundation_readiness
            artifacts/htr010b_complete_corporate_action_dataset
            artifacts/htr010b1_adjustment_replay_admission
            artifacts/htr010b1d_factor_transformation_forensics
            artifacts/htr010b1d1_cross_series_identity_bridge
            artifacts/htr010b1d2_bridge_aware_validation_repair
            artifacts/htr010b1e2_final_admission_state_propagation
            work/calendar/htr007_session_calendar.json
