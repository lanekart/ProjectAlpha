name: HTR-010B10 Quality Fix

on:
  push:
    branches:
      - feature/htr-010b10-governed-adaptive-institutional-trade-shadow
    paths:
      - .github/workflows/htr010b10-quality-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - name: Apply deterministic Ruff fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path("alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py")
          text = engine.read_text(encoding="utf-8")
          old = '''from alpha.benchmark_replay.governed_adaptive_publication_bridge import (
              HTR010B9_CONTRACT_VERSION,
              validate_governed_adaptive_publication_bridge_certificate,
          )
          from alpha.benchmark_replay.governed_adaptive_evidence_lineage import (
              HTR010B8_CONTRACT_VERSION,
              validate_governed_adaptive_evidence_lineage_certificate,
          )
          '''
          new = '''from alpha.benchmark_replay.governed_adaptive_evidence_lineage import (
              HTR010B8_CONTRACT_VERSION,
              validate_governed_adaptive_evidence_lineage_certificate,
          )
          from alpha.benchmark_replay.governed_adaptive_publication_bridge import (
              HTR010B9_CONTRACT_VERSION,
              validate_governed_adaptive_publication_bridge_certificate,
          )
          '''
          if old not in text:
              raise SystemExit("expected B10 import block not found")
          engine.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py")
          text = test.read_text(encoding="utf-8")
          replacements = {
              '    assert _readiness(**{**base, "default_path_drift_count": 1})[0] == B10_BLOCKED_DEFAULT\n': '''    assert (
              _readiness(**{**base, "default_path_drift_count": 1})[0]
              == B10_BLOCKED_DEFAULT
          )
          ''',
              '    assert _readiness(**{**base, "recommendation_semantic_drift_count": 1})[0] == B10_BLOCKED_RECOMMENDATION\n': '''    assert (
              _readiness(**{**base, "recommendation_semantic_drift_count": 1})[0]
              == B10_BLOCKED_RECOMMENDATION
          )
          ''',
              '    assert _readiness(**{**base, "unexplained_institutional_divergence_count": 1})[0] == B10_BLOCKED_INSTITUTIONAL\n': '''    assert (
              _readiness(
                  **{**base, "unexplained_institutional_divergence_count": 1}
              )[0]
              == B10_BLOCKED_INSTITUTIONAL
          )
          ''',
              '    assert _readiness(**{**base, "unexplained_trade_divergence_count": 1})[0] == B10_BLOCKED_TRADE\n': '''    assert (
              _readiness(**{**base, "unexplained_trade_divergence_count": 1})[0]
              == B10_BLOCKED_TRADE
          )
          ''',
              '    assert _readiness(**{**base, "unexplained_arm_divergence_count": 1})[0] == B10_BLOCKED_ARM\n': '''    assert (
              _readiness(**{**base, "unexplained_arm_divergence_count": 1})[0]
              == B10_BLOCKED_ARM
          )
          ''',
              '    assert _readiness(**{**base, "implementation_defects": ("DEFECT",)})[0] == B10_BLOCKED_DEFECT\n': '''    assert (
              _readiness(**{**base, "implementation_defects": ("DEFECT",)})[0]
              == B10_BLOCKED_DEFECT
          )
          ''',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"expected B10 test line not found: {before.strip()}")
              text = text.replace(before, after)
          test.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary workflow and publish fix
        run: |
          rm .github/workflows/htr010b10-quality-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py \
            .github/workflows/htr010b10-quality-fix.yml
          git commit -m "fix(htr010b10): satisfy repository quality gates"
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
