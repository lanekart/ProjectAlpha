name: DSI-012 Canonical Source Locator

on:
  push:
    branches:
      - feature/dsi-012-governed-structural-stop-risk-scaling

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-012-governed-structural-stop-risk-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Canonicalize source locators
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path(
              "alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py"
          )
          source = source_path.read_text(encoding="utf-8")
          old = '''def _portable_path(path: Path) -> str:
              parts = path.resolve().parts
              if "artifacts" in parts:
                  return "/".join(parts[parts.index("artifacts") :])
              return path.name
          '''
          new = '''def _portable_path(path: Path) -> str:
              return path.name
          '''
          if old not in source:
              raise SystemExit("portable-path replacement anchor not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path(
              "tests/decision_superiority/test_structural_stop_risk_scaling_parity.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          import_old = '''from alpha.decision_superiority.structural_stop_risk_scaling_rehydration import (
              _parity_rows,
          )
          '''
          import_new = '''from alpha.decision_superiority.structural_stop_risk_scaling_rehydration import (
              _parity_rows,
              _portable_path,
          )
          '''
          if import_old not in tests:
              raise SystemExit("test import replacement anchor not found")
          tests = tests.replace(import_old, import_new, 1)
          anchor = '''
          
          def test_parity_uses_frozen_signed_mechanism_not_current_winner(
          '''
          insert = '''
          
          def test_source_locator_is_relocation_invariant(tmp_path: Path) -> None:
              first = tmp_path / "run_a" / "dsi009_entry_stop_certificate.json"
              second = tmp_path / "run_b" / "dsi009_entry_stop_certificate.json"
          
              assert _portable_path(first) == "dsi009_entry_stop_certificate.json"
              assert _portable_path(second) == "dsi009_entry_stop_certificate.json"
          
          
          def test_parity_uses_frozen_signed_mechanism_not_current_winner(
          '''
          if anchor not in tests:
              raise SystemExit("test insertion anchor not found")
          test_path.write_text(tests.replace(anchor, insert, 1), encoding="utf-8")
          PY
      - name: Format and lint
        run: |
          pip install ruff==0.15.20
          ruff format \
            alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py \
            tests/decision_superiority/test_structural_stop_risk_scaling_parity.py
          ruff check \
            alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py \
            tests/decision_superiority/test_structural_stop_risk_scaling_parity.py
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/dsi012-canonical-source-locator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/structural_stop_risk_scaling_rehydration.py \
            tests/decision_superiority/test_structural_stop_risk_scaling_parity.py \
            .github/workflows/dsi012-canonical-source-locator.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-012): canonicalize source locators"
          git push origin HEAD:feature/dsi-012-governed-structural-stop-risk-scaling

# Trigger canonicalization after workflow registration.
