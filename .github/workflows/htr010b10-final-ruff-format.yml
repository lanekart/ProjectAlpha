name: HTR-010B10 Final Ruff Format

on:
  pull_request:
  push:
    branches:
      - feature/htr-010b10-governed-adaptive-institutional-trade-shadow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply locked Ruff formatting and clean workflow
        run: |
          pip install ruff==0.15.20
          ruff format alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py
          rm .github/workflows/htr010b10-final-ruff-format.yml
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py .github/workflows
          git commit -m 'style(htr-010b10): apply locked Ruff formatting'
          git pull --rebase origin feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
