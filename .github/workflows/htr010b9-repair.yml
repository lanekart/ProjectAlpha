name: Repair HTR-010B9 typing

on:
  push:
    branches:
      - feature/htr-010b9-governed-adaptive-publication-bridge
    paths:
      - .github/workflows/htr010b9-repair.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
          fetch-depth: 0

      - name: Synchronize feature head
        run: git pull --ff-only origin feature/htr-010b9-governed-adaptive-publication-bridge

      - name: Apply strict typing repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  print(f"anchor already absent in {path}: {old[:50]!r}")
                  return
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          publication = "alpha/learning_intelligence/publication.py"
          replace(
              publication,
              "from alpha.learning_intelligence.engine import AdaptiveLearningEngine\n",
              "from alpha.learning_intelligence.engine import AdaptiveLearningEngine\n"
              "from alpha.learning_intelligence.models import AdaptiveLearningAssessment\n",
          )
          replace(
              publication,
              "    def _metadata(assessment: object) -> dict[str, str]:\n",
              "    def _metadata(\n"
              "        assessment: AdaptiveLearningAssessment,\n"
              "    ) -> dict[str, str]:\n",
          )
          replace(
              publication,
              "        statistics = getattr(assessment, \"statistics\")\n"
              "        bayesian = getattr(assessment, \"bayesian\")\n"
              "        confidence = getattr(assessment, \"confidence\")\n"
              "        expectancy = getattr(statistics, \"expectancy\")\n",
              "        statistics = assessment.statistics\n"
              "        bayesian = assessment.bayesian\n"
              "        confidence = assessment.confidence\n"
              "        expectancy = statistics.expectancy\n",
          )
          replace(
              publication,
              "                getattr(confidence, \"adjusted_confidence\")\n",
              "                confidence.adjusted_confidence\n",
          )
          replace(
              publication,
              "                getattr(getattr(statistics, \"evidence_strength\"), \"value\")\n",
              "                statistics.evidence_strength.value\n",
          )
          replace(
              publication,
              "                getattr(bayesian, \"posterior_win_probability\")\n",
              "                bayesian.posterior_win_probability\n",
          )
          replace(
              publication,
              "                getattr(statistics, \"completed_trade_count\")\n",
              "                statistics.completed_trade_count\n",
          )

          engine = "alpha/benchmark_replay/governed_adaptive_publication_bridge.py"
          replace(
              engine,
              "from alpha.application.intelligence import IntelligenceApplicationService\n",
              "from alpha.application.intelligence import (\n"
              "    IntelligenceApplicationService,\n"
              "    IntelligenceRun,\n"
              ")\n",
          )
          replace(
              engine,
              "from alpha.performance_intelligence.recorder import recommendation_to_ledger_entry\n",
              "from alpha.performance_intelligence.recorder import recommendation_to_ledger_entry\n"
              "from alpha.recommendation_intelligence.models import RecommendationReport\n",
          )
          replace(
              engine,
              "    def publish(self, **_: object) -> AdaptiveMetadataPublicationBatch:\n"
              "        self.calls += 1\n",
              "    def publish(\n"
              "        self,\n"
              "        *,\n"
              "        recommendations: tuple[RecommendationReport, ...],\n"
              "        observed_on: date,\n"
              "        market_regime: str | None,\n"
              "    ) -> AdaptiveMetadataPublicationBatch:\n"
              "        del recommendations, observed_on, market_regime\n"
              "        self.calls += 1\n",
          )
          replace(
              engine,
              "    tuple[dict[str, object], ...], object, tuple[str, ...]\n",
              "    tuple[dict[str, object], ...], IntelligenceRun, tuple[str, ...]\n",
          )
          replace(
              engine,
              "def _recorder_parity(\n    baseline_run: object,\n",
              "def _recorder_parity(\n    baseline_run: IntelligenceRun,\n",
          )
          replace(
              engine,
              "    recommendations = tuple(getattr(baseline_run, \"recommendations\"))\n"
              "    market_regime = str(getattr(getattr(baseline_run, \"market_report\"), \"bias\").value)\n",
              "    recommendations = baseline_run.recommendations\n"
              "    market_regime = baseline_run.market_report.bias.value\n",
          )
          replace(
              engine,
              "def _publisher_round_trip(\n    baseline_run: object,\n",
              "def _publisher_round_trip(\n    baseline_run: IntelligenceRun,\n",
          )
          replace(
              engine,
              "    recommendation = tuple(getattr(baseline_run, \"recommendations\"))[0]\n"
              "    market_regime = str(getattr(getattr(baseline_run, \"market_report\"), \"bias\").value)\n",
              "    recommendation = baseline_run.recommendations[0]\n"
              "    market_regime = baseline_run.market_report.bias.value\n",
          )
          replace(
              engine,
              "            \"- No recommendation, approval, portfolio, execution, learning, or production influence.\",\n",
              "            (\n"
              "                \"- No recommendation, approval, portfolio, execution, \"\n"
              "                \"learning, or production influence.\"\n"
              "            ),\n",
          )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction
          poetry run ruff check . --fix
          poetry run ruff format .
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy alpha
          poetry run pytest -q \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/performance_intelligence/test_performance_intelligence.py \
            tests/application/test_intelligence.py \
            tests/canonical_universe_audit
          poetry run python -m alpha benchmark --help | \
            grep governed-adaptive-publication-bridge

      - name: Commit source-only repair
        run: |
          rm -f .tmp/htr010b9_patch.py
          rm -f .github/workflows/htr010b9-integrate.yml
          rm -f .github/workflows/htr010b9-finalize.yml
          rm -f .github/workflows/htr010b9-validate.yml
          rm -f .github/workflows/htr010b9-repair.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(htr-010b9): harden adaptive publication contracts'
          git push origin HEAD:feature/htr-010b9-governed-adaptive-publication-bridge

      - name: Record successful focused validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          gh pr comment 57 --body "HTR-010B9 focused validation passed after strict typing repair. Ruff, Ruff format, strict MyPy, focused publication/recorder/application/canonical/B9 tests, and CLI registration all passed at head \`${HEAD_SHA}\`."
