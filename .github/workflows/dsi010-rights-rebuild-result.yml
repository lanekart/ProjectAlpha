name: DSI-010 Rights Rebuild Result

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-rights-rebuild-result.yml

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read signed rights rebuild result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: '90252398550'
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          grep -nE '"(rights_factor_count|rights_factor_states|rights_validation_outcomes|all_validation_outcomes|rights_missing_terms_count|rights_provisional_reference_price_count|implementation_defect_count|final_unresolved_interval_count|readiness_state|readiness_blockers|production_influence|full_benchmark_replays)"|PRE2016_RIGHTS_TERMS_REBUILD|ADJUSTED_REPLAY_READY|PRODUCTION_INFLUENCE' /tmp/job.log | tail -260 || true
          sed -n '610,720p' /tmp/job.log || true
