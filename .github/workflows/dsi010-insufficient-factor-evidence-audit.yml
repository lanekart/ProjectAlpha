name: DSI-010 Insufficient Factor Evidence Audit

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-insufficient-factor-evidence-audit.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry && poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30355398752
          name: dsi010-rights-reference-certified-rebuild
          path: inputs
      - name: Restore governed warehouse
        run: |
          set -euo pipefail
          archive=$(find inputs -type f -name alpha_data_after_reference_certification.tar.gz | head -1)
          test -f "$archive"
          mkdir -p work artifacts/dsi010_insufficient_factor_evidence_audit
          tar -xzf "$archive" -C work
          test -f work/alpha_data/warehouse/historical_truth.duckdb
      - name: Classify insufficient evidence population
        run: |
          poetry run python - <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter
          from datetime import date
          from pathlib import Path
          from typing import Any

          import duckdb

          def load(path: Path) -> list[dict[str, Any]]:
              payload=json.loads(path.read_text(encoding='utf-8'))
              rows=payload.get('records',payload) if isinstance(payload,dict) else payload
              return [dict(row) for row in rows]

          b=next(Path('inputs').rglob('htr010b_complete_corporate_action_dataset'))
          final=next(Path('inputs').rglob('htr010b1e2_final_admission_state_propagation'))
          a3=next(Path('inputs').rglob('htr010a3_tier_a_foundation_readiness'))
          events=load(b/'htr010b_canonical_events.json')
          factors=load(b/'htr010b_adjustment_factors.json')
          results=load(final/'htr010b1_factor_validation_results.json')
          joins=load(a3/'htr010a3_corporate_action_join_readiness.json')
          event_by_id={str(row.get('canonical_event_id')):row for row in events}
          factor_by_event={str(row.get('canonical_event_id')):row for row in factors}
          join_by_identity={str(row.get('identity_key')):row for row in joins}
          insufficient=[row for row in results if str(row.get('validation_outcome'))=='FACTOR_INSUFFICIENT_EVIDENCE']
          db=Path('work/alpha_data/warehouse/historical_truth.duckdb')
          cases=[]
          with duckdb.connect(str(db),read_only=True) as con:
              for result in insufficient:
                  event_id=str(result.get('event_id') or result.get('canonical_event_id') or '')
                  event=event_by_id.get(event_id,{})
                  factor=factor_by_event.get(event_id,{})
                  identity=str(result.get('identity_key') or event.get('governed_identity_id') or factor.get('identity_key') or '')
                  symbol=str(result.get('symbol') or event.get('symbol') or '').upper()
                  event_isin=str(result.get('isin') or event.get('isin') or '').upper()
                  applicable=tuple(str(item).upper() for item in event.get('series_applicability') or ())
                  series=(str(result.get('series') or '').upper() or (applicable[0] if len(applicable)==1 else ''))
                  effective_text=str(result.get('effective_date') or event.get('effective_date') or '')
                  try:
                      effective=date.fromisoformat(effective_text)
                  except ValueError:
                      effective=None
                  join=join_by_identity.get(identity,{})
                  prior_symbol=None
                  current_symbol=None
                  prior_isin=None
                  current_isin=None
                  prior_history_count=0
                  if effective and symbol and series:
                      prior_symbol=con.execute(
                          '''SELECT trading_date, upper(coalesce(isin,'')), close_price,
                                    coalesce(source_sha256,'')
                             FROM daily_candle
                             WHERE upper(symbol)=? AND upper(series)=? AND trading_date<?
                             ORDER BY trading_date DESC LIMIT 1''',
                          [symbol,series,effective],
                      ).fetchone()
                      current_symbol=con.execute(
                          '''SELECT trading_date, upper(coalesce(isin,'')), open_price,
                                    coalesce(source_sha256,'')
                             FROM daily_candle
                             WHERE upper(symbol)=? AND upper(series)=? AND trading_date>=?
                             ORDER BY trading_date LIMIT 1''',
                          [symbol,series,effective],
                      ).fetchone()
                      prior_history_count=int(con.execute(
                          '''SELECT count(*) FROM (
                                 SELECT 1 FROM daily_candle
                                 WHERE upper(symbol)=? AND upper(series)=? AND trading_date<?
                                 ORDER BY trading_date DESC LIMIT 14
                             )''',
                          [symbol,series,effective],
                      ).fetchone()[0])
                  if effective and event_isin and series:
                      prior_isin=con.execute(
                          '''SELECT trading_date, upper(coalesce(isin,'')), close_price,
                                    coalesce(source_sha256,'')
                             FROM daily_candle
                             WHERE upper(isin)=? AND upper(series)=? AND trading_date<?
                             ORDER BY trading_date DESC LIMIT 1''',
                          [event_isin,series,effective],
                      ).fetchone()
                      current_isin=con.execute(
                          '''SELECT trading_date, upper(coalesce(isin,'')), open_price,
                                    coalesce(source_sha256,'')
                             FROM daily_candle
                             WHERE upper(isin)=? AND upper(series)=? AND trading_date>=?
                             ORDER BY trading_date LIMIT 1''',
                          [event_isin,series,effective],
                      ).fetchone()

                  state=str(factor.get('factor_state') or result.get('factor_state') or '')
                  price_factor=factor.get('price_factor')
                  if not event_id or not event:
                      reason='EVENT_CONTRACT_MISSING'
                  elif price_factor is None:
                      reason='OFFICIAL_FACTOR_VALUE_UNAVAILABLE'
                  elif not event_isin:
                      reason='EVENT_ISIN_MISSING'
                  elif len(applicable)!=1 or not series:
                      reason='EVENT_SERIES_NOT_UNIQUE'
                  elif prior_symbol is None:
                      reason='PRIOR_SYMBOL_SERIES_CANDLE_MISSING'
                  elif current_symbol is None:
                      reason='CURRENT_SYMBOL_SERIES_CANDLE_MISSING'
                  elif prior_history_count < 2:
                      reason='INSUFFICIENT_PRIOR_ATR_HISTORY'
                  elif not str(prior_symbol[1]) or not str(current_symbol[1]):
                      reason='LEGACY_CANDLES_MISSING_ISIN'
                  elif str(prior_symbol[1]) != event_isin or str(current_symbol[1]) != event_isin:
                      reason='SYMBOL_SERIES_ISIN_DISAGREES_WITH_EVENT'
                  elif prior_isin is None:
                      reason='PRIOR_EVENT_ISIN_CANDLE_MISSING'
                  elif current_isin is None:
                      reason='CURRENT_EVENT_ISIN_CANDLE_MISSING'
                  else:
                      reason='CANDLE_CONTEXT_AVAILABLE_REQUIRES_DEEPER_REVIEW'

                  cases.append({
                      'event_id':event_id,
                      'identity_key':identity,
                      'symbol':symbol or None,
                      'event_isin':event_isin or None,
                      'series':series or None,
                      'action_type':result.get('action_type') or event.get('action_type'),
                      'effective_date':effective_text or None,
                      'factor_state':state,
                      'price_factor':price_factor,
                      'a3_join_state':join.get('state'),
                      'a3_join_admitted':bool(join.get('admitted_to_certified_join')),
                      'series_applicability':list(applicable),
                      'prior_symbol_date':prior_symbol[0].isoformat() if prior_symbol else None,
                      'prior_symbol_isin':str(prior_symbol[1]) or None if prior_symbol else None,
                      'current_symbol_date':current_symbol[0].isoformat() if current_symbol else None,
                      'current_symbol_isin':str(current_symbol[1]) or None if current_symbol else None,
                      'prior_event_isin_date':prior_isin[0].isoformat() if prior_isin else None,
                      'current_event_isin_date':current_isin[0].isoformat() if current_isin else None,
                      'prior_history_count':prior_history_count,
                      'insufficient_reason':reason,
                      'production_influence':False,
                  })

          summary={
              'contract':'DSI-010-INSUFFICIENT-FACTOR-EVIDENCE-AUDIT-v1',
              'case_count':len(cases),
              'reason_counts':dict(sorted(Counter(str(row['insufficient_reason']) for row in cases).items())),
              'action_type_counts':dict(sorted(Counter(str(row['action_type']) for row in cases).items())),
              'factor_state_counts':dict(sorted(Counter(str(row['factor_state']) for row in cases).items())),
              'year_counts':dict(sorted(Counter(str(row['effective_date'])[:4] for row in cases if row['effective_date']).items())),
              'a3_join_admitted_count':sum(bool(row['a3_join_admitted']) for row in cases),
              'legacy_missing_isin_count':sum(row['insufficient_reason']=='LEGACY_CANDLES_MISSING_ISIN' for row in cases),
              'deep_review_count':sum(row['insufficient_reason']=='CANDLE_CONTEXT_AVAILABLE_REQUIRES_DEEPER_REVIEW' for row in cases),
              'factor_mutated':False,
              'admission_policy_changed':False,
              'full_benchmark_replays':0,
              'production_influence':False,
          }
          out=Path('artifacts/dsi010_insufficient_factor_evidence_audit')
          (out/'insufficient_factor_evidence_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (out/'insufficient_factor_evidence_cases.json').write_text(json.dumps(cases,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-insufficient-factor-evidence-audit
          retention-days: 14
          path: artifacts/dsi010_insufficient_factor_evidence_audit
