name: Pre-2016 Composite Factor Closure

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/pre2016-composite-factor-closure.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: |
          poetry run python scripts/patch_pre2016_composite_factor_closure.py
          poetry run python scripts/patch_pre2016_composite_factor_precision.py
          poetry run python scripts/patch_pre2016_composite_factor_test_escapes.py
          poetry run python scripts/patch_pre2016_composite_factor_defect_counts.py
      - name: Validate repair
        run: |
          poetry run ruff format \
            alpha/historical_truth/corporate_action_price_sources.py \
            alpha/historical_truth/factor_transformation_forensics.py \
            alpha/historical_truth/factor_transformation_bridge_forensics.py \
            alpha/historical_truth/bridge_aware_factor_validation_repair.py \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_pre2016_composite_factor_closure.py
          poetry run ruff check \
            alpha/historical_truth/corporate_action_price_sources.py \
            alpha/historical_truth/factor_transformation_forensics.py \
            alpha/historical_truth/factor_transformation_bridge_forensics.py \
            alpha/historical_truth/bridge_aware_factor_validation_repair.py \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_pre2016_composite_factor_closure.py
          poetry run ruff format --check \
            alpha/historical_truth/corporate_action_price_sources.py \
            alpha/historical_truth/factor_transformation_forensics.py \
            alpha/historical_truth/factor_transformation_bridge_forensics.py \
            alpha/historical_truth/bridge_aware_factor_validation_repair.py \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_pre2016_composite_factor_closure.py
          poetry run mypy \
            alpha/historical_truth/corporate_action_price_sources.py \
            alpha/historical_truth/factor_transformation_forensics.py \
            alpha/historical_truth/factor_transformation_bridge_forensics.py \
            alpha/historical_truth/bridge_aware_factor_validation_repair.py \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py
          poetry run pytest -q \
            tests/historical_truth/test_pre2016_composite_factor_closure.py \
            tests/historical_truth/test_corporate_action_price_certification.py \
            tests/historical_truth/test_factor_transformation_forensics.py \
            tests/historical_truth/test_factor_transformation_bridge_forensics.py \
            tests/historical_truth/test_bridge_aware_factor_validation_repair.py \
            tests/historical_truth/test_bridge_aware_admission_state_propagation.py
      - name: Publish permanent repair
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/historical_truth/corporate_action_price_sources.py \
            alpha/historical_truth/factor_transformation_forensics.py \
            alpha/historical_truth/factor_transformation_bridge_forensics.py \
            alpha/historical_truth/bridge_aware_factor_validation_repair.py \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_pre2016_composite_factor_closure.py
          git commit -m "fix(htr-010b1): close pre-2016 composite factors"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
