name: HTR010B1A Autofix

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - 'alpha/historical_truth/adjustment_replay_admission_*.py'
      - 'tests/historical_truth/test_adjustment_replay_admission_repair.py'
      - '.github/HTR010B1A_AUTOFIX_TRIGGER'

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Repair keyword-only calls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/historical_truth/adjustment_replay_admission_repair.py')
          text = path.read_text(encoding='utf-8')
          for key in ('symbol', 'series', 'isin', 'action_type', 'effective_date'):
              text = text.replace(
                  f'_first(event, factor, item, "{key}")',
                  f'_first(event, factor, item, key="{key}")',
              )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply Ruff fixes and formatting
        run: |
          python -m pip install ruff==0.15.20
          ruff check \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_models.py \
            alpha/historical_truth/adjustment_replay_admission_repair.py \
            tests/historical_truth/test_adjustment_replay_admission_repair.py \
            --fix || true
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_models.py \
            alpha/historical_truth/adjustment_replay_admission_repair.py \
            tests/historical_truth/test_adjustment_replay_admission_repair.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_models.py \
            alpha/historical_truth/adjustment_replay_admission_repair.py \
            tests/historical_truth/test_adjustment_replay_admission_repair.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format and repair HTR-010B1A implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
