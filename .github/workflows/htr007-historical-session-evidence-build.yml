name: HTR-007 Historical Session Evidence Build

on:
  push:
    branches:
      - feature/htr-007-historical-session-evidence
  pull_request:
    branches:
      - feature/recovery-foundation-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-007-historical-session-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.create true

      - name: Update lock and install dependencies
        run: |
          poetry lock
          poetry install --no-interaction

      - name: Add public Historical Truth exports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("alpha/historical_truth/__init__.py")
          text = path.read_text(encoding="utf-8")
          import_block = '''from alpha.historical_truth.historical_session_evidence import (
              HTR007_HISTORICAL_SESSION_EVIDENCE_CONTRACT_VERSION,
              NSE_YEAR_PAGE_TEMPLATE,
              HistoricalEvidenceRecord,
              HistoricalEvidenceReport,
              HistoricalEvidenceStatus,
              HistoricalSessionEvidenceEngine,
              ParsedAnnualCalendar,
          )
          '''
          marker = "from alpha.historical_truth.integrity import ("
          if import_block not in text:
              text = text.replace(marker, import_block + marker)
          additions = (
              '    "HTR007_HISTORICAL_SESSION_EVIDENCE_CONTRACT_VERSION",\n',
              '    "HistoricalEvidenceRecord",\n',
              '    "HistoricalEvidenceReport",\n',
              '    "HistoricalEvidenceStatus",\n',
              '    "HistoricalSessionEvidenceEngine",\n',
              '    "NSE_YEAR_PAGE_TEMPLATE",\n',
              '    "ParsedAnnualCalendar",\n',
          )
          anchor = '    "HTR007_BACKFILL_CONTRACT_VERSION",\n'
          for addition in reversed(additions):
              if addition not in text:
                  text = text.replace(anchor, anchor + addition)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate slice
        shell: bash
        run: |
          set -o pipefail
          poetry run ruff check --fix \
            alpha/historical_truth/historical_session_evidence.py \
            alpha/historical_truth/historical_session_evidence_cli.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_historical_session_evidence.py \
            2>&1 | tee ruff.txt
          poetry run ruff format \
            alpha/historical_truth/historical_session_evidence.py \
            alpha/historical_truth/historical_session_evidence_cli.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_historical_session_evidence.py
          poetry run ruff check \
            alpha/historical_truth/historical_session_evidence.py \
            alpha/historical_truth/historical_session_evidence_cli.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_historical_session_evidence.py \
            2>&1 | tee -a ruff.txt
          poetry run mypy \
            alpha/historical_truth/historical_session_evidence.py \
            alpha/historical_truth/historical_session_evidence_cli.py \
            2>&1 | tee mypy.txt
          poetry run pytest \
            tests/historical_truth/test_historical_session_evidence.py -q \
            2>&1 | tee pytest.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr007-historical-session-evidence-diagnostics
          path: |
            ruff.txt
            mypy.txt
            pytest.txt
          if-no-files-found: warn

      - name: Commit validated source and remove temporary workflow
        run: |
          rm .github/workflows/htr007-historical-session-evidence-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/historical_truth/historical_session_evidence.py \
            alpha/historical_truth/historical_session_evidence_cli.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_historical_session_evidence.py \
            pyproject.toml \
            poetry.lock \
            .github/workflows/htr007-historical-session-evidence-build.yml
          git commit -m "HTR-007: validate historical session evidence slice"
          git push origin HEAD:feature/htr-007-historical-session-evidence
