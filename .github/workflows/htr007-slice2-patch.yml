name: HTR-007 Slice 2 Patch

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-007-checkpointed-backfill

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry install --no-interaction

      - name: Patch known non-autofixable lines
        run: |
          poetry run python - <<'PY'
          from pathlib import Path

          path = Path("alpha/historical_truth/resumable.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              '                    error=verification.reason or "immutable archive verification failed",\n': (
                  '                    error=(\n'
                  '                        verification.reason\n'
                  '                        or "immutable archive verification failed"\n'
                  '                    ),\n'
              ),
              '                        error="refetched archive checksum differs from trusted manifest",\n': (
                  '                        error=(\n'
                  '                            "refetched archive checksum differs from "\n'
                  '                            "trusted manifest"\n'
                  '                        ),\n'
              ),
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit(f"expected one source fragment: {old!r}")
              content = content.replace(old, new, 1)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Format Slice 2
        run: |
          poetry run ruff format \
            alpha/historical_truth/backfill.py \
            alpha/historical_truth/backfill_cli.py \
            alpha/historical_truth/manager.py \
            alpha/historical_truth/resumable.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_backfill.py \
            tests/historical_truth/test_backfill_cli.py
          poetry run ruff check --fix \
            alpha/historical_truth/backfill.py \
            alpha/historical_truth/backfill_cli.py \
            alpha/historical_truth/manager.py \
            alpha/historical_truth/resumable.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_backfill.py \
            tests/historical_truth/test_backfill_cli.py

      - name: Verify Ruff Slice 2
        id: ruff
        continue-on-error: true
        run: |
          poetry run ruff check \
            alpha/historical_truth/backfill.py \
            alpha/historical_truth/backfill_cli.py \
            alpha/historical_truth/manager.py \
            alpha/historical_truth/resumable.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_backfill.py \
            tests/historical_truth/test_backfill_cli.py \
            > htr007-slice2-ruff.txt 2>&1

      - name: Upload Slice 2 Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htr007-slice2-ruff
          path: htr007-slice2-ruff.txt

      - name: Enforce Ruff result
        if: steps.ruff.outcome == 'failure'
        run: |
          cat htr007-slice2-ruff.txt
          exit 1

      - name: MyPy repository
        run: poetry run mypy alpha

      - name: Targeted recovery tests
        run: |
          poetry run pytest \
            tests/historical_truth/test_backfill.py \
            tests/historical_truth/test_backfill_cli.py \
            tests/historical_truth/test_archive_manager.py \
            tests/historical_truth/test_resumable_download.py -q

      - name: Commit validated Slice 2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/htr007-slice2-patch.yml
          git add \
            alpha/historical_truth/backfill.py \
            alpha/historical_truth/backfill_cli.py \
            alpha/historical_truth/manager.py \
            alpha/historical_truth/resumable.py \
            alpha/historical_truth/__init__.py \
            tests/historical_truth/test_backfill.py \
            tests/historical_truth/test_backfill_cli.py
          git commit -m "Validate checkpointed HTR-007 backfill"
          git push origin HEAD:feature/htr-007-checkpointed-backfill
