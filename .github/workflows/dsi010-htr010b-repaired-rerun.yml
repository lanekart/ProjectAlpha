name: DSI-010 Repaired HTR-010B Rerun

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010b-repaired-rerun.yml

permissions:
  actions: read
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Download preserved repaired A3 state
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30335669653
          name: dsi010-a3-b-repaired-rerun
          path: inputs/a3-b

      - name: Restore governed HTR-010B prerequisites
        run: |
          set -euo pipefail
          ARCHIVE=$(find inputs/a3-b -type f -name alpha_data_after_htr010b.tar.gz | head -1)
          CALENDAR=$(find inputs/a3-b -type f -name htr007_session_calendar.json | head -1)
          test -n "$ARCHIVE" && test -f "$ARCHIVE"
          test -n "$CALENDAR" && test -f "$CALENDAR"
          mkdir -p work artifacts/dsi010_htr010b_repaired_rerun
          tar -xzf "$ARCHIVE" -C work
          mkdir -p work/certified_calendar
          cp "$CALENDAR" work/certified_calendar/htr007_session_calendar.json
          for name in \
            htr009a_point_in_time_universe \
            htr009a2_event_sourced_universe \
            htr009b_corporate_action_price_continuity \
            htr010a_complete_security_dataset \
            htr010a1_population_interval_repair \
            htr010a2_lifecycle_session_semantics \
            htr010a3_tier_a_foundation_readiness; do
            source=$(find inputs/a3-b -type d -path "*/artifacts/${name}" | head -1)
            test -n "$source" && test -d "$source"
            rm -rf "artifacts/${name}"
            cp -a "$source" "artifacts/${name}"
          done
          rm -rf artifacts/htr010b_complete_corporate_action_dataset
          test -f work/alpha_data/warehouse/historical_truth.duckdb
          test -f artifacts/htr010a3_tier_a_foundation_readiness/htr010a3_readiness.json

      - name: Run repaired HTR-010B complete corporate-action dataset
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run python -m alpha historical-truth complete-corporate-action-dataset \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --root work/alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b_complete_corporate_action_dataset \
            --refresh-sources \
            2>&1 | tee artifacts/dsi010_htr010b_repaired_rerun/htr010b.log

      - name: Export governed HTR-010B result
        if: always()
        env:
          B_OUTCOME: ${{ steps.b.outcome }}
        run: |
          poetry run python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/htr010b_complete_corporate_action_dataset")
          executive_path = output / "htr010b_executive_report.json"
          readiness_path = output / "htr010b_adjusted_replay_readiness.json"
          certification_path = output / "htr010b_certification.json"
          executive = json.loads(executive_path.read_text(encoding="utf-8")) if executive_path.is_file() else {}
          readiness = json.loads(readiness_path.read_text(encoding="utf-8")) if readiness_path.is_file() else {}
          certification = json.loads(certification_path.read_text(encoding="utf-8")) if certification_path.is_file() else {}
          summary = {
              "htr010b_outcome": os.environ.get("B_OUTCOME", "unknown"),
              "tier_a_identities": executive.get("tier_a_identities"),
              "raw_event_records": executive.get("raw_event_records"),
              "canonical_events": executive.get("canonical_events"),
              "rejected_events": executive.get("rejected_events"),
              "replay_readiness": readiness.get("state"),
              "replay_blockers": readiness.get("blockers", []),
              "upstream_htr010a3_readiness": readiness.get("upstream_htr010a3_readiness"),
              "upstream_htr010a3_blockers": readiness.get("upstream_htr010a3_blockers", []),
              "quarantined_identity_count": readiness.get("quarantined_identity_count"),
              "quarantined_interval_count": readiness.get("quarantined_interval_count"),
              "certification": certification,
              "report_sha256": executive.get("report_sha256"),
              "production_influence": False,
          }
          target = Path("artifacts/dsi010_htr010b_repaired_rerun")
          target.mkdir(parents=True, exist_ok=True)
          (target / "htr010b_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          tar -czf artifacts/dsi010_htr010b_repaired_rerun/alpha_data_after_htr010b.tar.gz \
            -C work alpha_data

      - name: Upload repaired HTR-010B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-htr010b-repaired-rerun
          path: |
            artifacts/dsi010_htr010b_repaired_rerun
            artifacts/htr010b_complete_corporate_action_dataset
            artifacts/htr010a3_tier_a_foundation_readiness
            artifacts/htr010a2_lifecycle_session_semantics
            artifacts/htr010a1_population_interval_repair
            artifacts/htr010a_complete_security_dataset
            artifacts/htr009b_corporate_action_price_continuity
            work/certified_calendar/htr007_session_calendar.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce execution completion
        if: always()
        env:
          B_OUTCOME: ${{ steps.b.outcome }}
        run: |
          echo "HTR010B_OUTCOME=${B_OUTCOME}"
          test "${B_OUTCOME}" = success
          test -f artifacts/htr010b_complete_corporate_action_dataset/htr010b_executive_report.json
          test -f artifacts/htr010b_complete_corporate_action_dataset/htr010b_adjusted_replay_readiness.json
          echo "PRODUCTION_INFLUENCE=false"
