name: Temporary PR44 Ruff Autofix

on:
  push:
    branches: [feature/bootstrap]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message == 'Temporarily normalize PR44 Ruff formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b1-final-governed-adjusted-replay-closure
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Normalize branch
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .

      - name: Commit normalized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/historical_truth tests/historical_truth
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Normalize HTR-010B1 final formatting'
          git push origin HEAD:feature/htr-010b1-final-governed-adjusted-replay-closure
