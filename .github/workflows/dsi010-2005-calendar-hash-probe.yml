name: DSI-010 2005 Calendar Hash Probe

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-2005-calendar-hash-probe.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-2005-calendar-hash-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download and hash exact official circular
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import requests

          url = "https://nsearchives.nseindia.com/content/circulars/cmtr5633.htm"
          output = Path("artifacts/dsi010_2005_calendar_hash_probe")
          output.mkdir(parents=True, exist_ok=True)
          response = requests.get(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 ProjectAlpha-HistoricalTruth/1.0",
                  "Accept": "text/html,*/*",
              },
              timeout=45,
          )
          raw = response.content
          digest = hashlib.sha256(raw).hexdigest()
          document = output / f"cmtr5633_{digest[:12]}.htm"
          document.write_bytes(raw)
          metadata = {
              "source_id": "NSE_CMTR_5633_2005_ANNUAL_CALENDAR",
              "source_url": url,
              "http_status": response.status_code,
              "final_url": response.url,
              "content_type": response.headers.get("Content-Type", ""),
              "response_bytes": len(raw),
              "sha256": digest,
              "html_signature_valid": b"<html" in raw[:2048].lower() or b"<body" in raw[:2048].lower(),
              "production_influence": False,
          }
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("===== DSI-010 2005 OFFICIAL CALENDAR HASH PROBE =====")
          for key, value in metadata.items():
              print(f"{key}={value}")
          if response.status_code != 200 or not metadata["html_signature_valid"]:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-2005-calendar-hash-probe
          path: artifacts/dsi010_2005_calendar_hash_probe
          if-no-files-found: error
          retention-days: 14
