name: DSI-009 Right Boundary Repair

on:
  push:
    branches:
      - feature/dsi-012-governed-structural-stop-risk-scaling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-012-governed-structural-stop-risk-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply right-boundary censoring repair
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("alpha/decision_superiority/entry_stop_improvement.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    frame = signals.copy()
              frame = frame.loc[
                  frame["walk_forward_fold_id"].notna() & frame["signal_date"].between(start, end)
              ].copy()
          '''
          new = '''    frame = signals.copy()
              if "entry_eligibility_date" not in frame.columns:
                  raise EntryStopImprovementError("DSI008_ENTRY_ELIGIBILITY_DATE_MISSING")
              in_signal_window = frame["walk_forward_fold_id"].notna() & frame[
                  "signal_date"
              ].between(start, end)
              missing_entry_date = in_signal_window & frame["entry_eligibility_date"].isna()
              if bool(missing_entry_date.any()):
                  raise EntryStopImprovementError(
                      "DSI008_ENTRY_ELIGIBILITY_DATE_MISSING:"
                      f"{int(missing_entry_date.sum())}"
                  )
              frame = frame.loc[
                  in_signal_window & frame["entry_eligibility_date"].le(end)
              ].copy()
          '''
          if old not in source:
              raise SystemExit("source replacement anchor not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/decision_superiority/test_entry_stop_improvement.py")
          tests = test_path.read_text(encoding="utf-8")
          helper_old = '''        "signal_date": date(2024, 1, 2),
                  "walk_forward_fold_id": fold,
          '''
          helper_new = '''        "signal_date": date(2024, 1, 2),
                  "entry_eligibility_date": date(2024, 1, 3),
                  "walk_forward_fold_id": fold,
          '''
          if helper_old not in tests:
              raise SystemExit("test helper replacement anchor not found")
          tests = tests.replace(helper_old, helper_new, 1)

          test_anchor = '''    assert selected["signal_id"].tolist() == ["S-1"]
          
          
          def test_missing_fold_regime_selection_fails_closed() -> None:
          '''
          test_insert = '''    assert selected["signal_id"].tolist() == ["S-1"]
          
          
          def test_outer_signal_population_excludes_right_censored_entries() -> None:
              eligible = _signal_row("S-1", "A", "TRANSITION", "WF-2021")
              right_censored = _signal_row("S-2", "A", "TRANSITION", "WF-2021")
              right_censored["signal_date"] = date(2025, 12, 24)
              right_censored["entry_eligibility_date"] = date(2025, 12, 26)
              selections = pd.DataFrame(
                  [
                      {
                          "walk_forward_fold_id": "WF-2021",
                          "selection_scope": "REGIME:TRANSITION",
                          "selected_strategy_variant_id": "A",
                      }
                  ]
              )
              selected = _outer_signals(
                  pd.DataFrame([eligible, right_censored]),
                  selections=selections,
                  policy=EntryStopPolicy(),
              )
              assert selected["signal_id"].tolist() == ["S-1"]
          
          
          def test_missing_fold_regime_selection_fails_closed() -> None:
          '''
          if test_anchor not in tests:
              raise SystemExit("test insertion anchor not found")
          test_path.write_text(tests.replace(test_anchor, test_insert, 1), encoding="utf-8")
          PY
      - name: Format and lint repair
        run: |
          pip install ruff==0.15.20
          ruff format \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
          ruff check \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/dsi009-right-boundary-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py \
            .github/workflows/dsi009-right-boundary-repair.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-009): censor non-executable end-window signals"
          git push origin HEAD:feature/dsi-012-governed-structural-stop-risk-scaling
