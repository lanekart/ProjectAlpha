name: HTR-009A Null-ISIN Repair Runner

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/htr009a-null-isin-repair-runner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - run: poetry run python scripts/patch_htr009a_pre2016_null_isin.py
      - run: |
          poetry run ruff format \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          poetry run ruff check \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          poetry run ruff format --check \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          poetry run mypy alpha/historical_truth/point_in_time_identity_engine.py
          poetry run pytest -q \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py \
            tests/historical_truth/test_point_in_time_identity_certification.py
      - run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          git commit -m "fix(htr-009a): handle null ISINs in reuse audit"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
