name: DSI-010 2005 Emergency Holiday Evidence

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-2005-emergency-holiday-hash.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-2005-emergency-holiday-hash.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Download and validate official NSE press release
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from io import BytesIO
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          url = "https://nsearchives.nseindia.com/content/press/27072005.pdf"
          response = requests.get(
              url,
              headers={"User-Agent": "ProjectAlpha-HistoricalTruth/1.0"},
              timeout=45,
          )
          response.raise_for_status()
          raw = response.content
          if not raw.startswith(b"%PDF-"):
              raise SystemExit("OFFICIAL_PRESS_RELEASE_PDF_SIGNATURE_INVALID")
          digest = hashlib.sha256(raw).hexdigest()
          text = "\n".join(
              (page.extract_text() or "").strip()
              for page in PdfReader(BytesIO(raw)).pages
          )
          required = (
              "Trading holiday and Postponement of July expiry",
              "NSE and BSE markets closed on Thursday, July 28, 2005",
              "Jul 27, 2005",
          )
          normalized = " ".join(text.split())
          for token in required:
              if " ".join(token.split()) not in normalized:
                  raise SystemExit(f"OFFICIAL_PRESS_RELEASE_CONTENT_MISSING:{token}")

          output = Path("artifacts/dsi010_2005_emergency_holiday")
          output.mkdir(parents=True, exist_ok=True)
          document = output / "nse_press_27072005.pdf"
          document.write_bytes(raw)
          extracted = output / "extracted_text.txt"
          extracted.write_text(text.rstrip() + "\n", encoding="utf-8")
          metadata = {
              "source_url": url,
              "final_url": response.url,
              "http_status": response.status_code,
              "content_type": response.headers.get("Content-Type", ""),
              "byte_size": len(raw),
              "sha256": digest,
              "extracted_text_sha256": hashlib.sha256(
                  extracted.read_bytes()
              ).hexdigest(),
              "trading_date": "2005-07-28",
              "classification": "HOLIDAY",
              "segment_scope": "EXCHANGE_WIDE",
              "content_validation_passed": True,
              "production_influence": False,
          }
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("===== DSI-010 2005 EMERGENCY HOLIDAY EVIDENCE =====")
          for key, value in metadata.items():
              print(f"{key}: {value}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-2005-emergency-holiday-evidence
          path: artifacts/dsi010_2005_emergency_holiday
          if-no-files-found: error
          retention-days: 14
