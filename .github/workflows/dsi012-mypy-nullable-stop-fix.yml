name: DSI-012 MyPy Nullable Stop Fix

on:
  push:
    branches:
      - feature/dsi-012-governed-structural-stop-risk-scaling

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-012-governed-structural-stop-risk-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Replace nullable scalar with NaN sentinel
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("alpha/decision_superiority/entry_stop_improvement.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _stop_level(
              row: pd.Series[Any],
              stop: StopMechanism,
              *,
              support: float | None,
          ) -> float | None:
              entry = float(row["entry_price_after_slippage"])
              incumbent = float(row["initial_stop"])
              atr = _optional_float(row["atr14"])
          '''
          new = '''def _stop_level(
              row: pd.Series[Any],
              stop: StopMechanism,
              *,
              support: float | None,
          ) -> float:
              entry = float(row["entry_price_after_slippage"])
              incumbent = float(row["initial_stop"])
              atr = _optional_float(row["atr14"])
          '''
          if old not in source:
              raise SystemExit("stop-level signature anchor not found")
          source = source.replace(old, new, 1)
          source = source.replace(
              '''        if atr is None or atr <= 0:
                      return None
          ''',
              '''        if atr is None or atr <= 0:
                      return math.nan
          ''',
              2,
          )
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/decision_superiority/test_entry_stop_improvement.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '    assert _stop_level(row, stops["STOP-ATR-125"], support=None) is None\n',
              '    assert pd.isna(_stop_level(row, stops["STOP-ATR-125"], support=None))\n',
              1,
          )
          tests = tests.replace(
              '''    assert _stop_level(row, stops["STOP-VOL-STRUCTURAL-10D"], support=94.0) is None
          ''',
              '''    assert pd.isna(
                  _stop_level(row, stops["STOP-VOL-STRUCTURAL-10D"], support=94.0)
              )
          ''',
              1,
          )
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Format and lint
        run: |
          pip install ruff==0.15.20
          ruff format \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
          ruff check \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/dsi012-mypy-nullable-stop-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py \
            .github/workflows/dsi012-mypy-nullable-stop-fix.yml
          git commit -m "fix(dsi-009): use NaN for unavailable stop levels"
          git push origin HEAD:feature/dsi-012-governed-structural-stop-risk-scaling
