name: DSI010 Calendar Gate Patch

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/dsi-010-pre2016-external-era-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Patch engine calendar gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/decision_superiority/pre2016_external_validation.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          calendar_import = [
              'from alpha.decision_superiority.pre2016_calendar import (',
              '    validate_pre2016_calendar_report,',
              ')',
          ]
          if calendar_import[0] not in lines:
              start = lines.index(
                  'from alpha.decision_superiority.pre2016_benchmark import ('
              )
              end = next(
                  index for index in range(start + 1, len(lines)) if lines[index] == ')'
              )
              lines[end + 1:end + 1] = calendar_import

          if not any('calendar_payload = validate_pre2016_calendar_report' in line for line in lines):
              start = lines.index(
                  '        validate_regime_strategy_tournament_certificate('
              )
              end = next(
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index] == '        )'
              )
              lines[end + 1:end + 1] = [
                  '        calendar_payload = validate_pre2016_calendar_report(',
                  '            sources.calendar_report,',
                  '            require_certified=True,',
                  '        )',
              ]

          if not any('"source_role": "PRE2016_SESSION_CALENDAR"' in line for line in lines):
              insert = lines.index(
                  '        featured, regime_daily, regime_transitions = _build_point_in_time_features('
              )
              lines[insert:insert] = [
                  '        source_rows = (',
                  '            *source_rows,',
                  '            {',
                  '                "source_role": "PRE2016_SESSION_CALENDAR",',
                  '                "availability": "AVAILABLE",',
                  '                "sha256": _file_sha256(sources.calendar_report),',
                  '                "byte_size": sources.calendar_report.stat().st_size,',
                  '                "portable_locator": sources.calendar_report.name,',
                  '                "contract_version": calendar_payload.get("contract_version"),',
                  '                "report_sha256": calendar_payload.get("report_sha256"),',
                  '                "certification_state": calendar_payload.get(',
                  '                    "certification_state"',
                  '                ),',
                  '                "expected_sessions": calendar_payload.get(',
                  '                    "expected_session_count"',
                  '                ),',
                  '                "observed_sessions": calendar_payload.get(',
                  '                    "observed_session_count"',
                  '                ),',
                  '                "used_for_decisions": True,',
                  '            },',
                  '        )',
              ]

          if not any('"calendar": {' in line for line in lines):
              anchor = lines.index('            "market_rows": len(market),')
              lines[anchor + 1:anchor + 1] = [
                  '            "calendar": {',
                  '                "contract_version": calendar_payload.get(',
                  '                    "contract_version"',
                  '                ),',
                  '                "report_sha256": calendar_payload.get("report_sha256"),',
                  '                "certification_state": calendar_payload.get(',
                  '                    "certification_state"',
                  '                ),',
                  '                "expected_sessions": calendar_payload.get(',
                  '                    "expected_session_count"',
                  '                ),',
                  '                "observed_sessions": calendar_payload.get(',
                  '                    "observed_session_count"',
                  '                ),',
                  '            },',
              ]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m compileall -q \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_calendar.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/dsi010_calendar_gate_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/decision_superiority/pre2016_external_validation.py \
            .github/workflows/dsi010_calendar_gate_patch.yml
          git commit -m 'fix(dsi-010): enforce certified external-era calendar'
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
