name: DSI-010 Pre-2016 B1E2 Result

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-pre2016-b1e2-result.yml

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Print governed signed summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: '90243432169'
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          grep -nE '"(contract_version|validation_outcomes|implementation_defect_count|final_unresolved_interval_count|readiness_state|readiness_blockers|b1d_case_count|b1d_classifications|b1d2_case_count|b1d2_proposed_outcomes|target_symbol_outcomes|production_influence|full_benchmark_replays)"|PRE2016_B1E2_REBUILD|ADJUSTED_REPLAY_READY|PRODUCTION_INFLUENCE' /tmp/job.log | tail -220 || true
          sed -n '600,690p' /tmp/job.log || true
