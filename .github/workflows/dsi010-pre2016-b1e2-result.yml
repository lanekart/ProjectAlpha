name: DSI-010 Pre-2016 B1E2 Result

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-pre2016-b1e2-result.yml

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Print governed signed summary payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: '90243432169'
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          sed -n '642,684p' /tmp/job.log
