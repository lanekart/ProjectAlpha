name: DSI-010 2008 Patch Failure Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-2008-patch-failure-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print patch failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90130264019"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== PATCH FAILURE ====="
          grep -nE \
            'BOUNDARY_MISSING|EVIDENCE_TYPING|AUDIT_PATCH|SystemExit|Traceback|Error|ERROR|failed|FAILED' \
            /tmp/job.log | tail -120 || true
          echo "===== FINAL 120 LINES ====="
          tail -120 /tmp/job.log
