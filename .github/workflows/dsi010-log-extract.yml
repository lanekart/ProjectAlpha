name: DSI010 MyPy Log Extract

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed quality-job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/lanekart/ProjectAlpha/actions/jobs/89899760788/logs \
            > quality-job.log
          grep -E \
            "(^|[^a-zA-Z])(error:|note:|Found [0-9]+ error|Success:)" \
            quality-job.log > dsi010-mypy-diagnostics.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-mypy-diagnostics
          path: |
            dsi010-mypy-diagnostics.txt
            quality-job.log
          if-no-files-found: error
          retention-days: 1
