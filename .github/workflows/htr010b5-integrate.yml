name: Integrate HTR-010B5

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - .github/workflows/htr010b5-integrate.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      FEATURE_BRANCH: feature/htr-010b5-governed-approval-gate-forensics-certification
    steps:
      - name: Reconstruct and diagnose the finalized payload
        shell: bash
        run: |
          set -euo pipefail
          comments="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          : > /tmp/htr010b5-final-payload.raw
          for number in $(seq 0 12); do
            printf -v index '%02d' "${number}"
            prefix="HTR010B5_FINAL_PART_${index}:"
            body="$(
              gh api --paginate "${comments}" \
                --jq ".[] | select(.body | startswith(\"${prefix}\")) | .body" \
                | tail -n 1
            )"
            if [[ -z "${body}" || "${body}" == "${prefix}" ]]; then
              echo "missing finalized payload part ${index}" >&2
              exit 1
            fi
            part="${body:${#prefix}}"
            printf 'part %s bytes=%s sha256=%s\n' \
              "${index}" "${#part}" "$(printf '%s' "${part}" | sha256sum | cut -d' ' -f1)"
            printf '%s' "${part}" >> /tmp/htr010b5-final-payload.raw
          done
          tr -d '\r\n\t ' < /tmp/htr010b5-final-payload.raw \
            > /tmp/htr010b5-final-payload.b64
          printf 'normalized base64 bytes=%s\n' \
            "$(wc -c < /tmp/htr010b5-final-payload.b64)"
          base64 --decode /tmp/htr010b5-final-payload.b64 \
            > /tmp/htr010b5-final-payload.tar.xz
          printf 'archive bytes=%s sha256=%s\n' \
            "$(wc -c < /tmp/htr010b5-final-payload.tar.xz)" \
            "$(sha256sum /tmp/htr010b5-final-payload.tar.xz | cut -d' ' -f1)"
          xz --test /tmp/htr010b5-final-payload.tar.xz

      - name: Check out the HTR-010B5 feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Materialize the finalized source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/htr010b5-final-payload.tar.xz -C .

      - name: Verify finalized source digests and syntax
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/htr010b5-source.sha256 <<'EOF'
          541ab7fdd3c97455b072c3ac43fe372862d4d5c00e23ef4fdf7ba0053a997ac5  alpha/application/benchmark_cli.py
          3dc58c3868d9064dbeca84586c3e862b904a242588bb7c34ac5d4741f1c0b59f  alpha/application/governed_approval_gate_forensics_cli.py
          5695a5a4416d0d3a1319ab0d14135e231f19ac35f98c309e551a03a30087d17c  alpha/benchmark_replay/__init__.py
          d9706f4ed3e4f3efdf930c0c0a658659c53a79356119a0a9b46ad53071910a3f  alpha/benchmark_replay/governed_approval_gate_forensics.py
          d61f09ec1b7f52d7d3590e350ed666c6021f93701d7f9e639426124403d2f84a  docs/HTR-010B5_GOVERNED_INSTITUTIONAL_APPROVAL_GATE_FORENSICS.md
          88a604c9fa5e332f2f54482a12e1cb4f0ef8afe5af6f2e7673cfcea69cfc37a4  tests/benchmark_replay/test_governed_approval_gate_forensics.py
          EOF
          sha256sum --check --strict /tmp/htr010b5-source.sha256
          python -m py_compile \
            alpha/application/benchmark_cli.py \
            alpha/application/governed_approval_gate_forensics_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_approval_gate_forensics.py \
            tests/benchmark_replay/test_governed_approval_gate_forensics.py

      - name: Install the locked project environment
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run HTR-010B5 milestone quality gates
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy alpha
          poetry run pytest -q \
            tests/benchmark_replay/test_governed_approval_gate_forensics.py

      - name: Commit the clean milestone implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/htr010b5
          rm -f .github/workflows/htr010b5-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/htr010b5-actual-paths
          cat > /tmp/htr010b5-expected-paths <<'EOF'
          .github/workflows/htr010b5-integrate.yml
          .tmp/htr010b5/payload.part-00
          .tmp/htr010b5/payload.part-01
          .tmp/htr010b5/payload.part-02
          .tmp/htr010b5/payload.part-03
          alpha/application/benchmark_cli.py
          alpha/application/governed_approval_gate_forensics_cli.py
          alpha/benchmark_replay/__init__.py
          alpha/benchmark_replay/governed_approval_gate_forensics.py
          docs/HTR-010B5_GOVERNED_INSTITUTIONAL_APPROVAL_GATE_FORENSICS.md
          tests/benchmark_replay/test_governed_approval_gate_forensics.py
          EOF
          diff -u /tmp/htr010b5-expected-paths /tmp/htr010b5-actual-paths
          git commit -m "feat(htr-010b5): certify approval-gate non-vacuity"
          git push origin "HEAD:${FEATURE_BRANCH}"
