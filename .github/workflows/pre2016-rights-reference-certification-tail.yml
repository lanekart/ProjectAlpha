name: Pre-2016 Rights Reference Certification Tail

on:
  pull_request:
    paths:
      - .github/workflows/pre2016-rights-reference-certification-tail.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print exact patch failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: '90256674574'
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          grep -nE 'RuntimeError|Traceback|BOUNDARY_MISSING|Error|error' /tmp/job.log | tail -100 || true
          tail -80 /tmp/job.log
