name: DSI-010 Legacy ISIN Bridge Rebuild

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-legacy-interval-v2-tail.yml

permissions:
  actions: read
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install project
        run: |
          pip install poetry
          poetry install --no-interaction
      - name: Download signed post-rights source boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30352312594
          name: dsi010-pre2016-rights-rebuild
          path: inputs
      - name: Download signed HTR-009A2 identity boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30335669653
          name: dsi010-a3-b-repaired-rerun
          path: identity
      - name: Restore governed source state
        run: |
          set -euo pipefail
          archive=$(find inputs -type f -name alpha_data_after_rights_rebuild.tar.gz | head -1)
          calendar=$(find inputs -type f -name htr007_session_calendar.json | head -1)
          a2=$(find identity -type d -name htr009a2_event_sourced_universe | head -1)
          test -f "$archive"
          test -f "$calendar"
          test -d "$a2"
          mkdir -p work artifacts work/calendar
          tar -xzf "$archive" -C work
          cp -a inputs/artifacts/. artifacts/
          rm -rf artifacts/htr009a2_event_sourced_universe
          cp -a "$a2" artifacts/
          cp "$calendar" work/calendar/htr007_session_calendar.json
          test -f work/alpha_data/warehouse/historical_truth.duckdb
          test -f artifacts/htr010a3_tier_a_foundation_readiness/htr010a3_corporate_action_join_readiness.json
          test -f artifacts/htr009a2_event_sourced_universe/htr009a2_membership_intervals.json
          test -f artifacts/htr009a2_event_sourced_universe/htr009a2_symbol_intervals.json
          test -f artifacts/htr009a2_event_sourced_universe/htr009a2_security_events.json
          rm -rf \
            artifacts/htr009b_corporate_action_price_continuity \
            artifacts/htr010b_complete_corporate_action_dataset \
            artifacts/htr010b1_adjustment_replay_admission \
            artifacts/htr010b1d_factor_transformation_forensics \
            artifacts/htr010b1d1_cross_series_identity_bridge \
            artifacts/htr010b1d2_bridge_aware_validation_repair \
            artifacts/htr010b1e2_final_admission_state_propagation \
            artifacts/dsi010_legacy_isin_bridge_rebuild
          mkdir -p artifacts/dsi010_legacy_isin_bridge_rebuild
      - name: Run governed HTR-009B through B1E2 chain
        run: |
          set -euo pipefail
          poetry run python -m alpha historical-truth corporate-action-price-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/calendar/htr007_session_calendar.json \
            --root work/alpha_data --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr009b_corporate_action_price_continuity --verify-only \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr009b.log
          poetry run python -m alpha historical-truth complete-corporate-action-dataset \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --root work/alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr009a2-output artifacts/htr009a2_event_sourced_universe \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b_complete_corporate_action_dataset --verify-only \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr010b.log
          poetry run python -m alpha historical-truth adjustment-replay-admission-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --root work/alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --session-calendar-report work/calendar/htr007_session_calendar.json \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b1_adjustment_replay_admission --verify-only \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr010b1c.log
          poetry run python -m alpha historical-truth factor-transformation-forensics \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1c-output artifacts/htr010b1_adjustment_replay_admission \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b1d_factor_transformation_forensics \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr010b1d.log
          poetry run python -m alpha historical-truth factor-transformation-bridge-forensics \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1d-output artifacts/htr010b1d_factor_transformation_forensics \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b1d1_cross_series_identity_bridge \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr010b1d1.log
          poetry run python -m alpha historical-truth bridge-aware-factor-validation-repair \
            --htr010b1d1-output artifacts/htr010b1d1_cross_series_identity_bridge \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b1d2_bridge_aware_validation_repair \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr010b1d2.log
          poetry run python -m alpha historical-truth bridge-aware-admission-reconcile \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1d2-output artifacts/htr010b1d2_bridge_aware_validation_repair \
            --session-calendar-report work/calendar/htr007_session_calendar.json \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b1e2_final_admission_state_propagation \
            2>&1 | tee artifacts/dsi010_legacy_isin_bridge_rebuild/htr010b1e2.log
      - name: Build and enforce governed bridge summary
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter
          from hashlib import sha256
          from pathlib import Path

          def load(path: Path):
              payload = json.loads(path.read_text(encoding="utf-8"))
              return payload.get("records", payload) if isinstance(payload, dict) else payload

          b = Path("artifacts/htr010b_complete_corporate_action_dataset")
          final = Path("artifacts/htr010b1e2_final_admission_state_propagation")
          a2 = Path("artifacts/htr009a2_event_sourced_universe")
          events = load(b / "htr010b_canonical_events.json")
          factors = load(b / "htr010b_adjustment_factors.json")
          results = load(final / "htr010b1_factor_validation_results.json")
          readiness = json.loads(
              (final / "htr010b1_replay_readiness.json").read_text(encoding="utf-8")
          )
          executive = json.loads(
              (b / "htr010b_executive_report.json").read_text(encoding="utf-8")
          )
          event_by_id = {
              str(row["canonical_event_id"]): row
              for row in events
              if row.get("canonical_event_id")
          }
          rights = [
              row
              for row in factors
              if event_by_id.get(str(row.get("canonical_event_id")), {}).get("action_type")
              == "RIGHTS"
          ]
          states = Counter(str(row.get("factor_state")) for row in rights)
          provenance = Counter(
              str(row.get("reference_price_provenance_state")) for row in rights
          )
          outcomes = Counter(str(row.get("validation_outcome")) for row in results)
          bridge_state = "CERTIFIED_DATED_OFFICIAL_IDENTITY_BRIDGE_PRIOR_CLOSE"
          bridge = [
              row
              for row in rights
              if row.get("reference_price_provenance_state") == bridge_state
          ]
          bridge_symbols = sorted(
              str(event_by_id[str(row["canonical_event_id"])]["symbol"])
              for row in bridge
          )
          evidence_files = (
              "htr009a2_membership_intervals.json",
              "htr009a2_symbol_intervals.json",
              "htr009a2_security_events.json",
          )
          evidence_sha256 = {
              name: sha256((a2 / name).read_bytes()).hexdigest()
              for name in evidence_files
          }
          summary = {
              "contract": "DSI-010-LEGACY-ISIN-BRIDGE-REBUILD-v1",
              "source_commit": "5e752d9476932d6e9bcff256410b4806274e6356",
              "rights_factor_count": len(rights),
              "rights_factor_states": dict(sorted(states.items())),
              "rights_reference_provenance_states": dict(sorted(provenance.items())),
              "bridge_certified_factor_count": len(bridge),
              "bridge_certified_symbols": bridge_symbols,
              "bridge_reference_isin_empty_count": sum(
                  row.get("reference_price_isin") is None for row in bridge
              ),
              "bridge_source_sha_present_count": sum(
                  isinstance(row.get("reference_price_source_sha256"), str)
                  and len(str(row["reference_price_source_sha256"])) == 64
                  for row in bridge
              ),
              "htr009a2_evidence_sha256": evidence_sha256,
              "all_validation_outcomes": dict(sorted(outcomes.items())),
              "implementation_defect_count": outcomes.get("IMPLEMENTATION_DEFECT", 0),
              "final_unresolved_interval_count": readiness.get(
                  "final_unresolved_interval_count"
              ),
              "readiness_state": readiness.get("state"),
              "readiness_blockers": readiness.get("blockers", []),
              "htr010b_report_sha256": executive.get("report_sha256"),
              "full_benchmark_replays": 0,
              "production_influence": readiness.get("production_influence"),
          }
          expected_symbols = sorted(
              [
                  "ADANIENT",
                  "ASAL",
                  "CENTRALBK",
                  "CUB",
                  "DHANBANK",
                  "DICIND",
                  "EIHOTEL",
                  "EXIDEIND",
                  "FMGOETZE",
                  "GODREJCP",
                  "GTLINFRA",
                  "HINDOILEXP",
                  "INFOMEDIA",
                  "KTKBANK",
                  "MURUDCERA",
                  "RELIGARE",
                  "SUZLON",
                  "TTML",
              ]
          )
          assert len(rights) == 105, summary
          assert states["FACTOR_CERTIFIED_REFERENCE_PRICE"] == 55, summary
          assert states["FACTOR_PROVISIONAL_REFERENCE_PRICE"] == 22, summary
          assert states["FACTOR_UNKNOWN_MISSING_TERMS"] == 28, summary
          assert provenance[bridge_state] == 18, summary
          assert provenance["PRIOR_ISIN_MISMATCH"] == 1, summary
          assert bridge_symbols == expected_symbols, summary
          assert summary["bridge_reference_isin_empty_count"] == 18, summary
          assert summary["bridge_source_sha_present_count"] == 18, summary
          assert summary["implementation_defect_count"] == 0, summary
          assert summary["final_unresolved_interval_count"] == 0, summary
          assert summary["full_benchmark_replays"] == 0, summary
          assert summary["production_influence"] is False, summary
          output = Path("artifacts/dsi010_legacy_isin_bridge_rebuild")
          (output / "legacy_isin_bridge_rebuild_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          print("LEGACY_ISIN_BRIDGE_REBUILD=success")
          print("ADJUSTED_REPLAY_READY=false")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - name: Upload governed rebuild
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-legacy-isin-bridge-rebuild
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
          path: |
            artifacts/dsi010_legacy_isin_bridge_rebuild
            artifacts/htr009b_corporate_action_price_continuity
            artifacts/htr010b_complete_corporate_action_dataset
            artifacts/htr010b1_adjustment_replay_admission
            artifacts/htr010b1d_factor_transformation_forensics
            artifacts/htr010b1d1_cross_series_identity_bridge
            artifacts/htr010b1d2_bridge_aware_validation_repair
            artifacts/htr010b1e2_final_admission_state_propagation
