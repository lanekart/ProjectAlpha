name: DSI-010 Source Snapshot

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-legacy-interval-v2-tail.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - name: Package reviewable source
        run: |
          tar -czf dsi010-source-snapshot.tar.gz \
            alpha tests docs pyproject.toml poetry.lock Makefile .github/workflows/ci.yml .github/workflows/lint.yml
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-source-snapshot
          path: dsi010-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 3
