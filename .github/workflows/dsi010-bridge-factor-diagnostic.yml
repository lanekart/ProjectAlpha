name: DSI-010 Bridge Factor Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-bridge-factor-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry && poetry install --no-interaction
      - name: Download signed post-rights source boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30352312594
          name: dsi010-pre2016-rights-rebuild
          path: inputs
      - name: Download signed HTR-009A2 identity boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30335669653
          name: dsi010-a3-b-repaired-rerun
          path: identity
      - name: Restore governed boundaries
        run: |
          set -euo pipefail
          archive=$(find inputs -type f -name alpha_data_after_rights_rebuild.tar.gz | head -1)
          a2=$(find identity -type d -name htr009a2_event_sourced_universe | head -1)
          test -f "$archive"
          test -d "$a2"
          mkdir -p work artifacts
          tar -xzf "$archive" -C work
          cp -a inputs/artifacts/. artifacts/
          rm -rf artifacts/htr009a2_event_sourced_universe
          cp -a "$a2" artifacts/
          rm -rf artifacts/htr010b_complete_corporate_action_dataset artifacts/dsi010_bridge_factor_diagnostic
          mkdir -p artifacts/dsi010_bridge_factor_diagnostic
      - name: Build HTR-010B with dated bridge evidence
        run: |
          poetry run python -m alpha historical-truth complete-corporate-action-dataset \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --root work/alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr009a2-output artifacts/htr009a2_event_sourced_universe \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b_complete_corporate_action_dataset --verify-only
      - name: Export actual factor census
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter
          from pathlib import Path

          def load(path: Path):
              payload = json.loads(path.read_text(encoding="utf-8"))
              return payload.get("records", payload) if isinstance(payload, dict) else payload

          root = Path("artifacts/htr010b_complete_corporate_action_dataset")
          events = load(root / "htr010b_canonical_events.json")
          factors = load(root / "htr010b_adjustment_factors.json")
          event_by_id = {
              str(row["canonical_event_id"]): row
              for row in events
              if row.get("canonical_event_id")
          }
          rights = [
              row
              for row in factors
              if event_by_id.get(str(row.get("canonical_event_id")), {}).get("action_type")
              == "RIGHTS"
          ]
          states = Counter(str(row.get("factor_state")) for row in rights)
          provenance = Counter(
              str(row.get("reference_price_provenance_state")) for row in rights
          )
          bridge_state = "CERTIFIED_DATED_OFFICIAL_IDENTITY_BRIDGE_PRIOR_CLOSE"
          bridge = [
              row
              for row in rights
              if row.get("reference_price_provenance_state") == bridge_state
          ]
          cases = [
              {
                  "symbol": event_by_id[str(row["canonical_event_id"])].get("symbol"),
                  "canonical_event_id": row.get("canonical_event_id"),
                  "factor_state": row.get("factor_state"),
                  "provenance_state": row.get("reference_price_provenance_state"),
                  "reference_price_isin": row.get("reference_price_isin"),
                  "reference_price_source_sha256": row.get("reference_price_source_sha256"),
                  "bridge_state": row.get("reference_price_bridge_state"),
                  "bridge_event_ids": row.get("reference_price_bridge_event_ids"),
                  "bridge_source_ids": row.get("reference_price_bridge_source_ids"),
              }
              for row in bridge
          ]
          payload = {
              "rights_factor_count": len(rights),
              "rights_factor_states": dict(sorted(states.items())),
              "rights_reference_provenance_states": dict(sorted(provenance.items())),
              "bridge_count": len(bridge),
              "bridge_cases": sorted(cases, key=lambda row: str(row["symbol"])),
          }
          out = Path("artifacts/dsi010_bridge_factor_diagnostic/factor_census.json")
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-bridge-factor-diagnostic
          path: artifacts/dsi010_bridge_factor_diagnostic
          if-no-files-found: error
          retention-days: 7
