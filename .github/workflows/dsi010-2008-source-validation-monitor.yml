name: DSI-010 2008 Source Validation Monitor

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-2008-source-validation-monitor.yml

permissions:
  actions: read
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate robust validation workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = "feature/dsi-010-pre2016-external-era-validation"
          workflow = "dsi010-2008-emergency-source-fix-v3.yml"
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{workflow}/runs?branch={urllib.parse.quote(branch, safe='')}&per_page=5"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = payload.get("workflow_runs", [])
          if not runs:
              raise SystemExit("ROBUST_VALIDATION_RUN_NOT_FOUND")
          latest = runs[0]
          print("===== DSI-010 2008 ROBUST SOURCE VALIDATION RUN =====")
          for key in ("id", "status", "conclusion", "head_sha", "run_number", "event"):
              print(f"{key}: {latest.get(key)}")
          PY
