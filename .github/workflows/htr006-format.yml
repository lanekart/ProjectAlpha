name: HTR-006 Format

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-006-replay-readiness-gate

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Format and verify repository
        run: |
          ruff format .
          ruff check .
          ruff format --check .

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format HTR-006 readiness slice"
          git push origin HEAD:feature/htr-006-replay-readiness-gate
