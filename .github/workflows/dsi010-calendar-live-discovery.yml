name: DSI-010 Calendar Live Discovery

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-calendar-live-discovery.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-calendar-live-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Query and fetch official NSE calendar circulars
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import time
          from pathlib import Path
          from typing import Any

          import requests

          root = Path("artifacts/dsi010_pre2011_live_discovery")
          raw_api_root = root / "raw_api"
          document_root = root / "documents"
          raw_api_root.mkdir(parents=True, exist_ok=True)
          document_root.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nseindia.com/resources/exchange-communication-circulars",
          }
          session.get("https://www.nseindia.com/", headers=headers, timeout=30)

          attempts: list[dict[str, Any]] = []
          rows_all: list[dict[str, Any]] = []

          def rows_from(payload: Any) -> list[dict[str, Any]]:
              if isinstance(payload, list):
                  return [row for row in payload if isinstance(row, dict)]
              if isinstance(payload, dict):
                  for key in ("data", "Table", "table", "records", "rows"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return [row for row in value if isinstance(row, dict)]
                  for value in payload.values():
                      if isinstance(value, list) and value and all(isinstance(row, dict) for row in value):
                          return value
              return []

          periods = [(2004, 4, "01-10", "31-12")]
          for year in range(2005, 2011):
              periods.extend(
                  (year, quarter, start, end)
                  for quarter, (start, end) in enumerate(
                      (("01-01", "31-03"), ("01-04", "30-06"), ("01-07", "30-09"), ("01-10", "31-12")),
                      start=1,
                  )
              )

          for year, quarter, start, end in periods:
              url = (
                  "https://www.nseindia.com/api/circulars"
                  f"?fromDate={start}-{year}&toDate={end}-{year}"
              )
              response = session.get(url, headers=headers, timeout=45)
              path = raw_api_root / f"{year}_q{quarter}_{response.status_code}.json"
              path.write_bytes(response.content)
              payload: Any = None
              error = None
              try:
                  payload = response.json()
              except ValueError as exc:
                  error = f"JSON_DECODE_FAILED:{type(exc).__name__}"
              rows = rows_from(payload)
              attempts.append(
                  {
                      "year": year,
                      "quarter": quarter,
                      "url": url,
                      "status": response.status_code,
                      "content_type": response.headers.get("Content-Type", ""),
                      "response_bytes": len(response.content),
                      "row_count": len(rows),
                      "error": error or "",
                  }
              )
              rows_all.extend({"api_year": year, "api_quarter": quarter, **row} for row in rows)
              time.sleep(1.1)

          def normalized(value: object) -> str:
              return re.sub(r"\s+", " ", str(value or "")).strip().casefold()

          selected: list[dict[str, Any]] = []
          seen: set[tuple[str, str]] = set()
          for row in rows_all:
              department = normalized(row.get("circDepartment"))
              subject = normalized(row.get("sub"))
              link = str(row.get("circFilelink") or "").strip()
              if department != "capital market (equities) trade" or not link:
                  continue

              circular_date = str(row.get("cirDate") or "")
              issued_year = int(circular_date[:4]) if len(circular_date) >= 4 and circular_date[:4].isdigit() else None
              category = None
              target_year = None

              annual_match = re.search(r"calendar year\s*(20(?:0[5-9]|10))", subject)
              if "trading holidays" in subject and annual_match:
                  category = "ANNUAL_CALENDAR"
                  target_year = int(annual_match.group(1))
              elif any(token in subject for token in ("muhurat", "mahurat")):
                  category = "SPECIAL_SESSION"
                  target_year = issued_year
              elif "trading holiday" in subject and issued_year in range(2005, 2011):
                  category = "HOLIDAY_AMENDMENT"
                  target_year = issued_year

              if category is None or target_year not in range(2005, 2011):
                  continue
              identity = (str(row.get("circNumber") or ""), link)
              if identity in seen:
                  continue
              seen.add(identity)
              selected.append(
                  {
                      "target_year": target_year,
                      "category": category,
                      "source_id": f"NSE_CMTR_{row.get('circNumber')}_{target_year}_{category}",
                      "source_url": link,
                      "segment_scope": "CAPITAL_MARKET",
                      "expected_download_number": str(row.get("circNumber") or ""),
                      "expected_circular_date": str(row.get("cirDisplayDate") or ""),
                      "expected_subject": str(row.get("sub") or ""),
                      "circ_display_no": str(row.get("circDisplayNo") or ""),
                      "circ_department": str(row.get("circDepartment") or ""),
                      "file_ext": str(row.get("fileExt") or ""),
                      "api_issue_date": circular_date,
                  }
              )

          selected.sort(key=lambda row: (row["target_year"], row["category"], row["api_issue_date"], row["source_id"]))
          downloads: list[dict[str, Any]] = []
          for item in selected:
              response = session.get(item["source_url"], headers={**headers, "Accept": "text/html,application/pdf,*/*"}, timeout=45)
              raw = response.content
              digest = hashlib.sha256(raw).hexdigest() if raw else ""
              suffix = ".pdf" if raw.startswith(b"%PDF-") else ".htm" if b"<html" in raw[:1000].lower() or b"<body" in raw[:1000].lower() else ".bin"
              path = document_root / str(item["target_year"]) / f"{item['source_id']}_{digest[:12]}{suffix}"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              downloads.append(
                  {
                      **item,
                      "http_status": response.status_code,
                      "final_url": response.url,
                      "content_type": response.headers.get("Content-Type", ""),
                      "response_bytes": len(raw),
                      "sha256": digest,
                      "document_path": str(path),
                      "document_format": suffix.lstrip("."),
                  }
              )
              time.sleep(0.8)

          root.mkdir(parents=True, exist_ok=True)
          (root / "attempts.json").write_text(json.dumps(attempts, indent=2, sort_keys=True, default=str) + "\n")
          (root / "selected_candidates.json").write_text(json.dumps(selected, indent=2, sort_keys=True, default=str) + "\n")
          (root / "downloads.json").write_text(json.dumps(downloads, indent=2, sort_keys=True, default=str) + "\n")

          for filename, rows in (("attempts.csv", attempts), ("selected_candidates.csv", selected), ("downloads.csv", downloads)):
              fields = sorted({key for row in rows for key in row}) or ["empty"]
              with (root / filename).open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)

          print("===== DSI-010 LIVE CIRCULAR DISCOVERY =====")
          print(f"API attempts: {len(attempts)}")
          print(f"Successful HTTP responses: {sum(row['status'] == 200 for row in attempts)}")
          print(f"Total API rows: {len(rows_all)}")
          print(f"Selected official CM candidates: {len(selected)}")
          print(f"Downloaded documents: {sum(row['http_status'] == 200 for row in downloads)}")
          for year in range(2005, 2011):
              annual = sum(row["target_year"] == year and row["category"] == "ANNUAL_CALENDAR" for row in downloads)
              amendments = sum(row["target_year"] == year and row["category"] == "HOLIDAY_AMENDMENT" for row in downloads)
              special = sum(row["target_year"] == year and row["category"] == "SPECIAL_SESSION" for row in downloads)
              print(f"{year}: annual={annual} amendments={amendments} special_sessions={special}")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-calendar-live-discovery
          path: artifacts/dsi010_pre2011_live_discovery
          if-no-files-found: error
          retention-days: 14
