name: DSI-010 Rights Reference Result Reader

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-rights-reference-result-reader.yml

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Print exact signed summary tail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: '90264224474'
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o /tmp/job.log
          sed -n '87,145p' /tmp/job.log
