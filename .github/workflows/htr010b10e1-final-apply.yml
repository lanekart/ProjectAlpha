name: HTR-010B10E1 Final Apply

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Reconstruct and patch full B10E1 implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          shas = (
              'a1a694ebbb82caae1d63beac9ebb21ed3470c09a',
              'baf994a0a638060327eedfa90f8ef02b7366fd79',
              'b440ec86ad203858817959e6cf9b59d9ac23be2f',
              'dd5f552df11b0f82173fd7b04ef44f976e856a4f',
              '53896c5cb7683ec8c365fab92ee3c445ee11122d',
              '697c807e1575fd8e722019ea29ab0dfe3398ea96',
              'ea707ad3b23c799dbe7aba2e2f8b868171cd42cc',
              '5ded10566e9fc2d38856d72e3f7f843dd78cefbd',
              'af4b7af8851dddd0adc79f6fd2de044fe0e3c033',
              'fd74c1365ef80bd971389adc4da41e03d6d0fbfc',
          )
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          chunks: list[str] = []
          for sha in shas:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
              chunks.append(base64.b64decode(payload['content']).decode('ascii'))

          encoded = ''.join(chunks)
          if len(encoded) != 38504:
              raise SystemExit(f'base64 length mismatch: {len(encoded)}')
          archive = base64.b64decode(encoded, validate=True)
          expected = '267400eb2135b4f23c69cafa4bcf2ac0c9378d976866d7b8ef4f37c85110cf05'
          digest = hashlib.sha256(archive).hexdigest()
          if digest != expected:
              raise SystemExit(f'archive SHA-256 mismatch: {digest}')

          stage = Path('.b10e1_stage')
          shutil.rmtree(stage, ignore_errors=True)
          stage.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              bundle.extractall(stage)

          files = (
              'alpha/application/governed_adaptive_institutional_trade_shadow_cli.py',
              'alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py',
              'tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py',
              'docs/HTR-010B10_GOVERNED_ADAPTIVE_INSTITUTIONAL_TRADE_SHADOW.md',
          )
          for relative in files:
              source = stage / relative
              if not source.is_file():
                  raise SystemExit(f'missing staged file: {relative}')
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          engine = Path(
              'alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py'
          )
          text = engine.read_text(encoding='utf-8')
          replacements = (
              ('"adaptive_adjusted_confidence": "HIGH"',
               '"adaptive_adjusted_confidence": "MEDIUM"'),
              ('risk_reward_ratio=Decimal("2"),',
               'risk_reward_ratio=Decimal("4"),'),
              ('historical_bar_count=250,',
               'historical_bar_count=1260,'),
              ('sample_count="60",\n                evidence_strength="moderate",\n                posterior="0.6000",',
               'sample_count="60",\n                evidence_strength="moderate",\n                posterior="0.7000",'),
              ('sample_count="1",\n                evidence_strength="strong",\n                posterior="0.6000",',
               'sample_count="1",\n                evidence_strength="strong",\n                posterior="0.7000",'),
              ('sample_count="1"',
               'sample_count="10"'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one fixture token {old!r}, found {count}')
              text = text.replace(old, new, 1)
          engine.write_text(text, encoding='utf-8')
          shutil.rmtree(stage)
          PY

      - name: Install locked dependencies
        run: |
          pip install poetry
          poetry install --with dev --no-interaction

      - name: Apply locked Ruff output
        run: |
          poetry run ruff check --fix \
            alpha/application/governed_adaptive_institutional_trade_shadow_cli.py \
            alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py
          poetry run ruff format \
            alpha/application/governed_adaptive_institutional_trade_shadow_cli.py \
            alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py

      - name: Validate focused implementation
        run: |
          poetry run ruff check \
            alpha/application/governed_adaptive_institutional_trade_shadow_cli.py \
            alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py
          poetry run ruff format --check \
            alpha/application/governed_adaptive_institutional_trade_shadow_cli.py \
            alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py
          poetry run mypy \
            alpha/application/governed_adaptive_institutional_trade_shadow_cli.py \
            alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py
          poetry run pytest -q \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py

      - name: Commit and push final B10E1 source
        run: |
          rm -f \
            .github/workflows/htr010b10e1-apply.yml \
            .github/workflows/htr010b10e1-probe-diagnostics.yml \
            .github/workflows/htr010b10e1-final-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/application/governed_adaptive_institutional_trade_shadow_cli.py \
            alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py \
            tests/benchmark_replay/test_governed_adaptive_institutional_trade_shadow.py \
            docs/HTR-010B10_GOVERNED_ADAPTIVE_INSTITUTIONAL_TRADE_SHADOW.md \
            .github/workflows
          git commit -m 'feat(htr-010b10e1): integrate empirical adaptive shadow population'
          git fetch origin feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          git rebase origin/feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
