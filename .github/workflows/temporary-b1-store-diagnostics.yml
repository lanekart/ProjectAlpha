name: Temporary B1 Store Diagnostics

on:
  push:
    branches:
      - feature/htr-010b2-governed-adjusted-benchmark-integration

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Run focused tests
        run: |
          set +e
          poetry run pytest -vv -x \
            tests/historical_truth/test_replay.py \
            tests/historical_truth/test_b1_shadow_universe.py \
            tests/historical_truth/test_b1_shadow_replay.py \
            > focused-test-output.txt 2>&1
          status=$?
          cat focused-test-output.txt
          echo "$status" > focused-test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: focused-b1-store-diagnostics
          path: |
            focused-test-output.txt
            focused-test-status.txt
          if-no-files-found: error
