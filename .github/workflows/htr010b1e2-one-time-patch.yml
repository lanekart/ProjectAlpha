name: HTR-010B1E2 one-time patch

on:
  push:
    branches:
      - feature/htr-010b1e2-final-admission-state-propagation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b1e2-final-admission-state-propagation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply governed FACTOR_NOT_REQUIRED mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('alpha/historical_truth/bridge_aware_admission_state_propagation.py')
          text = source.read_text()

          old = '_MISSING_TEXT = {"", "none", "null", "nan", "n/a", "na"}\n'
          new = (
              '_MISSING_TEXT = {"", "none", "null", "nan", "n/a", "na"}\n'
              '_NO_ADJUSTMENT_FACTOR_STATES = {"FACTOR_NOT_REQUIRED"}\n'
          )
          if '_NO_ADJUSTMENT_FACTOR_STATES' not in text:
              if old not in text:
                  raise SystemExit('missing constant insertion anchor')
              text = text.replace(old, new, 1)

          old_logic = '''    if states & NON_MULTIPLICATIVE_STATES:\n        return AdmissionState.IDENTITY_TRANSITION_NONCOMPARABLE, "RAW"\n    if states <= CERTIFIED_FACTOR_STATES and (\n        not outcomes or outcomes <= _CONFIRMED_OUTCOMES\n    ):\n        return AdmissionState.ADJUSTED_REPLAY_CERTIFIED_TRADABILITY_PARTIAL, "ADJUSTED"\n    return AdmissionState.UNRESOLVED, "NONE"\n'''
          new_logic = '''    if states & NON_MULTIPLICATIVE_STATES:\n        return AdmissionState.IDENTITY_TRANSITION_NONCOMPARABLE, "RAW"\n\n    adjustment_states = states - _NO_ADJUSTMENT_FACTOR_STATES\n    if not adjustment_states:\n        return AdmissionState.RAW_REPLAY_CERTIFIED_NO_ACTION_EXPOSURE, "RAW"\n    if adjustment_states <= CERTIFIED_FACTOR_STATES and (\n        not outcomes or outcomes <= _CONFIRMED_OUTCOMES\n    ):\n        return AdmissionState.ADJUSTED_REPLAY_CERTIFIED_TRADABILITY_PARTIAL, "ADJUSTED"\n    return AdmissionState.UNRESOLVED, "NONE"\n'''
          if old_logic not in text:
              raise SystemExit('missing admission classifier replacement anchor')
          text = text.replace(old_logic, new_logic, 1)

          transform_old = '                "reference_price_requirement_fail_closed_explicit": True,\n'
          transform_new = (
              '                "reference_price_requirement_fail_closed_explicit": True,\n'
              '                "factor_not_required_raw_safe_explicit": True,\n'
          )
          if 'factor_not_required_raw_safe_explicit' not in text:
              if transform_old not in text:
                  raise SystemExit('missing transformation contract anchor')
              text = text.replace(transform_old, transform_new, 1)

          source.write_text(text)

          tests = Path('tests/historical_truth/test_bridge_aware_admission_state_propagation.py')
          test_text = tests.read_text()
          marker = 'def test_factor_not_required_is_raw_safe() -> None:'
          if marker not in test_text:
              test_text += '''\n\ndef test_factor_not_required_is_raw_safe() -> None:\n    sessions = tuple(date(2026, 1, day) for day in range(1, 6))\n    identity = "nse:isin:INE000000005"\n    factors = (\n        {\n            "factor_id": "factor-not-required",\n            "canonical_event_id": "event-1",\n            "identity_key": identity,\n            "effective_date": "2026-01-03",\n            "factor_state": "FACTOR_NOT_REQUIRED",\n        },\n    )\n\n    intervals, summary = propagated_admission_intervals(\n        coverage=_coverage(identity),\n        factors=factors,\n        validation_results=(),\n        sessions=sessions,\n        start_date=sessions[0],\n        end_date=sessions[-1],\n    )\n\n    pre_event = next(row for row in intervals if row["start_date"] == "2026-01-01")\n    assert pre_event["admission_state"] == (\n        AdmissionState.RAW_REPLAY_CERTIFIED_NO_ACTION_EXPOSURE.value\n    )\n    assert pre_event["admitted_price_view"] == "RAW"\n    assert summary["final_unresolved_interval_count"] == 0\n\n\ndef test_factor_not_required_does_not_block_confirmed_adjustment() -> None:\n    sessions = tuple(date(2026, 1, day) for day in range(1, 6))\n    identity = "nse:isin:INE000000006"\n    factors = (\n        {\n            "factor_id": "factor-derived",\n            "canonical_event_id": "event-derived",\n            "identity_key": identity,\n            "effective_date": "2026-01-03",\n            "factor_state": "FACTOR_DERIVED_OFFICIAL_TERMS",\n        },\n        {\n            "factor_id": "factor-not-required",\n            "canonical_event_id": "event-no-adjustment",\n            "identity_key": identity,\n            "effective_date": "2026-01-04",\n            "factor_state": "FACTOR_NOT_REQUIRED",\n        },\n    )\n    validation = (\n        {\n            "event_id": "event-derived",\n            "validation_outcome": "FACTOR_CONFIRMED_CORRECT_MARKET_GAP",\n        },\n    )\n\n    intervals, summary = propagated_admission_intervals(\n        coverage=_coverage(identity),\n        factors=factors,\n        validation_results=validation,\n        sessions=sessions,\n        start_date=sessions[0],\n        end_date=sessions[-1],\n    )\n\n    pre_event = next(row for row in intervals if row["start_date"] == "2026-01-01")\n    assert pre_event["admission_state"] == (\n        AdmissionState.ADJUSTED_REPLAY_CERTIFIED_TRADABILITY_PARTIAL.value\n    )\n    assert pre_event["admitted_price_view"] == "ADJUSTED"\n    assert summary["final_unresolved_interval_count"] == 0\n'''
              tests.write_text(test_text)
          PY

      - name: Format patched files
        run: |
          python -m pip install ruff
          ruff format \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_bridge_aware_admission_state_propagation.py
          ruff check \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_bridge_aware_admission_state_propagation.py

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/historical_truth/bridge_aware_admission_state_propagation.py \
            tests/historical_truth/test_bridge_aware_admission_state_propagation.py
          git commit -m 'Classify FACTOR_NOT_REQUIRED intervals deterministically'
          git push origin HEAD:feature/htr-010b1e2-final-admission-state-propagation
