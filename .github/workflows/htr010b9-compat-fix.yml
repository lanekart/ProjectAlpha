name: Repair HTR-010B9 B8 compatibility

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/htr-010b9-governed-adaptive-publication-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
          fetch-depth: 0

      - name: Synchronize and update the B8 source-contract expectation
        run: |
          git pull --ff-only origin feature/htr-010b9-governed-adaptive-publication-bridge
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/benchmark_replay/test_governed_adaptive_evidence_lineage.py')
          text = path.read_text(encoding='utf-8')
          old = (
              'def test_publication_source_contract_attributes_current_gap() -> None:\n'
              '    rows, summary = _publication_source_contract()\n\n'
              '    assert len(rows) == len(_ADAPTIVE_METADATA_CONTRACT) == 5\n'
              '    assert summary["consumer_contract_key_count"] == 5\n'
              '    assert summary["producer_publication_key_count"] == 0\n'
              '    assert summary["orchestrator_invokes_adaptive_assessment"] is False\n'
              '    assert summary["attributed_gap_count"] == 5\n'
              '    assert summary["unexplained_gap_count"] == 0\n'
              '    assert all(row["gap_explained"] is True for row in rows)\n'
          )
          new = (
              'def test_publication_source_contract_attributes_guarded_b9_gap() -> None:\n'
              '    rows, summary = _publication_source_contract()\n\n'
              '    assert len(rows) == len(_ADAPTIVE_METADATA_CONTRACT) == 5\n'
              '    assert summary["consumer_contract_key_count"] == 5\n'
              '    assert summary["producer_publication_key_count"] == 0\n'
              '    assert summary["orchestrator_invokes_adaptive_assessment"] is True\n'
              '    assert summary["attributed_gap_count"] == 5\n'
              '    assert summary["unexplained_gap_count"] == 0\n'
              '    assert all(row["gap_explained"] is True for row in rows)\n'
          )
          if text.count(old) != 1:
              raise SystemExit('B8 compatibility test anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install and verify compatibility
        run: |
          pip install poetry
          poetry install --no-interaction
          poetry run ruff check tests/benchmark_replay/test_governed_adaptive_evidence_lineage.py
          poetry run ruff format --check tests/benchmark_replay/test_governed_adaptive_evidence_lineage.py
          poetry run pytest -q \
            tests/benchmark_replay/test_governed_adaptive_evidence_lineage.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/learning_intelligence/test_adaptive_metadata_publication.py

      - name: Remove temporary diagnostic workflows and push
        run: |
          rm -f .github/workflows/htr010b9-remaining-diagnostic.yml
          rm -f .github/workflows/htr010b9-compat-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(htr-010b9): preserve B8 source-contract compatibility'
          git push origin HEAD:feature/htr-010b9-governed-adaptive-publication-bridge
