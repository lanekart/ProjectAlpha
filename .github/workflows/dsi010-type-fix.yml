name: DSI010 Type-Safe Scalar Fix

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked Ruff
        run: pip install ruff==0.15.20
      - name: Apply function-scoped type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def function_name(line: str) -> str | None:
              stripped = line.strip()
              if not stripped.startswith("def "):
                  return None
              return stripped.removeprefix("def ").split("(", 1)[0]

          engine = Path(
              "alpha/decision_superiority/pre2016_external_validation.py"
          )
          output: list[str] = []
          current_function: str | None = None
          counts = {
              "registry_int": 0,
              "benchmark_first": 0,
              "benchmark_item": 0,
              "benchmark_value": 0,
              "calendar_year": 0,
              "optional_none": 0,
              "optional_number": 0,
          }
          for line in engine.read_text(encoding="utf-8").splitlines():
              declared = function_name(line)
              if declared is not None:
                  current_function = declared
              stripped = line.strip()
              indent = line[: len(line) - len(line.lstrip())]
              if stripped == "observed = int(float(observed))":
                  output.extend(
                      [
                          f"{indent}number = _optional_float(observed)",
                          f"{indent}if number is None:",
                          f"{indent}    raise Pre2016ExternalValidationError(",
                          f'{indent}        f"FROZEN_CHALLENGER_CONTRACT_VALUE_INVALID:{{key}}"',
                          f"{indent}    )",
                          f"{indent}observed = int(number)",
                      ]
                  )
                  counts["registry_int"] += 1
                  continue
              if (
                  current_function == "_equity_rows"
                  and stripped
                  == 'first = float(benchmark.iloc[0]["benchmark_value"])'
              ):
                  output.extend(
                      [
                          f'{indent}first = _optional_float(benchmark.iloc[0]["benchmark_value"])',
                          f"{indent}if first is None or first <= 0:",
                          f"{indent}    raise Pre2016ExternalValidationError(",
                          f'{indent}        "BENCHMARK_START_VALUE_INVALID"',
                          f"{indent}    )",
                      ]
                  )
                  counts["benchmark_first"] += 1
                  continue
              output.append(line)
              if (
                  current_function == "_equity_rows"
                  and stripped == "for item in benchmark.itertuples(index=False):"
              ):
                  child = indent + "    "
                  output.extend(
                      [
                          f"{child}benchmark_value = _optional_float(item.benchmark_value)",
                          f"{child}if benchmark_value is None:",
                          f"{child}    raise Pre2016ExternalValidationError(",
                          f'{child}        "BENCHMARK_VALUE_INVALID"',
                          f"{child}    )",
                      ]
                  )
                  counts["benchmark_item"] += 1
              if (
                  current_function == "_equity_rows"
                  and stripped
                  == "1_000_000.0 * float(item.benchmark_value) / first,"
              ):
                  output[-1] = f"{indent}1_000_000.0 * benchmark_value / first,"
                  counts["benchmark_value"] += 1
              elif stripped == '"calendar_year": int(year),':
                  output[-1] = f'{indent}"calendar_year": int(str(year)),'
                  counts["calendar_year"] += 1
              elif (
                  current_function == "_optional_float"
                  and stripped == "if value is None or pd.isna(value):"
              ):
                  output[-1] = f"{indent}if value is None:"
                  counts["optional_none"] += 1
              elif (
                  current_function == "_optional_float"
                  and stripped == "number = float(value)"
              ):
                  output[-1] = f"{indent}number = float(str(value))"
                  counts["optional_number"] += 1
          missing = [name for name, count in counts.items() if count != 1]
          if missing:
              raise SystemExit(f"engine type-fix counts invalid: {counts}")
          engine.write_text("\n".join(output) + "\n", encoding="utf-8")

          artifacts = Path(
              "alpha/decision_superiority/"
              "pre2016_external_validation_artifacts.py"
          )
          output = []
          current_function = None
          changed = 0
          for line in artifacts.read_text(encoding="utf-8").splitlines():
              declared = function_name(line)
              if declared is not None:
                  current_function = declared
              stripped = line.strip()
              indent = line[: len(line) - len(line.lstrip())]
              if current_function == "_display" and stripped == "number = float(value)":
                  output.append(f"{indent}number = float(str(value))")
                  changed += 1
              else:
                  output.append(line)
          if changed != 1:
              raise SystemExit(f"artifact type-fix count invalid: {changed}")
          artifacts.write_text("\n".join(output) + "\n", encoding="utf-8")

          cli = Path(
              "alpha/application/"
              "decision_superiority_pre2016_external_validation_cli.py"
          )
          output = []
          current_function = None
          changed = 0
          for line in cli.read_text(encoding="utf-8").splitlines():
              declared = function_name(line)
              if declared is not None:
                  current_function = declared
              stripped = line.strip()
              indent = line[: len(line) - len(line.lstrip())]
              if (
                  current_function == "_percent"
                  and stripped == 'return f"{float(value) * 100:.2f}%"'
              ):
                  output.append(f'{indent}return f"{{float(str(value)) * 100:.2f}}%"')
                  changed += 1
              else:
                  output.append(line)
          if changed != 1:
              raise SystemExit(f"CLI type-fix count invalid: {changed}")
          cli.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
          ruff format \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          ruff check \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          ruff format --check \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          python -m py_compile \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
      - name: Commit fixes and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/dsi010-diagnostics.yml \
            .github/workflows/dsi010-log-extract.yml \
            .github/workflows/dsi010-type-fix.yml
          git add \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          git commit -m "fix(dsi-010): make scalar handling type-safe"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
