name: DSI010 Type-Safe Scalar Fix

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked Ruff
        run: pip install ruff==0.15.20
      - name: Apply type-safe source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path(
              "alpha/decision_superiority/pre2016_external_validation.py"
          )
          text = engine.read_text(encoding="utf-8")
          replacements = [
              (
                  '''        elif isinstance(value, int):
                      observed = int(float(observed))
                  ''',
                  '''        elif isinstance(value, int):
                      number = _optional_float(observed)
                      if number is None:
                          raise Pre2016ExternalValidationError(
                              f"FROZEN_CHALLENGER_CONTRACT_VALUE_INVALID:{key}"
                          )
                      observed = int(number)
                  ''',
              ),
              (
                  '''    if benchmark is not None and not benchmark.empty:
                      first = float(benchmark.iloc[0]["benchmark_value"])
                      for item in benchmark.itertuples(index=False):
                          rows.append(
                  ''',
                  '''    if benchmark is not None and not benchmark.empty:
                      first = _optional_float(benchmark.iloc[0]["benchmark_value"])
                      if first is None or first <= 0:
                          raise Pre2016ExternalValidationError(
                              "BENCHMARK_START_VALUE_INVALID"
                          )
                      for item in benchmark.itertuples(index=False):
                          benchmark_value = _optional_float(item.benchmark_value)
                          if benchmark_value is None:
                              raise Pre2016ExternalValidationError(
                                  "BENCHMARK_VALUE_INVALID"
                              )
                          rows.append(
                  ''',
              ),
              (
                  '''                        1_000_000.0 * float(item.benchmark_value) / first,
                  ''',
                  '''                        1_000_000.0 * benchmark_value / first,
                  ''',
              ),
              (
                  '''                "calendar_year": int(year),
                  ''',
                  '''                "calendar_year": int(str(year)),
                  ''',
              ),
              (
                  '''def _optional_float(value: object) -> float | None:
                      if value is None or pd.isna(value):
                          return None
                      try:
                          number = float(value)
                      except (TypeError, ValueError):
                          return None
                      return number if math.isfinite(number) else None
                  ''',
                  '''def _optional_float(value: object) -> float | None:
                      if value is None:
                          return None
                      try:
                          number = float(str(value))
                      except (TypeError, ValueError):
                          return None
                      return number if math.isfinite(number) else None
                  ''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(
                      f"engine replacement count was {text.count(old)} for {old!r}"
                  )
              text = text.replace(old, new, 1)
          engine.write_text(text, encoding="utf-8")

          artifacts = Path(
              "alpha/decision_superiority/"
              "pre2016_external_validation_artifacts.py"
          )
          text = artifacts.read_text(encoding="utf-8")
          old = "        number = float(value)\n"
          new = "        number = float(str(value))\n"
          if text.count(old) != 1:
              raise SystemExit(
                  f"artifact scalar replacement count was {text.count(old)}"
              )
          artifacts.write_text(text.replace(old, new, 1), encoding="utf-8")

          cli = Path(
              "alpha/application/"
              "decision_superiority_pre2016_external_validation_cli.py"
          )
          text = cli.read_text(encoding="utf-8")
          old = '        return f"{float(value) * 100:.2f}%"\n'
          new = '        return f"{float(str(value)) * 100:.2f}%"\n'
          if text.count(old) != 1:
              raise SystemExit(
                  f"CLI scalar replacement count was {text.count(old)}"
              )
          cli.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff format \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          ruff check \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          ruff format --check \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          python -m py_compile \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
      - name: Commit fixes and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/dsi010-diagnostics.yml \
            .github/workflows/dsi010-log-extract.yml \
            .github/workflows/dsi010-type-fix.yml
          git add \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          git commit -m "fix(dsi-010): make scalar handling type-safe"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
