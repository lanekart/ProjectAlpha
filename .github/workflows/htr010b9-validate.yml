name: Validate HTR-010B9

on:
  push:
    branches:
      - feature/htr-010b9-governed-adaptive-publication-bridge
    paths:
      - .github/workflows/htr010b9-validate.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current feature head
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
          fetch-depth: 0

      - name: Synchronize and apply seam if necessary
        run: |
          git pull --ff-only origin feature/htr-010b9-governed-adaptive-publication-bridge
          if grep -q 'adaptive_metadata_publication_enabled' alpha/application/intelligence.py; then
            echo 'B9 integration seam already present.'
          else
            test -f .tmp/htr010b9_patch.py
            python .tmp/htr010b9_patch.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked project environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction

      - name: Normalize intended B9 files
        run: |
          poetry run ruff check \
            alpha/application/benchmark_cli.py \
            alpha/application/intelligence.py \
            alpha/application/governed_adaptive_publication_bridge_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_adaptive_publication_bridge.py \
            alpha/canonical_universe_audit/canonical_runner.py \
            alpha/learning_intelligence/__init__.py \
            alpha/learning_intelligence/publication.py \
            alpha/performance_intelligence/recorder.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            --fix
          poetry run ruff format \
            alpha/application/benchmark_cli.py \
            alpha/application/intelligence.py \
            alpha/application/governed_adaptive_publication_bridge_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_adaptive_publication_bridge.py \
            alpha/canonical_universe_audit/canonical_runner.py \
            alpha/learning_intelligence/__init__.py \
            alpha/learning_intelligence/publication.py \
            alpha/performance_intelligence/recorder.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/learning_intelligence/test_adaptive_metadata_publication.py

      - name: Run gates and capture diagnostics
        id: gates
        shell: bash
        run: |
          set +e
          poetry run ruff check . > /tmp/b9-ruff.log 2>&1
          RUFF=$?
          poetry run ruff format --check . > /tmp/b9-format.log 2>&1
          FORMAT=$?
          poetry run mypy alpha > /tmp/b9-mypy.log 2>&1
          MYPY=$?
          poetry run pytest -q \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/performance_intelligence/test_performance_intelligence.py \
            tests/application/test_intelligence.py \
            tests/canonical_universe_audit \
            > /tmp/b9-pytest.log 2>&1
          PYTEST=$?
          poetry run python -m alpha benchmark --help \
            > /tmp/b9-cli.log 2>&1
          CLI_COMMAND=$?
          grep -q governed-adaptive-publication-bridge /tmp/b9-cli.log
          CLI_REGISTERED=$?
          echo "ruff=$RUFF" >> "$GITHUB_OUTPUT"
          echo "format=$FORMAT" >> "$GITHUB_OUTPUT"
          echo "mypy=$MYPY" >> "$GITHUB_OUTPUT"
          echo "pytest=$PYTEST" >> "$GITHUB_OUTPUT"
          echo "cli_command=$CLI_COMMAND" >> "$GITHUB_OUTPUT"
          echo "cli_registered=$CLI_REGISTERED" >> "$GITHUB_OUTPUT"
          if [ "$RUFF" -ne 0 ] || [ "$FORMAT" -ne 0 ] || \
             [ "$MYPY" -ne 0 ] || [ "$PYTEST" -ne 0 ] || \
             [ "$CLI_COMMAND" -ne 0 ] || [ "$CLI_REGISTERED" -ne 0 ]; then
            exit 1
          fi

      - name: Comment failure diagnostics
        if: failure() && steps.gates.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## HTR-010B9 validation failed'
            echo
            echo 'Gate exit codes:'
            echo '- Ruff: `${{ steps.gates.outputs.ruff }}`'
            echo '- Format: `${{ steps.gates.outputs.format }}`'
            echo '- MyPy: `${{ steps.gates.outputs.mypy }}`'
            echo '- Pytest: `${{ steps.gates.outputs.pytest }}`'
            echo '- CLI command: `${{ steps.gates.outputs.cli_command }}`'
            echo '- CLI registration: `${{ steps.gates.outputs.cli_registered }}`'
            for item in ruff format mypy pytest cli; do
              echo
              echo "### ${item} tail"
              echo '```text'
              tail -n 120 "/tmp/b9-${item}.log" || true
              echo '```'
            done
          } > /tmp/b9-comment.md
          gh pr comment 57 --body-file /tmp/b9-comment.md

      - name: Commit clean source-only tree
        if: success()
        run: |
          rm -f .tmp/htr010b9_patch.py
          rm -f .github/workflows/htr010b9-integrate.yml
          rm -f .github/workflows/htr010b9-finalize.yml
          rm -f .github/workflows/htr010b9-validate.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup commit required.'
          else
            git commit -m 'chore(htr-010b9): certify clean publication bridge tree'
            git push origin HEAD:feature/htr-010b9-governed-adaptive-publication-bridge
          fi

      - name: Comment successful validation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          cat > /tmp/b9-comment.md <<EOF
          ## HTR-010B9 focused validation passed

          - Ruff check: passed
          - Ruff format check: passed
          - Strict MyPy: passed
          - Focused publication, recorder, application, canonical-runner and B9 certificate tests: passed
          - Public CLI registration: passed
          - Clean validated head: \`${HEAD_SHA}\`

          Normal repository Lint and CI remain the authoritative final repository-wide gates.
          EOF
          gh pr comment 57 --body-file /tmp/b9-comment.md
