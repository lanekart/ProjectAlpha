name: DSI-001 Temporary Finalizer

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feature/dsi-001-governed-decision-superiority-gate-value-audit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-001-governed-decision-superiority-gate-value-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install project
        run: |
          pip install poetry
          poetry install --no-interaction
      - name: Register DSI-001 benchmark command
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/application/benchmark_cli.py')
          text = path.read_text(encoding='utf-8')
          import_block = (
              'from alpha.application.decision_superiority_gate_value_cli import (\n'
              '    register_decision_superiority_gate_value_command,\n'
              ')\n'
          )
          anchor = 'from alpha.application.governed_adaptive_evidence_lineage_cli import (\n'
          if import_block not in text:
              text = text.replace(anchor, import_block + anchor)
          register = 'register_decision_superiority_gate_value_command(benchmark_app)\n'
          anchor_register = 'register_governed_adjusted_benchmark_command(benchmark_app)\n'
          if register not in text:
              text = text.replace(anchor_register, register + anchor_register)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Repair governed ordinal typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/decision_superiority/gate_value_audit.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'int(entry["minimum_ordinal"])',
              '_int(entry["minimum_ordinal"])',
          )
          text = text.replace(
              'int(entry["maximum_ordinal"])',
              '_int(entry["maximum_ordinal"])',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and lint
        run: |
          poetry run ruff format \
            alpha/application/decision_superiority_gate_value_cli.py \
            alpha/application/benchmark_cli.py \
            alpha/decision_superiority \
            tests/decision_superiority
          poetry run ruff check \
            alpha/application/decision_superiority_gate_value_cli.py \
            alpha/application/benchmark_cli.py \
            alpha/decision_superiority \
            tests/decision_superiority \
            --fix
          poetry run ruff format --check \
            alpha/application/decision_superiority_gate_value_cli.py \
            alpha/application/benchmark_cli.py \
            alpha/decision_superiority \
            tests/decision_superiority
      - name: Commit validated normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_gate_value_cli.py \
            alpha/decision_superiority \
            tests/decision_superiority
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(dsi-001): normalize governed gate ordinal typing'
          git push origin HEAD:feature/dsi-001-governed-decision-superiority-gate-value-audit
      - name: Focused MyPy
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run mypy \
            alpha/application/decision_superiority_gate_value_cli.py \
            alpha/decision_superiority 2>&1 | tee dsi001-mypy.txt
      - name: Upload MyPy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi001-mypy-diagnostics
          path: dsi001-mypy.txt
      - name: Enforce MyPy
        if: steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Focused pytest
        run: poetry run pytest -q tests/decision_superiority
