name: DSI-010 Cancel Row-Wise Finalizer

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-cancel-rowwise-finalizer.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete row-wise merge run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "30309961601"
        run: |
          status=$(curl --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "run_id=${RUN_ID} status=${status}"
          if [ "$status" != "completed" ]; then
            curl --fail --request POST --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/cancel"
            echo "cancelled=${RUN_ID}"
          fi
