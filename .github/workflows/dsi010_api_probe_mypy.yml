name: DSI010 Holiday API Probe Adapter Repair

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/dsi-010-pre2016-external-era-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked Ruff
        run: python -m pip install 'ruff==0.15.20'
      - name: Apply typed Requests adapter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/decision_superiority/pre2016_calendar_api_probe.py')
          text = path.read_text(encoding='utf-8')
          protocol_anchor = '''class _HttpSession(Protocol):
              def get(
                  self,
                  url: str,
                  *,
                  params: Mapping[str, str] | None = None,
                  headers: Mapping[str, str] | None = None,
                  timeout: float | None = None,
              ) -> _HttpResponse: ...
          '''
          adapter_block = protocol_anchor + '''

          class _RequestsResponseAdapter:
              def __init__(self, response: requests.Response) -> None:
                  self.status_code = response.status_code
                  self.content = response.content
                  self.headers: Mapping[str, str] = dict(response.headers)
                  self._response = response

              def json(self) -> object:
                  return self._response.json()


          class _RequestsSessionAdapter:
              def __init__(self) -> None:
                  self._session = requests.Session()

              def get(
                  self,
                  url: str,
                  *,
                  params: Mapping[str, str] | None = None,
                  headers: Mapping[str, str] | None = None,
                  timeout: float | None = None,
              ) -> _HttpResponse:
                  response = self._session.get(
                      url,
                      params=params,
                      headers=headers,
                      timeout=timeout,
                  )
                  return _RequestsResponseAdapter(response)
          '''
          old_client = '    client: _HttpSession = session or requests.Session()'
          new_client = '    client: _HttpSession = session or _RequestsSessionAdapter()'
          if protocol_anchor not in text:
              raise SystemExit('HTTP protocol anchor missing')
          if old_client not in text:
              raise SystemExit('HTTP client anchor missing')
          text = text.replace(protocol_anchor, adapter_block, 1)
          text = text.replace(old_client, new_client, 1)
          path.write_text(text, encoding='utf-8')
          PY
          ruff format alpha/decision_superiority/pre2016_calendar_api_probe.py
          ruff check alpha/decision_superiority/pre2016_calendar_api_probe.py
          python -m compileall -q alpha/decision_superiority/pre2016_calendar_api_probe.py
      - name: Commit repair and remove workflow
        run: |
          rm .github/workflows/dsi010_api_probe_mypy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/decision_superiority/pre2016_calendar_api_probe.py \
            .github/workflows/dsi010_api_probe_mypy.yml
          git commit -m 'fix(dsi-010): adapt Requests to holiday API protocol'
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
