name: HTR-009A Pre-2016 Null-ISIN Repair Push

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/htr009a-pre2016-null-isin-fix-push.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Patch null-ISIN symbol-reuse handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("alpha/historical_truth/point_in_time_identity_engine.py")
          text = path.read_text(encoding="utf-8")
          old_query = '''                FROM scoped_candle c JOIN reused r
                  ON UPPER(c.symbol) = r.symbol AND UPPER(c.series) = r.series
                GROUP BY UPPER(c.symbol), UPPER(c.series), UPPER(c.isin)
'''
          new_query = '''                FROM scoped_candle c JOIN reused r
                  ON UPPER(c.symbol) = r.symbol AND UPPER(c.series) = r.series
                WHERE c.isin IS NOT NULL
                GROUP BY UPPER(c.symbol), UPPER(c.series), UPPER(c.isin)
'''
          if old_query not in text:
              raise SystemExit("HTR009A_NULL_ISIN_QUERY_BOUNDARY_MISSING")
          text = text.replace(old_query, new_query, 1)
          old_parse = '''        for symbol, series, isins, summaries, candles, _ in rows:
            parsed = [item.split(":") for item in summaries]
            intervals = [
                (date.fromisoformat(parts[1]), date.fromisoformat(parts[2]))
                for parts in parsed
            ]
'''
          new_parse = '''        for symbol, series, isins, summaries, candles, _ in rows:
            valid_isins = tuple(str(item) for item in isins if item is not None)
            valid_summaries = tuple(
                str(item) for item in summaries if item is not None
            )
            parsed = [item.split(":") for item in valid_summaries]
            intervals = [
                (date.fromisoformat(parts[1]), date.fromisoformat(parts[2]))
                for parts in parsed
            ]
'''
          if old_parse not in text:
              raise SystemExit("HTR009A_NULL_ISIN_PARSE_BOUNDARY_MISSING")
          text = text.replace(old_parse, new_parse, 1)
          old_records = '''                    tuple(str(item) for item in isins),
                    tuple(str(item) for item in summaries),
'''
          if old_records not in text:
              raise SystemExit("HTR009A_NULL_ISIN_RECORD_BOUNDARY_MISSING")
          text = text.replace(
              old_records,
              '''                    valid_isins,
                    valid_summaries,
''',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          cat > tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py <<'PY'
          from __future__ import annotations

          from datetime import date

          import duckdb

          from alpha.historical_truth.point_in_time_identity_engine import (
              PointInTimeIdentityCertificationEngine,
          )
          from alpha.historical_truth.point_in_time_identity_models import IdentityState


          def test_symbol_reuse_ignores_null_isin_rows_without_losing_conflict() -> None:
              connection = duckdb.connect(":memory:")
              try:
                  connection.execute(
                      """
                      create table scoped_candle (
                          symbol varchar,
                          series varchar,
                          isin varchar,
                          trading_date date
                      )
                      """
                  )
                  connection.executemany(
                      "insert into scoped_candle values (?, ?, ?, ?)",
                      [
                          ("REUSED", "EQ", "INE000A01001", date(2005, 1, 3)),
                          ("REUSED", "EQ", None, date(2005, 1, 4)),
                          ("REUSED", "EQ", "INE000B01002", date(2006, 1, 3)),
                      ],
                  )
                  records = PointInTimeIdentityCertificationEngine._symbol_reuse(
                      connection
                  )
              finally:
                  connection.close()
              assert len(records) == 1
              record = records[0]
              assert record.involved_isins == ("INE000A01001", "INE000B01002")
              assert all("None" not in item for item in record.observed_intervals)
              assert record.candle_rows == 2
              assert record.final_classification is IdentityState.SYMBOL_REUSE_CONFLICT
          PY
      - name: Validate focused repair
        run: |
          poetry run ruff format \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          poetry run ruff check \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          poetry run ruff format --check \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          poetry run mypy alpha/historical_truth/point_in_time_identity_engine.py
          poetry run pytest -q \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py \
            tests/historical_truth/test_point_in_time_identity_certification.py
      - name: Commit validated repair
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/historical_truth/point_in_time_identity_engine.py \
            tests/historical_truth/test_point_in_time_identity_pre2016_regressions.py
          git commit -m "fix(htr-009a): handle null ISINs in reuse audit"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
