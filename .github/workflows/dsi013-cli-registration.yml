name: DSI-013 CLI Registration

on:
  push:
    branches:
      - feature/dsi-013-governed-intraday-execution-audit

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-013-governed-intraday-execution-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Register source commands and clean imports
        run: |
          python - <<'PY'
          from pathlib import Path

          benchmark = Path("alpha/application/benchmark_cli.py")
          source = benchmark.read_text(encoding="utf-8")
          import_anchor = '''from alpha.application.decision_superiority_historical_rehydration_cli import (
              register_decision_superiority_historical_rehydration_command,
          )
          '''
          import_insert = import_anchor + '''from alpha.application.decision_superiority_intraday_source_cli import (
              register_decision_superiority_intraday_source_command,
          )
          '''
          if import_anchor not in source:
              raise SystemExit("benchmark import anchor not found")
          source = source.replace(import_anchor, import_insert, 1)
          register_anchor = '''register_decision_superiority_entry_stop_improvement_command(benchmark_app)
          '''
          register_insert = register_anchor + '''register_decision_superiority_intraday_source_command(benchmark_app)
          '''
          if register_anchor not in source:
              raise SystemExit("benchmark registration anchor not found")
          benchmark.write_text(
              source.replace(register_anchor, register_insert, 1),
              encoding="utf-8",
          )

          runner = Path(
              "alpha/decision_superiority/intraday_source_runner.py"
          )
          runner_source = runner.read_text(encoding="utf-8")
          runner_source = runner_source.replace(
              "from typing import Any, cast\n",
              "from typing import Any\n",
              1,
          )
          runner.write_text(runner_source, encoding="utf-8")
          PY
      - name: Format and validate changed source
        run: |
          python -m pip install ruff==0.15.20
          ruff format \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_source_runner.py
          ruff check \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_source_runner.py
          ruff format --check \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_source_runner.py
      - name: Commit registration and remove helper
        run: |
          rm .github/workflows/dsi013-cli-registration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/application/benchmark_cli.py \
            alpha/application/decision_superiority_intraday_source_cli.py \
            alpha/decision_superiority/intraday_source_runner.py \
            .github/workflows/dsi013-cli-registration.yml
          git diff --cached --quiet && exit 1
          git commit -m "feat(dsi-013): register source certification commands"
          git push origin HEAD:feature/dsi-013-governed-intraday-execution-audit
