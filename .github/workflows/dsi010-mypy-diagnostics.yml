name: DSI010 MyPy Diagnostics

on:
  push:
    branches:
      - feature/dsi-010-governed-pre2016-external-validation

permissions:
  contents: read

jobs:
  mypy-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install project
        run: poetry install --no-interaction
      - name: Capture strict MyPy diagnostics
        shell: bash
        run: |
          set +e
          poetry run mypy alpha > dsi010-mypy.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-mypy-diagnostics
          path: dsi010-mypy.txt
