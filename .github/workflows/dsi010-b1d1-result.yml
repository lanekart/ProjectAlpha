name: DSI-010 B1D1 Result

on:
  pull_request:
    paths: [.github/workflows/dsi010-b1d1-result.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90220657121"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep -nE 'Cross-Series|Cases audited|Classifications|Recommended repairs|Cross-series pairing|Governed cross-ISIN|Non-comparable identity|Missing candle-lineage|Report SHA|HTR010B1D1_OUTCOME|PRODUCTION_INFLUENCE' /tmp/log | tail -160 || true
          grep -n -A100 -B5 '"outcome"' /tmp/log | tail -150 || true
