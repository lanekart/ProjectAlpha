name: DSI-010 Three Defect Minimal

on:
  pull_request:
    paths: [.github/workflows/dsi010-three-defect-minimal.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30343241834
          name: dsi010-b1e-admission-reconciliation
          path: e
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30342652599
          name: dsi010-b1d2-validation-repair
          path: d
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(name,root):
            p=next(Path(root).rglob(name)); x=json.loads(p.read_text()); return x.get('records',[]) if isinstance(x,dict) else x
          v=load('htr010b1_factor_validation_results.json','e')
          f={str(x.get('canonical_event_id')):x for x in load('htr010b_adjustment_factors.json','e')}
          ev={str(x.get('canonical_event_id')):x for x in load('htr010b_canonical_events.json','e')}
          d={str(x.get('event_id')):x for x in load('htr010b1d2_reclassified_cases.json','d')}
          defects=[x for x in v if x.get('validation_outcome')=='IMPLEMENTATION_DEFECT']
          print('COUNT',len(defects))
          for x in defects:
            i=str(x.get('event_id')); a=ev.get(i,{}); q=f.get(i,{}); r=d.get(i,{})
            print('|'.join(str(z) for z in (
              a.get('symbol'),a.get('effective_date'),a.get('action_type'),a.get('raw_action_text'),
              q.get('price_factor'),x.get('raw_gap_atr'),x.get('adjusted_gap_atr'),
              r.get('prior_series'),r.get('current_series'),r.get('corrected_disposition'),
              r.get('recommended_contract_repair'))))
          PY
