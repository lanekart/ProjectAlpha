name: Integrate HTR-010B7

on:
  push:
    branches:
      - feature/htr-010b7-governed-setup-matched-evidence
    paths:
      - .github/workflows/htr010b7-integrate.yml
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - .github/workflows/htr010b7-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b7-governed-setup-matched-evidence
          fetch-depth: 0
      - name: Stop after diagnostic
        if: ${{ hashFiles('.tmp/htr010b7/final_fragment_diagnostic.txt') != '' }}
        run: |
          cat .tmp/htr010b7/final_fragment_diagnostic.txt
          exit 1
      - name: Publish final-fragment diagnostic
        shell: bash
        run: |
          set +e
          D=.tmp/htr010b7/final_fragment_diagnostic.txt
          echo HTR010B7_FINAL_FRAGMENT_DIAGNOSTIC > "$D"
          for part in \
            .tmp/htr010b7/fixed3.part-02-02-02-00 \
            .tmp/htr010b7/fixed3.part-02-02-02-01; do
            wc -c "$part" >> "$D" 2>&1
            sha256sum "$part" >> "$D" 2>&1
          done
          cat "$D"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$D"
          git commit -m "chore(htr-010b7): publish final fragment diagnostic"
          git push origin HEAD:feature/htr-010b7-governed-setup-matched-evidence
          exit 1
