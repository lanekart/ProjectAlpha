name: Integrate HTR-010B7

on:
  push:
    branches:
      - feature/htr-010b7-governed-setup-matched-evidence
    paths:
      - .github/workflows/htr010b7-integrate.yml
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - .github/workflows/htr010b7-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the HTR-010B7 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b7-governed-setup-matched-evidence
          fetch-depth: 0

      - name: Stop after publishing a diagnostic
        if: ${{ hashFiles('.tmp/htr010b7/transport_diagnostic.txt') != '' }}
        run: |
          cat .tmp/htr010b7/transport_diagnostic.txt
          exit 1

      - name: Publish payload transport diagnostic
        shell: bash
        run: |
          set +e
          DIAGNOSTIC=.tmp/htr010b7/transport_diagnostic.txt
          {
            echo "HTR010B7_PAYLOAD_TRANSPORT_DIAGNOSTIC"
            echo "git_head=$(git rev-parse HEAD)"
            echo
            for part in .tmp/htr010b7/payload.part-*; do
              wc -c "$part"
              sha256sum "$part"
            done
            echo
            cat .tmp/htr010b7/payload.part-* | tr -d '\r\n' > /tmp/htr010b7-payload.b64
            echo "normalized_base64_bytes=$(wc -c < /tmp/htr010b7-payload.b64)"
            sha256sum /tmp/htr010b7-payload.b64
            echo
            python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          source = Path('/tmp/htr010b7-payload.b64').read_bytes()
          print(f'python_source_bytes={len(source)}')
          print(f'python_source_mod4={len(source) % 4}')
          try:
              archive = base64.b64decode(source, validate=True)
          except Exception as error:
              print(f'python_decode_error={type(error).__name__}:{error}')
          else:
              Path('/tmp/htr010b7-payload.tar.gz').write_bytes(archive)
              print(f'archive_bytes={len(archive)}')
              print(f'archive_sha256={hashlib.sha256(archive).hexdigest()}')
          PY
            echo
            if test -f /tmp/htr010b7-payload.tar.gz; then
              tar -tzf /tmp/htr010b7-payload.tar.gz
              echo "tar_status=$?"
            fi
          } > "$DIAGNOSTIC" 2>&1
          cat "$DIAGNOSTIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIAGNOSTIC"
          git commit -m "chore(htr-010b7): publish payload transport diagnostic"
          git push origin HEAD:feature/htr-010b7-governed-setup-matched-evidence
          exit 1
