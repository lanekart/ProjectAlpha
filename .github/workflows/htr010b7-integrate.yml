name: Integrate HTR-010B7

on:
  push:
    branches:
      - feature/htr-010b7-governed-setup-matched-evidence
    paths:
      - .github/workflows/htr010b7-integrate.yml
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - .github/workflows/htr010b7-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the HTR-010B7 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b7-governed-setup-matched-evidence
          fetch-depth: 0

      - name: Stop after diagnostic publication
        if: ${{ hashFiles('.tmp/htr010b7/quality_diagnostic.txt') != '' }}
        run: |
          cat .tmp/htr010b7/quality_diagnostic.txt
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Materialize HTR-010B7 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/htr010b7/payload.part-00 \
            .tmp/htr010b7/fixed.part-01-00 \
            .tmp/htr010b7/fixed.part-01-01 \
            .tmp/htr010b7/fixed.part-01-02 \
            .tmp/htr010b7/fixed.part-01-03 \
            .tmp/htr010b7/fixed.part-02-00 \
            .tmp/htr010b7/fixed.part-02-01 \
            .tmp/htr010b7/fixed2.part-02-02-00 \
            .tmp/htr010b7/fixed2.part-02-02-01 \
            .tmp/htr010b7/fixed3.part-02-02-02-00 \
            .tmp/htr010b7/fixed4.part-02-02-02-01-00 \
            .tmp/htr010b7/fixed4.part-02-02-02-01-01 \
            .tmp/htr010b7/fixed.part-02-03 \
            .tmp/htr010b7/payload.part-03 \
            | tr -d '\r\n' > /tmp/htr010b7-payload.b64
          test "$(wc -c < /tmp/htr010b7-payload.b64)" -eq 37044
          base64 --decode /tmp/htr010b7-payload.b64 > /tmp/htr010b7-payload.tar.gz
          echo "f4e413354fd6bca6b67647a4c8995d359e114de0875748ab42c8ff4db718a6a5  /tmp/htr010b7-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/htr010b7-payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"B7 patch anchor mismatch: {path}: {old!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")


          cli = Path("alpha/application/benchmark_cli.py")
          import_anchor = '''from alpha.application.governed_approval_constraint_frontier_cli import (
              register_governed_approval_constraint_frontier_command,
          )
          '''
          replace_once(
              cli,
              import_anchor,
              import_anchor + '''from alpha.application.governed_setup_matched_evidence_cli import (
              register_governed_setup_matched_evidence_command,
          )
          ''',
          )
          registration_anchor = (
              "register_governed_approval_constraint_frontier_command(benchmark_app)\n"
          )
          replace_once(
              cli,
              registration_anchor,
              registration_anchor
              + "register_governed_setup_matched_evidence_command(benchmark_app)\n",
          )

          package = Path("alpha/benchmark_replay/__init__.py")
          module_anchor = (
              "from alpha.benchmark_replay.governed_approval_gate_forensics import (\n"
          )
          replace_once(
              package,
              module_anchor,
              '''from alpha.benchmark_replay.governed_setup_matched_evidence import (
              B7_BLOCKED_DIVERGENCE,
              B7_BLOCKED_EMPTY,
              B7_BLOCKED_PROVENANCE,
              B7_BLOCKED_SETUP,
              B7_READY,
              HTR010B7_CONTRACT_VERSION,
              GovernedSetupMatchedEvidenceEngine,
              GovernedSetupMatchedEvidenceResult,
              export_governed_setup_matched_evidence,
              validate_governed_setup_matched_evidence_certificate,
          )
          ''' + module_anchor,
          )
          replacements = {
              '    "B6_READY",\n': '''    "B6_READY",
              "B7_BLOCKED_DIVERGENCE",
              "B7_BLOCKED_EMPTY",
              "B7_BLOCKED_PROVENANCE",
              "B7_BLOCKED_SETUP",
              "B7_READY",
          ''',
              '    "HTR010B6_CONTRACT_VERSION",\n': '''    "HTR010B6_CONTRACT_VERSION",
              "HTR010B7_CONTRACT_VERSION",
          ''',
              '    "GovernedApprovalConstraintFrontierResult",\n': '''    "GovernedApprovalConstraintFrontierResult",
              "GovernedSetupMatchedEvidenceEngine",
              "GovernedSetupMatchedEvidenceResult",
          ''',
              '    "export_governed_approval_constraint_frontier",\n': '''    "export_governed_approval_constraint_frontier",
              "export_governed_setup_matched_evidence",
          ''',
              '    "validate_governed_approval_constraint_frontier_certificate",\n': '''    "validate_governed_approval_constraint_frontier_certificate",
              "validate_governed_setup_matched_evidence_certificate",
          ''',
          }
          for anchor, replacement in replacements.items():
              replace_once(package, anchor, replacement)
          PY

      - name: Install the locked project environment
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Normalize formatting
        run: |
          poetry run ruff check --fix \
            alpha/application/benchmark_cli.py \
            alpha/application/governed_setup_matched_evidence_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_setup_matched_evidence.py \
            tests/benchmark_replay/test_governed_setup_matched_evidence.py
          poetry run ruff format \
            alpha/application/benchmark_cli.py \
            alpha/application/governed_setup_matched_evidence_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_setup_matched_evidence.py \
            tests/benchmark_replay/test_governed_setup_matched_evidence.py

      - name: Publish source quality diagnostics
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          set +e
          D=.tmp/htr010b7/quality_diagnostic.txt
          poetry run ruff check \
            alpha/application/benchmark_cli.py \
            alpha/application/governed_setup_matched_evidence_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_setup_matched_evidence.py \
            tests/benchmark_replay/test_governed_setup_matched_evidence.py \
            > /tmp/b7-ruff-check.log 2>&1
          RUFF_CHECK_STATUS=$?
          poetry run ruff format --check \
            alpha/application/benchmark_cli.py \
            alpha/application/governed_setup_matched_evidence_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_setup_matched_evidence.py \
            tests/benchmark_replay/test_governed_setup_matched_evidence.py \
            > /tmp/b7-ruff-format.log 2>&1
          RUFF_FORMAT_STATUS=$?
          poetry run mypy alpha > /tmp/b7-mypy.log 2>&1
          MYPY_STATUS=$?
          poetry run pytest -q \
            tests/benchmark_replay/test_governed_setup_matched_evidence.py \
            > /tmp/b7-pytest.log 2>&1
          PYTEST_STATUS=$?
          {
            echo "ruff_check_status=$RUFF_CHECK_STATUS"
            echo "ruff_format_status=$RUFF_FORMAT_STATUS"
            echo "mypy_status=$MYPY_STATUS"
            echo "pytest_status=$PYTEST_STATUS"
            echo
            echo "--- ruff check ---"
            cat /tmp/b7-ruff-check.log
            echo
            echo "--- ruff format ---"
            cat /tmp/b7-ruff-format.log
            echo
            echo "--- strict mypy ---"
            cat /tmp/b7-mypy.log
            echo
            echo "--- focused pytest ---"
            cat /tmp/b7-pytest.log
          } > "$D"
          cat "$D"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$D"
          git commit -m "chore(htr-010b7): publish source quality diagnostic"
          git push origin HEAD:feature/htr-010b7-governed-setup-matched-evidence
          exit 1
