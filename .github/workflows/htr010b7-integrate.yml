name: Integrate HTR-010B7

on:
  push:
    branches:
      - feature/htr-010b7-governed-setup-matched-evidence
    paths:
      - .github/workflows/htr010b7-integrate.yml
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - .github/workflows/htr010b7-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b7-governed-setup-matched-evidence
          fetch-depth: 0

      - name: Stop after final diagnostic
        if: ${{ hashFiles('.tmp/htr010b7/final_transport_diagnostic.txt') != '' }}
        run: |
          cat .tmp/htr010b7/final_transport_diagnostic.txt
          exit 1

      - name: Publish final transport diagnostic
        shell: bash
        run: |
          set +e
          DIAGNOSTIC=.tmp/htr010b7/final_transport_diagnostic.txt
          echo "HTR010B7_FINAL_TRANSPORT_DIAGNOSTIC" > "$DIAGNOSTIC"
          echo "git_head=$(git rev-parse HEAD)" >> "$DIAGNOSTIC"
          for part in \
            .tmp/htr010b7/payload.part-00 \
            .tmp/htr010b7/fixed.part-01-00 \
            .tmp/htr010b7/fixed.part-01-01 \
            .tmp/htr010b7/fixed.part-01-02 \
            .tmp/htr010b7/fixed.part-01-03 \
            .tmp/htr010b7/fixed.part-02-00 \
            .tmp/htr010b7/fixed.part-02-01 \
            .tmp/htr010b7/fixed2.part-02-02-00 \
            .tmp/htr010b7/fixed2.part-02-02-01 \
            .tmp/htr010b7/fixed2.part-02-02-02 \
            .tmp/htr010b7/fixed.part-02-03 \
            .tmp/htr010b7/payload.part-03; do
            wc -c "$part" >> "$DIAGNOSTIC" 2>&1
            sha256sum "$part" >> "$DIAGNOSTIC" 2>&1
          done
          cat \
            .tmp/htr010b7/payload.part-00 \
            .tmp/htr010b7/fixed.part-01-00 \
            .tmp/htr010b7/fixed.part-01-01 \
            .tmp/htr010b7/fixed.part-01-02 \
            .tmp/htr010b7/fixed.part-01-03 \
            .tmp/htr010b7/fixed.part-02-00 \
            .tmp/htr010b7/fixed.part-02-01 \
            .tmp/htr010b7/fixed2.part-02-02-00 \
            .tmp/htr010b7/fixed2.part-02-02-01 \
            .tmp/htr010b7/fixed2.part-02-02-02 \
            .tmp/htr010b7/fixed.part-02-03 \
            .tmp/htr010b7/payload.part-03 \
            | tr -d '\r\n' > /tmp/htr010b7-payload.b64
          echo "normalized_base64_bytes=$(wc -c < /tmp/htr010b7-payload.b64)" >> "$DIAGNOSTIC"
          sha256sum /tmp/htr010b7-payload.b64 >> "$DIAGNOSTIC" 2>&1
          base64 --decode /tmp/htr010b7-payload.b64 > /tmp/htr010b7-payload.tar.gz 2>> "$DIAGNOSTIC"
          echo "decode_status=$?" >> "$DIAGNOSTIC"
          sha256sum /tmp/htr010b7-payload.tar.gz >> "$DIAGNOSTIC" 2>&1
          tar -tzf /tmp/htr010b7-payload.tar.gz >> "$DIAGNOSTIC" 2>&1
          echo "tar_status=$?" >> "$DIAGNOSTIC"
          cat "$DIAGNOSTIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DIAGNOSTIC"
          git commit -m "chore(htr-010b7): publish final transport diagnostic"
          git push origin HEAD:feature/htr-010b7-governed-setup-matched-evidence
          exit 1
