name: Integrate HTR-010B7

on:
  push:
    branches:
      - feature/htr-010b7-governed-setup-matched-evidence
    paths:
      - .github/workflows/htr010b7-integrate.yml
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    paths:
      - .github/workflows/htr010b7-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the HTR-010B7 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b7-governed-setup-matched-evidence
          fetch-depth: 0

      - name: Stop after publishing a diagnostic
        if: ${{ hashFiles('.tmp/htr010b7/transport_diagnostic.txt') != '' }}
        run: |
          cat .tmp/htr010b7/transport_diagnostic.txt
          exit 1

      - name: Publish payload transport diagnostic
        shell: bash
        run: |
          set +e
          DIAGNOSTIC=.tmp/htr010b7/transport_diagnostic.txt
          echo "HTR010B7_PAYLOAD_TRANSPORT_DIAGNOSTIC" > "$DIAGNOSTIC"
          echo "git_head=$(git rev-parse HEAD)" >> "$DIAGNOSTIC"
          echo >> "$DIAGNOSTIC"
          for part in .tmp/htr010b7/payload.part-*; do
            wc -c "$part" >> "$DIAGNOSTIC" 2>&1
            sha256sum "$part" >> "$DIAGNOSTIC" 2>&1
          done
          echo >> "$DIAGNOSTIC"
          cat .tmp/htr010b7/payload.part-* | tr -d '\r\n' > /tmp/htr010b7-payload.b64
          echo "normalized_base64_bytes=$(wc -c < /tmp/htr010b7-payload.b64)" >> "$DIAGNOSTIC"
          sha256sum /tmp/htr010b7-payload.b64 >> "$DIAGNOSTIC" 2>&1
          base64 --decode /tmp/htr010b7-payload.b64 > /tmp/htr010b7-payload.tar.gz 2>> "$DIAGNOSTIC"
          echo "base64_decode_status=$?" >> "$DIAGNOSTIC"
          if test -f /tmp/htr010b7-payload.tar.gz; then
            echo "archive_bytes=$(wc -c < /tmp/htr010b7-payload.tar.gz)" >> "$DIAGNOSTIC"
            sha256sum /tmp/htr010b7-payload.tar.gz >> "$DIAGNOSTIC" 2>&1
            tar -tzf /tmp/htr010b7-payload.tar.gz >> "$DIAGNOSTIC" 2>&1
            echo "tar_status=$?" >> "$DIAGNOSTIC"
          fi
          cat "$DIAGNOSTIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DIAGNOSTIC"
          git commit -m "chore(htr-010b7): publish payload transport diagnostic"
          git push origin HEAD:feature/htr-010b7-governed-setup-matched-evidence
          exit 1
