name: Diagnose HTR-010B9 remaining shard

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'feature/htr-010b9-governed-adaptive-publication-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Run remaining shard and publish exact failure
        env:
          GH_TOKEN: ${{ github.token }}
          _TYPER_FORCE_DISABLE_TERMINAL: '1'
        shell: bash
        run: |
          set +e
          poetry run python scripts/run_remaining_tests.py > /tmp/remaining.log 2>&1
          STATUS=$?
          {
            echo '## HTR-010B9 remaining-shard diagnostic'
            echo
            echo "Exit code: \`${STATUS}\`"
            echo
            echo '```text'
            tail -n 300 /tmp/remaining.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
          exit "$STATUS"
