name: Authoritative HTR-010B9 validation

on:
  push:
    branches:
      - feature/htr-010b9-governed-adaptive-publication-bridge
    paths:
      - .github/workflows/htr010b9-authoritative.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out and synchronize feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
          fetch-depth: 0

      - name: Pull latest connector-authored head
        run: git pull --ff-only origin feature/htr-010b9-governed-adaptive-publication-bridge

      - name: Apply guarded integration patch when necessary
        run: |
          if grep -q 'adaptive_metadata_publication_enabled' alpha/application/intelligence.py; then
            echo 'B9 integration seam already present.'
          else
            test -f .tmp/htr010b9_patch.py
            python .tmp/htr010b9_patch.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction

      - name: Normalize all repository source
        run: |
          poetry run ruff check . --fix
          poetry run ruff format .
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Strict MyPy
        run: poetry run mypy alpha

      - name: Focused B9 and compatibility tests
        run: |
          poetry run pytest -q \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/performance_intelligence/test_performance_intelligence.py \
            tests/application/test_intelligence.py \
            tests/application/test_intelligence_inputs.py \
            tests/canonical_universe_audit \
            tests/decision_intelligence \
            tests/recommendation_intelligence

      - name: Public CLI registration
        run: |
          poetry run python -m alpha benchmark --help | \
            grep governed-adaptive-publication-bridge

      - name: Remove all temporary integration material
        run: |
          rm -f .tmp/htr010b9_patch.py
          rm -f .github/workflows/htr010b9-integrate.yml
          rm -f .github/workflows/htr010b9-finalize.yml
          rm -f .github/workflows/htr010b9-validate.yml
          rm -f .github/workflows/htr010b9-repair.yml
          rm -f .github/workflows/htr010b9-authoritative.yml
          rmdir .tmp 2>/dev/null || true

      - name: Enforce intended milestone file set
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              'alpha/application/benchmark_cli.py',
              'alpha/application/governed_adaptive_publication_bridge_cli.py',
              'alpha/application/intelligence.py',
              'alpha/benchmark_replay/__init__.py',
              'alpha/benchmark_replay/governed_adaptive_publication_bridge.py',
              'alpha/canonical_universe_audit/canonical_runner.py',
              'alpha/learning_intelligence/__init__.py',
              'alpha/learning_intelligence/publication.py',
              'alpha/performance_intelligence/recorder.py',
              'docs/HTR-010B9_GOVERNED_ADAPTIVE_PUBLICATION_BRIDGE.md',
              'tests/benchmark_replay/test_governed_adaptive_publication_bridge.py',
              'tests/learning_intelligence/test_adaptive_metadata_publication.py',
          }
          observed = set(
              subprocess.check_output(
                  [
                      'git',
                      'diff',
                      '--name-only',
                      'origin/feature/recovery-foundation-v1...HEAD',
                  ],
                  text=True,
              ).splitlines()
          )
          observed.update(
              subprocess.check_output(
                  ['git', 'diff', '--name-only'],
                  text=True,
              ).splitlines()
          )
          untracked = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'],
              text=True,
          ).splitlines()
          observed.update(untracked)
          unexpected = sorted(path for path in observed if path not in expected)
          missing = sorted(path for path in expected if path not in observed)
          if unexpected or missing:
              raise SystemExit(
                  f'unexpected={unexpected}; missing={missing}; observed={sorted(observed)}'
              )
          print('HTR-010B9 intended file set verified')
          PY

      - name: Commit validated source-only head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup commit was required.'
          else
            git commit -m 'chore(htr-010b9): publish validated source-only milestone tree'
            git push origin HEAD:feature/htr-010b9-governed-adaptive-publication-bridge
          fi

      - name: Record authoritative focused validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          gh pr comment 57 --body "Authoritative HTR-010B9 focused validation passed. Ruff, Ruff format, strict MyPy, B9 publication/certificate tests, recorder/application/input/canonical/decision/recommendation compatibility tests, CLI registration, and exact source-only file-set verification passed at head \`${HEAD_SHA}\`. Normal Lint and CI remain the final repository-wide gates."
