name: DSI-010 Fast-Track Finalizer

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-fast-track-finalizer.yml

permissions:
  actions: write
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Wait for governed artifacts and cancel duplicate source work
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: "30303891098"
          ACCELERATOR_RUN_ID: "30307186644"
          PILOT_RUN_ID: "30299181789"
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/dsi010-fast-track-wait.log
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          source_run = int(os.environ["SOURCE_RUN_ID"])
          accelerator_run = int(os.environ["ACCELERATOR_RUN_ID"])
          pilot_run = int(os.environ["PILOT_RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          source_expected = {
              f"dsi010-corrected-population-shard-{year}" for year in range(2006, 2012)
          }
          accelerator_expected = {
              f"dsi010-accelerated-population-shard-{year}" for year in range(2012, 2016)
          }
          pilot_expected = {"dsi010-2005-population-pilot"}

          def request_json(url: str) -> dict[str, object]:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict):
                  raise RuntimeError("GITHUB_API_PAYLOAD_INVALID")
              return payload

          def artifacts(run_id: int) -> dict[str, dict[str, object]]:
              payload = request_json(
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100"
              )
              rows = payload.get("artifacts")
              if not isinstance(rows, list):
                  raise RuntimeError(f"ARTIFACT_LIST_INVALID:{run_id}")
              result: dict[str, dict[str, object]] = {}
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  name = str(row.get("name") or "")
                  if name:
                      result[name] = row
              return result

          cancelled_source = False
          deadline = time.monotonic() + 4 * 60 * 60
          while True:
              source = artifacts(source_run)
              accelerated = artifacts(accelerator_run)
              pilot = artifacts(pilot_run)
              source_missing = sorted(source_expected - set(source))
              accelerator_missing = sorted(accelerator_expected - set(accelerated))
              pilot_missing = sorted(pilot_expected - set(pilot))
              print(
                  "artifact_progress "
                  f"source={len(source_expected) - len(source_missing)}/{len(source_expected)} "
                  f"accelerator={len(accelerator_expected) - len(accelerator_missing)}/{len(accelerator_expected)} "
                  f"pilot={len(pilot_expected) - len(pilot_missing)}/{len(pilot_expected)}",
                  flush=True,
              )
              if not source_missing and not cancelled_source:
                  run_payload = request_json(
                      f"https://api.github.com/repos/{repository}/actions/runs/{source_run}"
                  )
                  if str(run_payload.get("status") or "") != "completed":
                      request = urllib.request.Request(
                          f"https://api.github.com/repos/{repository}/actions/runs/{source_run}/cancel",
                          headers=headers,
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=60):
                              pass
                          print(f"cancelled_duplicate_source_run={source_run}", flush=True)
                      except urllib.error.HTTPError as exc:
                          if exc.code not in {409, 422}:
                              raise
                  cancelled_source = True
              if not source_missing and not accelerator_missing and not pilot_missing:
                  registry = {
                      "source_run_id": source_run,
                      "accelerator_run_id": accelerator_run,
                      "pilot_run_id": pilot_run,
                      "artifacts": {
                          **{
                              name: {
                                  "id": int(source[name]["id"]),
                                  "run_id": source_run,
                              }
                              for name in sorted(source_expected)
                          },
                          **{
                              name: {
                                  "id": int(accelerated[name]["id"]),
                                  "run_id": accelerator_run,
                              }
                              for name in sorted(accelerator_expected)
                          },
                          "dsi010-2005-population-pilot": {
                              "id": int(pilot["dsi010-2005-population-pilot"]["id"]),
                              "run_id": pilot_run,
                          },
                      },
                  }
                  Path("/tmp/dsi010-artifact-registry.json").write_text(
                      json.dumps(registry, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  print("ALL_REQUIRED_ARTIFACTS_AVAILABLE=true")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      "ARTIFACT_WAIT_TIMEOUT:"
                      f"source_missing={source_missing}:"
                      f"accelerator_missing={accelerator_missing}:"
                      f"pilot_missing={pilot_missing}"
                  )
              time.sleep(30)
          PY
      - name: Download and extract all governed year shards
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/dsi010-fast-track-download.log
          from __future__ import annotations

          import json
          import os
          import shutil
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          registry = json.loads(
              Path("/tmp/dsi010-artifact-registry.json").read_text(encoding="utf-8")
          )
          artifacts = registry["artifacts"]
          download_root = Path("work/downloads")
          shard_root = Path("work/shards")
          download_root.mkdir(parents=True, exist_ok=True)
          shard_root.mkdir(parents=True, exist_ok=True)

          def safe_parts(name: str) -> bool:
              path = PurePosixPath(name)
              return not path.is_absolute() and ".." not in path.parts

          for name, metadata in sorted(artifacts.items()):
              artifact_id = int(metadata["id"])
              zip_path = download_root / f"{name}.zip"
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}/zip",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  zip_path.write_bytes(response.read())
              extract_root = download_root / name
              extract_root.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(zip_path) as archive:
                  if any(not safe_parts(member.filename) for member in archive.infolist()):
                      raise RuntimeError(f"UNSAFE_ARTIFACT_ZIP:{name}")
                  archive.extractall(extract_root)

              if name == "dsi010-2005-population-pilot":
                  source = extract_root / "alpha_data"
                  destination = shard_root / "2005" / "alpha_data"
                  if not source.is_dir():
                      raise RuntimeError("PILOT_ALPHA_DATA_MISSING")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copytree(source, destination)
                  continue

              year = int(name.rsplit("-", maxsplit=1)[1])
              archive_path = extract_root / f"alpha_data-{year}.tar.gz"
              summary_path = extract_root / f"shard_summary-{year}.json"
              if not archive_path.is_file() or not summary_path.is_file():
                  raise RuntimeError(f"SHARD_ARTIFACT_CONTENT_MISSING:{year}")
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              if int(summary.get("covered_year", 0)) != year:
                  raise RuntimeError(f"SHARD_YEAR_MISMATCH:{year}")
              destination = shard_root / str(year)
              destination.mkdir(parents=True, exist_ok=True)
              with tarfile.open(archive_path, "r:gz") as archive:
                  for member in archive.getmembers():
                      if not safe_parts(member.name):
                          raise RuntimeError(f"UNSAFE_SHARD_TAR:{year}")
                  archive.extractall(destination, filter="data")
              if not (destination / "alpha_data/warehouse/historical_truth.duckdb").is_file():
                  raise RuntimeError(f"SHARD_DATABASE_MISSING:{year}")
              if not (destination / "alpha_data/manifests/archive_manifest.jsonl").is_file():
                  raise RuntimeError(f"SHARD_MANIFEST_MISSING:{year}")
              print(f"extracted_year={year}")
          print("EXTRACTED_GOVERNED_SHARD_COUNT=11")
          PY
      - name: Validate merge and full-audit implementation
        run: |
          poetry run ruff check \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py
          poetry run pytest -q tests/decision_superiority/test_pre2016_population_merge.py
      - name: Merge governed Historical Truth shards
        run: |
          set -o pipefail
          poetry run python - <<'PY' 2>&1 | tee /tmp/dsi010-fast-track-merge.log
          from pathlib import Path

          from alpha.decision_superiority.pre2016_population_merge import (
              merge_pre2016_population_shards,
          )

          years = tuple(range(2005, 2016))
          result = merge_pre2016_population_shards(
              shard_roots=tuple(
                  Path(f"work/shards/{year}/alpha_data") for year in years
              ),
              output_root=Path("artifacts/dsi010_merged_historical_truth"),
              expected_years=years,
          )
          print("===== DSI-010 FAST-TRACK GOVERNED POPULATION MERGE =====")
          print(f"Covered Years: {','.join(str(year) for year in result.covered_years)}")
          print(f"Shard Count: {result.shard_count}")
          print(f"Manifest Records: {result.manifest_records}")
          print(f"Daily Candle Rows: {result.daily_candle_rows}")
          print(f"Observed Sessions: {result.observed_sessions}")
          print(f"Raw Files: {result.raw_files}")
          print(f"Snapshot Files: {result.snapshot_files}")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - name: Recover and build all official calendar sources
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          set -euo pipefail
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_pre2011_official_calendar_candidates.json \
            --output artifacts/dsi010_pre2011_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_pre2011_reviewed_sources.py \
            --recovery-root artifacts/dsi010_pre2011_official_sources \
            --output-root artifacts/dsi010_pre2011_reviewed_sources
          poetry run python - <<'PY'
          from pathlib import Path

          import requests

          response = requests.get(
              "https://nsearchives.nseindia.com/content/press/27072005.pdf",
              headers={"User-Agent": "ProjectAlpha-HistoricalTruth/1.0"},
              timeout=45,
          )
          response.raise_for_status()
          output = Path("artifacts/dsi010_2005_emergency_holiday_source")
          output.mkdir(parents=True, exist_ok=True)
          (output / "nse_press_27072005.pdf").write_bytes(response.content)
          PY
          poetry run python scripts/build_dsi010_2005_emergency_holiday_source.py \
            --source-document \
            artifacts/dsi010_2005_emergency_holiday_source/nse_press_27072005.pdf \
            --output-root artifacts/dsi010_2005_emergency_holiday_source
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_2011_2015_official_calendar_candidates.json \
            --output artifacts/dsi010_2011_2015_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_2011_2015_reviewed_sources.py \
            --recovery-root artifacts/dsi010_2011_2015_official_sources \
            --output-root artifacts/dsi010_2011_2015_reviewed_sources
      - name: Run complete governed calendar audit
        run: |
          set -o pipefail
          poetry run python scripts/run_dsi010_full_calendar_audit.py \
            --merged-root artifacts/dsi010_merged_historical_truth \
            --early-root artifacts/dsi010_pre2011_reviewed_sources \
            --later-root artifacts/dsi010_2011_2015_reviewed_sources \
            --emergency-source \
            artifacts/dsi010_2005_emergency_holiday_source/nse_2005_emergency_holiday.json \
            --special-config config/dsi010_2005_2015_special_sessions.json \
            --audit-root artifacts/dsi010_2005_2015_full_calendar_audit \
            --source-population-run-id ${{ github.run_id }} \
            2>&1 | tee /tmp/dsi010-fast-track-full-calendar-audit.log
      - name: Upload merged store and full audit
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-fast-track-full-2005-2015-governed-calendar-audit
          path: |
            /tmp/dsi010-fast-track-wait.log
            /tmp/dsi010-artifact-registry.json
            /tmp/dsi010-fast-track-download.log
            /tmp/dsi010-fast-track-merge.log
            /tmp/dsi010-fast-track-full-calendar-audit.log
            artifacts/dsi010_merged_historical_truth
            artifacts/dsi010_2005_2015_full_calendar_audit
            artifacts/dsi010_pre2011_official_sources
            artifacts/dsi010_pre2011_reviewed_sources
            artifacts/dsi010_2005_emergency_holiday_source
            artifacts/dsi010_2011_2015_official_sources
            artifacts/dsi010_2011_2015_reviewed_sources
            config/dsi010_2005_2015_special_sessions.json
          if-no-files-found: error
          retention-days: 14
