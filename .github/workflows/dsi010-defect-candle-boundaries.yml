name: DSI-010 Defect Candle Boundaries

on:
  pull_request:
    paths: [.github/workflows/dsi010-defect-candle-boundaries.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry && poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30341297898
          name: dsi010-htr010b1-admission-audit
          path: inputs
      - run: |
          archive=$(find inputs -name alpha_data_after_htr010b1.tar.gz | head -1)
          test -f "$archive"
          mkdir -p work
          tar -xzf "$archive" -C work
          poetry run python - <<'PY'
          import json
          from pathlib import Path
          import duckdb
          events_path=next(Path('inputs').rglob('htr010b_canonical_events.json'))
          payload=json.loads(events_path.read_text()); events=payload.get('records',[]) if isinstance(payload,dict) else payload
          wanted={'OMAXE','MINDACORP','JBMA'}
          for e in events:
            if e.get('symbol') in wanted and e.get('effective_date') in {'2013-11-11','2015-01-05','2014-10-08'}:
              print('EVENT|'+json.dumps({k:e.get(k) for k in ('symbol','series_applicability','announcement_date','record_date','ex_date','effective_date','action_type','raw_action_text','old_face_value','new_face_value','ratio_numerator','ratio_denominator')},sort_keys=True))
          db=Path('work/alpha_data/warehouse/historical_truth.duckdb')
          with duckdb.connect(str(db),read_only=True) as c:
            for symbol,start,end in [('OMAXE','2013-11-01','2013-11-20'),('MINDACORP','2014-12-24','2015-01-14'),('JBMA','2014-09-26','2014-10-20')]:
              rows=c.execute('''select trading_date,series,open_price,high_price,low_price,close_price,volume from daily_candle where symbol=? and trading_date between ? and ? order by trading_date,series''',[symbol,start,end]).fetchall()
              for row in rows:
                print('CANDLE|'+symbol+'|'+'|'.join(str(x) for x in row))
          PY
