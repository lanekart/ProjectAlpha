name: DSI-010 Repaired HTR-010A Result Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010a-result-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print HTR-010A result markers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90194582842"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== HTR-010A RESULT MARKERS ====="
          grep -nE \
            'HTR-010A|Complete Security|Certification|Primary|Secondary|Population|Census|Tier|Identity|Membership|Adjusted|Candle|Coverage|Source|Rows|Report SHA|PRODUCTION_INFLUENCE|HTR010A_OUTCOME' \
            /tmp/job.log | tail -320 || true
          echo "===== HTR-010A EXECUTION RANGE ====="
          sed -n '440,610p' /tmp/job.log
