name: DSI010 One-Time Formatter

on:
  push:
    branches:
      - feature/dsi-010-governed-pre2016-external-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-governed-pre2016-external-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked Ruff
        run: python -m pip install 'ruff==0.15.20'
      - name: Format DSI-010 source
        run: |
          ruff format \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py \
            alpha/decision_superiority/pre2016_external_validation_models.py \
            tests/decision_superiority/test_pre2016_external_validation.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py \
            alpha/decision_superiority/pre2016_external_validation_models.py \
            tests/decision_superiority/test_pre2016_external_validation.py
          git commit -m "style(dsi-010): apply locked Ruff formatting"
          git push origin HEAD:feature/dsi-010-governed-pre2016-external-validation
