name: DSI010 Format Diagnostics

on:
  push:
    branches:
      - feature/dsi-010-governed-pre2016-external-validation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked Ruff
        run: python -m pip install 'ruff==0.15.20'
      - name: Capture format diff
        shell: bash
        run: |
          set +e
          ruff format --diff \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            alpha/application/decision_superiority_pre2016_external_validation_cli.py \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py \
            alpha/decision_superiority/pre2016_external_validation_models.py \
            tests/decision_superiority/test_pre2016_external_validation.py \
            > dsi010-format.diff
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-format-diff
          path: dsi010-format.diff
