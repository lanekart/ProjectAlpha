name: Temporary HTR-010B1E2 patcher

on:
  push:
    branches: [feature/bootstrap]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporarily patch HTR-010B1E2 branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b1e2-final-admission-state-propagation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply governed mapping and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('alpha/historical_truth/bridge_aware_admission_state_propagation.py')
          text = source.read_text()
          if '_NO_ADJUSTMENT_FACTOR_STATES' not in text:
              text = text.replace(
                  '_MISSING_TEXT = {"", "none", "null", "nan", "n/a", "na"}\n',
                  '_MISSING_TEXT = {"", "none", "null", "nan", "n/a", "na"}\n'
                  '_NO_ADJUSTMENT_FACTOR_STATES = {"FACTOR_NOT_REQUIRED"}\n',
                  1,
              )
          old = '''    if states & NON_MULTIPLICATIVE_STATES:\n        return AdmissionState.IDENTITY_TRANSITION_NONCOMPARABLE, "RAW"\n    if states <= CERTIFIED_FACTOR_STATES and (\n        not outcomes or outcomes <= _CONFIRMED_OUTCOMES\n    ):\n        return AdmissionState.ADJUSTED_REPLAY_CERTIFIED_TRADABILITY_PARTIAL, "ADJUSTED"\n    return AdmissionState.UNRESOLVED, "NONE"\n'''
          new = '''    if states & NON_MULTIPLICATIVE_STATES:\n        return AdmissionState.IDENTITY_TRANSITION_NONCOMPARABLE, "RAW"\n\n    adjustment_states = states - _NO_ADJUSTMENT_FACTOR_STATES\n    if not adjustment_states:\n        return AdmissionState.RAW_REPLAY_CERTIFIED_NO_ACTION_EXPOSURE, "RAW"\n    if adjustment_states <= CERTIFIED_FACTOR_STATES and (\n        not outcomes or outcomes <= _CONFIRMED_OUTCOMES\n    ):\n        return AdmissionState.ADJUSTED_REPLAY_CERTIFIED_TRADABILITY_PARTIAL, "ADJUSTED"\n    return AdmissionState.UNRESOLVED, "NONE"\n'''
          if old not in text:
              raise SystemExit('classifier anchor missing')
          text = text.replace(old, new, 1)
          if 'factor_not_required_raw_safe_explicit' not in text:
              text = text.replace(
                  '                "reference_price_requirement_fail_closed_explicit": True,\n',
                  '                "reference_price_requirement_fail_closed_explicit": True,\n'
                  '                "factor_not_required_raw_safe_explicit": True,\n',
                  1,
              )
          source.write_text(text)

          tests = Path('tests/historical_truth/test_bridge_aware_admission_state_propagation.py')
          test_text = tests.read_text()
          if 'def test_factor_not_required_is_raw_safe()' not in test_text:
              test_text += '''\n\ndef test_factor_not_required_is_raw_safe() -> None:\n    sessions = tuple(date(2026, 1, day) for day in range(1, 6))\n    identity = "nse:isin:INE000000005"\n    factors = ({"factor_id": "not-required", "canonical_event_id": "event-1", "identity_key": identity, "effective_date": "2026-01-03", "factor_state": "FACTOR_NOT_REQUIRED"},)\n    intervals, summary = propagated_admission_intervals(coverage=_coverage(identity), factors=factors, validation_results=(), sessions=sessions, start_date=sessions[0], end_date=sessions[-1])\n    pre_event = next(row for row in intervals if row["start_date"] == "2026-01-01")\n    assert pre_event["admission_state"] == AdmissionState.RAW_REPLAY_CERTIFIED_NO_ACTION_EXPOSURE.value\n    assert pre_event["admitted_price_view"] == "RAW"\n    assert summary["final_unresolved_interval_count"] == 0\n\n\ndef test_factor_not_required_does_not_block_confirmed_adjustment() -> None:\n    sessions = tuple(date(2026, 1, day) for day in range(1, 6))\n    identity = "nse:isin:INE000000006"\n    factors = (\n        {"factor_id": "derived", "canonical_event_id": "event-derived", "identity_key": identity, "effective_date": "2026-01-03", "factor_state": "FACTOR_DERIVED_OFFICIAL_TERMS"},\n        {"factor_id": "not-required", "canonical_event_id": "event-none", "identity_key": identity, "effective_date": "2026-01-04", "factor_state": "FACTOR_NOT_REQUIRED"},\n    )\n    validation = ({"event_id": "event-derived", "validation_outcome": "FACTOR_CONFIRMED_CORRECT_MARKET_GAP"},)\n    intervals, summary = propagated_admission_intervals(coverage=_coverage(identity), factors=factors, validation_results=validation, sessions=sessions, start_date=sessions[0], end_date=sessions[-1])\n    pre_event = next(row for row in intervals if row["start_date"] == "2026-01-01")\n    assert pre_event["admission_state"] == AdmissionState.ADJUSTED_REPLAY_CERTIFIED_TRADABILITY_PARTIAL.value\n    assert pre_event["admitted_price_view"] == "ADJUSTED"\n    assert summary["final_unresolved_interval_count"] == 0\n'''
              tests.write_text(test_text)
          PY

      - name: Format and validate focused files
        run: |
          python -m pip install ruff
          ruff format alpha/historical_truth/bridge_aware_admission_state_propagation.py tests/historical_truth/test_bridge_aware_admission_state_propagation.py
          ruff check alpha/historical_truth/bridge_aware_admission_state_propagation.py tests/historical_truth/test_bridge_aware_admission_state_propagation.py

      - name: Commit to B1E2 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/historical_truth/bridge_aware_admission_state_propagation.py tests/historical_truth/test_bridge_aware_admission_state_propagation.py
          git commit -m 'Classify FACTOR_NOT_REQUIRED intervals deterministically'
          git push origin HEAD:feature/htr-010b1e2-final-admission-state-propagation
