name: Temporary DSI-011D MyPy Fix

on:
  push:
    branches:
      - feature/dsi-011d-calibrated-position-sizing-main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-011d-calibrated-position-sizing-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Type optional numeric conversion
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/research/calibrated_position_sizing.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _optional_number(value: object) -> float:
              if value is None:
                  return float("-inf")
              return float(value)
          '''
          new = '''def _optional_number(value: object) -> float:
              if value is None:
                  return float("-inf")
              if isinstance(value, (str, int, float, Decimal)):
                  return float(value)
              raise TypeError(
                  f"unsupported numeric value: {type(value).__name__}"
              )
          '''
          if old not in text:
              raise SystemExit('optional-number function did not match expected source')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m pip install 'ruff==0.15.20'
          ruff check \
            alpha/research/calibrated_position_sizing.py
          ruff format \
            alpha/research/calibrated_position_sizing.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/research/calibrated_position_sizing.py
          git commit -m 'fix(dsi-011d): type optional numeric conversion'
          git push origin HEAD:feature/dsi-011d-calibrated-position-sizing-main
