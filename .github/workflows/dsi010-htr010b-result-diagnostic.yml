name: DSI-010 Repaired HTR-010B Result Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010b-result-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print repaired HTR-010B result details
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90215375697"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== SUMMARY PAYLOAD ====="
          sed -n '500,530p' /tmp/job.log
          echo "===== CERTIFICATION DETAILS ====="
          grep -nE \
            'certification_counts|source_file_completeness|parser_completeness|identity_join_completeness|replay_readiness|tier_a_identities|upstream_htr010a3|blockers|quarantined' \
            /tmp/job.log | tail -260 || true
          echo "===== HTR-010B CONSOLE ====="
          sed -n '425,442p' /tmp/job.log
