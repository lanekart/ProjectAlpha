name: DSI-010 Repaired HTR-010B Result Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010b-result-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print repaired HTR-010B result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90215375697"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== HTR-010B RESULT MARKERS ====="
          grep -nE \
            'HTR-010B Complete|Tier A identities|Raw official records|Canonical events|Adjustment factors|Replay readiness|Report SHA|HTR010B_OUTCOME|PRODUCTION_INFLUENCE|upstream_htr010a3|replay_blockers|quarantined_identity_count|quarantined_interval_count|report_sha256' \
            /tmp/job.log | tail -360 || true
          echo "===== SUMMARY JSON RANGE ====="
          grep -n -A100 -B5 '"htr010b_outcome"' /tmp/job.log | tail -180 || true
          echo "===== TRACEBACKS ====="
          grep -n -A80 -B10 'Traceback' /tmp/job.log | tail -180 || true
