name: Temporary DSI-011C Normalizer

on:
  push:
    branches:
      - feature/dsi-011c-20dma-reclaim-portfolio
  pull_request:
    branches:
      - feature/dsi-011b-stop-target-matrix

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-011c-20dma-reclaim-portfolio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply locked Ruff normalization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/research/reclaim_portfolio_challenger.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        "final_exit": "remaining quantity at earliest of 3R or prior-session SMA(20) trail",\n',
              '        "final_exit": (\n'
              '            "remaining quantity at earliest of 3R or prior-session "\n'
              '            "SMA(20) trail"\n'
              '        ),\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install 'ruff==0.15.20'
          ruff format \
            alpha/research/reclaim_portfolio_challenger.py \
            tests/research/test_reclaim_portfolio_challenger.py
          ruff check --fix \
            alpha/research/reclaim_portfolio_challenger.py \
            tests/research/test_reclaim_portfolio_challenger.py
          ruff format --check \
            alpha/research/reclaim_portfolio_challenger.py \
            tests/research/test_reclaim_portfolio_challenger.py
          git diff --check
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/research/reclaim_portfolio_challenger.py \
            tests/research/test_reclaim_portfolio_challenger.py
          git commit -m 'style(dsi-011c): apply locked Ruff normalization'
          git push origin HEAD:feature/dsi-011c-20dma-reclaim-portfolio
