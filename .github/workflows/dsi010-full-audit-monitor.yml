name: DSI-010 Full Audit Monitor

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-full-audit-monitor.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-full-audit-monitor.yml

permissions:
  actions: read
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate latest full audit workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = "feature/dsi-010-pre2016-external-era-validation"
          workflow = "dsi010-full-population-calendar-audit.yml"
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"{workflow}/runs?branch={urllib.parse.quote(branch, safe='')}"
              "&per_page=10"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          runs = payload.get("workflow_runs", [])
          if not runs:
              raise SystemExit("FULL_AUDIT_WORKFLOW_RUN_NOT_FOUND")
          latest = runs[0]
          print("===== DSI-010 FULL AUDIT RUN IDENTITY =====")
          print(f"run_id: {latest['id']}")
          print(f"status: {latest['status']}")
          print(f"conclusion: {latest.get('conclusion')}")
          print(f"head_sha: {latest['head_sha']}")
          print(f"event: {latest['event']}")
          print(f"run_number: {latest['run_number']}")
          PY
