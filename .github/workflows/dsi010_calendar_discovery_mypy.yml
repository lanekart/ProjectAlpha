name: DSI010 Calendar Discovery Type Repair

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/dsi-010-pre2016-external-era-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install project
        run: |
          python -m pip install poetry
          poetry install --no-interaction
      - name: Apply type-safe calendar year conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/decision_superiority/pre2016_calendar_sources.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for row in rows:
              year = int(row["calendar_year"])
              counts[year] = counts.get(year, 0) + 1'''
          new = '''    for row in rows:
              raw_year = row["calendar_year"]
              if isinstance(raw_year, bool) or not isinstance(raw_year, (int, str)):
                  raise Pre2016ExternalValidationError(
                      "PRE2016_DISCOVERY_CALENDAR_YEAR_INVALID"
                  )
              try:
                  year = int(raw_year)
              except ValueError as exc:
                  raise Pre2016ExternalValidationError(
                      "PRE2016_DISCOVERY_CALENDAR_YEAR_INVALID"
                  ) from exc
              counts[year] = counts.get(year, 0) + 1'''
          if old not in text:
              raise SystemExit('calendar year conversion anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          poetry run ruff check \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py
      - name: Commit repair and remove workflow
        run: |
          rm .github/workflows/dsi010_calendar_discovery_mypy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            .github/workflows/dsi010_calendar_discovery_mypy.yml
          git commit -m 'fix(dsi-010): validate discovery calendar year scalar'
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
