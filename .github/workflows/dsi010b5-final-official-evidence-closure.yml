name: DSI-010B5 Final Official-Evidence Closure

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation

permissions:
  actions: read
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Download signed source and prior certificates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30352312594
          name: dsi010-pre2016-rights-rebuild
          path: inputs

      - name: Download signed HTR-009A2 identity boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30335669653
          name: dsi010-a3-b-repaired-rerun
          path: identity

      - name: Download signed DSI-010B1 boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30380882353
          name: dsi010b1-legacy-rights-bridge-certification
          path: signed_b1

      - name: Download signed DSI-010B2 boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30390124010
          name: dsi010b2-bridge-aware-continuity-certification
          path: signed_b2

      - name: Download signed DSI-010B3 boundary
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30402890362
          name: dsi010b3-residual-corporate-action-closure
          path: signed_b3

      - name: Restore immutable governed source state
        run: |
          set -euo pipefail
          archive=$(find inputs -type f -name alpha_data_after_rights_rebuild.tar.gz | head -1)
          calendar=$(find inputs -type f -name htr007_session_calendar.json | head -1)
          a2=$(find identity -type d -name htr009a2_event_sourced_universe | head -1)
          b1=$(find signed_b1 -type d -name dsi010b1_legacy_rights_reference_bridge | head -1)
          baseline_htr=$(find signed_b2 -type d -name htr010b_complete_corporate_action_dataset | head -1)
          baseline_b1e2=$(find signed_b2 -type d -name htr010b1e2_final_admission_state_propagation_b2 | head -1)
          test -f "$archive"
          test -f "$calendar"
          test -d "$a2"
          test -d "$b1"
          test -d "$baseline_htr"
          test -d "$baseline_b1e2"
          mkdir -p work artifacts work/calendar signed baseline
          tar -xzf "$archive" -C work
          cp -a inputs/artifacts/. artifacts/
          cp -a "$a2" signed/htr009a2_event_sourced_universe
          cp -a "$b1" signed/dsi010b1_legacy_rights_reference_bridge
          cp -a "$baseline_htr" baseline/htr010b
          cp -a "$baseline_b1e2" baseline/b1e2
          cp "$calendar" work/calendar/htr007_session_calendar.json
          test -f work/alpha_data/warehouse/historical_truth.duckdb

      - name: Restore and verify signed authoritative evidence
        run: |
          set -euo pipefail
          root=work/alpha_data/raw/official/company_identity
          supplements=work/alpha_data/raw/official/corporate_action_supplements/dsi010b5
          mkdir -p "$root/TATAPOWER" "$root/HINDMOTOR"
          mkdir -p "$supplements"
          signed_root=signed_b3/work/alpha_data/raw/official/company_identity
          cp \
            "$signed_root/TATAPOWER/tatapower_corporate_governance_2011_12_95fd08f775bee1069ba350b2478d93366a4035ef87fc7d887776aa03a2519734.pdf" \
            "$root/TATAPOWER/"
          cp "$signed_root/TATAPOWER/tatapower_rights_2014_bse.pdf" \
            "$root/TATAPOWER/"
          cp "$signed_root/HINDMOTOR/nse_press_20110217.htm" \
            "$root/HINDMOTOR/"
          echo "95fd08f775bee1069ba350b2478d93366a4035ef87fc7d887776aa03a2519734  $root/TATAPOWER/tatapower_corporate_governance_2011_12_95fd08f775bee1069ba350b2478d93366a4035ef87fc7d887776aa03a2519734.pdf" | sha256sum -c -
          echo "9c1a79a78b1b77adca7e6b6c9429dbadc944132b9964f03bfd250ac1a9faf5e1  $root/TATAPOWER/tatapower_rights_2014_bse.pdf" | sha256sum -c -
          echo "a874ce997f384fedc21e74506775da58d1017b402e4c6aa2add87b1aa869d52f  $root/HINDMOTOR/nse_press_20110217.htm" | sha256sum -c -

          fetch_official() {
            local filename="$1"
            local expected_sha="$2"
            local url="$3"
            local destination="$supplements/$filename"
            curl \
              --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 --max-time 240 \
              --user-agent "ProjectAlpha/1.0 HistoricalTruthResearch" \
              --output "$destination.tmp" \
              "$url"
            sha256sum "$destination.tmp"
            echo "$expected_sha  $destination.tmp" | sha256sum -c -
            mv "$destination.tmp" "$destination"
          }

          fetch_official \
            tatasteel_2007_official_press.html \
            27f83c81ff900588c6bbcceab2ae4269ae9a6fa414b75d8fd7e402656650ff6d \
            "https://www.tatasteel.com/media/newsroom/press-releases/india/2007/funding-of-corus-transaction/"
          fetch_official \
            tmpv_2008_tatamotors_20f.pdf \
            1c8ff28023f9b59e9baa6d9a93e7ae3a57762e01984d47940b06119abcfb8ed5 \
            "https://www.tatamotors.com/wp-content/uploads/2023/12/20F-2008.pdf"
          fetch_official \
            lakshmivilas_2014_bse_lof.pdf \
            a73148f4bef9016aaaf79c5ba2958489c4f8a55f8b3c1545f8a22865e35a05fb \
            "https://www.bseindia.com/downloads/ipo/Lakshmi%20Vilas%20Bank%20-%20LOF_070820141241.pdf"
          fetch_official \
            ocl_2006_sebi_lof.pdf \
            f00439f3c803e1273c29d0435c4838e9a5ec95bd7498587100871b30d9d6a949 \
            "https://www.sebi.gov.in/sebi_data/attachdocs/1292478628241.pdf"
          fetch_official \
            uniwestbnk_2006_sebi_caf.pdf \
            413df458096f73e906170b2bfc311e5f74ef4cef7a3def4c6d98c74e1ab14d40 \
            "https://www.sebi.gov.in/sebi_data/attachdocs/1292399175191.pdf"
          fetch_official \
            bajajfinance_2006_annual_report.pdf \
            816892c7dcedc65ad773e1aff54091400474627278ee9a18e6e7184f980b970e \
            "https://cms-assets.bajajfinserv.in/is/content/bajajfinance/bajaj-finserv-limited-2008pdf?fmt=pdf&scl=1"
          fetch_official \
            cholafin_2007_sebi_lof.pdf \
            461becd4db41c860b5694c817649029b205a3374af0d874a3ea72158ff56fa4a \
            "https://www.sebi.gov.in/sebi_data/attachdocs/1291892791087.pdf"
          fetch_official \
            andhrapaper_2010_sebi_lof.pdf \
            5b21cb8a5b78cd6f322aa43957099c75fd03496064e9f879c6e437c5a79a7620 \
            "https://www.sebi.gov.in/sebi_data/attachdocs/1288348223615.pdf"
          fetch_official \
            orientpaper_2007_lof.pdf \
            53e0c174c161ab044cce7382a5d387c900a12086333cbb72006e03cbeed585b4 \
            "https://orientpaper.in/wp-content/assets/investors/other-disclosures/right-issue-LOF-June_8_2007.pdf"
          fetch_official \
            hindmotor_2010_11_bse_annual_report.pdf \
            56c07a82b95e72049fc22111de2763f9ad9c5438fb4fa07f86d57b7604f1aa92 \
            "https://www.bseindia.com/bseplus/AnnualReport/500500/5005000311.pdf"
          fetch_official \
            kwality_2009_10_bse_annual_report.pdf \
            2ea760fc23053236b96be8d4e55d22811ac4b80aaaf4a7df10fea521338e69ca \
            "https://www.bseindia.com/bseplus/AnnualReport/531882/5318820310.pdf"
          fetch_official \
            gppetrol_2012_13_bse_annual_report.pdf \
            502c7ae71bec6da2c100cb9cbc329b9b3ece6a1ec31a69ffcd4bdf5cb4c2db90 \
            "https://www.bseindia.com/bseplus/AnnualReport/532543/5325430313.pdf"
          fetch_official \
            centext_2005_annual_report.pdf \
            f0ad855e924c15c54a54570d6321f2d5b37b5cfcd1753ebdb98027fcb1fe4fbe \
            "https://www.centuryextrusions.com/financials/annual-report/images/ar032005.pdf"
          fetch_official \
            nse_press_20100106.htm \
            314ceb8b5f2bb753039fe376e1101d4d5e26bdefbe3664b31474aec296a6aa58 \
            "https://nsearchives.nseindia.com/content/press/06012010.htm"

      - name: Rebuild governed chain twice
        run: |
          set -euo pipefail
          rm -rf artifacts/htr009b_corporate_action_price_continuity
          poetry run python -m alpha historical-truth corporate-action-price-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/calendar/htr007_session_calendar.json \
            --root work/alpha_data --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr009b_corporate_action_price_continuity \
            --verify-only

          run_chain() {
            local out="$1"
            mkdir -p "$out"
            poetry run python -m alpha historical-truth complete-corporate-action-dataset \
              --database work/alpha_data/warehouse/historical_truth.duckdb \
              --root work/alpha_data \
              --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
              --htr009a2-output signed/htr009a2_event_sourced_universe \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/htr010b"
            poetry run python -m alpha historical-truth adjustment-replay-admission-certify \
              --database work/alpha_data/warehouse/historical_truth.duckdb \
              --root work/alpha_data \
              --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
              --htr010b-output "$out/htr010b" \
              --htr009a2-output signed/htr009a2_event_sourced_universe \
              --dsi010b1-output signed/dsi010b1_legacy_rights_reference_bridge \
              --session-calendar-report work/calendar/htr007_session_calendar.json \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/b1c"
            poetry run python -m alpha historical-truth factor-transformation-forensics \
              --database work/alpha_data/warehouse/historical_truth.duckdb \
              --htr010b-output "$out/htr010b" \
              --htr010b1c-output "$out/b1c" \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/b1d"
            poetry run python -m alpha historical-truth factor-transformation-bridge-forensics \
              --database work/alpha_data/warehouse/historical_truth.duckdb \
              --htr010b-output "$out/htr010b" \
              --htr010b1d-output "$out/b1d" \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/b1d1"
            poetry run python -m alpha historical-truth bridge-aware-factor-validation-repair \
              --htr010b1d1-output "$out/b1d1" \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/b1d2"
            poetry run python -m alpha historical-truth bridge-aware-admission-reconcile \
              --database work/alpha_data/warehouse/historical_truth.duckdb \
              --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
              --htr010b-output "$out/htr010b" \
              --htr009a2-output signed/htr009a2_event_sourced_universe \
              --dsi010b1-output signed/dsi010b1_legacy_rights_reference_bridge \
              --htr010b1d2-output "$out/b1d2" \
              --session-calendar-report work/calendar/htr007_session_calendar.json \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/b1e2"
            poetry run python -m alpha historical-truth residual-corporate-action-closure-certify \
              --baseline-b1c-output baseline/b1e2 \
              --final-b1c-output "$out/b1e2" \
              --baseline-htr010b-output baseline/htr010b \
              --final-htr010b-output "$out/htr010b" \
              --official-source-root work/alpha_data/raw/official/company_identity \
              --dsi010b1-output signed/dsi010b1_legacy_rights_reference_bridge \
              --output "$out/closure"
            poetry run python -m alpha historical-truth \
              final-pre2016-adjusted-history-closure-certify \
              --baseline-b1c-output signed_b3/acceptance-a/b1e2 \
              --final-b1c-output "$out/b1e2" \
              --baseline-htr010b-output signed_b3/acceptance-a/htr010b \
              --final-htr010b-output "$out/htr010b" \
              --dsi010b1-output signed/dsi010b1_legacy_rights_reference_bridge \
              --output "$out/b4"
            poetry run python -m alpha historical-truth \
              final-official-evidence-closure-certify \
              --database work/alpha_data/warehouse/historical_truth.duckdb \
              --htr009a2-output signed/htr009a2_event_sourced_universe \
              --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
              --htr010b-output "$out/htr010b" \
              --final-b1c-output "$out/b1c" \
              --final-b1e2-output "$out/b1e2" \
              --baseline-b4-output "$out/b4" \
              --start 2005-01-01 --end 2015-12-31 \
              --output "$out/b5"
          }

          run_chain acceptance-a
          run_chain acceptance-b

      - name: Certify deterministic closure
        run: |
          set -euo pipefail
          poetry run python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          from subprocess import check_output

          import duckdb

          first = Path("acceptance-a")
          second = Path("acceptance-b")
          first_files = {
              path.relative_to(first): sha256(path.read_bytes()).hexdigest()
              for path in first.rglob("*")
              if path.is_file() and path.suffix != ".duckdb"
          }
          second_files = {
              path.relative_to(second): sha256(path.read_bytes()).hexdigest()
              for path in second.rglob("*")
              if path.is_file() and path.suffix != ".duckdb"
          }
          assert first_files == second_files

          def compare_databases(first_db, second_db):
              connection = duckdb.connect()
              quote = "'"
              connection.execute(
                  f"ATTACH {quote}{first_db}{quote} AS first (READ_ONLY)"
              )
              connection.execute(
                  f"ATTACH {quote}{second_db}{quote} AS second (READ_ONLY)"
              )
              tables = [
                  row[0]
                  for row in connection.execute(
                      "SELECT table_name FROM information_schema.tables "
                      "WHERE table_catalog='first' ORDER BY table_name"
                  ).fetchall()
              ]
              table_rows = {}
              for table in tables:
                  left = connection.execute(
                      f"SELECT COUNT(*) FROM (SELECT * FROM first.{table} "
                      f"EXCEPT ALL SELECT * FROM second.{table})"
                  ).fetchone()[0]
                  right = connection.execute(
                      f"SELECT COUNT(*) FROM (SELECT * FROM second.{table} "
                      f"EXCEPT ALL SELECT * FROM first.{table})"
                  ).fetchone()[0]
                  assert left == right == 0
                  table_rows[table] = connection.execute(
                      f"SELECT COUNT(*) FROM first.{table}"
                  ).fetchone()[0]
              connection.close()
              return table_rows

          htr010b_table_rows = compare_databases(
              first / "htr010b/htr010b_corporate_action.duckdb",
              second / "htr010b/htr010b_corporate_action.duckdb",
          )
          adjusted_table_rows = compare_databases(
              first / "b5/dsi010b5_adjusted_history.duckdb",
              second / "b5/dsi010b5_adjusted_history.duckdb",
          )

          root = first / "b5"
          summary_path = root / "dsi010b5_closure_summary.json"
          certificate_path = root / "dsi010b5_adjusted_replay_certificate.json"
          report_path = root / "dsi010b5_executive_report.md"
          summary = json.loads(summary_path.read_text())
          assert summary["starting_residual_case_count"] == 66
          assert summary["material_validation_case_count"] == 705
          assert summary["unresolved_validation_case_count"] == 0
          assert summary["accepted_multiplicative_factor_count"] == 697
          assert summary["non_multiplicative_event_count"] == 8
          assert summary["event_resolution_counts"] == {
              "AUTHORITATIVE_SUPERSEDING_OFFICIAL_TERMS": 1,
              "COMPLETE_OFFICIAL_EQUITY_RIGHTS_TERMS": 11,
              "FIRST_GOVERNED_ACTION_SESSION_CANDLE": 10,
              "FOURTEEN_GOVERNED_PRE_EVENT_BARS": 31,
              "GOVERNED_REFERENCE_PRICE_IDENTITY": 12,
              "OFFICIAL_EFFECTIVE_DATED_ISIN_TRANSITION": 1,
              "TOTAL_REMAINING_EVENT_CASES": 0,
              "TOTAL_RESOLVED_CASES": 66,
              "TOTAL_STARTING_CASES": 66,
          }
          assert summary["validation_outcome_counts"] == {
              "FACTOR_CERTIFIED_OFFICIAL_TERMS_CONTINUITY_NOT_TESTABLE": 2,
              "FACTOR_CONFIRMED_CORRECT_MARKET_GAP": 695,
              "FACTOR_NON_MULTIPLICATIVE": 8,
          }
          assert summary["required_adjustment_row_count"] == 500046
          assert summary["adjusted_row_count_after"] == 246688
          assert summary["unresolved_identity_adjustment_row_count"] == 253358
          assert summary["unresolved_identity_segment_count"] == 476
          assert summary["raw_candles_unchanged"] is True
          assert summary["security_periods_excluded"] is False
          assert summary["adjusted_replay_ready"] is False
          assert (
              summary["readiness"]
              == "BLOCKED_BY_UNCERTIFIED_PRE_EVENT_IDENTITY_HISTORY"
          )
          assert summary["production_influence"] is False
          acceptance = {
              "contract": "DSI-010B5-ACCEPTANCE-v1",
              "source_commit": check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "summary": summary,
              "governed_non_database_artifact_count": len(first_files),
              "governed_non_database_artifacts_byte_identical": True,
              "duckdb_tables_logically_identical": True,
              "htr010b_duckdb_table_rows": htr010b_table_rows,
              "adjusted_duckdb_table_rows": adjusted_table_rows,
              "summary_file_sha256": sha256(summary_path.read_bytes()).hexdigest(),
              "certificate_file_sha256": sha256(
                  certificate_path.read_bytes()
              ).hexdigest(),
              "report_file_sha256": sha256(report_path.read_bytes()).hexdigest(),
              "full_benchmark_replays": 0,
              "production_influence": False,
          }
          output = Path("acceptance")
          output.mkdir()
          (output / "acceptance_summary.json").write_text(
              json.dumps(acceptance, indent=2, sort_keys=True) + "\n"
          )
          (output / "artifact_hashes.json").write_text(
              json.dumps(
                  {str(path): digest for path, digest in first_files.items()},
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )
          print(json.dumps(acceptance, indent=2, sort_keys=True))
          print("FULL_BENCHMARK_REPLAYS=0")
          print("STOP_POLICY_AUTOMATIC_PROMOTION_ENABLED=false")
          print("ADJUSTED_REPLAY_READY=false")
          print("PRODUCTION_INFLUENCE=false")
          PY

      - name: Upload signed acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsi010b5-final-official-evidence-closure
          retention-days: 14
          compression-level: 6
          if-no-files-found: error
          path: |
            acceptance
            acceptance-a
            work/alpha_data/raw/official/company_identity
