name: DSI010 Calendar Discovery Format

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/dsi-010-pre2016-external-era-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked Ruff
        run: python -m pip install 'ruff==0.15.20'
      - name: Apply exact wraps and format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/decision_superiority/pre2016_calendar_sources.py')
          text = path.read_text(encoding='utf-8')
          old_status = (
              '        status_case_normalized = status_case_normalized or '
              'raw_status != normalized_status'
          )
          new_status = '''        status_case_normalized = (
              status_case_normalized or raw_status != normalized_status
          )'''
          old_count = (
              'def _count_by_year(rows: tuple[dict[str, object], ...] | '
              'list[dict[str, object]]) -> dict[int, int]:'
          )
          new_count = '''def _count_by_year(
              rows: tuple[dict[str, object], ...] | list[dict[str, object]],
          ) -> dict[int, int]:'''
          if old_status not in text or old_count not in text:
              raise SystemExit('discovery formatting anchor missing')
          text = text.replace(old_status, new_status, 1)
          text = text.replace(old_count, new_count, 1)
          path.write_text(text, encoding='utf-8')
          PY
          ruff check --fix \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py
          ruff format \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py
          ruff check \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py
          python -m compileall -q \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/dsi010_calendar_discovery_format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/decision_superiority/pre2016_calendar_sources.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            alpha/application/decision_superiority_entry_stop_improvement_cli.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py \
            .github/workflows/dsi010_calendar_discovery_format.yml
          git commit -m 'fix(dsi-010): format calendar discovery operator'
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
