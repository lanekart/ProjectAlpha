name: DSI010 Holiday API Probe Format

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/dsi-010-pre2016-external-era-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked Ruff
        run: python -m pip install 'ruff==0.15.20'
      - name: Format probe surface
        run: |
          ruff format \
            alpha/decision_superiority/pre2016_calendar_api_probe.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            tests/decision_superiority/test_pre2016_calendar_api_probe.py
          ruff check \
            alpha/decision_superiority/pre2016_calendar_api_probe.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            tests/decision_superiority/test_pre2016_calendar_api_probe.py
          ruff format --check \
            alpha/decision_superiority/pre2016_calendar_api_probe.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            tests/decision_superiority/test_pre2016_calendar_api_probe.py
          python -m compileall -q \
            alpha/decision_superiority/pre2016_calendar_api_probe.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            tests/decision_superiority/test_pre2016_calendar_api_probe.py
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/dsi010_api_probe_format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/decision_superiority/pre2016_calendar_api_probe.py \
            alpha/application/decision_superiority_pre2016_calendar_sources_cli.py \
            tests/decision_superiority/test_pre2016_calendar_api_probe.py \
            .github/workflows/dsi010_api_probe_format.yml
          git commit -m 'style(dsi-010): format holiday API probe surface'
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
