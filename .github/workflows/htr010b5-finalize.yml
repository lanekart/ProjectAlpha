name: Temporary HTR-010B5 finalizer

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.ref ==
      'feature/htr-010b5-governed-approval-gate-forensics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the HTR-010B5 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b5-governed-approval-gate-forensics
          fetch-depth: 0

      - name: Apply final deterministic source cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "alpha/benchmark_replay/governed_approval_gate_forensics.py"
          )
          lines = path.read_text(encoding="utf-8").splitlines()
          date_marker = '_date_value(benchmark_row.get("observed_on")'
          symbol_marker = '_symbol(benchmark_row.get("symbol")'
          date_indexes = [
              index for index, line in enumerate(lines) if date_marker in line
          ]
          symbol_indexes = [
              index for index, line in enumerate(lines) if symbol_marker in line
          ]
          if len(date_indexes) != 1 or len(symbol_indexes) != 1:
              raise SystemExit(
                  "unexpected HTR-010B5 benchmark-key markers: "
                  f"dates={date_indexes}, symbols={symbol_indexes}"
              )
          date_index = date_indexes[0]
          symbol_index = symbol_indexes[0]
          if symbol_index != date_index + 1:
              # Already wrapped source is accepted without further mutation.
              wrapped = (
                  lines[date_index].strip() == "_date_value("
                  and lines[symbol_index].strip() == "_symbol("
              )
              if not wrapped:
                  raise SystemExit("benchmark-key markers are not adjacent")
          else:
              indent = lines[date_index][
                  : len(lines[date_index]) - len(lines[date_index].lstrip())
              ]
              lines[date_index : symbol_index + 1] = [
                  f"{indent}_date_value(",
                  f'{indent}    benchmark_row.get("observed_on"),',
                  f'{indent}    f"{{price_view}} benchmark date",',
                  f"{indent}),",
                  f"{indent}_symbol(",
                  f'{indent}    benchmark_row.get("symbol"),',
                  f'{indent}    f"{{price_view}} benchmark symbol",',
                  f"{indent}),",
              ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm -f \
            .github/workflows/htr010b5-final-format.yml \
            .github/workflows/htr010b5-mypy-fix.yml \
            htr010b5-mypy-diagnostics.txt \
            htr010b5-quality-diagnostics.txt

      - name: Commit the final feature-branch source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(htr010b5): finalize strict-typed source"
          git push origin \
            HEAD:feature/htr-010b5-governed-approval-gate-forensics
