name: DSI-010 2008 Emergency Source Fix V3

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-2008-emergency-source-fix-v3.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Apply robust source and audit repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path(
              "alpha/decision_superiority/pre2016_2008_emergency_closure.py"
          )
          module_text = module.read_text(encoding="utf-8")
          module_text = module_text.replace("from io import BytesIO\n", "", 1)
          if "    evidence: dict[str, object] = {" not in module_text:
              if "    evidence = {" not in module_text:
                  raise SystemExit("EVIDENCE_ASSIGNMENT_MISSING")
              module_text = module_text.replace(
                  "    evidence = {",
                  "    evidence: dict[str, object] = {",
                  1,
              )
          module.write_text(module_text, encoding="utf-8")

          path = Path("scripts/run_dsi010_full_calendar_audit.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"AUDIT_PATCH_BOUNDARY_MISSING:{label}")
              text = text.replace(old, new, 1)

          replace_once(
              "    emergency_source: Path,\n) -> tuple[Path, ...]:",
              "    emergency_source: Path,\n"
              "    additional_sources: tuple[Path, ...] = (),\n"
              "    expected_source_count: int = 29,\n"
              ") -> tuple[Path, ...]:",
              "calendar-source-signature",
          )
          replace_once(
              "    source_paths = (*early_sources, *later_sources, emergency_source)\n"
              "    if len(set(source_paths)) != 29:\n"
              "        raise RuntimeError(\"CALENDAR_SOURCE_PATH_DUPLICATION\")\n"
              "    return source_paths",
              "    missing_additional = tuple(\n"
              "        source for source in additional_sources if not source.is_file()\n"
              "    )\n"
              "    if missing_additional:\n"
              "        raise RuntimeError(\n"
              "            \"ADDITIONAL_CALENDAR_SOURCE_MISSING:\"\n"
              "            + \",\".join(str(source) for source in missing_additional)\n"
              "        )\n"
              "    source_paths = (\n"
              "        *early_sources,\n"
              "        *later_sources,\n"
              "        emergency_source,\n"
              "        *additional_sources,\n"
              "    )\n"
              "    if len(source_paths) != expected_source_count:\n"
              "        raise RuntimeError(\n"
              "            \"CALENDAR_SOURCE_COUNT_MISMATCH:\"\n"
              "            f\"expected={expected_source_count}:observed={len(source_paths)}\"\n"
              "        )\n"
              "    if len(set(source_paths)) != expected_source_count:\n"
              "        raise RuntimeError(\"CALENDAR_SOURCE_PATH_DUPLICATION\")\n"
              "    return source_paths",
              "calendar-source-body",
          )
          replace_once(
              "    special_config: Path,\n) -> list[dict[str, object]]:",
              "    special_config: Path,\n"
              "    expected_holiday_rows: int = 220,\n"
              ") -> list[dict[str, object]]:",
              "source-validation-signature",
          )
          replace_once(
              "    if holiday_rows != 220:\n"
              "        raise RuntimeError(f\"EXPECTED_220_HOLIDAY_ROWS_FOUND_{holiday_rows}\")",
              "    if holiday_rows != expected_holiday_rows:\n"
              "        raise RuntimeError(\n"
              "            \"CALENDAR_HOLIDAY_ROW_COUNT_MISMATCH:\"\n"
              "            f\"expected={expected_holiday_rows}:observed={holiday_rows}\"\n"
              "        )",
              "holiday-count",
          )
          replace_once(
              "    source_population_run_id: int,\n) -> Path:",
              "    source_population_run_id: int,\n"
              "    additional_sources: tuple[Path, ...] = (),\n"
              "    expected_source_count: int = 29,\n"
              "    expected_holiday_rows: int = 220,\n"
              ") -> Path:",
              "audit-signature",
          )
          replace_once(
              "        emergency_source=emergency_source,\n"
              "    )\n"
              "    source_lineage = _validate_sources_and_special_sessions(\n"
              "        source_paths=source_paths,\n"
              "        special_config=special_config,\n"
              "    )",
              "        emergency_source=emergency_source,\n"
              "        additional_sources=additional_sources,\n"
              "        expected_source_count=expected_source_count,\n"
              "    )\n"
              "    source_lineage = _validate_sources_and_special_sessions(\n"
              "        source_paths=source_paths,\n"
              "        special_config=special_config,\n"
              "        expected_holiday_rows=expected_holiday_rows,\n"
              "    )",
              "audit-call",
          )
          if "    record_rows: list[dict[str, object]] = [" not in text:
              if "    record_rows = [" not in text:
                  raise SystemExit("AUDIT_RECORD_ROWS_BOUNDARY_MISSING")
              text = text.replace(
                  "    record_rows = [",
                  "    record_rows: list[dict[str, object]] = [",
                  1,
              )
          replace_once(
              "    parser.add_argument(\"--source-population-run-id\", type=int, required=True)\n"
              "    args = parser.parse_args()",
              "    parser.add_argument(\"--source-population-run-id\", type=int, required=True)\n"
              "    parser.add_argument(\n"
              "        \"--additional-source\",\n"
              "        type=Path,\n"
              "        action=\"append\",\n"
              "        default=[],\n"
              "    )\n"
              "    parser.add_argument(\"--expected-source-count\", type=int, default=29)\n"
              "    parser.add_argument(\n"
              "        \"--expected-holiday-row-count\", type=int, default=220\n"
              "    )\n"
              "    args = parser.parse_args()",
              "cli-arguments",
          )
          replace_once(
              "        source_population_run_id=args.source_population_run_id,\n"
              "    )",
              "        source_population_run_id=args.source_population_run_id,\n"
              "        additional_sources=tuple(args.additional_source),\n"
              "        expected_source_count=args.expected_source_count,\n"
              "        expected_holiday_rows=args.expected_holiday_row_count,\n"
              "    )",
              "cli-call",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate implementation
        run: |
          poetry run ruff check --fix \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run ruff format \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run ruff check \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py
          poetry run pytest -q \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py \
            tests/decision_superiority/test_pre2016_population_merge.py
      - name: Commit validated implementation
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          if git diff --cached --quiet; then
            echo "No implementation changes required"
            exit 0
          fi
          git commit -m "feat(dsi-010): govern 2008 emergency market closure"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
