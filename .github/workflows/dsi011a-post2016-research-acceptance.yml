name: DSI-011A Post-2016 Research Acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release containing the immutable acceptance bundle
        required: true
        type: string
      asset_name:
        description: Name of the gzipped acceptance tar archive
        required: true
        type: string
      expected_sha256:
        description: Expected SHA-256 of the acceptance archive
        required: true
        type: string
      expected_source_commit:
        description: Validated DSI-011A source commit recorded in certificates
        required: true
        type: string
      expected_logical_sha256:
        description: Expected logical SHA-256 recorded by both acceptance manifests
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXPECTED_LOGICAL_SHA256: ${{ inputs.expected_logical_sha256 }}
      EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable acceptance bundle
        run: |
          set -euo pipefail
          mkdir -p incoming acceptance
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset_name }}" \
            --dir incoming
          archive="incoming/${{ inputs.asset_name }}"
          echo "$EXPECTED_ARCHIVE_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C acceptance

      - name: Verify signed roots and deterministic artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          roots = (
              Path("acceptance/acceptance-a"),
              Path("acceptance/acceptance-b"),
          )
          expected_source = os.environ["EXPECTED_SOURCE_COMMIT"]
          expected_logical = os.environ["EXPECTED_LOGICAL_SHA256"]

          def file_hash(path: Path) -> str:
              return sha256(path.read_bytes()).hexdigest()

          def is_allowed_archive_metadata(relative: str) -> bool:
              parts = Path(relative).parts
              return any(part.startswith("._") for part in parts) or Path(relative).name == ".DS_Store"

          def validate(root: Path) -> tuple[dict[str, str], dict[str, object]]:
              manifest_path = root / "acceptance_artifact_manifest.json"
              summary_path = root / "acceptance_summary.json"
              comparison_path = root / "acceptance_comparison.json"
              if not manifest_path.is_file() or not summary_path.is_file() or not comparison_path.is_file():
                  raise AssertionError(f"incomplete acceptance root: {root}")

              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest["artifact_logical_sha256"] != expected_logical:
                  raise AssertionError(f"logical hash mismatch: {root}")

              recorded = {
                  item["path"]: item["sha256"]
                  for item in manifest["artifacts"]
              }
              missing: list[str] = []
              mismatched: list[dict[str, str]] = []
              for relative, expected_hash in sorted(recorded.items()):
                  path = root / relative
                  if not path.is_file():
                      missing.append(relative)
                      continue
                  observed_hash = file_hash(path)
                  if observed_hash != expected_hash:
                      mismatched.append(
                          {
                              "path": relative,
                              "expected": expected_hash,
                              "observed": observed_hash,
                          }
                      )

              extras = []
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or path == manifest_path:
                      continue
                  relative = path.relative_to(root).as_posix()
                  if relative not in recorded and not is_allowed_archive_metadata(relative):
                      extras.append(relative)

              if missing or mismatched or extras:
                  raise AssertionError(
                      json.dumps(
                          {
                              "root": str(root),
                              "missing": missing[:20],
                              "mismatched": mismatched[:20],
                              "unexpected_extras": extras[:20],
                          },
                          sort_keys=True,
                      )
                  )

              certificates = sorted((root / "runs").glob("*/certificate.json"))
              if not certificates:
                  raise AssertionError(f"no completed runs: {root}")
              for certificate_path in certificates:
                  certificate = json.loads(
                      certificate_path.read_text(encoding="utf-8")
                  )
                  if certificate["source_commit"] != expected_source:
                      raise AssertionError(
                          f"source mismatch: {certificate_path}"
                      )
                  if certificate["ready"] is not True:
                      raise AssertionError(
                          f"blocked experiment: {certificate_path}"
                      )
                  if certificate["production_influence"] is not False:
                      raise AssertionError(
                          f"production influence: {certificate_path}"
                      )
                  if certificate["automatic_strategy_promotion"] is not False:
                      raise AssertionError(
                          f"automatic promotion: {certificate_path}"
                      )

              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              if summary["production_influence"] is not False:
                  raise AssertionError(f"invalid summary: {root}")
              experiments = summary["experiments"]
              expected_experiments = set("ABCDEFGH") | {
                  "PURE_TECHNICAL",
                  "RETROSPECTIVE_ALPHA",
              }
              if set(experiments) != expected_experiments:
                  raise AssertionError(
                      f"acceptance population mismatch: {root}: "
                      f"{sorted(experiments)}"
                  )
              if not all(item["completed"] for item in experiments.values()):
                  raise AssertionError(f"incomplete experiment: {root}")

              comparison = json.loads(comparison_path.read_text(encoding="utf-8"))
              if not comparison:
                  raise AssertionError(f"empty comparison artifact: {root}")
              return recorded, manifest

          first_files, first_manifest = validate(roots[0])
          second_files, second_manifest = validate(roots[1])
          if first_files != second_files:
              raise AssertionError("clean-root governed manifests are not identical")
          if (
              first_manifest["artifact_logical_sha256"]
              != second_manifest["artifact_logical_sha256"]
          ):
              raise AssertionError("logical acceptance hashes differ")

          envelope = {
              "source_head_sha": expected_source,
              "workflow_source_sha": os.environ["GITHUB_SHA"],
              "artifact_logical_sha256": expected_logical,
              "archive_sha256": os.environ["EXPECTED_ARCHIVE_SHA256"],
              "acceptance_roots_byte_identical": True,
              "artifact_count_per_root": len(first_files),
              "top_level_run_count": 10,
              "comparison_artifact_present": True,
              "production_influence": False,
          }
          Path("acceptance/ci_acceptance_envelope.json").write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(envelope, indent=2, sort_keys=True))
          PY

      - name: Upload governed DSI-011A acceptance
        uses: actions/upload-artifact@v4
        with:
          name: dsi011a-post2016-research-acceptance
          path: |
            acceptance/acceptance-a
            acceptance/ci_acceptance_envelope.json
          if-no-files-found: error
          retention-days: 90
