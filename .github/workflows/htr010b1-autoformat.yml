name: HTR010B1 Autoformat

on:
  push:
    branches:
      - feature/htr-010b1-factor-validation-replay-admission

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b1-factor-validation-replay-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install ruff==0.15.20
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check alpha/historical_truth/adjustment_replay_admission_*.py tests/historical_truth/test_adjustment_replay_admission.py --fix
          ruff format alpha/historical_truth/adjustment_replay_admission_*.py tests/historical_truth/test_adjustment_replay_admission.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/historical_truth/adjustment_replay_admission_*.py tests/historical_truth/test_adjustment_replay_admission.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format HTR-010B1 implementation'
          git push origin HEAD:feature/htr-010b1-factor-validation-replay-admission
