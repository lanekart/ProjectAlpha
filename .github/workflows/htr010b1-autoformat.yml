name: HTR010B1 Autoformat

on:
  push:
    branches:
      - feature/htr-010b1-factor-validation-replay-admission

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b1-factor-validation-replay-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.11.7'
      - name: Fix and format HTR-010B1 files
        run: |
          ruff check --fix \
            alpha/historical_truth/adjustment_replay_admission_*.py \
            tests/historical_truth/test_adjustment_replay_admission.py
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_*.py \
            tests/historical_truth/test_adjustment_replay_admission.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/historical_truth/adjustment_replay_admission_*.py tests/historical_truth/test_adjustment_replay_admission.py
          git commit -m 'Format HTR-010B1 implementation'
          git push origin HEAD:feature/htr-010b1-factor-validation-replay-admission
