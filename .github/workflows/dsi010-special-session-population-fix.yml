name: DSI-010 Special Session Population Validation

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-special-session-population-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Add explicit special-session planning
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("alpha/historical_truth/service.py")
          text = service.read_text(encoding="utf-8")
          text = text.replace(
              "import os\nfrom dataclasses import asdict\n",
              "import os\nfrom collections.abc import Iterable\nfrom dataclasses import asdict\n",
              1,
          )
          marker = '''    @staticmethod
    def _nse_bhavcopy_request(trading_date: date) -> ArchiveRequest:
'''
          addition = '''    def plan_nse_bhavcopies_for_dates(
        self,
        trading_dates: Iterable[date],
    ) -> tuple[ArchiveRequest, ...]:
        """Plan exact governed sessions, including weekend special sessions."""

        return tuple(
            self._nse_bhavcopy_request(trading_date)
            for trading_date in sorted(set(trading_dates))
        )

'''
          if marker not in text:
              raise SystemExit("service planning marker missing")
          if "def plan_nse_bhavcopies_for_dates(" not in text:
              text = text.replace(marker, addition + marker, 1)
          service.write_text(text, encoding="utf-8")

          population = Path("alpha/decision_superiority/pre2016_population.py")
          text = population.read_text(encoding="utf-8")
          text = text.replace(
              '''    end: date,
    retry_failed: bool = True,
) -> Pre2016PopulationResult:
''',
              '''    end: date,
    retry_failed: bool = True,
    special_session_dates: tuple[date, ...] = (),
) -> Pre2016PopulationResult:
''',
              1,
          )
          old = '''    archive = HistoricalTruthWarehouse(root)
    canonical = CanonicalPointInTimeWarehouse(
        root / "warehouse" / "historical_truth.duckdb"
    )
    snapshots = PointInTimeSnapshotEngine(canonical, root / "snapshots")
    engine = HistoricalPopulationEngine(archive, canonical, snapshots)
    requests = archive.plan_nse_bhavcopies(start, end)
    records = engine.populate(requests, retry_failed=retry_failed)
'''
          new = '''    governed_special_sessions = tuple(sorted(set(special_session_dates)))
    if any(
        trading_date < start or trading_date > end
        for trading_date in governed_special_sessions
    ):
        raise Pre2016PopulationError(
            "PRE2016_POPULATION_SPECIAL_SESSION_OUTSIDE_RANGE"
        )

    archive = HistoricalTruthWarehouse(root)
    canonical = CanonicalPointInTimeWarehouse(
        root / "warehouse" / "historical_truth.duckdb"
    )
    snapshots = PointInTimeSnapshotEngine(canonical, root / "snapshots")
    engine = HistoricalPopulationEngine(archive, canonical, snapshots)
    planned = (
        *archive.plan_nse_bhavcopies(start, end),
        *archive.plan_nse_bhavcopies_for_dates(governed_special_sessions),
    )
    requests = tuple(
        sorted(
            {
                (request.exchange, request.dataset, request.trading_date): request
                for request in planned
            }.values(),
            key=lambda request: (
                request.trading_date,
                request.exchange,
                request.dataset.value,
            ),
        )
    )
    records = engine.populate(requests, retry_failed=retry_failed)
'''
          if old not in text:
              raise SystemExit("population planning block missing")
          text = text.replace(old, new, 1)
          population.write_text(text, encoding="utf-8")

          tests = Path("tests/decision_superiority/test_pre2016_population_and_benchmark.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              "from alpha.decision_superiority.pre2016_population import (\n",
              "from alpha.decision_superiority import pre2016_population\n"
              "from alpha.decision_superiority.pre2016_population import (\n",
              1,
          )
          marker = "\n\ndef test_archive_cli_uses_governed_population_not_legacy_ingestion(\n"
          addition = '''

def test_population_includes_governed_weekend_special_session(
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    captured: list[date] = []
    monkeypatch.setattr(
        "alpha.decision_superiority.pre2016_population.shutil.disk_usage",
        lambda _: SimpleNamespace(free=20 * 1024**3),
    )

    def populate(
        self: object,
        requests: tuple[object, ...],
        *,
        retry_failed: bool,
    ) -> tuple[object, ...]:
        del self, retry_failed
        captured.extend(request.trading_date for request in requests)  # type: ignore[attr-defined]
        return ()

    monkeypatch.setattr(
        pre2016_population.HistoricalPopulationEngine,
        "populate",
        populate,
    )
    monkeypatch.setattr(
        pre2016_population.HistoricalPopulationEngine,
        "export",
        lambda self, records, output_dir: (),
    )

    result = populate_pre2016_historical_truth(
        root=tmp_path / "alpha_data",
        output_dir=tmp_path / "artifacts",
        start=date(2013, 1, 1),
        end=date(2013, 12, 31),
        special_session_dates=(date(2013, 11, 3),),
    )

    assert date(2013, 11, 3) in captured
    assert captured.count(date(2013, 11, 3)) == 1
    assert result.planned_requests == len(captured)


def test_population_deduplicates_weekday_special_session(
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    captured: list[date] = []
    monkeypatch.setattr(
        "alpha.decision_superiority.pre2016_population.shutil.disk_usage",
        lambda _: SimpleNamespace(free=20 * 1024**3),
    )

    def populate(
        self: object,
        requests: tuple[object, ...],
        *,
        retry_failed: bool,
    ) -> tuple[object, ...]:
        del self, retry_failed
        captured.extend(request.trading_date for request in requests)  # type: ignore[attr-defined]
        return ()

    monkeypatch.setattr(
        pre2016_population.HistoricalPopulationEngine,
        "populate",
        populate,
    )
    monkeypatch.setattr(
        pre2016_population.HistoricalPopulationEngine,
        "export",
        lambda self, records, output_dir: (),
    )

    populate_pre2016_historical_truth(
        root=tmp_path / "alpha_data",
        output_dir=tmp_path / "artifacts",
        start=date(2011, 10, 26),
        end=date(2011, 10, 26),
        special_session_dates=(date(2011, 10, 26),),
    )

    assert captured == [date(2011, 10, 26)]


def test_population_rejects_special_session_outside_requested_range(
    tmp_path: Path,
) -> None:
    with pytest.raises(
        Pre2016PopulationError,
        match="PRE2016_POPULATION_SPECIAL_SESSION_OUTSIDE_RANGE",
    ):
        populate_pre2016_historical_truth(
            root=tmp_path / "alpha_data",
            output_dir=tmp_path / "artifacts",
            start=date(2013, 1, 1),
            end=date(2013, 12, 31),
            special_session_dates=(date(2014, 1, 1),),
        )
'''
          if marker not in text:
              raise SystemExit("population test insertion marker missing")
          if "test_population_includes_governed_weekend_special_session" not in text:
              text = text.replace(marker, addition + marker, 1)
          tests.write_text(text, encoding="utf-8")
          PY
      - name: Validate explicit special-session population
        run: |
          poetry run ruff check --fix \
            alpha/historical_truth/service.py \
            alpha/decision_superiority/pre2016_population.py \
            tests/decision_superiority/test_pre2016_population_and_benchmark.py
          poetry run ruff format \
            alpha/historical_truth/service.py \
            alpha/decision_superiority/pre2016_population.py \
            tests/decision_superiority/test_pre2016_population_and_benchmark.py
          poetry run ruff check \
            alpha/historical_truth/service.py \
            alpha/decision_superiority/pre2016_population.py \
            tests/decision_superiority/test_pre2016_population_and_benchmark.py
          poetry run mypy \
            alpha/historical_truth/service.py \
            alpha/decision_superiority/pre2016_population.py
          poetry run pytest -q \
            tests/decision_superiority/test_pre2016_population_and_benchmark.py
      - name: Commit validated special-session support
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/historical_truth/service.py \
            alpha/decision_superiority/pre2016_population.py \
            tests/decision_superiority/test_pre2016_population_and_benchmark.py
          if git diff --cached --quiet; then
            echo "Special-session support already canonical"
            exit 0
          fi
          git commit -m "fix(dsi-010): populate governed weekend sessions"
          git pull --rebase origin feature/dsi-010-pre2016-external-era-validation
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
