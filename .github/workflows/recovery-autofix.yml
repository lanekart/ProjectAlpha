name: Recovery Autofix

on:
  push:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recovery-foundation-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.20
      - name: Fix MyPy assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/recovery/test_security_entity.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert row.values["entity_confidence"] > 0.0\n'
          new = (
              '    entity_confidence = row.values["entity_confidence"]\n'
              '    assert isinstance(entity_confidence, float)\n'
              '    assert entity_confidence > 0.0\n'
          )
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check alpha/recovery tests/recovery --fix
          ruff format alpha/recovery tests/recovery
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha/recovery tests/recovery
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix security recovery quality gates"
          git push origin HEAD:feature/recovery-foundation-v1
