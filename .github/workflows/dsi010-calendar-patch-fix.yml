name: DSI-010 Calendar Patch Fix

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-calendar-patch-fix.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-calendar-patch-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
          persist-credentials: true
      - name: Correct bytes normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dsi010-calendar-implementation.yml')
          text = path.read_text(encoding='utf-8')
          old = 'prefix = raw[:2048].lstrip().casefold()'
          new = 'prefix = raw[:2048].lstrip().lower()'
          if old not in text:
              raise SystemExit('bytes casefold patch target missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add .github/workflows/dsi010-calendar-implementation.yml
          git commit -m "fix(dsi-010): normalize HTML bytes safely"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
