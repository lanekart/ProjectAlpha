name: HTR-006 CLI Readiness Fix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-006-replay-readiness-gate

      - name: Install project
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Apply deterministic CLI and fixture changes
        run: |
          python - <<'PY'
          from pathlib import Path

          cli_path = Path("alpha/cli.py")
          cli = cli_path.read_text(encoding="utf-8")

          old = '''    replay_output: Path | None = typer.Option(
'''
          new = '''    historical_truth_snapshots: Path = typer.Option(
        Path("alpha_data/snapshots"),
        "--historical-truth-snapshots",
        help="Historical-truth snapshot root for readiness certification.",
    ),
    replay_output: Path | None = typer.Option(
'''
          if cli.count(old) != 1:
              raise SystemExit("unexpected learning replay_output signature count")
          cli = cli.replace(old, new, 1)

          old = '''    corporate_action_artifact: Path = typer.Option(
        ...,
        "--corporate-action-artifact",
        help="HTR-003 canonical action timeline CSV/JSON artifact.",
    ),
    output: Path = typer.Option(
'''
          new = '''    corporate_action_artifact: Path = typer.Option(
        ...,
        "--corporate-action-artifact",
        help="HTR-003 canonical action timeline CSV/JSON artifact.",
    ),
    historical_truth_snapshots: Path = typer.Option(
        Path("alpha_data/snapshots"),
        "--historical-truth-snapshots",
        help="Historical-truth snapshot root for readiness certification.",
    ),
    output: Path = typer.Option(
'''
          if cli.count(old) != 2:
              raise SystemExit("unexpected replay command signature count")
          cli = cli.replace(old, new)

          old = '''                replay_repository=HistoricalReplayRepository(),
                output=replay_output,
'''
          new = '''                replay_repository=HistoricalReplayRepository(),
                snapshots_path=historical_truth_snapshots,
                output=replay_output,
'''
          if cli.count(old) != 1:
              raise SystemExit("learning replay call not found")
          cli = cli.replace(old, new, 1)

          old = '''            replay_repository=HistoricalReplayRepository(),
            output=output,
'''
          new = '''            replay_repository=HistoricalReplayRepository(),
            snapshots_path=historical_truth_snapshots,
            output=output,
'''
          if cli.count(old) != 1:
              raise SystemExit("replay run call not found")
          cli = cli.replace(old, new, 1)

          old = '''                replay_repository=replay_repository,
                output=output / replay_date.isoformat(),
'''
          new = '''                replay_repository=replay_repository,
                snapshots_path=historical_truth_snapshots,
                output=output / replay_date.isoformat(),
'''
          if cli.count(old) != 1:
              raise SystemExit("replay accumulation call not found")
          cli = cli.replace(old, new, 1)
          cli_path.write_text(cli, encoding="utf-8")

          test_path = Path("tests/historical_replay/test_historical_replay.py")
          test = test_path.read_text(encoding="utf-8")
          old = '''import pandas as pd
from typer.testing import CliRunner
'''
          new = '''import duckdb
import pandas as pd
from typer.testing import CliRunner
'''
          if test.count(old) != 1:
              raise SystemExit("test import block not found")
          test = test.replace(old, new, 1)

          old = '''    _insert_replay_price_history(repo, replay_date=replay_date)
    db.close()
    identity_artifact = tmp_path / "canonical_identities.csv"
'''
          new = '''    _insert_replay_price_history(repo, replay_date=replay_date)
    db.close()
    connection = duckdb.connect(str(db_path))
    try:
        connection.execute(
            "CREATE TABLE daily_candle (trading_date DATE, isin VARCHAR)"
        )
        connection.execute(
            "INSERT INTO daily_candle VALUES "
            "('2026-01-01', 'INE000000001'), "
            "('2026-01-01', 'INE000000002'), "
            "('2026-01-01', 'INE000000003')"
        )
        for table_name, date_column in (
            ("corporate_action", "effective_date"),
            ("security_identity", "valid_from"),
            ("listing_history", "valid_from"),
            ("delisting_history", "effective_date"),
            ("trading_calendar", "trading_date"),
            ("benchmark_history", "trade_date"),
            ("sector_mapping", "valid_from"),
            ("index_constituent", "valid_from"),
        ):
            connection.execute(
                f'CREATE TABLE "{table_name}" ("{date_column}" DATE)'
            )
            connection.execute(
                f'INSERT INTO "{table_name}" VALUES (?)',
                [replay_date],
            )
    finally:
        connection.close()
    snapshots_path = tmp_path / "snapshots"
    snapshots_path.mkdir()
    (snapshots_path / "2026-01-01.json").write_text(
        '{"availability": {}}\n',
        encoding="utf-8",
    )
    identity_artifact = tmp_path / "canonical_identities.csv"
'''
          if test.count(old) != 1:
              raise SystemExit("test database setup block not found")
          test = test.replace(old, new, 1)

          old = '''            "--corporate-action-artifact",
            str(corporate_action_artifact),
            "--output",
'''
          new = '''            "--corporate-action-artifact",
            str(corporate_action_artifact),
            "--historical-truth-snapshots",
            str(snapshots_path),
            "--output",
'''
          if test.count(old) != 1:
              raise SystemExit("test replay arguments not found")
          test = test.replace(old, new, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Format and validate targeted changes
        run: |
          poetry run ruff format alpha/cli.py tests/historical_replay/test_historical_replay.py
          poetry run ruff check alpha/cli.py tests/historical_replay/test_historical_replay.py
          poetry run pytest tests/historical_replay/test_historical_replay.py::test_cli_replay_evidence_feature_and_simulation_commands -q

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha/cli.py tests/historical_replay/test_historical_replay.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Enforce inventory readiness in replay CLI"
          git push origin HEAD:feature/htr-006-replay-readiness-gate

# Registration follow-up activates the pull-request workflow.
