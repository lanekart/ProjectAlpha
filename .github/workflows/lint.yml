name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Apply exact formatting in workspace
        run: |
          ruff check \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/benchmark_replay/__init__.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            alpha/application/benchmark_cli.py \
            tests/benchmark_replay/test_governed_adjusted.py
          ruff format \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/benchmark_replay/__init__.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            alpha/application/benchmark_cli.py \
            tests/benchmark_replay/test_governed_adjusted.py
          ruff format --check \
            alpha/benchmark_replay/governed_adjusted.py \
            alpha/benchmark_replay/__init__.py \
            alpha/application/governed_adjusted_benchmark_cli.py \
            alpha/application/benchmark_cli.py \
            tests/benchmark_replay/test_governed_adjusted.py

      - name: Upload exact formatted B2 files
        uses: actions/upload-artifact@v4
        with:
          name: htr010b2-ruff-formatted
          path: |
            alpha/benchmark_replay/governed_adjusted.py
            alpha/benchmark_replay/__init__.py
            alpha/application/governed_adjusted_benchmark_cli.py
            alpha/application/benchmark_cli.py
            tests/benchmark_replay/test_governed_adjusted.py
          if-no-files-found: error
