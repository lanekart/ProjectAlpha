name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Show Ruff version
        run: ruff --version

      - name: Run Ruff check
        run: |
          set +e
          ruff check . 2>&1 | tee ruff-check.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-check.txt
          if-no-files-found: error

      - name: Run Ruff format check
        run: ruff format --check .

  format-artifact-pr33:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 33
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format B1C files
        run: |
          pip install ruff==0.15.20
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_residual_attribution.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            tests/historical_truth/test_adjustment_replay_admission_b1c.py
          tar -czf htr010b1c-formatted.tar.gz \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_residual_attribution.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            tests/historical_truth/test_adjustment_replay_admission_b1c.py
      - uses: actions/upload-artifact@v4
        with:
          name: htr010b1c-formatted
          path: htr010b1c-formatted.tar.gz
