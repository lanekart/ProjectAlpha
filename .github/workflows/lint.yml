name: Lint

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Show Ruff version
        run: ruff --version

      - name: Run Ruff check
        run: |
          set +e
          ruff check . 2>&1 | tee ruff-check.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-check.txt
          if-no-files-found: error

      - name: Run Ruff format check
        run: ruff format --check .

  format-pr33:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 33 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Format and commit PR33
        run: |
          pip install ruff==0.15.20
          ruff check \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_residual_attribution.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            tests/historical_truth/test_adjustment_replay_admission_b1c.py \
            --fix || true
          ruff format \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_residual_attribution.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            tests/historical_truth/test_adjustment_replay_admission_b1c.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/historical_truth/adjustment_replay_admission_cli.py \
            alpha/historical_truth/adjustment_replay_admission_exports.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_residual_attribution.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            tests/historical_truth/test_adjustment_replay_admission_b1c.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format HTR-010B1C implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
