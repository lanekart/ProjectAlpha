name: Lint

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  ruff:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'Apply exact locked Ruff normalization'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b1-final-governed-adjusted-replay-closure
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Apply locked normalization
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .

      - name: Restore normal lint workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('.github/workflows/lint.yml').write_text('''name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Show Ruff version
        run: ruff --version

      - name: Run Ruff check
        run: |
          set +e
          ruff check . 2>&1 | tee ruff-check.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-check.txt
          if-no-files-found: error

      - name: Run Ruff format check
        run: ruff format --check .
