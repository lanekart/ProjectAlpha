name: Lint

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Show Ruff version
        run: ruff --version

      - name: Run Ruff check
        run: |
          set +e
          ruff check . 2>&1 | tee ruff-check.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-check.txt
          if-no-files-found: error

      - name: Run Ruff format check
        run: ruff format --check .

  format-pr34:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 34 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply verified source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'alpha/historical_truth/session_calendar_extension.py'
          )
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    CalendarCertificationState,\n',
              '',
              1,
          )
          text = text.replace(
              '            raise ValueError(f"governed calendar source checksum mismatch: {source_path}")\n',
              '            raise ValueError(\n'
              '                f"governed calendar source checksum mismatch: {source_path}"\n'
              '            )\n',
              1,
          )
          text = text.replace(
              '            f"- Existing window: {audit.existing_window_start} to {audit.existing_window_end}",\n',
              '            (\n'
              '                f"- Existing window: {audit.existing_window_start} "\n'
              '                f"to {audit.existing_window_end}"\n'
              '            ),\n',
              1,
          )
          text = text.replace(
              '            f"- Unconfirmed special sessions: {audit.unconfirmed_special_session_count}",\n',
              '            (\n'
              '                "- Unconfirmed special sessions: "\n'
              '                f"{audit.unconfirmed_special_session_count}"\n'
              '            ),\n',
              1,
          )
          text = text.replace(
              '            "Existing governed sources remain immutable; the new source is appended and year-scoped.",\n',
              '            (\n'
              '                "Existing governed sources remain immutable; "\n'
              '                "the new source is appended and year-scoped."\n'
              '            ),\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format and commit PR34
        run: |
          pip install ruff==0.15.20
          ruff check \
            alpha/__main__.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            alpha/historical_truth/session_calendar_extension.py \
            alpha/historical_truth/session_calendar_extension_cli.py \
            tests/historical_truth/test_session_calendar_extension.py \
            --fix
          ruff format \
            alpha/__main__.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            alpha/historical_truth/session_calendar_extension.py \
            alpha/historical_truth/session_calendar_extension_cli.py \
            tests/historical_truth/test_session_calendar_extension.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/__main__.py \
            alpha/historical_truth/adjustment_replay_admission_integrity_engine.py \
            alpha/historical_truth/adjustment_replay_admission_session_coverage.py \
            alpha/historical_truth/session_calendar_extension.py \
            alpha/historical_truth/session_calendar_extension_cli.py \
            tests/historical_truth/test_session_calendar_extension.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format HTR-007C implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
