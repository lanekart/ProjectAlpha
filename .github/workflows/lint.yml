name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Show Ruff version
        run: ruff --version

      - name: Produce exact import fix
        run: ruff check tests/historical_truth/test_b1_shadow_replay.py --fix

      - name: Upload corrected regression
        uses: actions/upload-artifact@v4
        with:
          name: ruff-autofixed-shadow-replay-test
          path: tests/historical_truth/test_b1_shadow_replay.py
          if-no-files-found: error

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .
