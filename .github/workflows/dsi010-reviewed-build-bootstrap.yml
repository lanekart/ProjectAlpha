name: DSI-010 Reviewed Build Bootstrap

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-reviewed-build-bootstrap.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-reviewed-build-bootstrap.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Repair and validate reviewed-source builder
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_dsi010_pre2011_reviewed_sources.py")
          text = path.read_text(encoding="utf-8")
          directive = "# ruff: noqa: E501\n"
          if not text.startswith(directive):
              text = directive + text
          old = '''        source_paths.append(source_path)
          manifest_rows.append(
              {
                  "year": year,
                  "source_id": source_id,
                  "source_path": str(source_path),
                  "source_json_sha256": _sha256(source_path),
                  "source_document_sha256": payload["source_document_sha256"],
                  "review_csv_sha256": payload["review_csv_sha256"],
                  "holiday_count": len(payload["holidays"]),
                  "special_session_count": len(payload["special_sessions"]),
                  "segment_scope": payload["segment_scope"],
              }
          )
'''
          new = '''        holidays = payload.get("holidays")
          special_sessions = payload.get("special_sessions")
          if not isinstance(holidays, list):
              raise RuntimeError(f"SOURCE_HOLIDAYS_INVALID:{source_id}")
          if not isinstance(special_sessions, list):
              raise RuntimeError(f"SOURCE_SPECIAL_SESSIONS_INVALID:{source_id}")
          source_paths.append(source_path)
          manifest_rows.append(
              {
                  "year": year,
                  "source_id": source_id,
                  "source_path": str(source_path),
                  "source_json_sha256": _sha256(source_path),
                  "source_document_sha256": payload["source_document_sha256"],
                  "review_csv_sha256": payload["review_csv_sha256"],
                  "holiday_count": len(holidays),
                  "special_session_count": len(special_sessions),
                  "segment_scope": payload["segment_scope"],
              }
          )
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "SOURCE_HOLIDAYS_INVALID" not in text:
              raise SystemExit("reviewed source payload patch target missing")
          path.write_text(text, encoding="utf-8")
          PY
          poetry run ruff check --fix scripts/build_dsi010_pre2011_reviewed_sources.py
          poetry run ruff format scripts/build_dsi010_pre2011_reviewed_sources.py
          poetry run ruff check scripts/build_dsi010_pre2011_reviewed_sources.py
          poetry run mypy scripts/build_dsi010_pre2011_reviewed_sources.py
      - name: Recover official documents
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          poetry run python -m alpha benchmark \
            decision-superiority-pre2011-calendar-source-recovery \
            --candidate-registry config/dsi010_pre2011_official_calendar_candidates.json \
            --output artifacts/dsi010_pre2011_official_sources \
            --timeout-seconds 45 \
            | tee artifacts/dsi010_pre2011_official_sources_console.log
      - name: Build reviewed sources
        run: |
          poetry run python scripts/build_dsi010_pre2011_reviewed_sources.py \
            --recovery-root artifacts/dsi010_pre2011_official_sources \
            --output-root artifacts/dsi010_pre2011_reviewed_sources \
            | tee artifacts/dsi010_pre2011_reviewed_sources_console.log
      - name: Validate counts and audit preflight
        run: |
          poetry run python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from alpha.decision_superiority.pre2016_calendar_sources import (
              validate_hash_bound_official_calendar_source,
          )

          root = Path("artifacts/dsi010_pre2011_reviewed_sources")
          sources = sorted((root / "sources").glob("*.json"))
          years: set[int] = set()
          holidays = 0
          specials = 0
          if len(sources) != 15:
              raise SystemExit(f"EXPECTED_15_SOURCES_FOUND_{len(sources)}")
          for path in sources:
              payload = validate_hash_bound_official_calendar_source(
                  path,
                  require_capital_market_scope=True,
              )
              covered = payload.get("covered_years")
              holiday_rows = payload.get("holidays")
              special_rows = payload.get("special_sessions")
              if not isinstance(covered, list):
                  raise SystemExit("COVERED_YEARS_INVALID")
              if not isinstance(holiday_rows, list):
                  raise SystemExit("HOLIDAYS_INVALID")
              if not isinstance(special_rows, list):
                  raise SystemExit("SPECIAL_SESSIONS_INVALID")
              years.update(int(year) for year in covered)
              holidays += len(holiday_rows)
              specials += len(special_rows)
          if years != set(range(2005, 2011)):
              raise SystemExit(f"COVERED_YEAR_MISMATCH:{sorted(years)}")
          if holidays != 120 or specials != 6:
              raise SystemExit(f"ROW_COUNT_MISMATCH:holidays={holidays}:specials={specials}")

          database = Path("alpha_data/warehouse/historical_truth.duckdb")
          manifest = Path("alpha_data/manifests/archive_manifest.jsonl")
          later_sources = sorted(
              path
              for path in Path(".").rglob("*.json")
              if path.is_file()
              and "calendar" in path.name.casefold()
              and any(str(year) in path.name for year in range(2011, 2016))
          )
          blockers: list[str] = []
          if not database.is_file():
              blockers.append("GOVERNED_DATABASE_UNAVAILABLE")
          if not manifest.is_file():
              blockers.append("GOVERNED_MANIFEST_UNAVAILABLE")
          if not later_sources:
              blockers.append("REVIEWED_2011_2015_SOURCES_UNAVAILABLE")
          preflight = {
              "reviewed_2005_2010_source_count": len(sources),
              "reviewed_2005_2010_covered_years": sorted(years),
              "reviewed_holiday_row_count": holidays,
              "reviewed_special_session_row_count": specials,
              "database_available": database.is_file(),
              "manifest_available": manifest.is_file(),
              "committed_2011_2015_source_candidates": [str(path) for path in later_sources],
              "full_2005_2015_audit_performed": False,
              "full_audit_blockers": blockers,
              "calendar_certification_permitted": False,
              "production_influence": False,
          }
          (root / "full_audit_preflight.json").write_text(
              json.dumps(preflight, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("===== DSI-010 REVIEWED SOURCE ACCEPTANCE =====")
          print(f"Reviewed Sources: {len(sources)}")
          print(f"Covered Years: {','.join(str(year) for year in sorted(years))}")
          print(f"Reviewed Holiday Rows: {holidays}")
          print(f"Reviewed Special Sessions: {specials}")
          print(f"Full Audit Blockers: {','.join(blockers) or 'NONE'}")
          print("Calendar Certification Permitted: false")
          print("Production Influence: false")
          PY
      - name: Commit validated builder
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add scripts/build_dsi010_pre2011_reviewed_sources.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(dsi-010): validate reviewed source payload types"
            git pull --rebase origin feature/dsi-010-pre2016-external-era-validation
            git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi010-pre2011-reviewed-calendar-sources
          path: |
            artifacts/dsi010_pre2011_official_sources
            artifacts/dsi010_pre2011_official_sources_console.log
            artifacts/dsi010_pre2011_reviewed_sources
            artifacts/dsi010_pre2011_reviewed_sources_console.log
            config/dsi010_pre2011_official_calendar_candidates.json
          if-no-files-found: error
          retention-days: 14
