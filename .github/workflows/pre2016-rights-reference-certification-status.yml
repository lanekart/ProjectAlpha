name: Pre-2016 Rights Reference Certification Status

on:
  pull_request:
    paths:
      - .github/workflows/pre2016-rights-reference-certification-status.yml

permissions:
  actions: read
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate reference certification run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          branch='feature/dsi-010-pre2016-external-era-validation'
          workflow='pre2016-rights-reference-certification.yml'
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/{workflow}/runs?branch={urllib.parse.quote(branch,safe='')}&per_page=5"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as response: data=json.load(response)
          runs=data.get('workflow_runs',[])
          if not runs: raise SystemExit('RIGHTS_REFERENCE_CERTIFICATION_RUN_NOT_FOUND')
          run=runs[0]
          for key in ('id','status','conclusion','head_sha','run_number','jobs_url'):
              print(f'{key}: {run.get(key)}')
          PY
