name: Historical Truth Quality

on:
  push:
    branches:
      - main
      - feature/historical-truth-warehouse-v1
    paths:
      - "alpha/__main__.py"
      - "alpha/application/historical_truth_cli.py"
      - "alpha/historical_truth/**"
      - "tests/historical_truth/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/historical-truth-quality.yml"

  pull_request:
    branches:
      - main
    paths:
      - "alpha/__main__.py"
      - "alpha/application/historical_truth_cli.py"
      - "alpha/historical_truth/**"
      - "tests/historical_truth/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/historical-truth-quality.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-truth-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, MyPy, PyTest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      - name: Ruff lint
        run: |
          poetry run ruff check \
            alpha/__main__.py \
            alpha/application/historical_truth_cli.py \
            alpha/historical_truth \
            tests/historical_truth

      - name: Ruff format
        run: |
          poetry run ruff format --check \
            alpha/__main__.py \
            alpha/application/historical_truth_cli.py \
            alpha/historical_truth \
            tests/historical_truth

      - name: MyPy
        run: |
          poetry run mypy \
            alpha/__main__.py \
            alpha/application/historical_truth_cli.py \
            alpha/historical_truth

      - name: PyTest
        run: |
          poetry run pytest tests/historical_truth -q
