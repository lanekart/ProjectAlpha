name: DSI-010 B1D2 Validation Repair

on:
  pull_request:
    paths: [.github/workflows/dsi010-b1d2.yml]

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry && poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30342376778
          name: dsi010-b1d1-bridge-audit
          path: inputs
      - name: Restore B1D1 evidence
        run: |
          set -euo pipefail
          source=$(find inputs -type d -path '*/artifacts/htr010b1d1_cross_series_identity_bridge' | head -1)
          test -d "$source"
          mkdir -p artifacts/dsi010_b1d2
          rm -rf artifacts/htr010b1d1_cross_series_identity_bridge artifacts/htr010b1d2_bridge_aware_validation_repair
          cp -a "$source" artifacts/htr010b1d1_cross_series_identity_bridge
      - name: Run B1D2
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run python -m alpha historical-truth bridge-aware-factor-validation-repair \
            --htr010b1d1-output artifacts/htr010b1d1_cross_series_identity_bridge \
            --start 2005-01-01 --end 2015-12-31 \
            --output artifacts/htr010b1d2_bridge_aware_validation_repair \
            2>&1 | tee artifacts/dsi010_b1d2/run.log
      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          poetry run python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('artifacts/htr010b1d2_bridge_aware_validation_repair/htr010b1d2_validation_repair.json')
          report=json.loads(path.read_text()) if path.is_file() else {}
          keys=('case_count','disposition_counts','proposed_validation_outcome_counts','same_session_group_count','composite_confirmed_group_count','factor_confirmed_case_count','factor_unconfirmed_case_count','replay_bridge_certified_case_count','replay_bridge_uncertified_case_count','implementation_defect_should_remain_count','report_sha256')
          summary={key:report.get(key) for key in keys}
          summary['outcome']=os.environ.get('OUTCOME')
          summary['production_influence']=False
          target=Path('artifacts/dsi010_b1d2/summary.json')
          target.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi010-b1d2-validation-repair
          path: |
            artifacts/dsi010_b1d2
            artifacts/htr010b1d2_bridge_aware_validation_repair
            artifacts/htr010b1d1_cross_series_identity_bridge
          retention-days: 14
      - name: Enforce
        if: always()
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          test "$OUTCOME" = success
          test -f artifacts/htr010b1d2_bridge_aware_validation_repair/htr010b1d2_validation_repair.json
          echo PRODUCTION_INFLUENCE=false
