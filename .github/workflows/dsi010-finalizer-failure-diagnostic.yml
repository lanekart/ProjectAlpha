name: DSI-010 Finalizer Failure Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-finalizer-failure-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print finalizer extraction failure tail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90114574321"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== FAILURE MATCHES ====="
          grep -nE \
            'Traceback|Error|ERROR|MISSING|UNSAFE|SHARD|PILOT|FileNotFound|RuntimeError|Exception' \
            /tmp/job.log | tail -120 || true
          echo "===== FINAL 220 LINES ====="
          tail -220 /tmp/job.log
