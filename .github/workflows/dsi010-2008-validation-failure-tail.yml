name: DSI-010 2008 Validation Failure Tail

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-2008-validation-failure-tail.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print repaired validation failure tail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90129349060"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== VALIDATION ERRORS ====="
          grep -nE \
            'error:|ERROR|FAILED|Failure|Traceback|AssertionError|TypeError|AttributeError|E[0-9]{3}|F[0-9]{3}|mypy|pytest|FAILURES|short test summary' \
            /tmp/job.log | tail -200 || true
          echo "===== FINAL 280 LINES ====="
          tail -280 /tmp/job.log
