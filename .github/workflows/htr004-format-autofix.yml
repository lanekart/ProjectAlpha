name: HTR-004 Format Autofix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-004-canonical-replay

      - name: Install locked Ruff
        run: pip install ruff==0.15.20

      - name: Format HTR-004 scope
        run: |
          ruff format \
            alpha/recovery \
            alpha/application/governed_replay_backtest.py \
            alpha/application/__init__.py \
            tests/recovery \
            tests/application/test_governed_replay_backtest.py
          ruff check .
          ruff format --check .

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/recovery \
            alpha/application/governed_replay_backtest.py \
            alpha/application/__init__.py \
            tests/recovery \
            tests/application/test_governed_replay_backtest.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format HTR-004 implementation"
          git push origin HEAD:feature/htr-004-canonical-replay
