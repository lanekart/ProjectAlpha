name: DSI-010 Corrected Full Population Calendar Audit

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-full-population-calendar-audit-v2.yml

permissions:
  actions: read
  contents: read

jobs:
  populate:
    name: Populate ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Populate governed year shard
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -o pipefail
          mkdir -p "work/shard-${YEAR}" "artifacts/shard-${YEAR}"
          poetry run python - <<'PY' 2>&1 | tee "artifacts/shard-${YEAR}/console-${YEAR}.log"
          from __future__ import annotations

          import json
          import os
          import shutil
          from dataclasses import asdict
          from datetime import date
          from pathlib import Path

          from alpha.decision_superiority.pre2016_population import (
              populate_pre2016_historical_truth,
          )

          year = int(os.environ["YEAR"])
          special_payload = json.loads(
              Path("config/dsi010_2005_2015_special_sessions.json").read_text(
                  encoding="utf-8"
              )
          )
          if special_payload.get("production_influence") is not False:
              raise SystemExit("SPECIAL_SESSION_CONFIG_PRODUCTION_INFLUENCE_INVALID")
          if special_payload.get(
              "classification_inferred_from_archive_status"
          ) is not False:
              raise SystemExit("SPECIAL_SESSION_ARCHIVE_INFERENCE_INVALID")
          if special_payload.get(
              "classification_inferred_from_observed_candles"
          ) is not False:
              raise SystemExit("SPECIAL_SESSION_CANDLE_INFERENCE_INVALID")
          special_dates = tuple(
              date.fromisoformat(str(row["trading_date"]))
              for row in special_payload["special_sessions"]
              if str(row["trading_date"]).startswith(f"{year}-")
          )
          root = Path(f"work/shard-{year}/alpha_data")
          output = Path(f"artifacts/shard-{year}/population")
          result = populate_pre2016_historical_truth(
              root=root,
              output_dir=output,
              start=date(year, 1, 1),
              end=date(year, 12, 31),
              retry_failed=True,
              special_session_dates=special_dates,
          )
          if result.failed:
              raise SystemExit(f"YEAR_SHARD_FAILED_RECORDS:{year}:{result.failed}")
          if result.candle_snapshots == 0:
              raise SystemExit(f"YEAR_SHARD_HAS_NO_CANDLES:{year}")

          payload = asdict(result)
          payload["requested_start"] = result.requested_start.isoformat()
          payload["requested_end"] = result.requested_end.isoformat()
          payload["database"] = str(result.database)
          payload["snapshot_root"] = str(result.snapshot_root)
          payload["artifact_paths"] = [str(path) for path in result.artifact_paths]
          payload["covered_year"] = year
          payload["special_session_dates"] = [
              item.isoformat() for item in special_dates
          ]
          payload["diagnostic_year_shard"] = True
          payload["production_influence"] = False
          Path(f"artifacts/shard-{year}/shard_summary-{year}.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          staging = root / "staging"
          staging_bytes = (
              sum(path.stat().st_size for path in staging.rglob("*") if path.is_file())
              if staging.exists()
              else 0
          )
          Path(f"artifacts/shard-{year}/staging_bytes-{year}.txt").write_text(
              f"{staging_bytes}\n",
              encoding="utf-8",
          )
          shutil.rmtree(staging, ignore_errors=True)
          print("===== DSI-010 GOVERNED YEAR SHARD =====")
          print(f"Year: {year}")
          print(f"Planned Requests: {result.planned_requests}")
          print(f"Candle Snapshots: {result.candle_snapshots}")
          print(f"Unavailable: {result.unavailable}")
          print(f"Failed: {result.failed}")
          print(f"Ingested Rows: {result.ingested_rows}")
          print(f"Special Sessions Requested: {len(special_dates)}")
          print("PRODUCTION_INFLUENCE=false")
          PY
          tar -czf "artifacts/shard-${YEAR}/alpha_data-${YEAR}.tar.gz" \
            -C "work/shard-${YEAR}" alpha_data
      - name: Upload governed year shard
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-corrected-population-shard-${{ matrix.year }}
          path: artifacts/shard-${{ matrix.year }}
          if-no-files-found: error
          retention-days: 14

  merge-and-audit:
    name: Merge and audit 2005-2015
    needs: populate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Download corrected 2006-2015 shards
        uses: actions/download-artifact@v4
        with:
          pattern: dsi010-corrected-population-shard-*
          path: downloads
          merge-multiple: true
      - name: Download validated 2005 pilot shard
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30299181789
          name: dsi010-2005-population-pilot
          path: pilot-download
      - name: Extract and validate governed shards
        run: |
          set -euo pipefail
          if [ ! -f pilot-download/alpha_data/warehouse/historical_truth.duckdb ]; then
            echo "PILOT_2005_DATABASE_MISSING" >&2
            exit 1
          fi
          if [ ! -f pilot-download/alpha_data/manifests/archive_manifest.jsonl ]; then
            echo "PILOT_2005_MANIFEST_MISSING" >&2
            exit 1
          fi
          mkdir -p work/shards/2005
          cp -a pilot-download/alpha_data work/shards/2005/alpha_data
          count=1
          for archive in downloads/alpha_data-*.tar.gz; do
            if [ ! -f "$archive" ]; then
              continue
            fi
            year=$(basename "$archive" | sed -E 's/alpha_data-([0-9]{4})\.tar\.gz/\1/')
            summary="downloads/shard_summary-${year}.json"
            if [ ! -f "$summary" ]; then
              echo "SHARD_SUMMARY_MISSING_${year}" >&2
              exit 1
            fi
            observed_year=$(python - "$summary" <<'PY'
          import json
          import sys
          from pathlib import Path

          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["covered_year"])
          PY
            )
            if [ "$observed_year" != "$year" ]; then
              echo "SHARD_YEAR_IDENTITY_MISMATCH_${year}_${observed_year}" >&2
              exit 1
            fi
            mkdir -p "work/shards/${year}"
            tar -xzf "$archive" -C "work/shards/${year}"
            count=$((count + 1))
          done
          if [ "$count" -ne 11 ]; then
            echo "EXPECTED_11_TOTAL_SHARDS_FOUND_${count}" >&2
            exit 1
          fi
      - name: Validate merge and audit implementation
        run: |
          poetry run ruff check \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py
          poetry run pytest -q tests/decision_superiority/test_pre2016_population_merge.py
      - name: Merge governed Historical Truth shards
        run: |
          set -o pipefail
          poetry run python - <<'PY' 2>&1 | tee /tmp/dsi010-corrected-merge.log
          from pathlib import Path

          from alpha.decision_superiority.pre2016_population_merge import (
              merge_pre2016_population_shards,
          )

          years = tuple(range(2005, 2016))
          result = merge_pre2016_population_shards(
              shard_roots=tuple(
                  Path(f"work/shards/{year}/alpha_data") for year in years
              ),
              output_root=Path("artifacts/dsi010_merged_historical_truth"),
              expected_years=years,
          )
          print("===== DSI-010 GOVERNED POPULATION MERGE =====")
          print(f"Covered Years: {','.join(str(year) for year in result.covered_years)}")
          print(f"Shard Count: {result.shard_count}")
          print(f"Manifest Records: {result.manifest_records}")
          print(f"Daily Candle Rows: {result.daily_candle_rows}")
          print(f"Observed Sessions: {result.observed_sessions}")
          print(f"Raw Files: {result.raw_files}")
          print(f"Snapshot Files: {result.snapshot_files}")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - name: Recover and build all official calendar sources
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          set -euo pipefail
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_pre2011_official_calendar_candidates.json \
            --output artifacts/dsi010_pre2011_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_pre2011_reviewed_sources.py \
            --recovery-root artifacts/dsi010_pre2011_official_sources \
            --output-root artifacts/dsi010_pre2011_reviewed_sources
          poetry run python - <<'PY'
          from pathlib import Path

          import requests

          url = "https://nsearchives.nseindia.com/content/press/27072005.pdf"
          response = requests.get(
              url,
              headers={"User-Agent": "ProjectAlpha-HistoricalTruth/1.0"},
              timeout=45,
          )
          response.raise_for_status()
          output = Path("artifacts/dsi010_2005_emergency_holiday_source")
          output.mkdir(parents=True, exist_ok=True)
          (output / "nse_press_27072005.pdf").write_bytes(response.content)
          PY
          poetry run python scripts/build_dsi010_2005_emergency_holiday_source.py \
            --source-document \
            artifacts/dsi010_2005_emergency_holiday_source/nse_press_27072005.pdf \
            --output-root artifacts/dsi010_2005_emergency_holiday_source
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_2011_2015_official_calendar_candidates.json \
            --output artifacts/dsi010_2011_2015_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_2011_2015_reviewed_sources.py \
            --recovery-root artifacts/dsi010_2011_2015_official_sources \
            --output-root artifacts/dsi010_2011_2015_reviewed_sources
      - name: Run corrected full governed calendar audit
        run: |
          set -o pipefail
          poetry run python scripts/run_dsi010_full_calendar_audit.py \
            --merged-root artifacts/dsi010_merged_historical_truth \
            --early-root artifacts/dsi010_pre2011_reviewed_sources \
            --later-root artifacts/dsi010_2011_2015_reviewed_sources \
            --emergency-source \
            artifacts/dsi010_2005_emergency_holiday_source/nse_2005_emergency_holiday.json \
            --special-config config/dsi010_2005_2015_special_sessions.json \
            --audit-root artifacts/dsi010_2005_2015_full_calendar_audit \
            --source-population-run-id ${{ github.run_id }} \
            2>&1 | tee /tmp/dsi010-corrected-full-calendar-audit.log
      - name: Upload corrected merged store and full audit
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-corrected-full-2005-2015-governed-calendar-audit
          path: |
            /tmp/dsi010-corrected-merge.log
            /tmp/dsi010-corrected-full-calendar-audit.log
            artifacts/dsi010_merged_historical_truth
            artifacts/dsi010_2005_2015_full_calendar_audit
            artifacts/dsi010_pre2011_official_sources
            artifacts/dsi010_pre2011_reviewed_sources
            artifacts/dsi010_2005_emergency_holiday_source
            artifacts/dsi010_2011_2015_official_sources
            artifacts/dsi010_2011_2015_reviewed_sources
            config/dsi010_2005_2015_special_sessions.json
          if-no-files-found: error
          retention-days: 14
