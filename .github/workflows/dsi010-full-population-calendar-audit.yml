name: DSI-010 Full Population Calendar Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-full-population-calendar-audit.yml

permissions:
  contents: read

jobs:
  populate:
    name: Populate ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Populate governed year shard
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -o pipefail
          mkdir -p "work/shard-${YEAR}" "artifacts/shard-${YEAR}"
          poetry run python - <<'PY' 2>&1 | tee "artifacts/shard-${YEAR}/console.log"
          from __future__ import annotations

          import json
          import os
          import shutil
          from dataclasses import asdict
          from datetime import date
          from pathlib import Path

          from alpha.decision_superiority.pre2016_population import (
              populate_pre2016_historical_truth,
          )

          year = int(os.environ["YEAR"])
          special_payload = json.loads(
              Path("config/dsi010_2005_2015_special_sessions.json").read_text(
                  encoding="utf-8"
              )
          )
          special_dates = tuple(
              date.fromisoformat(str(row["trading_date"]))
              for row in special_payload["special_sessions"]
              if str(row["trading_date"]).startswith(f"{year}-")
          )
          root = Path(f"work/shard-{year}/alpha_data")
          output = Path(f"artifacts/shard-{year}/population")
          result = populate_pre2016_historical_truth(
              root=root,
              output_dir=output,
              start=date(year, 1, 1),
              end=date(year, 12, 31),
              retry_failed=True,
              special_session_dates=special_dates,
          )
          if result.failed:
              raise SystemExit(f"YEAR_SHARD_FAILED_RECORDS:{year}:{result.failed}")
          if result.candle_snapshots == 0:
              raise SystemExit(f"YEAR_SHARD_HAS_NO_CANDLES:{year}")

          payload = asdict(result)
          payload["database"] = str(result.database)
          payload["snapshot_root"] = str(result.snapshot_root)
          payload["artifact_paths"] = [str(path) for path in result.artifact_paths]
          payload["covered_year"] = year
          payload["special_session_dates"] = [
              item.isoformat() for item in special_dates
          ]
          payload["diagnostic_year_shard"] = True
          payload["production_influence"] = False
          Path(f"artifacts/shard-{year}/shard_summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          staging = root / "staging"
          staging_bytes = (
              sum(path.stat().st_size for path in staging.rglob("*") if path.is_file())
              if staging.exists()
              else 0
          )
          Path(f"artifacts/shard-{year}/staging_bytes.txt").write_text(
              f"{staging_bytes}\n",
              encoding="utf-8",
          )
          shutil.rmtree(staging, ignore_errors=True)
          print("===== DSI-010 GOVERNED YEAR SHARD =====")
          print(f"Year: {year}")
          print(f"Planned Requests: {result.planned_requests}")
          print(f"Candle Snapshots: {result.candle_snapshots}")
          print(f"Unavailable: {result.unavailable}")
          print(f"Failed: {result.failed}")
          print(f"Ingested Rows: {result.ingested_rows}")
          print(f"Special Sessions Requested: {len(special_dates)}")
          print("PRODUCTION_INFLUENCE=false")
          PY
          tar -czf "artifacts/shard-${YEAR}/alpha_data.tar.gz" \
            -C "work/shard-${YEAR}" alpha_data
      - name: Upload governed year shard
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-population-shard-${{ matrix.year }}
          path: artifacts/shard-${{ matrix.year }}
          if-no-files-found: error
          retention-days: 14

  merge-and-audit:
    name: Merge and audit 2005-2015
    needs: populate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Download all governed year shards
        uses: actions/download-artifact@v4
        with:
          pattern: dsi010-population-shard-*
          path: downloads
          merge-multiple: true
      - name: Extract governed year shards
        run: |
          set -euo pipefail
          mkdir -p work/shards
          count=0
          for archive in downloads/alpha_data.tar.gz downloads/*/alpha_data.tar.gz; do
            if [ ! -f "$archive" ]; then
              continue
            fi
            year=$(python - "$archive" <<'PY'
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          candidates = list(archive.parent.glob("shard_summary.json"))
          if not candidates:
              raise SystemExit("SHARD_SUMMARY_MISSING")
          print(json.loads(candidates[0].read_text(encoding="utf-8"))["covered_year"])
          PY
            )
            mkdir -p "work/shards/${year}"
            tar -xzf "$archive" -C "work/shards/${year}"
            count=$((count + 1))
          done
          if [ "$count" -ne 11 ]; then
            echo "EXPECTED_11_SHARD_ARCHIVES_FOUND_${count}" >&2
            exit 1
          fi
      - name: Validate merge implementation
        run: |
          poetry run ruff check \
            alpha/decision_superiority/pre2016_population_merge.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_population_merge.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run mypy alpha/decision_superiority/pre2016_population_merge.py
          poetry run pytest -q tests/decision_superiority/test_pre2016_population_merge.py
      - name: Merge governed Historical Truth shards
        run: |
          set -o pipefail
          poetry run python - <<'PY' 2>&1 | tee /tmp/dsi010-merge.log
          from pathlib import Path

          from alpha.decision_superiority.pre2016_population_merge import (
              merge_pre2016_population_shards,
          )

          years = tuple(range(2005, 2016))
          result = merge_pre2016_population_shards(
              shard_roots=tuple(
                  Path(f"work/shards/{year}/alpha_data") for year in years
              ),
              output_root=Path("artifacts/dsi010_merged_historical_truth"),
              expected_years=years,
          )
          print("===== DSI-010 GOVERNED POPULATION MERGE =====")
          print(f"Covered Years: {','.join(str(year) for year in result.covered_years)}")
          print(f"Shard Count: {result.shard_count}")
          print(f"Manifest Records: {result.manifest_records}")
          print(f"Daily Candle Rows: {result.daily_candle_rows}")
          print(f"Observed Sessions: {result.observed_sessions}")
          print(f"Raw Files: {result.raw_files}")
          print(f"Snapshot Files: {result.snapshot_files}")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - name: Recover and build all official calendar sources
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          set -euo pipefail
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_pre2011_official_calendar_candidates.json \
            --output artifacts/dsi010_pre2011_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_pre2011_reviewed_sources.py \
            --recovery-root artifacts/dsi010_pre2011_official_sources \
            --output-root artifacts/dsi010_pre2011_reviewed_sources
          poetry run python - <<'PY'
          from pathlib import Path

          import requests

          url = "https://nsearchives.nseindia.com/content/press/27072005.pdf"
          response = requests.get(
              url,
              headers={"User-Agent": "ProjectAlpha-HistoricalTruth/1.0"},
              timeout=45,
          )
          response.raise_for_status()
          output = Path("artifacts/dsi010_2005_emergency_holiday_source")
          output.mkdir(parents=True, exist_ok=True)
          (output / "nse_press_27072005.pdf").write_bytes(response.content)
          PY
          poetry run python scripts/build_dsi010_2005_emergency_holiday_source.py \
            --source-document \
            artifacts/dsi010_2005_emergency_holiday_source/nse_press_27072005.pdf \
            --output-root artifacts/dsi010_2005_emergency_holiday_source
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_2011_2015_official_calendar_candidates.json \
            --output artifacts/dsi010_2011_2015_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_2011_2015_reviewed_sources.py \
            --recovery-root artifacts/dsi010_2011_2015_official_sources \
            --output-root artifacts/dsi010_2011_2015_reviewed_sources
      - name: Run full governed calendar audit
        run: |
          set -o pipefail
          poetry run python - <<'PY' 2>&1 | tee /tmp/dsi010-full-calendar-audit.log
          from __future__ import annotations

          import csv
          import hashlib
          import json
          from dataclasses import asdict
          from pathlib import Path

          from alpha.historical_truth.canonical import CanonicalPointInTimeWarehouse
          from alpha.historical_truth.session_calendar import (
              CalendarCertificationState,
              OfficialSessionCalendarEngine,
          )

          merged_root = Path("artifacts/dsi010_merged_historical_truth")
          database = merged_root / "warehouse" / "historical_truth.duckdb"
          manifest = merged_root / "manifests" / "archive_manifest.jsonl"
          audit_root = Path("artifacts/dsi010_2005_2015_full_calendar_audit")
          audit_root.mkdir(parents=True, exist_ok=True)

          early_sources = sorted(
              Path("artifacts/dsi010_pre2011_reviewed_sources/sources").glob(
                  "*.json"
              )
          )
          later_sources = sorted(
              Path("artifacts/dsi010_2011_2015_reviewed_sources/sources").glob(
                  "*.json"
              )
          )
          emergency_source = Path(
              "artifacts/dsi010_2005_emergency_holiday_source/"
              "nse_2005_emergency_holiday.json"
          )
          source_paths = (*early_sources, *later_sources, emergency_source)
          if len(source_paths) != 29:
              raise SystemExit(f"EXPECTED_29_CALENDAR_SOURCES_FOUND_{len(source_paths)}")

          configured = json.loads(
              Path("config/dsi010_2005_2015_special_sessions.json").read_text(
                  encoding="utf-8"
              )
          )
          configured_pairs = {
              (str(row["trading_date"]), str(row["source_id"]))
              for row in configured["special_sessions"]
          }
          source_pairs: set[tuple[str, str]] = set()
          source_lineage: list[dict[str, object]] = []
          for source_path in source_paths:
              payload = json.loads(source_path.read_text(encoding="utf-8"))
              source_id = str(payload["source_id"])
              for row in payload["special_sessions"]:
                  source_pairs.add((str(row["trading_date"]), source_id))
              source_lineage.append(
                  {
                      "source_id": source_id,
                      "source_path": str(source_path),
                      "source_json_sha256": hashlib.sha256(
                          source_path.read_bytes()
                      ).hexdigest(),
                      "source_document_sha256": payload[
                          "source_document_sha256"
                      ],
                      "review_csv_sha256": payload["review_csv_sha256"],
                      "covered_years": payload["covered_years"],
                      "segment_scope": payload["segment_scope"],
                  }
              )
          if source_pairs != configured_pairs:
              raise SystemExit(
                  "GOVERNED_SPECIAL_SESSION_CONFIG_MISMATCH:"
                  f"configured={sorted(configured_pairs)}:sources={sorted(source_pairs)}"
              )

          sources = tuple(
              OfficialSessionCalendarEngine.load_source(path)
              for path in source_paths
          )
          canonical = CanonicalPointInTimeWarehouse(database)
          engine = OfficialSessionCalendarEngine(canonical)
          report = engine.reconcile(
              __import__("datetime").date(2005, 1, 1),
              __import__("datetime").date(2015, 12, 31),
              sources,
          )
          engine_paths = engine.export(report, audit_root)

          def write_rows(
              name: str,
              rows: list[dict[str, object]],
              fields: tuple[str, ...],
          ) -> Path:
              path = audit_root / name
              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows)
              return path

          annual_rows = [asdict(item) for item in report.annual_summaries]
          write_rows(
              "annual_audit.csv",
              annual_rows,
              tuple(annual_rows[0]),
          )
          record_rows = [
              {
                  "trading_date": record.trading_date.isoformat(),
                  "classification": record.classification.value,
                  "observed_candles": record.observed_candles,
                  "description": record.description or "",
                  "source_ids": ";".join(record.source_ids),
                  "issue_codes": ";".join(record.issue_codes),
              }
              for record in report.records
          ]
          fields = (
              "trading_date",
              "classification",
              "observed_candles",
              "description",
              "source_ids",
              "issue_codes",
          )
          write_rows(
              "unresolved_dates.csv",
              [row for row in record_rows if row["classification"] == "unresolved_weekday"],
              fields,
          )
          write_rows(
              "conflicts.csv",
              [row for row in record_rows if "HOLIDAY_HAS_OBSERVED_CANDLES" in row["issue_codes"]],
              fields,
          )
          write_rows(
              "missing_special_sessions.csv",
              [row for row in record_rows if "MISSING_OFFICIAL_SPECIAL_SESSION" in row["issue_codes"]],
              fields,
          )
          write_rows(
              "unconfirmed_special_sessions.csv",
              [row for row in record_rows if "UNCONFIRMED_SPECIAL_SESSION" in row["issue_codes"]],
              fields,
          )
          (audit_root / "source_lineage.json").write_text(
              json.dumps(source_lineage, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          latest_manifest: dict[str, dict[str, object]] = {}
          for line in manifest.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              payload = json.loads(line)
              latest_manifest[str(payload["trading_date"])] = payload
          latest_status_counts: dict[str, int] = {}
          for payload in latest_manifest.values():
              status = str(payload.get("status") or "UNKNOWN")
              latest_status_counts[status] = latest_status_counts.get(status, 0) + 1

          certification_permitted = (
              report.certification_state is CalendarCertificationState.CERTIFIED
              and report.unresolved_weekday_count == 0
              and report.unconfirmed_special_session_count == 0
              and report.missing_special_session_count == 0
              and report.conflict_count == 0
          )
          summary = {
              "start_date": report.start_date.isoformat(),
              "end_date": report.end_date.isoformat(),
              "reviewed_source_count": len(source_paths),
              "covered_years": list(range(2005, 2016)),
              "official_holiday_count": report.official_holiday_count,
              "official_special_session_count": report.official_special_session_count,
              "expected_session_count": report.expected_session_count,
              "observed_session_count": report.observed_session_count,
              "unresolved_weekday_count": report.unresolved_weekday_count,
              "unconfirmed_special_session_count": report.unconfirmed_special_session_count,
              "missing_special_session_count": report.missing_special_session_count,
              "conflict_count": report.conflict_count,
              "certification_state": report.certification_state.value,
              "calendar_report_sha256": report.report_sha256,
              "database_path": str(database),
              "database_sha256": hashlib.sha256(database.read_bytes()).hexdigest(),
              "manifest_path": str(manifest),
              "manifest_sha256": hashlib.sha256(manifest.read_bytes()).hexdigest(),
              "latest_manifest_status_counts": dict(sorted(latest_status_counts.items())),
              "full_2005_2015_audit_performed": True,
              "calendar_certification_permitted": certification_permitted,
              "classification_inferred_from_archive_status": False,
              "classification_inferred_from_observed_candles": False,
              "production_influence": False,
              "engine_artifacts": [str(path) for path in engine_paths],
          }
          (audit_root / "full_calendar_audit_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          evidence_paths = [
              database,
              manifest,
              merged_root / "merge_lineage.json",
              merged_root / "merge_summary.json",
              *(path for path in audit_root.rglob("*") if path.is_file()),
              *source_paths,
          ]
          with (audit_root / "evidence_hashes.txt").open(
              "w",
              encoding="utf-8",
          ) as handle:
              for path in sorted(set(evidence_paths), key=str):
                  handle.write(
                      f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path}\n"
                  )

          print("===== DSI-010 FULL 2005-2015 CALENDAR AUDIT =====")
          for key, value in summary.items():
              print(f"{key}: {value}")
          PY
      - name: Upload merged governed store and full audit
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-full-2005-2015-governed-calendar-audit
          path: |
            /tmp/dsi010-merge.log
            /tmp/dsi010-full-calendar-audit.log
            artifacts/dsi010_merged_historical_truth
            artifacts/dsi010_2005_2015_full_calendar_audit
            artifacts/dsi010_pre2011_official_sources
            artifacts/dsi010_pre2011_reviewed_sources
            artifacts/dsi010_2005_emergency_holiday_source
            artifacts/dsi010_2011_2015_official_sources
            artifacts/dsi010_2011_2015_reviewed_sources
            config/dsi010_2005_2015_special_sessions.json
          if-no-files-found: error
          retention-days: 14
