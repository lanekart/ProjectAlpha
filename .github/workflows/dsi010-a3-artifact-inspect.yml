name: DSI-010 A3 Artifact Inspect

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-a3-artifact-inspect.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: '8679067292'
        run: |
          mkdir -p inputs
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o /tmp/artifact.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/artifact.json'))
          print('ARTIFACT_NAME='+str(payload.get('name')))
          print('ARTIFACT_EXPIRED='+str(payload.get('expired')))
          print('ARTIFACT_SIZE='+str(payload.get('size_in_bytes')))
          run=payload.get('workflow_run') or {}
          print('ORIGINAL_RUN_ID='+str(run.get('id')))
          print('ORIGINAL_HEAD_SHA='+str(run.get('head_sha')))
          PY
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/artifact.zip
          unzip -q /tmp/artifact.zip -d inputs
      - name: Inspect preserved boundary
        run: |
          echo '=== FILES ==='
          find inputs -maxdepth 6 -type f -printf '%p|%s\n' | sort | head -400
          echo '=== ARCHIVES ==='
          find inputs -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) -printf '%p|%s\n' | sort
          echo '=== A3 MARKERS ==='
          find inputs -type f | grep -Ei 'htr010a3|tier.a|readiness|summary|result' | sort | head -240 || true
