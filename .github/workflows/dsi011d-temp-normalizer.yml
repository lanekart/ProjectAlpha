name: Temporary DSI-011D Normalizer

on:
  push:
    branches:
      - feature/dsi-011d-calibrated-position-sizing-main
  pull_request:
    branches:
      - feature/dsi-011c-20dma-reclaim-portfolio

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-011d-calibrated-position-sizing-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply locked Ruff normalization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/research/calibrated_position_sizing.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    lines = [\n'
              '        "# DSI-011D Calibrated Edge and Position-Sizing Audit",\n',
              '    parity = cast(dict[str, object], payload["reference_parity"])\n'
              '    lines = [\n'
              '        "# DSI-011D Calibrated Edge and Position-Sizing Audit",\n',
          )
          text = text.replace(
              '        f"- Reference parity: {cast(dict[str, object], payload[\'reference_parity\'])[\'passed\']}",\n',
              '        f"- Reference parity: {parity[\'passed\']}",\n',
          )
          text = text.replace(
              '            "| {rank} | {policy} | {cagr} | {mdd} | {pf} | {trades} | {hurdles} |".format(\n',
              '            (\n'
              '                "| {rank} | {policy} | {cagr} | {mdd} | {pf} | "\n'
              '                "{trades} | {hurdles} |"\n'
              '            ).format(\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install 'ruff==0.15.20'
          ruff format \
            alpha/research/calibrated_position_sizing.py \
            tests/research/test_calibrated_position_sizing.py
          ruff check --fix \
            alpha/research/calibrated_position_sizing.py \
            tests/research/test_calibrated_position_sizing.py
          ruff format --check \
            alpha/research/calibrated_position_sizing.py \
            tests/research/test_calibrated_position_sizing.py
          git diff --check
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/research/calibrated_position_sizing.py \
            tests/research/test_calibrated_position_sizing.py
          git commit -m 'style(dsi-011d): apply locked Ruff normalization'
          git push origin HEAD:feature/dsi-011d-calibrated-position-sizing-main
