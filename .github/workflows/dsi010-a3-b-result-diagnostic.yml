name: DSI-010 Repaired A3 B Result Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-a3-b-result-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print A3 and B results
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90199889987"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== A3 B RESULT MARKERS ====="
          grep -nE \
            'HTR-010A3|HTR-010B|Readiness|Certification|Conflict case|Blocking conflicts|Quarantined|Admitted|Corporate action|Official actions|Unresolved|Report SHA|PRODUCTION_INFLUENCE|Traceback|TypeError|KeyError|ValueError|AttributeError' \
            /tmp/job.log | tail -420 || true
          echo "===== EXECUTION OUTCOMES ====="
          grep -nE 'HTR010A3_OUTCOME|HTR010B_OUTCOME' /tmp/job.log | tail -40 || true
          echo "===== TRACEBACKS ====="
          grep -n -A90 -B10 'Traceback' /tmp/job.log | tail -220 || true
