name: DSI-010 2011-2015 Discovery Evidence

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-2011-2015-discovery-pr-run.yml
  pull_request:
    paths:
      - .github/workflows/dsi010-2011-2015-discovery-pr-run.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Execute governed discovery script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/dsi010-2011-2015-calendar-discovery.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index("\n          PY", start)
          raw_script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw_script.splitlines()
          ) + "\n"
          Path("/tmp/dsi010_2011_2015_discovery.py").write_text(
              script,
              encoding="utf-8",
          )
          PY
          python /tmp/dsi010_2011_2015_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-2011-2015-calendar-discovery
          path: artifacts/dsi010_2011_2015_live_discovery
          if-no-files-found: error
          retention-days: 14
