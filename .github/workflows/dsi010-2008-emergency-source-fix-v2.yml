name: DSI-010 2008 Emergency Source Fix V2

on:
  push:
    branches:
      - feature/dsi-010-pre2016-external-era-validation
    paths:
      - .github/workflows/dsi010-2008-emergency-source-fix-v2.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Apply strict typing repairs and audit extension
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path(
              "alpha/decision_superiority/pre2016_2008_emergency_closure.py"
          )
          module_text = module.read_text(encoding="utf-8")
          module_text = module_text.replace("from io import BytesIO\n", "", 1)
          old_evidence = '''    evidence = {
              "api_url": CIRCULAR_API_URL,
              "rows": sorted(selected, key=lambda row: str(row["circNumber"])),
          }'''
          new_evidence = '''    evidence: dict[str, object] = {
              "api_url": CIRCULAR_API_URL,
              "rows": sorted(selected, key=lambda row: str(row["circNumber"])),
          }'''
          if old_evidence not in module_text:
              raise SystemExit("EVIDENCE_TYPING_BOUNDARY_MISSING")
          module_text = module_text.replace(old_evidence, new_evidence, 1)
          module.write_text(module_text, encoding="utf-8")

          path = Path("scripts/run_dsi010_full_calendar_audit.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''def _calendar_sources(
              *,
              early_root: Path,
              later_root: Path,
              emergency_source: Path,
          ) -> tuple[Path, ...]:''',
                  '''def _calendar_sources(
              *,
              early_root: Path,
              later_root: Path,
              emergency_source: Path,
              additional_sources: tuple[Path, ...] = (),
              expected_source_count: int = 29,
          ) -> tuple[Path, ...]:''',
              ),
              (
                  '''    source_paths = (*early_sources, *later_sources, emergency_source)
              if len(set(source_paths)) != 29:
                  raise RuntimeError("CALENDAR_SOURCE_PATH_DUPLICATION")
              return source_paths''',
                  '''    missing_additional = tuple(
                  source for source in additional_sources if not source.is_file()
              )
              if missing_additional:
                  raise RuntimeError(
                      "ADDITIONAL_CALENDAR_SOURCE_MISSING:"
                      + ",".join(str(source) for source in missing_additional)
                  )
              source_paths = (
                  *early_sources,
                  *later_sources,
                  emergency_source,
                  *additional_sources,
              )
              if len(source_paths) != expected_source_count:
                  raise RuntimeError(
                      "CALENDAR_SOURCE_COUNT_MISMATCH:"
                      f"expected={expected_source_count}:observed={len(source_paths)}"
                  )
              if len(set(source_paths)) != expected_source_count:
                  raise RuntimeError("CALENDAR_SOURCE_PATH_DUPLICATION")
              return source_paths''',
              ),
              (
                  '''def _validate_sources_and_special_sessions(
              *,
              source_paths: tuple[Path, ...],
              special_config: Path,
          ) -> list[dict[str, object]]:''',
                  '''def _validate_sources_and_special_sessions(
              *,
              source_paths: tuple[Path, ...],
              special_config: Path,
              expected_holiday_rows: int = 220,
          ) -> list[dict[str, object]]:''',
              ),
              (
                  '''    if holiday_rows != 220:
                  raise RuntimeError(f"EXPECTED_220_HOLIDAY_ROWS_FOUND_{holiday_rows}")''',
                  '''    if holiday_rows != expected_holiday_rows:
                  raise RuntimeError(
                      "CALENDAR_HOLIDAY_ROW_COUNT_MISMATCH:"
                      f"expected={expected_holiday_rows}:observed={holiday_rows}"
                  )''',
              ),
              (
                  '''    source_population_run_id: int,
          ) -> Path:''',
                  '''    source_population_run_id: int,
              additional_sources: tuple[Path, ...] = (),
              expected_source_count: int = 29,
              expected_holiday_rows: int = 220,
          ) -> Path:''',
              ),
              (
                  '''        emergency_source=emergency_source,
              )
              source_lineage = _validate_sources_and_special_sessions(
                  source_paths=source_paths,
                  special_config=special_config,
              )''',
                  '''        emergency_source=emergency_source,
                  additional_sources=additional_sources,
                  expected_source_count=expected_source_count,
              )
              source_lineage = _validate_sources_and_special_sessions(
                  source_paths=source_paths,
                  special_config=special_config,
                  expected_holiday_rows=expected_holiday_rows,
              )''',
              ),
              (
                  '''    record_rows = [''',
                  '''    record_rows: list[dict[str, object]] = [''',
              ),
              (
                  '''    parser.add_argument("--source-population-run-id", type=int, required=True)
              args = parser.parse_args()''',
                  '''    parser.add_argument("--source-population-run-id", type=int, required=True)
              parser.add_argument(
                  "--additional-source",
                  type=Path,
                  action="append",
                  default=[],
              )
              parser.add_argument("--expected-source-count", type=int, default=29)
              parser.add_argument("--expected-holiday-row-count", type=int, default=220)
              args = parser.parse_args()''',
              ),
              (
                  '''        source_population_run_id=args.source_population_run_id,
              )''',
                  '''        source_population_run_id=args.source_population_run_id,
                  additional_sources=tuple(args.additional_source),
                  expected_source_count=args.expected_source_count,
                  expected_holiday_rows=args.expected_holiday_row_count,
              )''',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"AUDIT_PATCH_BOUNDARY_MISSING:{old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate implementation
        run: |
          poetry run ruff check --fix \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run ruff format \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run ruff check \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py
          poetry run pytest -q \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py \
            tests/decision_superiority/test_pre2016_calendar_sources.py \
            tests/decision_superiority/test_pre2016_population_merge.py
      - name: Commit validated implementation
        run: |
          git config user.name "Project Alpha Automation"
          git config user.email "project-alpha-automation@users.noreply.github.com"
          git add \
            alpha/decision_superiority/pre2016_2008_emergency_closure.py \
            scripts/build_dsi010_2008_emergency_closure_source.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_2008_emergency_closure.py
          if git diff --cached --quiet; then
            echo "No implementation changes required"
            exit 0
          fi
          git commit -m "feat(dsi-010): govern 2008 emergency market closure"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
