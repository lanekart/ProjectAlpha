name: HTR-010B9 clean-head release gate

on:
  push:
    branches:
      - feature/htr-010b9-governed-adaptive-publication-bridge
    paths:
      - .github/workflows/htr010b9-release-gate.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out and synchronize feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
          fetch-depth: 0

      - name: Pull latest connector-authored head
        run: git pull --ff-only origin feature/htr-010b9-governed-adaptive-publication-bridge

      - name: Apply seam and hardening if absent
        run: |
          if ! grep -q 'adaptive_metadata_publication_enabled' alpha/application/intelligence.py; then
            test -f .tmp/htr010b9_patch.py
            python .tmp/htr010b9_patch.py
          fi
          python - <<'PY'
          from pathlib import Path

          engine = Path('alpha/benchmark_replay/governed_adaptive_publication_bridge.py')
          text = engine.read_text(encoding='utf-8')
          old = (
              '    "alpha/application/intelligence.py",\n'
              '    "alpha/performance_intelligence/recorder.py",\n'
          )
          new = (
              '    "alpha/application/intelligence.py",\n'
              '    "alpha/canonical_universe_audit/canonical_runner.py",\n'
              '    "alpha/performance_intelligence/recorder.py",\n'
          )
          if old in text:
              engine.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction

      - name: Run focused quality and compatibility gates
        run: |
          poetry run ruff check . --fix
          poetry run ruff format .
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy alpha
          poetry run pytest -q \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/performance_intelligence/test_performance_intelligence.py \
            tests/application/test_intelligence.py \
            tests/application/test_intelligence_inputs.py \
            tests/canonical_universe_audit \
            tests/decision_intelligence \
            tests/recommendation_intelligence
          poetry run python -m alpha benchmark --help | \
            grep governed-adaptive-publication-bridge

      - name: Remove every temporary B9 transport file
        run: |
          rm -f .tmp/htr010b9_patch.py
          rm -f .github/workflows/htr010b9-integrate.yml
          rm -f .github/workflows/htr010b9-finalize.yml
          rm -f .github/workflows/htr010b9-validate.yml
          rm -f .github/workflows/htr010b9-repair.yml
          rm -f .github/workflows/htr010b9-authoritative.yml
          rm -f .github/workflows/htr010b9-authoritative-v2.yml
          rm -f .github/workflows/htr010b9-release-gate.yml
          rmdir .tmp 2>/dev/null || true
          git add -A

      - name: Verify effective final source-only tree
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              'alpha/application/benchmark_cli.py',
              'alpha/application/governed_adaptive_publication_bridge_cli.py',
              'alpha/application/intelligence.py',
              'alpha/benchmark_replay/__init__.py',
              'alpha/benchmark_replay/governed_adaptive_publication_bridge.py',
              'alpha/canonical_universe_audit/canonical_runner.py',
              'alpha/learning_intelligence/__init__.py',
              'alpha/learning_intelligence/publication.py',
              'alpha/performance_intelligence/recorder.py',
              'docs/HTR-010B9_GOVERNED_ADAPTIVE_PUBLICATION_BRIDGE.md',
              'tests/benchmark_replay/test_governed_adaptive_publication_bridge.py',
              'tests/learning_intelligence/test_adaptive_metadata_publication.py',
          }
          observed = set(
              subprocess.check_output(
                  [
                      'git', 'diff', '--cached', '--name-only',
                      'origin/feature/recovery-foundation-v1',
                  ],
                  text=True,
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(
                  f'final B9 file set mismatch: observed={sorted(observed)}; '
                  f'expected={sorted(expected)}'
              )
          PY

      - name: Push clean source-only commit
        id: clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'No clean-tree commit required.'
          else
            git commit -m 'chore(htr-010b9): publish clean validated milestone head'
            git push origin HEAD:feature/htr-010b9-governed-adaptive-publication-bridge
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for normal Lint and CI on clean head
        id: repository_checks
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.clean.outputs.sha }}
        run: |
          success=0
          for attempt in $(seq 1 120); do
            payload=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CLEAN_SHA}&per_page=100")
            lint_status=$(echo "$payload" | jq -r \
              '[.workflow_runs[] | select(.name == "Lint")][0].status // "missing"')
            lint_conclusion=$(echo "$payload" | jq -r \
              '[.workflow_runs[] | select(.name == "Lint")][0].conclusion // "pending"')
            lint_id=$(echo "$payload" | jq -r \
              '[.workflow_runs[] | select(.name == "Lint")][0].id // ""')
            ci_status=$(echo "$payload" | jq -r \
              '[.workflow_runs[] | select(.name == "CI")][0].status // "missing"')
            ci_conclusion=$(echo "$payload" | jq -r \
              '[.workflow_runs[] | select(.name == "CI")][0].conclusion // "pending"')
            ci_id=$(echo "$payload" | jq -r \
              '[.workflow_runs[] | select(.name == "CI")][0].id // ""')
            echo "attempt=${attempt} lint=${lint_status}/${lint_conclusion} ci=${ci_status}/${ci_conclusion}"
            if [ "$lint_status" = completed ] && [ "$ci_status" = completed ]; then
              if [ "$lint_conclusion" = success ] && [ "$ci_conclusion" = success ]; then
                echo "lint_id=$lint_id" >> "$GITHUB_OUTPUT"
                echo "ci_id=$ci_id" >> "$GITHUB_OUTPUT"
                success=1
                break
              fi
              gh pr comment 57 --body "HTR-010B9 clean-head repository validation failed at \`${CLEAN_SHA}\`: Lint \`${lint_conclusion}\` (run ${lint_id}), CI \`${ci_conclusion}\` (run ${ci_id}). The PR remains draft."
              exit 1
            fi
            sleep 30
          done
          if [ "$success" -ne 1 ]; then
            gh pr comment 57 --body "HTR-010B9 clean-head repository validation timed out at \`${CLEAN_SHA}\` before both normal Lint and CI completed. The PR remains draft."
            exit 1
          fi

      - name: Tag validated source and record result
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.clean.outputs.sha }}
          LINT_ID: ${{ steps.repository_checks.outputs.lint_id }}
          CI_ID: ${{ steps.repository_checks.outputs.ci_id }}
        run: |
          TAG=htr-010b9-validated-source-v1
          existing=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          if [ -n "$existing" ] && [ "$existing" != "$CLEAN_SHA" ]; then
            gh pr comment 57 --body "HTR-010B9 validation tag \`${TAG}\` already points to a different commit; refusing to move it."
            exit 1
          fi
          if [ -z "$existing" ]; then
            git tag -a "$TAG" "$CLEAN_SHA" \
              -m "HTR-010B9 repository-validated source"
            git push origin "refs/tags/${TAG}"
          fi
          gh pr comment 57 --body "HTR-010B9 clean-head repository validation passed. Source commit: \`${CLEAN_SHA}\`. Immutable validation tag: \`${TAG}\`. Normal Lint run: \`${LINT_ID}\` (success). Normal CI run: \`${CI_ID}\` (success). The branch contains only the 12 intended B9 files. Signed real-data B9 acceptance remains outstanding, so the PR stays draft."
