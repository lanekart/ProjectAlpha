name: DSI-010 A3 Artifact Metadata

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-a3-artifact-metadata.yml

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Read artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: '8679067292'
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
          | python -c 'import json,sys; p=json.load(sys.stdin); r=p.get("workflow_run") or {}; print("ARTIFACT_NAME="+str(p.get("name"))); print("ARTIFACT_SIZE="+str(p.get("size_in_bytes"))); print("ARTIFACT_EXPIRED="+str(p.get("expired"))); print("ORIGINAL_RUN_ID="+str(r.get("id"))); print("ORIGINAL_HEAD_SHA="+str(r.get("head_sha"))); print("ORIGINAL_HEAD_BRANCH="+str(r.get("head_branch")))'
