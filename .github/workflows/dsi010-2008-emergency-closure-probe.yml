name: DSI-010 2008 Emergency Closure Probe

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-2008-emergency-closure-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Probe official NSE press and circular evidence
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from io import BytesIO
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          output = Path("artifacts/dsi010_2008_emergency_closure_probe")
          output.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nseindia.com/resources/exchange-communication-circulars",
          }
          session.get("https://www.nseindia.com/", headers=headers, timeout=30)

          api_url = (
              "https://www.nseindia.com/api/circulars"
              "?fromDate=25-11-2008&toDate=30-11-2008"
          )
          api_response = session.get(
              api_url,
              headers={**headers, "Accept": "application/json,text/plain,*/*"},
              timeout=45,
          )
          (output / "circular_api_response.json").write_bytes(api_response.content)
          try:
              api_payload: Any = api_response.json()
          except ValueError:
              api_payload = None

          def rows_from(payload: Any) -> list[dict[str, Any]]:
              if isinstance(payload, list):
                  return [row for row in payload if isinstance(row, dict)]
              if isinstance(payload, dict):
                  for key in ("data", "Table", "table", "records", "rows"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return [row for row in value if isinstance(row, dict)]
                  for value in payload.values():
                      if isinstance(value, list) and all(
                          isinstance(row, dict) for row in value
                      ):
                          return value
              return []

          api_rows = rows_from(api_payload)
          relevant_rows = []
          for row in api_rows:
              rendered = json.dumps(row, sort_keys=True, default=str).casefold()
              if any(
                  token in rendered
                  for token in (
                      "holiday",
                      "closed",
                      "closure",
                      "trading",
                      "terror",
                      "mumbai",
                      "november 27",
                  )
              ):
                  relevant_rows.append(row)
          (output / "relevant_api_rows.json").write_text(
              json.dumps(relevant_rows, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )

          urls = [
              "https://nsearchives.nseindia.com/content/press/26112008.htm",
              "https://nsearchives.nseindia.com/content/press/26112008.pdf",
              "https://nsearchives.nseindia.com/content/press/27112008.htm",
              "https://nsearchives.nseindia.com/content/press/27112008.pdf",
              "https://nsearchives.nseindia.com/content/press/28112008.htm",
              "https://nsearchives.nseindia.com/content/press/28112008.pdf",
          ]
          for row in relevant_rows:
              for key in ("circFilelink", "fileLink", "url", "link"):
                  value = str(row.get(key) or "").strip()
                  if value.startswith("https://"):
                      urls.append(value)

          attempts: list[dict[str, object]] = []
          seen: set[str] = set()
          for index, url in enumerate(dict.fromkeys(urls), start=1):
              response = session.get(
                  url,
                  headers={**headers, "Accept": "text/html,application/pdf,*/*"},
                  timeout=45,
              )
              raw = response.content
              digest = hashlib.sha256(raw).hexdigest() if raw else ""
              prefix = raw[:2048].lower()
              document_format = (
                  "PDF"
                  if raw.startswith(b"%PDF-")
                  else "HTML"
                  if b"<html" in prefix or b"<body" in prefix
                  else "UNKNOWN"
              )
              text = ""
              extraction_error = ""
              try:
                  if document_format == "PDF":
                      text = "\n".join(
                          (page.extract_text() or "").strip()
                          for page in PdfReader(BytesIO(raw)).pages
                      )
                  elif document_format == "HTML":
                      text = re.sub(
                          r"\s+",
                          " ",
                          re.sub(
                              r"<[^>]+>",
                              " ",
                              raw.decode("utf-8", errors="replace"),
                          ),
                      ).strip()
              except Exception as exc:  # diagnostic-only probe
                  extraction_error = f"{type(exc).__name__}:{exc}"
              normalized = re.sub(r"\s+", " ", text).casefold()
              matched_tokens = [
                  token
                  for token in (
                      "november 27, 2008",
                      "27 november 2008",
                      "markets will remain closed",
                      "market will remain closed",
                      "trading will remain closed",
                      "mumbai",
                      "terrorist",
                  )
                  if token in normalized
              ]
              suffix = {"PDF": ".pdf", "HTML": ".htm"}.get(
                  document_format, ".bin"
              )
              document_path = output / f"candidate_{index:02d}_{digest[:12]}{suffix}"
              document_path.write_bytes(raw)
              text_path = output / f"candidate_{index:02d}_{digest[:12]}.txt"
              text_path.write_text(text.rstrip() + "\n", encoding="utf-8")
              attempts.append(
                  {
                      "url": url,
                      "final_url": response.url,
                      "http_status": response.status_code,
                      "content_type": response.headers.get("Content-Type", ""),
                      "response_bytes": len(raw),
                      "sha256": digest,
                      "duplicate_hash": digest in seen,
                      "document_format": document_format,
                      "text_sha256": hashlib.sha256(
                          (text.rstrip() + "\n").encode("utf-8")
                      ).hexdigest(),
                      "matched_tokens": matched_tokens,
                      "extraction_error": extraction_error,
                      "document_path": str(document_path),
                      "text_path": str(text_path),
                  }
              )
              seen.add(digest)
          (output / "attempts.json").write_text(
              json.dumps(attempts, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("===== DSI-010 2008 EMERGENCY CLOSURE PROBE =====")
          print(f"API Status: {api_response.status_code}")
          print(f"API Rows: {len(api_rows)}")
          print(f"Relevant API Rows: {len(relevant_rows)}")
          print(f"Official URLs Probed: {len(attempts)}")
          for attempt in attempts:
              if attempt["matched_tokens"]:
                  print(json.dumps(attempt, sort_keys=True))
          print("CLASSIFICATION_INFERRED_FROM_CANDLES=false")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-2008-emergency-closure-probe
          path: artifacts/dsi010_2008_emergency_closure_probe
          if-no-files-found: error
          retention-days: 14
