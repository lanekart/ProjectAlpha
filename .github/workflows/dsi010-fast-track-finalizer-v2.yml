name: DSI-010 Fast-Track Finalizer V2

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-fast-track-finalizer-v2.yml

permissions:
  actions: read
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Download validated 2005 pilot shard
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30299181789
          name: dsi010-2005-population-pilot
          path: inputs/pilot
      - name: Download governed 2006-2011 shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30303891098
          pattern: dsi010-corrected-population-shard-*
          path: inputs/source
          merge-multiple: true
      - name: Download accelerated 2012-2015 shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30307186644
          pattern: dsi010-accelerated-population-shard-*
          path: inputs/accelerated
          merge-multiple: true
      - name: Extract and validate all eleven governed shards
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/dsi010-v2-extract.log
          from __future__ import annotations

          import json
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          destination_root = Path("work/shards")
          destination_root.mkdir(parents=True, exist_ok=True)

          pilot = Path("inputs/pilot/alpha_data")
          if not (pilot / "warehouse/historical_truth.duckdb").is_file():
              raise RuntimeError("PILOT_DATABASE_MISSING")
          if not (pilot / "manifests/archive_manifest.jsonl").is_file():
              raise RuntimeError("PILOT_MANIFEST_MISSING")
          shutil.copytree(pilot, destination_root / "2005/alpha_data")

          def safe_name(value: str) -> bool:
              path = PurePosixPath(value)
              return not path.is_absolute() and ".." not in path.parts

          for year in range(2006, 2016):
              input_root = Path("inputs/source" if year <= 2011 else "inputs/accelerated")
              archive_path = input_root / f"alpha_data-{year}.tar.gz"
              summary_path = input_root / f"shard_summary-{year}.json"
              if not archive_path.is_file():
                  raise RuntimeError(f"SHARD_ARCHIVE_MISSING:{year}")
              if not summary_path.is_file():
                  raise RuntimeError(f"SHARD_SUMMARY_MISSING:{year}")
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              if int(summary.get("covered_year", 0)) != year:
                  raise RuntimeError(f"SHARD_YEAR_MISMATCH:{year}")
              if int(summary.get("failed", -1)) != 0:
                  raise RuntimeError(f"SHARD_FAILURE_COUNT_NONZERO:{year}")
              destination = destination_root / str(year)
              destination.mkdir(parents=True, exist_ok=True)
              with tarfile.open(archive_path, "r:gz") as archive:
                  if any(not safe_name(member.name) for member in archive.getmembers()):
                      raise RuntimeError(f"UNSAFE_SHARD_TAR:{year}")
                  archive.extractall(destination, filter="data")
              shard = destination / "alpha_data"
              if not (shard / "warehouse/historical_truth.duckdb").is_file():
                  raise RuntimeError(f"SHARD_DATABASE_MISSING:{year}")
              if not (shard / "manifests/archive_manifest.jsonl").is_file():
                  raise RuntimeError(f"SHARD_MANIFEST_MISSING:{year}")
              print(
                  f"year={year} candles={summary.get('candle_snapshots')} "
                  f"unavailable={summary.get('unavailable')} "
                  f"specials={summary.get('special_session_dates')}"
              )
          print("VALIDATED_GOVERNED_SHARD_COUNT=11")
          PY
      - name: Validate merge and full-audit implementation
        run: |
          poetry run ruff check \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run ruff format --check \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py \
            tests/decision_superiority/test_pre2016_population_merge.py
          poetry run mypy \
            alpha/decision_superiority/pre2016_population_merge.py \
            scripts/run_dsi010_full_calendar_audit.py
          poetry run pytest -q tests/decision_superiority/test_pre2016_population_merge.py
      - name: Merge governed Historical Truth shards
        run: |
          set -o pipefail
          poetry run python - <<'PY' 2>&1 | tee /tmp/dsi010-v2-merge.log
          from pathlib import Path

          from alpha.decision_superiority.pre2016_population_merge import (
              merge_pre2016_population_shards,
          )

          years = tuple(range(2005, 2016))
          result = merge_pre2016_population_shards(
              shard_roots=tuple(
                  Path(f"work/shards/{year}/alpha_data") for year in years
              ),
              output_root=Path("artifacts/dsi010_merged_historical_truth"),
              expected_years=years,
          )
          print("===== DSI-010 GOVERNED POPULATION MERGE =====")
          print(f"Covered Years: {','.join(str(year) for year in result.covered_years)}")
          print(f"Shard Count: {result.shard_count}")
          print(f"Manifest Records: {result.manifest_records}")
          print(f"Daily Candle Rows: {result.daily_candle_rows}")
          print(f"Observed Sessions: {result.observed_sessions}")
          print(f"Raw Files: {result.raw_files}")
          print(f"Snapshot Files: {result.snapshot_files}")
          print("PRODUCTION_INFLUENCE=false")
          PY
      - name: Recover and build all official calendar sources
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          set -euo pipefail
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_pre2011_official_calendar_candidates.json \
            --output artifacts/dsi010_pre2011_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_pre2011_reviewed_sources.py \
            --recovery-root artifacts/dsi010_pre2011_official_sources \
            --output-root artifacts/dsi010_pre2011_reviewed_sources
          poetry run python - <<'PY'
          from pathlib import Path

          import requests

          response = requests.get(
              "https://nsearchives.nseindia.com/content/press/27072005.pdf",
              headers={"User-Agent": "ProjectAlpha-HistoricalTruth/1.0"},
              timeout=45,
          )
          response.raise_for_status()
          output = Path("artifacts/dsi010_2005_emergency_holiday_source")
          output.mkdir(parents=True, exist_ok=True)
          (output / "nse_press_27072005.pdf").write_bytes(response.content)
          PY
          poetry run python scripts/build_dsi010_2005_emergency_holiday_source.py \
            --source-document \
            artifacts/dsi010_2005_emergency_holiday_source/nse_press_27072005.pdf \
            --output-root artifacts/dsi010_2005_emergency_holiday_source
          poetry run python -m alpha benchmark \
            decision-superiority-pre2016-calendar-source-recovery \
            --candidate-registry config/dsi010_2011_2015_official_calendar_candidates.json \
            --output artifacts/dsi010_2011_2015_official_sources \
            --timeout-seconds 45
          poetry run python scripts/build_dsi010_2011_2015_reviewed_sources.py \
            --recovery-root artifacts/dsi010_2011_2015_official_sources \
            --output-root artifacts/dsi010_2011_2015_reviewed_sources
      - name: Run complete governed calendar audit
        run: |
          set -o pipefail
          poetry run python scripts/run_dsi010_full_calendar_audit.py \
            --merged-root artifacts/dsi010_merged_historical_truth \
            --early-root artifacts/dsi010_pre2011_reviewed_sources \
            --later-root artifacts/dsi010_2011_2015_reviewed_sources \
            --emergency-source \
            artifacts/dsi010_2005_emergency_holiday_source/nse_2005_emergency_holiday.json \
            --special-config config/dsi010_2005_2015_special_sessions.json \
            --audit-root artifacts/dsi010_2005_2015_full_calendar_audit \
            --source-population-run-id ${{ github.run_id }} \
            2>&1 | tee /tmp/dsi010-v2-full-calendar-audit.log
      - name: Upload merged store and full audit
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-fast-track-v2-full-2005-2015-governed-calendar-audit
          path: |
            /tmp/dsi010-v2-extract.log
            /tmp/dsi010-v2-merge.log
            /tmp/dsi010-v2-full-calendar-audit.log
            artifacts/dsi010_merged_historical_truth
            artifacts/dsi010_2005_2015_full_calendar_audit
            artifacts/dsi010_pre2011_official_sources
            artifacts/dsi010_pre2011_reviewed_sources
            artifacts/dsi010_2005_emergency_holiday_source
            artifacts/dsi010_2011_2015_official_sources
            artifacts/dsi010_2011_2015_reviewed_sources
            config/dsi010_2005_2015_special_sessions.json
          if-no-files-found: error
          retention-days: 14
