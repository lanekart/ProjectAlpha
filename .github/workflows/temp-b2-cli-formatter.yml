name: Temporary B2 CLI Formatter

on:
  push:
    branches:
      - feature/htr-010b2-governed-adjusted-benchmark-integration

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Format B2 progress CLI') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b2-governed-adjusted-benchmark-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Apply locked Ruff formatting
        run: |
          poetry run ruff format alpha/application/governed_adjusted_benchmark_cli.py
          poetry run ruff check alpha/application/governed_adjusted_benchmark_cli.py
          poetry run ruff format --check alpha/application/governed_adjusted_benchmark_cli.py
          poetry run mypy alpha
      - name: Commit formatter output
        run: |
          git config user.name "Project Alpha CI"
          git config user.email "actions@users.noreply.github.com"
          git add alpha/application/governed_adjusted_benchmark_cli.py
          git commit -m "Format B2 progress CLI"
          git push origin HEAD:feature/htr-010b2-governed-adjusted-benchmark-integration
