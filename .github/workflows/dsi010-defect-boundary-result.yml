name: DSI-010 Defect Boundary Result

on:
  pull_request:
    paths: [.github/workflows/dsi010-defect-boundary-result.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90229854139"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep 'EVENT|' /tmp/log || true
          grep -E 'CANDLE\|OMAXE\|2013-11-(07|08|11|12|13)' /tmp/log || true
          grep -E 'CANDLE\|MINDACORP\|2015-01-(01|02|05|06|07)' /tmp/log || true
          grep -E 'CANDLE\|JBMA\|2014-10-(06|07|08|09|10)' /tmp/log || true
