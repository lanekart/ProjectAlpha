name: HTR-010B10 Final Format and Typing

on:
  pull_request:
  push:
    branches:
      - feature/htr-010b10-governed-adaptive-institutional-trade-shadow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - name: Apply final typed Markdown layout and clean temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py')
          text = path.read_text(encoding='utf-8')
          old_blockers = '    blockers = report.get("readiness_blockers", [])\n'
          new_blockers = (
              '    blockers = cast(\n'
              '        Sequence[object], report.get("readiness_blockers", [])\n'
              '    )\n'
          )
          if old_blockers in text:
              text = text.replace(old_blockers, new_blockers, 1)
          elif new_blockers not in text:
              raise SystemExit('expected blockers assignment not found')

          old_iterator = 'for item in cast(Sequence[object], blockers)'
          if old_iterator in text:
              text = text.replace(old_iterator, 'for item in blockers', 1)
          elif 'for item in blockers' not in text:
              raise SystemExit('expected blockers iterator not found')

          path.write_text(text, encoding='utf-8')
          for temporary in (
              '.github/workflows/htr010b10-final-mypy-diagnostics.yml',
              '.github/workflows/htr010b10-finalize-engine-typing.yml',
              '.github/workflows/htr010b10-finalize-engine-typing-pr.yml',
              '.github/workflows/htr010b10-final-format-typing.yml',
          ):
              Path(temporary).unlink(missing_ok=True)
          PY
      - name: Commit and push finalized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/benchmark_replay/governed_adaptive_institutional_trade_shadow.py .github/workflows
          git commit -m 'fix(htr-010b10): finalize typed report formatting'
          git pull --rebase origin feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
