name: Temporary DSI-011E Formatter

on:
  push:
    branches:
      - feature/dsi-011e-alpha-eligibility-window-sweep
  pull_request:
    branches:
      - feature/dsi-011d-calibrated-position-sizing-main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-011e-alpha-eligibility-window-sweep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply locked Ruff formatting
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.15.20'
          ruff format \
            alpha/research/eligibility_window_sweep.py \
            tests/research/test_eligibility_window_sweep.py
          ruff check \
            alpha/research/eligibility_window_sweep.py \
            tests/research/test_eligibility_window_sweep.py
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alpha/research/eligibility_window_sweep.py \
            tests/research/test_eligibility_window_sweep.py
          git commit -m 'style(dsi-011e): apply locked Ruff formatting'
          git push origin HEAD:feature/dsi-011e-alpha-eligibility-window-sweep
