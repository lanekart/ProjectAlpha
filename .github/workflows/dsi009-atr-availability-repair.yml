name: DSI-009 ATR Availability Repair

on:
  push:
    branches:
      - feature/dsi-012-governed-structural-stop-risk-scaling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-012-governed-structural-stop-risk-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply mechanism-specific ATR availability repair
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("alpha/decision_superiority/entry_stop_improvement.py")
          source = source_path.read_text(encoding="utf-8")

          source = source.replace(
              '''    required = (
                  "signal_close",
                  "atr14",
                  "raw_entry_price",
                  "initial_stop",
                  "target_1",
                  "target_2",
                  "average_traded_value20",
              )
          ''',
              '''    required = (
                  "signal_close",
                  "raw_entry_price",
                  "initial_stop",
                  "target_1",
                  "target_2",
                  "average_traded_value20",
              )
          ''',
              1,
          )

          source = source.replace(
              '            "atr14": _round(signal.atr14),\n',
              '            "atr14": _optional_round(signal.atr14),\n',
              1,
          )

          source = source.replace(
              '''        signal_close = float(signal.signal_close)
                  atr = float(signal.atr14)
          ''',
              '''        signal_close = float(signal.signal_close)
                  atr = _optional_float(signal.atr14)
          ''',
              1,
          )

          source = source.replace(
              '''        elif mechanism.family == "PULLBACK_TO_SUPPORT":
                      level = signal_close - atr * float(mechanism.atr_offset or 0.0)
                      considered = window.iloc[: mechanism.maximum_wait_sessions]
                      touched = considered.loc[considered["low"].astype(float) <= level]
                      if not touched.empty:
                          fill_bar = touched.iloc[0]
                          fill_date = fill_bar.trading_date
                          raw_fill = min(float(fill_bar.open), level)
          ''',
              '''        elif mechanism.family == "PULLBACK_TO_SUPPORT":
                      if atr is None or atr <= 0:
                          state = FillState.DATA_UNAVAILABLE
                          reason = "14-session ATR unavailable for ATR-dependent entry"
                      else:
                          level = signal_close - atr * float(mechanism.atr_offset or 0.0)
                          considered = window.iloc[: mechanism.maximum_wait_sessions]
                          touched = considered.loc[considered["low"].astype(float) <= level]
                          if not touched.empty:
                              fill_bar = touched.iloc[0]
                              fill_date = fill_bar.trading_date
                              raw_fill = min(float(fill_bar.open), level)
          ''',
              1,
          )

          source = source.replace(
              '''        elif mechanism.family == "MAXIMUM_EXTENSION_FILTER":
                      extension = (float(entry_bar.open) - signal_close) / atr
                      if extension <= float(mechanism.maximum_extension_atr or 0.0):
                          fill_date = entry_bar.trading_date
                          raw_fill = float(entry_bar.open)
                      else:
                          state = FillState.GAP_BEYOND_ENTRY_LIMIT
                          reason = "next open exceeded the frozen ATR extension limit"
          ''',
              '''        elif mechanism.family == "MAXIMUM_EXTENSION_FILTER":
                      if atr is None or atr <= 0:
                          state = FillState.DATA_UNAVAILABLE
                          reason = "14-session ATR unavailable for ATR-dependent entry"
                      else:
                          extension = (float(entry_bar.open) - signal_close) / atr
                          if extension <= float(mechanism.maximum_extension_atr or 0.0):
                              fill_date = entry_bar.trading_date
                              raw_fill = float(entry_bar.open)
                          else:
                              state = FillState.GAP_BEYOND_ENTRY_LIMIT
                              reason = "next open exceeded the frozen ATR extension limit"
          ''',
              1,
          )

          source = source.replace(
              '        "atr14": _round(signal.atr14),\n',
              '        "atr14": _optional_round(signal.atr14),\n',
              1,
          )

          source = source.replace(
              '''        "entry_extension_atr": (
                      None
                      if raw_fill is None
                      else _round((raw_fill - float(signal.signal_close)) / float(signal.atr14))
                  ),
          ''',
              '''        "entry_extension_atr": (
                      None
                      if raw_fill is None or atr is None or atr <= 0
                      else _round((raw_fill - signal_close) / atr)
                  ),
          ''',
              1,
          )

          source = source.replace(
              ''') -> float:
                  entry = float(row["entry_price_after_slippage"])
                  incumbent = float(row["initial_stop"])
                  atr = float(row["atr14"])
                  if stop.family == "INCUMBENT_STOP":
                      level = incumbent
                  elif stop.family == "ATR_STOP":
                      level = entry - atr * float(stop.atr_multiple or 0.0)
                  elif stop.family == "STRUCTURAL_SUPPORT":
                      level = incumbent if support is None else support
                  elif stop.family == "VOLATILITY_ADJUSTED_STRUCTURAL":
                      volatility = entry - atr * float(stop.atr_multiple or 0.0)
                      level = volatility if support is None else min(support, volatility)
                  elif stop.family == "MAXIMUM_RISK_CAP":
                      level = max(incumbent, entry * (1.0 - float(stop.maximum_risk_fraction or 0.0)))
          ''',
              ''') -> float | None:
                  entry = float(row["entry_price_after_slippage"])
                  incumbent = float(row["initial_stop"])
                  atr = _optional_float(row["atr14"])
                  if stop.family == "INCUMBENT_STOP":
                      level = incumbent
                  elif stop.family == "ATR_STOP":
                      if atr is None or atr <= 0:
                          return None
                      level = entry - atr * float(stop.atr_multiple or 0.0)
                  elif stop.family == "STRUCTURAL_SUPPORT":
                      level = incumbent if support is None else support
                  elif stop.family == "VOLATILITY_ADJUSTED_STRUCTURAL":
                      if atr is None or atr <= 0:
                          return None
                      volatility = entry - atr * float(stop.atr_multiple or 0.0)
                      level = volatility if support is None else min(support, volatility)
                  elif stop.family == "MAXIMUM_RISK_CAP":
                      level = max(incumbent, entry * (1.0 - float(stop.maximum_risk_fraction or 0.0)))
          ''',
              1,
          )

          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/decision_superiority/test_entry_stop_improvement.py")
          tests = test_path.read_text(encoding="utf-8")
          anchor = '''def test_stop_candidates_are_bounded_below_entry() -> None:
          '''
          insert = '''def test_missing_atr_is_mechanism_specific_not_population_fatal() -> None:
              signal = _signal()
              signal.atr14 = float("nan")

              incumbent = _entry_fill(
                  signal,
                  _bars(),
                  default_entry_registry()[0],
                  policy=EntryStopPolicy(),
              )
              assert incumbent["fill_state"] == FillState.ENTERED.value
              assert incumbent["atr14"] is None
              assert incumbent["entry_extension_atr"] is None

              atr_entry = _entry_fill(
                  signal,
                  _bars(),
                  default_entry_registry()[3],
                  policy=EntryStopPolicy(),
              )
              assert atr_entry["fill_state"] == FillState.DATA_UNAVAILABLE.value
              assert "ATR unavailable" in atr_entry["fill_reason"]

              row = pd.Series(
                  {
                      "entry_price_after_slippage": 100.0,
                      "initial_stop": 92.0,
                      "atr14": float("nan"),
                  }
              )
              stops = {item.mechanism_id: item for item in default_stop_registry()}
              assert _stop_level(row, stops["STOP-STRUCTURAL-10D"], support=94.0) == 94.0
              assert _stop_level(row, stops["STOP-MAX-RISK-080"], support=None) == 92.0
              assert _stop_level(row, stops["STOP-ATR-125"], support=None) is None
              assert (
                  _stop_level(row, stops["STOP-VOL-STRUCTURAL-10D"], support=94.0)
                  is None
              )


          def test_stop_candidates_are_bounded_below_entry() -> None:
          '''
          if anchor not in tests:
              raise SystemExit("ATR regression test anchor not found")
          test_path.write_text(tests.replace(anchor, insert, 1), encoding="utf-8")
          PY
      - name: Format and validate repair
        run: |
          pip install ruff==0.15.20
          ruff format \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
          ruff check \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/dsi009-atr-availability-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py \
            .github/workflows/dsi009-atr-availability-repair.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-009): treat ATR availability by mechanism"
          git push origin HEAD:feature/dsi-012-governed-structural-stop-risk-scaling
