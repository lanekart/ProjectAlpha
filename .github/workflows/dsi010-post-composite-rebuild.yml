name: DSI-010 Post-Composite Governed Rebuild

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-post-composite-rebuild.yml

permissions:
  actions: read
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry && poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30341297898
          name: dsi010-htr010b1-admission-audit
          path: inputs
      - name: Restore governed prerequisites
        run: |
          archive=$(find inputs -name alpha_data_after_htr010b1.tar.gz | head -1)
          calendar=$(find inputs -name htr007_session_calendar.json | head -1)
          test -f "$archive"
          test -f "$calendar"
          tar -xzf "$archive"
          mkdir -p work/calendar artifacts
          cp "$calendar" work/calendar/htr007_session_calendar.json
          for name in \
            htr010a3_tier_a_foundation_readiness \
            htr010b_complete_corporate_action_dataset; do
            source=$(find inputs -type d -name "$name" | head -1)
            test -d "$source"
            rm -rf "artifacts/$name"
            cp -R "$source" "artifacts/$name"
          done
          test -f alpha_data/warehouse/historical_truth.duckdb
      - name: Rebuild HTR-009B
        run: |
          rm -rf artifacts/htr009b_corporate_action_price_continuity
          poetry run python -m alpha historical-truth corporate-action-price-certify \
            --database alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/calendar/htr007_session_calendar.json \
            --root alpha_data \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --verify-only \
            --output artifacts/htr009b_corporate_action_price_continuity
      - name: Rebuild HTR-010B
        run: |
          rm -rf artifacts/htr010b_complete_corporate_action_dataset
          poetry run python -m alpha historical-truth complete-corporate-action-dataset \
            --database alpha_data/warehouse/historical_truth.duckdb \
            --root alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --verify-only \
            --output artifacts/htr010b_complete_corporate_action_dataset
      - name: Rebuild HTR-010B1C
        run: |
          rm -rf artifacts/htr010b1_adjustment_replay_admission
          poetry run python -m alpha historical-truth adjustment-replay-admission-certify \
            --database alpha_data/warehouse/historical_truth.duckdb \
            --root alpha_data \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --session-calendar-report work/calendar/htr007_session_calendar.json \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1_adjustment_replay_admission
      - name: Rebuild HTR-010B1D
        run: |
          rm -rf artifacts/htr010b1d_factor_transformation_forensics
          poetry run python -m alpha historical-truth factor-transformation-forensics \
            --database alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1c-output artifacts/htr010b1_adjustment_replay_admission \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d_factor_transformation_forensics
      - name: Rebuild HTR-010B1D1
        run: |
          rm -rf artifacts/htr010b1d1_cross_series_identity_bridge
          poetry run python -m alpha historical-truth factor-transformation-bridge-forensics \
            --database alpha_data/warehouse/historical_truth.duckdb \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1d-output artifacts/htr010b1d_factor_transformation_forensics \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d1_cross_series_identity_bridge
      - name: Rebuild HTR-010B1D2
        run: |
          rm -rf artifacts/htr010b1d2_bridge_aware_validation_repair
          poetry run python -m alpha historical-truth bridge-aware-factor-validation-repair \
            --htr010b1d1-output artifacts/htr010b1d1_cross_series_identity_bridge \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1d2_bridge_aware_validation_repair
      - name: Rebuild HTR-010B1E2
        run: |
          rm -rf artifacts/htr010b1e2_final_admission_state_propagation
          poetry run python -m alpha historical-truth bridge-aware-admission-reconcile \
            --database alpha_data/warehouse/historical_truth.duckdb \
            --htr010a3-output artifacts/htr010a3_tier_a_foundation_readiness \
            --htr010b-output artifacts/htr010b_complete_corporate_action_dataset \
            --htr010b1d2-output artifacts/htr010b1d2_bridge_aware_validation_repair \
            --session-calendar-report work/calendar/htr007_session_calendar.json \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/htr010b1e2_final_admission_state_propagation
      - name: Export governed result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {"outcome": "success", "production_influence": False}
          paths = {
              "htr009b": Path("artifacts/htr009b_corporate_action_price_continuity/htr009b_corporate_action_price_report.json"),
              "htr010b": Path("artifacts/htr010b_complete_corporate_action_dataset/htr010b_complete_corporate_action_report.json"),
              "b1d": Path("artifacts/htr010b1d_factor_transformation_forensics/htr010b1d_factor_transformation_forensics.json"),
              "b1d2": Path("artifacts/htr010b1d2_bridge_aware_validation_repair/htr010b1d2_validation_repair.json"),
              "b1e2": Path("artifacts/htr010b1e2_final_admission_state_propagation/htr010b1_replay_readiness.json"),
          }
          for key, path in paths.items():
              if not path.is_file():
                  summary["outcome"] = "failure"
                  summary[key] = {"missing": str(path)}
                  continue
              payload = json.loads(path.read_text())
              summary[key] = payload
          Path("artifacts/dsi010_post_composite_rebuild_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi010-post-composite-governed-rebuild
          path: |
            artifacts/dsi010_post_composite_rebuild_summary.json
            artifacts/htr009b_corporate_action_price_continuity
            artifacts/htr010b_complete_corporate_action_dataset
            artifacts/htr010b1_adjustment_replay_admission
            artifacts/htr010b1d_factor_transformation_forensics
            artifacts/htr010b1d1_cross_series_identity_bridge
            artifacts/htr010b1d2_bridge_aware_validation_repair
            artifacts/htr010b1e2_final_admission_state_propagation
          retention-days: 14
          if-no-files-found: warn
      - name: Enforce complete execution
        run: |
          test -f artifacts/htr010b1e2_final_admission_state_propagation/htr010b1_replay_readiness.json
          echo PRODUCTION_INFLUENCE=false
