name: DSI010 Diagnostics

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Capture MyPy diagnostics
        run: |
          set +e
          poetry run mypy alpha 2>&1 | tee dsi010-mypy.txt
          echo ${PIPESTATUS[0]} > dsi010-mypy-status.txt
          exit 0
      - name: Capture focused pytest diagnostics
        run: |
          set +e
          poetry run pytest \
            tests/decision_superiority/test_pre2016_external_validation.py \
            -q 2>&1 | tee dsi010-pytest.txt
          echo ${PIPESTATUS[0]} > dsi010-pytest-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-diagnostics
          path: |
            dsi010-mypy.txt
            dsi010-mypy-status.txt
            dsi010-pytest.txt
            dsi010-pytest-status.txt
          if-no-files-found: error
          retention-days: 1
