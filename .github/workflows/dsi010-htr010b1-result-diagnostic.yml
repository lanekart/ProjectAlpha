name: DSI-010 HTR-010B1 Result Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010b1-result-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print HTR-010B1 admission result details
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90217264688"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== HTR-010B1 CONSOLE ====="
          sed -n '425,450p' /tmp/job.log
          echo "===== HTR-010B1 SUMMARY PAYLOAD ====="
          sed -n '500,575p' /tmp/job.log
          echo "===== HTR-010B1 BLOCKER MARKERS ====="
          grep -nE \
            'readiness_blockers|validation_outcomes|economic_weight_measurement_state|pct_observed_tier_a|admission_quarantined|evidence_quarantined|unresolved_case|requested_window_fully_observed|input_contract|schema|coverage|blockers' \
            /tmp/job.log | tail -360 || true
