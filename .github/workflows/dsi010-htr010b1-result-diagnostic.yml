name: DSI-010 HTR-010B1 Result Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr010b1-result-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print HTR-010B1 admission result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90217264688"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== HTR-010B1 CONSOLE ====="
          grep -nE \
            'HTR-010B1 Adjustment|Factor validation cases|Quarantine intervals|Replay admission intervals|Replay readiness|Report SHA|HTR010B1_OUTCOME|PRODUCTION_INFLUENCE' \
            /tmp/job.log | tail -160 || true
          echo "===== HTR-010B1 SUMMARY ====="
          grep -n -A180 -B5 '"htr010b1_outcome"' /tmp/job.log | tail -240 || true
          echo "===== BLOCKER AND WEIGHT DETAILS ====="
          grep -nE \
            'readiness_blockers|validation_outcomes|economic_weight_measurement_state|pct_observed_tier_a|admission_quarantined|evidence_quarantined|unresolved_case|requested_window_fully_observed|contract|schema|coverage|blockers' \
            /tmp/job.log | tail -320 || true
          echo "===== TRACEBACKS ====="
          grep -n -A80 -B10 'Traceback' /tmp/job.log | tail -180 || true
