name: DSI-010 Adjusted Prerequisite Rebuild

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-adjusted-prerequisite-rebuild.yml

permissions:
  actions: read
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --no-interaction

      - name: Download governed V4 Historical Truth store
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30310808599
          name: dsi010-fast-track-v4-full-2005-2015-governed-calendar-audit
          path: inputs/v4

      - name: Download certified calendar evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30313024674
          name: dsi010-certified-2005-2015-calendar-audit
          path: inputs/certified

      - name: Restore governed execution root
        run: |
          set -euo pipefail
          V4_ROOT=$(find inputs/v4 -type d -path '*/artifacts/dsi010_merged_historical_truth' | head -1)
          CALENDAR=$(find inputs/certified -type f -path '*/dsi010_2005_2015_certified_calendar_audit/htr007_session_calendar.json' | head -1)
          if [ -z "$V4_ROOT" ] || [ ! -d "$V4_ROOT" ]; then
            echo "GOVERNED_V4_ROOT_NOT_FOUND" >&2
            exit 1
          fi
          if [ -z "$CALENDAR" ] || [ ! -f "$CALENDAR" ]; then
            echo "CERTIFIED_CALENDAR_REPORT_NOT_FOUND" >&2
            exit 1
          fi
          mkdir -p work/alpha_data work/certified_calendar artifacts/dsi010_adjusted_prerequisite_rebuild
          cp -a "$V4_ROOT"/. work/alpha_data/
          cp "$CALENDAR" work/certified_calendar/htr007_session_calendar.json
          test -f work/alpha_data/warehouse/historical_truth.duckdb
          test -f work/alpha_data/manifests/archive_manifest.jsonl
          test -d work/alpha_data/raw
          test -d work/alpha_data/snapshots
          RAW_COUNT=$(find work/alpha_data/raw -type f | wc -l | tr -d ' ')
          SNAPSHOT_COUNT=$(find work/alpha_data/snapshots -type f | wc -l | tr -d ' ')
          printf 'raw_files=%s\nsnapshot_files=%s\n' "$RAW_COUNT" "$SNAPSHOT_COUNT" \
            | tee artifacts/dsi010_adjusted_prerequisite_rebuild/input_preflight.txt
          if [ "$RAW_COUNT" -lt 2700 ] || [ "$SNAPSHOT_COUNT" -lt 2700 ]; then
            echo "GOVERNED_INPUT_POPULATION_INCOMPLETE" >&2
            exit 1
          fi

      - name: Rebuild HTR-009A2 event-sourced universe
        id: htr009a2
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run python -m alpha historical-truth \
            event-sourced-universe-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/certified_calendar/htr007_session_calendar.json \
            --root work/alpha_data \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/dsi010_htr009a2_event_sourced_universe \
            --refresh-sources \
            2>&1 | tee artifacts/dsi010_adjusted_prerequisite_rebuild/htr009a2.log

      - name: Rebuild HTR-009B corporate-action and price basis
        id: htr009b
        if: steps.htr009a2.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run python -m alpha historical-truth \
            corporate-action-price-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/certified_calendar/htr007_session_calendar.json \
            --root work/alpha_data \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/dsi010_htr009b_corporate_action_price \
            --refresh-sources \
            2>&1 | tee artifacts/dsi010_adjusted_prerequisite_rebuild/htr009b.log

      - name: Run HTR-010A complete security certification
        id: htr010a
        if: steps.htr009a2.outcome == 'success' && steps.htr009b.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run python -m alpha historical-truth \
            complete-security-dataset-certify \
            --database work/alpha_data/warehouse/historical_truth.duckdb \
            --calendar-report work/certified_calendar/htr007_session_calendar.json \
            --snapshot-root work/alpha_data/snapshots \
            --root work/alpha_data \
            --start 2005-01-01 \
            --end 2015-12-31 \
            --output artifacts/dsi010_htr010a_complete_security_dataset \
            --refresh-sources \
            2>&1 | tee artifacts/dsi010_adjusted_prerequisite_rebuild/htr010a.log

      - name: Export governed rebuild state
        if: always()
        env:
          HTR009A2_OUTCOME: ${{ steps.htr009a2.outcome }}
          HTR009B_OUTCOME: ${{ steps.htr009b.outcome }}
          HTR010A_OUTCOME: ${{ steps.htr010a.outcome }}
        run: |
          poetry run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          import duckdb

          database = Path("work/alpha_data/warehouse/historical_truth.duckdb")
          table_names: list[str] = []
          table_counts: dict[str, int] = {}
          if database.is_file():
              with duckdb.connect(str(database), read_only=True) as connection:
                  table_names = [
                      str(row[0])
                      for row in connection.execute(
                          "select table_name from information_schema.tables "
                          "where table_schema = 'main' order by table_name"
                      ).fetchall()
                  ]
                  for table in (
                      "daily_candle",
                      "security_event",
                      "security_membership_interval",
                      "corporate_action_event",
                      "corporate_action_adjustment_factor",
                      "adjusted_daily_candle",
                      "complete_security_identity",
                      "security_dataset_certification",
                  ):
                      if table in table_names:
                          row = connection.execute(
                              f'SELECT count(*) FROM "{table}"'
                          ).fetchone()
                          table_counts[table] = int(row[0]) if row else 0
          summary = {
              "htr009a2_outcome": os.environ.get("HTR009A2_OUTCOME", "unknown"),
              "htr009b_outcome": os.environ.get("HTR009B_OUTCOME", "unknown"),
              "htr010a_outcome": os.environ.get("HTR010A_OUTCOME", "unknown"),
              "database_tables": table_names,
              "table_counts": table_counts,
              "classification_inferred_from_archive_status": False,
              "classification_inferred_from_observed_candles": False,
              "production_influence": False,
          }
          output = Path("artifacts/dsi010_adjusted_prerequisite_rebuild")
          output.mkdir(parents=True, exist_ok=True)
          (output / "rebuild_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          tar -czf artifacts/dsi010_adjusted_prerequisite_rebuild/alpha_data_after_rebuild.tar.gz \
            -C work alpha_data

      - name: Upload governed rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsi010-adjusted-prerequisite-rebuild
          path: |
            artifacts/dsi010_adjusted_prerequisite_rebuild
            artifacts/dsi010_htr009a2_event_sourced_universe
            artifacts/dsi010_htr009b_corporate_action_price
            artifacts/dsi010_htr010a_complete_security_dataset
            work/certified_calendar/htr007_session_calendar.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce sequential rebuild contract
        if: always()
        env:
          HTR009A2_OUTCOME: ${{ steps.htr009a2.outcome }}
          HTR009B_OUTCOME: ${{ steps.htr009b.outcome }}
          HTR010A_OUTCOME: ${{ steps.htr010a.outcome }}
        run: |
          echo "HTR009A2_OUTCOME=${HTR009A2_OUTCOME}"
          echo "HTR009B_OUTCOME=${HTR009B_OUTCOME}"
          echo "HTR010A_OUTCOME=${HTR010A_OUTCOME}"
          test "${HTR009A2_OUTCOME}" = "success"
          test "${HTR009B_OUTCOME}" = "success"
          test "${HTR010A_OUTCOME}" = "success"
          echo "PRODUCTION_INFLUENCE=false"
