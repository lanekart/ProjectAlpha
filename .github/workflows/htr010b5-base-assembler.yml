name: Temporary HTR-010B5 base assembler

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1
    types:
      - synchronize
    paths:
      - .tmp/htr010b5/**
      - .github/workflows/htr010b5-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    if: >-
      github.event.pull_request.head.ref ==
      'feature/htr-010b5-governed-approval-gate-forensics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the HTR-010B5 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b5-governed-approval-gate-forensics
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Decode and validate the source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/htr010b5/bundle-*.b64 \
            | base64 --decode \
            > /tmp/htr010b5-bundle.tar.bz2
          python - <<'PY'
          import bz2
          import hashlib
          from pathlib import Path

          compressed = Path("/tmp/htr010b5-bundle.tar.bz2").read_bytes()
          compressed_sha256 = hashlib.sha256(compressed).hexdigest()
          if compressed_sha256 != (
              "863f9691c51ce53e2e0e8a8336d5c89b4cb4fe27dd83f50b53389544fbbace4d"
          ):
              raise SystemExit("compressed HTR-010B5 bundle digest mismatch")
          archive = bz2.decompress(compressed)
          archive_sha256 = hashlib.sha256(archive).hexdigest()
          if archive_sha256 != (
              "d2b8b922a1200410a294adf5bba1899d0d9ebd81dadb8940acd1502ff10773a8"
          ):
              raise SystemExit("HTR-010B5 bundle digest mismatch")
          Path("/tmp/htr010b5-bundle.tar").write_bytes(archive)
          PY
          tar --extract \
            --file /tmp/htr010b5-bundle.tar \
            --directory .
          python -m py_compile \
            alpha/application/benchmark_cli.py \
            alpha/application/governed_approval_gate_forensics_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_approval_gate_forensics.py \
            tests/benchmark_replay/test_governed_approval_gate_forensics.py

      - name: Commit the assembled source to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/htr010b5
          rm -f .github/workflows/htr010b5-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit \
            -m "feat(benchmark): add HTR-010B5 approval-gate forensics"
          git push origin \
            HEAD:feature/htr-010b5-governed-approval-gate-forensics
