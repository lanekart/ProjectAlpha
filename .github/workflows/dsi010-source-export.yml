name: DSI010 Exact Lint Repair

on:
  pull_request:
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked Ruff
        run: pip install ruff==0.15.20
      - name: Apply exact source repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "alpha/decision_superiority/pre2016_external_validation.py"
          )
          text = path.read_text(encoding="utf-8")
          old = "        dsi007 = validate_regime_strategy_tournament_certificate("
          new = "        validate_regime_strategy_tournament_certificate("
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one DSI-007 validation binding, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff format \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          ruff check \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          python -m py_compile \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dsi010-source-export.yml
          git add \
            alpha/decision_superiority/pre2016_external_validation.py \
            alpha/decision_superiority/pre2016_external_validation_artifacts.py
          git commit -m "fix(dsi-010): satisfy source quality checks"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
