name: DSI-009 Dynamic Trade Count Repair

on:
  push:
    branches:
      - feature/dsi-012-governed-structural-stop-risk-scaling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-012-governed-structural-stop-risk-scaling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply dynamic trade-count reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("alpha/decision_superiority/entry_stop_improvement.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    if len(paths) != 56:
                  raise EntryStopImprovementError(
                      f"UNRECONCILED_INCUMBENT_TRADE_COUNT:{len(paths)}"
                  )
              return paths, excursions
          
          
          def _entry_stop_attribution(
          '''
          new = '''    _validate_trade_path_count(
                  paths=paths,
                  incumbent_trades=incumbent_trades,
              )
              return paths, excursions
          
          
          def _validate_trade_path_count(
              *,
              paths: Sequence[Mapping[str, Any]],
              incumbent_trades: Sequence[Mapping[str, Any]],
          ) -> None:
              if len(paths) != len(incumbent_trades):
                  raise EntryStopImprovementError(
                      "UNRECONCILED_INCUMBENT_TRADE_COUNT:"
                      f"{len(paths)}:{len(incumbent_trades)}"
                  )
          
          
          def _entry_stop_attribution(
          '''
          if old not in source:
              raise SystemExit("trade-count replacement anchor not found")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/decision_superiority/test_entry_stop_improvement.py")
          tests = test_path.read_text(encoding="utf-8")
          import_old = '''    _structural_probes,
              default_entry_registry,
          '''
          import_new = '''    _structural_probes,
              _validate_trade_path_count,
              default_entry_registry,
          '''
          if import_old not in tests:
              raise SystemExit("test import anchor not found")
          tests = tests.replace(import_old, import_new, 1)

          test_anchor = '''def test_attribution_separates_entry_recovery_and_tail_protection() -> None:
          '''
          test_insert = '''def test_trade_path_count_reconciles_to_current_incumbent_population() -> None:
              _validate_trade_path_count(
                  paths=[{"id": "P-1"}, {"id": "P-2"}],
                  incumbent_trades=[{"id": "T-1"}, {"id": "T-2"}],
              )
              with pytest.raises(
                  EntryStopImprovementError,
                  match="UNRECONCILED_INCUMBENT_TRADE_COUNT:1:2",
              ):
                  _validate_trade_path_count(
                      paths=[{"id": "P-1"}],
                      incumbent_trades=[{"id": "T-1"}, {"id": "T-2"}],
                  )
          
          
          def test_attribution_separates_entry_recovery_and_tail_protection() -> None:
          '''
          if test_anchor not in tests:
              raise SystemExit("test insertion anchor not found")
          test_path.write_text(tests.replace(test_anchor, test_insert, 1), encoding="utf-8")
          PY
      - name: Format and lint repair
        run: |
          pip install ruff==0.15.20
          ruff format \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
          ruff check \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/dsi009-dynamic-trade-count-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alpha/decision_superiority/entry_stop_improvement.py \
            tests/decision_superiority/test_entry_stop_improvement.py \
            .github/workflows/dsi009-dynamic-trade-count-repair.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix(dsi-009): reconcile dynamic incumbent trade count"
          git push origin HEAD:feature/dsi-012-governed-structural-stop-risk-scaling
