name: HTR-010B10 Finalize Typing

on:
  push:
    branches:
      - feature/htr-010b10-governed-adaptive-institutional-trade-shadow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/htr-010b10-governed-adaptive-institutional-trade-shadow
          fetch-depth: 0
      - name: Narrow readiness blockers to strings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('alpha/application/governed_adaptive_institutional_trade_shadow_cli.py')
          text = path.read_text(encoding='utf-8')
          old = 'cast(Sequence[object], report["readiness_blockers"])'
          new = 'cast(Sequence[str], report["readiness_blockers"])'
          if old not in text and new not in text:
              raise SystemExit('expected blocker cast not found')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/htr010b10-finalize-typing.yml').unlink(missing_ok=True)
          PY
      - name: Commit strict typing correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/application/governed_adaptive_institutional_trade_shadow_cli.py .github/workflows
          git commit -m 'fix(htr-010b10): narrow readiness blockers to strings'
          git push origin HEAD:feature/htr-010b10-governed-adaptive-institutional-trade-shadow
