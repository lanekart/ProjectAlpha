name: DSI-010 Refresh HTR-010B Result Read

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-refresh-htr010b-result-read.yml

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90244680753"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep -nE 'HTR-009B|HTR-010B Complete|Sources attempted|Sources acquired|Sources reused|Sources failed|Raw official records|Canonical events|Adjustment factors|HTR010B_CANONICAL_EVENT_COUNT|EMPTY_HTR010B|Traceback|Error|ERROR|failure' /tmp/log | tail -220 || true
          tail -80 /tmp/log
