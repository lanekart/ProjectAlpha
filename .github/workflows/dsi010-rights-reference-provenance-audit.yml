name: DSI-010 Rights Reference Provenance Audit

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-rights-reference-provenance-audit.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry && poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30352312594
          name: dsi010-pre2016-rights-rebuild
          path: inputs
      - name: Restore signed evidence
        run: |
          set -euo pipefail
          archive=$(find inputs -type f -name alpha_data_after_rights_rebuild.tar.gz | head -1)
          test -f "$archive"
          mkdir -p work artifacts/audit
          tar -xzf "$archive" -C work
          test -f work/alpha_data/warehouse/historical_truth.duckdb
      - name: Audit rights reference-price provenance
        run: |
          poetry run python - <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter
          from datetime import date
          from pathlib import Path
          from typing import Any

          import duckdb

          def load(path: Path) -> list[dict[str, Any]]:
              payload=json.loads(path.read_text(encoding='utf-8'))
              rows=payload.get('records',payload) if isinstance(payload,dict) else payload
              return [dict(row) for row in rows]

          b=next(Path('inputs').rglob('htr010b_complete_corporate_action_dataset'))
          a3=next(Path('inputs').rglob('htr010a3_tier_a_foundation_readiness'))
          events=load(b/'htr010b_canonical_events.json')
          factors=load(b/'htr010b_adjustment_factors.json')
          joins=load(a3/'htr010a3_corporate_action_join_readiness.json')
          event_by_id={str(row.get('canonical_event_id')):row for row in events}
          join_by_identity={str(row.get('identity_key')):row for row in joins}
          provisional=[row for row in factors if str(row.get('factor_state'))=='FACTOR_PROVISIONAL_REFERENCE_PRICE']
          db=Path('work/alpha_data/warehouse/historical_truth.duckdb')
          rows=[]
          with duckdb.connect(str(db),read_only=True) as con:
              for factor in provisional:
                  event=event_by_id[str(factor.get('canonical_event_id'))]
                  identity=str(factor.get('identity_key') or '')
                  symbol=str(event.get('symbol') or '').upper()
                  event_isin=str(event.get('isin') or '').upper()
                  applicable=tuple(str(item).upper() for item in event.get('series_applicability') or ())
                  series=applicable[0] if len(applicable)==1 else ''
                  effective=date.fromisoformat(str(event['effective_date']))
                  prior=None
                  if symbol and series:
                      prior=con.execute(
                          '''SELECT trading_date, upper(coalesce(isin,'')), close_price,
                                    coalesce(source_sha256,'')
                             FROM daily_candle
                             WHERE upper(symbol)=? AND upper(series)=? AND trading_date<?
                             ORDER BY trading_date DESC LIMIT 1''',
                          [symbol,series,effective],
                      ).fetchone()
                  join=join_by_identity.get(identity,{})
                  prior_date=prior[0].isoformat() if prior else None
                  prior_isin=str(prior[1]) if prior else ''
                  close=float(prior[2]) if prior and prior[2] is not None else None
                  source_sha=str(prior[3]) if prior else ''
                  reference=factor.get('reference_price')
                  reference_value=float(reference) if isinstance(reference,(int,float)) else None
                  reference_matches=(
                      close is not None and reference_value is not None
                      and abs(close-reference_value)<=1e-9
                  )
                  isin_state=(
                      'MATCH' if prior_isin and prior_isin==event_isin
                      else 'MISSING' if not prior_isin
                      else 'MISMATCH'
                  )
                  strict=(
                      bool(join.get('admitted_to_certified_join'))
                      and len(applicable)==1
                      and prior is not None
                      and close is not None and close>0
                      and bool(source_sha)
                      and reference_matches
                      and bool(event_isin)
                      and isin_state=='MATCH'
                  )
                  rows.append({
                      'factor_id':factor.get('factor_id'),
                      'canonical_event_id':factor.get('canonical_event_id'),
                      'identity_key':identity,
                      'symbol':symbol,
                      'series':series or None,
                      'event_isin':event_isin or None,
                      'effective_date':effective.isoformat(),
                      'prior_date':prior_date,
                      'prior_isin':prior_isin or None,
                      'prior_close':close,
                      'reference_price':reference_value,
                      'reference_matches_stored_factor':reference_matches,
                      'source_sha256_present':bool(source_sha),
                      'a3_join_state':join.get('state'),
                      'a3_join_admitted':bool(join.get('admitted_to_certified_join')),
                      'prior_isin_state':isin_state,
                      'strict_reference_provenance_certifiable':strict,
                      'raw_action_text':event.get('raw_action_text'),
                      'production_influence':False,
                  })
          reasons=Counter()
          for row in rows:
              if row['strict_reference_provenance_certifiable']:
                  reasons['STRICT_CERTIFIABLE']+=1
              else:
                  if not row['a3_join_admitted']: reasons['A3_JOIN_NOT_ADMITTED']+=1
                  if row['series'] is None: reasons['SERIES_NOT_UNIQUE']+=1
                  if row['prior_date'] is None: reasons['PRIOR_CANDLE_MISSING']+=1
                  if row['prior_close'] is None or (row['prior_close'] is not None and row['prior_close']<=0): reasons['PRIOR_CLOSE_INVALID']+=1
                  if not row['source_sha256_present']: reasons['SOURCE_SHA_MISSING']+=1
                  if not row['reference_matches_stored_factor']: reasons['REFERENCE_PRICE_MISMATCH']+=1
                  if row['prior_isin_state']=='MISSING': reasons['PRIOR_ISIN_MISSING']+=1
                  if row['prior_isin_state']=='MISMATCH': reasons['PRIOR_ISIN_MISMATCH']+=1
          summary={
              'contract':'DSI-010-RIGHTS-REFERENCE-PROVENANCE-AUDIT-v1',
              'provisional_factor_count':len(rows),
              'strict_reference_provenance_certifiable_count':sum(bool(row['strict_reference_provenance_certifiable']) for row in rows),
              'prior_isin_state_counts':dict(sorted(Counter(str(row['prior_isin_state']) for row in rows).items())),
              'year_counts':dict(sorted(Counter(str(row['effective_date'])[:4] for row in rows).items())),
              'reason_counts':dict(sorted(reasons.items())),
              'market_derived_factor_autocorrection':False,
              'admission_policy_changed':False,
              'full_benchmark_replays':0,
              'production_influence':False,
          }
          out=Path('artifacts/audit')
          (out/'rights_reference_provenance_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (out/'rights_reference_provenance_cases.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dsi010-rights-reference-provenance-audit
          retention-days: 14
          path: artifacts/audit
