name: DSI-010 2005 Failure Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-2005-failure-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download failed job log and print failure tail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90097682578"
        run: |
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            --output /tmp/job.log
          echo "===== FAILURE MATCHES ====="
          grep -nE \
            'Traceback|Error|ERROR|YEAR_SHARD|PRE2016|FAILED|Exception|SystemExit' \
            /tmp/job.log | tail -80 || true
          echo "===== FINAL 180 LINES ====="
          tail -180 /tmp/job.log
