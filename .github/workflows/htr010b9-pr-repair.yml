name: Repair HTR-010B9 PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feature/recovery-foundation-v1

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: htr010b9-pr-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'feature/htr-010b9-governed-adaptive-publication-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the B9 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/htr-010b9-governed-adaptive-publication-bridge
          fetch-depth: 0

      - name: Synchronize feature head
        run: git pull --ff-only origin feature/htr-010b9-governed-adaptive-publication-bridge

      - name: Apply guarded integration and exact repairs
        run: |
          if grep -q 'adaptive_metadata_publication_enabled' alpha/application/intelligence.py; then
            echo 'B9 integration seam already present.'
          else
            test -f .tmp/htr010b9_patch.py
            python .tmp/htr010b9_patch.py
          fi
          test -f .tmp/htr010b9_repair.py
          python .tmp/htr010b9_repair.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install --no-interaction

      - name: Normalize intended B9 source
        run: |
          poetry run ruff check \
            alpha/application/benchmark_cli.py \
            alpha/application/intelligence.py \
            alpha/application/governed_adaptive_publication_bridge_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_adaptive_publication_bridge.py \
            alpha/canonical_universe_audit/canonical_runner.py \
            alpha/learning_intelligence/__init__.py \
            alpha/learning_intelligence/publication.py \
            alpha/performance_intelligence/recorder.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            --fix || true
          poetry run ruff format \
            alpha/application/benchmark_cli.py \
            alpha/application/intelligence.py \
            alpha/application/governed_adaptive_publication_bridge_cli.py \
            alpha/benchmark_replay/__init__.py \
            alpha/benchmark_replay/governed_adaptive_publication_bridge.py \
            alpha/canonical_universe_audit/canonical_runner.py \
            alpha/learning_intelligence/__init__.py \
            alpha/learning_intelligence/publication.py \
            alpha/performance_intelligence/recorder.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/learning_intelligence/test_adaptive_metadata_publication.py

      - name: Focused quality gates
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy alpha
          poetry run pytest -q \
            tests/learning_intelligence/test_adaptive_metadata_publication.py \
            tests/benchmark_replay/test_governed_adaptive_publication_bridge.py \
            tests/performance_intelligence/test_performance_intelligence.py \
            tests/canonical_universe_audit
          poetry run python -m alpha benchmark --help | \
            grep governed-adaptive-publication-bridge

      - name: Remove every temporary B9 workflow and payload
        run: |
          rm -f .tmp/htr010b9_patch.py
          rm -f .tmp/htr010b9_repair.py
          rm -f .github/workflows/htr010b9-integrate.yml
          rm -f .github/workflows/htr010b9-finalize.yml
          rm -f .github/workflows/htr010b9-validate.yml
          rm -f .github/workflows/htr010b9-repair.yml
          rm -f .github/workflows/htr010b9-authoritative.yml
          rm -f .github/workflows/htr010b9-authoritative-v2.yml
          rm -f .github/workflows/htr010b9-release-gate.yml
          rm -f .github/workflows/htr010b9-final-full-suite.yml
          rm -f .github/workflows/htr010b9-pr-bootstrap.yml
          rm -f .github/workflows/htr010b9-pr-repair.yml
          rmdir .tmp 2>/dev/null || true

      - name: Verify final source-only file set
        run: |
          git add -A
          python - <<'PY'
          import subprocess

          expected = {
              'alpha/application/benchmark_cli.py',
              'alpha/application/governed_adaptive_publication_bridge_cli.py',
              'alpha/application/intelligence.py',
              'alpha/benchmark_replay/__init__.py',
              'alpha/benchmark_replay/governed_adaptive_publication_bridge.py',
              'alpha/canonical_universe_audit/canonical_runner.py',
              'alpha/learning_intelligence/__init__.py',
              'alpha/learning_intelligence/publication.py',
              'alpha/performance_intelligence/recorder.py',
              'docs/HTR-010B9_GOVERNED_ADAPTIVE_PUBLICATION_BRIDGE.md',
              'tests/benchmark_replay/test_governed_adaptive_publication_bridge.py',
              'tests/learning_intelligence/test_adaptive_metadata_publication.py',
          }
          observed = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only', 'origin/feature/recovery-foundation-v1'],
                  text=True,
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(
                  f'B9 final file set mismatch: observed={sorted(observed)}; '
                  f'expected={sorted(expected)}'
              )
          print('B9 final source-only file set verified')
          PY

      - name: Commit and push clean B9 head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(htr-010b9): integrate governed adaptive publication bridge'
          git push origin HEAD:feature/htr-010b9-governed-adaptive-publication-bridge
