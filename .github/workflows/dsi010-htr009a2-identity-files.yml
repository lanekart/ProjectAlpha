name: DSI-010 Legacy ISIN Bridge Patcher

on:
  pull_request:
    paths:
      - .github/workflows/dsi010-htr009a2-identity-files.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      _TYPER_FORCE_DISABLE_TERMINAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsi-010-pre2016-external-era-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install project
        run: |
          pip install poetry
          poetry install --no-interaction
      - name: Apply governed bridge implementation
        run: |
          base64 --decode scripts/dsi010_legacy_isin_bridge_patch.b64 \
            | gzip --decompress > /tmp/dsi010.patch
          git apply --check /tmp/dsi010.patch
          git apply /tmp/dsi010.patch
      - name: Format and validate focused implementation
        run: |
          files=(
            alpha/historical_truth/legacy_isin_reference_bridge.py
            alpha/historical_truth/complete_corporate_action_engine.py
            alpha/historical_truth/complete_corporate_action_cli.py
            tests/historical_truth/test_pre2016_legacy_isin_reference_bridge.py
            tests/historical_truth/test_pre2016_rights_reference_certification.py
          )
          poetry run ruff format "${files[@]}"
          poetry run ruff check "${files[@]}" --fix
          poetry run ruff format "${files[@]}"
          poetry run ruff check "${files[@]}"
          poetry run mypy \
            alpha/historical_truth/legacy_isin_reference_bridge.py \
            alpha/historical_truth/complete_corporate_action_engine.py \
            alpha/historical_truth/complete_corporate_action_cli.py
          poetry run pytest -q \
            tests/historical_truth/test_pre2016_legacy_isin_reference_bridge.py \
            tests/historical_truth/test_pre2016_rights_reference_certification.py \
            tests/historical_truth/test_complete_corporate_action_pre2016_regressions.py \
            tests/historical_truth/test_complete_corporate_action_dataset.py
          git diff --check
      - name: Commit governed implementation
        run: |
          git config user.name "lanekart"
          git config user.email "10551192+lanekart@users.noreply.github.com"
          git add \
            alpha/historical_truth/legacy_isin_reference_bridge.py \
            alpha/historical_truth/complete_corporate_action_engine.py \
            alpha/historical_truth/complete_corporate_action_cli.py \
            tests/historical_truth/test_pre2016_legacy_isin_reference_bridge.py \
            tests/historical_truth/test_pre2016_rights_reference_certification.py
          git commit -m "feat(dsi010): certify dated legacy ISIN reference bridges"
          git push origin HEAD:feature/dsi-010-pre2016-external-era-validation
