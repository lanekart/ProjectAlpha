name: DSI-010 B1E Result

on:
  pull_request:
    paths: [.github/workflows/dsi010-b1e-result.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90223425186"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep -nE 'Bridge-Aware Admission|Factor validation cases|Corrected B1D2 cases|Factor-quality confirmed|Bridge-uncertified|Implementation defects remaining|Admission interval quarantine|Validation outcomes|Admission states|Admission-quarantined identities|Observed Tier A row weight|Replay readiness|Readiness blockers|Report SHA|PRODUCTION_INFLUENCE' /tmp/log | tail -220 || true
          grep -n -A160 -B5 '"outcome"' /tmp/log | tail -220 || true
