name: DSI-010 B1D2 Result

on:
  pull_request:
    paths: [.github/workflows/dsi010-b1d2-result.yml]

permissions:
  actions: read
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          JOB_ID: "90221540078"
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o /tmp/log
          grep -nE 'Bridge-Aware|Cases audited|Corrected dispositions|Proposed outcomes|Same-session groups|Composite groups|Factor-quality confirmed|Replay bridges uncertified|Implementation defects remaining|Report SHA|PRODUCTION_INFLUENCE' /tmp/log | tail -160 || true
          grep -n -A100 -B5 '"outcome"' /tmp/log | tail -150 || true
