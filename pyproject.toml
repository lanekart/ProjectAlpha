[tool.poetry]
name = "alpha"
version = "0.1.0"
description = "Professional NSE trading intelligence platform for identifying high-probability trading opportunities."
authors = ["Rishab Wahal"]
license = "MIT"
readme = "README.md"
packages = [{ include = "alpha" }]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"

# Core
pandas = "^3.0.3"
numpy = "^2.5.0"
pyarrow = "^24.0.0"

# Database
duckdb = "^1.5.4"

# Networking
requests = "^2.34.2"

# CLI
typer = "^0.26.8"
rich = "^15.0.0"

# Logging
loguru = "^0.7.3"

# Configuration
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
python-dotenv = "^1.2.2"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.15.20"
mypy = "^2.1.0"
pandas-stubs = "^2.3.2"
pre-commit = "^4.6.0"


[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = []
fixable = ["ALL"]


[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true


[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"